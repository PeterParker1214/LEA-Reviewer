<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEA Reviewer — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/lea-confirm.js?v=1"></script>
<script src="assets/icons.js?v=1"></script>
<script src="assets/theme.js?v=1" data-alt-class="light-mode" data-default-is="dark"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-deep:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268;
    --rose:#6fa8cf; --rose-bright:#8fc4ea; --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-head: 'Big Shoulders Display', sans-serif; --font-body: 'Space Grotesk', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-deep:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c;
    --rose:#2f6c95; --rose-bright:#1b4a6b; --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  /* inline SVG icons sitting inside a text label */
  .btn-ico{ display:inline-flex; vertical-align:-2px; margin-right:2px; }
  .btn-ico svg{ width:15px; height:15px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh; padding:32px 16px 80px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-family:var(--font-head);font-weight:800;font-size:36px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;color:var(--ink);}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{
    font-family:var(--font-body); cursor:pointer; border-radius:8px 8px 0 0; border:1px solid var(--line);
    border-bottom:none; background:var(--bg-panel-deep); color:var(--muted); padding:10px 16px; font-size:14px;
  }
  .tab-btn.active{background:var(--bg-panel);color:var(--gold-bright);font-weight:600;}
  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .msg{padding:16px;border-radius:10px;font-size:14px;}
  .msg.error{background:rgba(198,90,82,0.15);border:1px solid var(--bad);color:var(--bad);}
  .msg.info{background:rgba(201,154,70,0.12);border:1px solid var(--line);color:var(--muted);}
  a{color:var(--gold-bright);}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  input[type="text"], textarea, select{
    background:var(--bg-panel-deep); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:8px; font-family:var(--font-body); font-size:14px; width:100%;
  }
  .row input[type="text"]{flex:1;}
  textarea{resize:vertical;}
  .status-tag{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;}
  button{
    font-family:var(--font-body); cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel-deep); color:var(--ink); padding:7px 10px; font-size:13px;
  }
  button:hover{border-color:var(--gold);}
  button.primary{background:var(--gold);color:var(--bg-deep);border:none;font-weight:600;}
  button.primary:hover{background:var(--gold-bright);}
  button.danger{color:var(--bad);border-color:var(--bad);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .toggle-btn.on{color:var(--good);border-color:var(--good);}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .save-status{font-size:13px;margin-top:10px;min-height:18px;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--bad);}
  .field-label{font-size:12px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:0.06em;}
  .file-list{max-height:280px;overflow-y:auto;}
  .file-item{
    padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-family:monospace;
    display:flex;justify-content:space-between;
  }
  .file-item:hover{background:var(--bg-panel-deep);}
  .q-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--bg-panel-deep);}
  .q-opts{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:6px;}
  .hidden{display:none;}
  .q-row{cursor:pointer;}
  .q-row .qr-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-row .qr-hidden-tag{color:var(--muted);font-style:italic;}
  .report-badge{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(226,96,74,0.15);border:1px solid var(--bad);color:var(--bad);white-space:nowrap;}
  .filter-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted);}
  .report-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--bg-panel-deep);}
  .report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .report-card .rc-loc{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .report-card .rc-count{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(226,96,74,0.15);border:1px solid var(--bad);color:var(--bad);white-space:nowrap;flex-shrink:0;}
  .report-card .rc-question{font-size:14px;margin:6px 0 10px;}
  .report-card .rc-reasons{font-size:12.5px;color:var(--muted);margin-bottom:6px;line-height:1.6;}
  .report-card .rc-reasons b{color:var(--ink);}
  .report-card .rc-comment{font-size:12.5px;color:var(--ink);background:var(--bg-panel);border-radius:6px;padding:8px 10px;margin:4px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin</h1>
  <div class="sub">LEA Reviewer</div>

  <div id="gate" class="card msg info">Checking your session…</div>

  <div id="panel" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="subjects">Subjects</button>
      <button class="tab-btn" data-tab="pages">Pages &amp; Quizzes</button>
      <button class="tab-btn" data-tab="upload">Add Module</button>
      <button class="tab-btn" data-tab="reports">Reports</button>
    </div>
    <div id="tab-subjects"></div>
    <div id="tab-pages" class="hidden"></div>
    <div id="tab-upload" class="hidden"></div>
    <div id="tab-reports" class="hidden"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const GITHUB_OWNER = 'peterparker1214';
const GITHUB_REPO = 'LEA-Reviewer';
const GITHUB_BRANCH = 'main';
const INDEX_PATH = 'index.html';

const gateEl = document.getElementById('gate');
const panelEl = document.getElementById('panel');
const tabSubjectsEl = document.getElementById('tab-subjects');
const tabPagesEl = document.getElementById('tab-pages');
const tabUploadEl = document.getElementById('tab-upload');
const tabReportsEl = document.getElementById('tab-reports');

let subjects = [];
let rawIndexHtml = '';
let accessToken = '';
let fileTree = [];        // list of {path} for every editable file in the repo (.html pages + data/*/*.json module files)
let currentFilePath = '';
let currentFileRaw = '';
let currentQuestions = null; // parsed QUESTIONS array, or null if this file doesn't have one
let currentIsJsonFile = false; // true when currentFilePath is a data/*/*.json module file, not an .html page
let currentDoc = null;       // parsed Document, used by the generic text editor
let expandedQIdx = new Set(); // which question rows are expanded in the current file's editor

// ---- Manifest (data/subjects.json) — used to resolve a report's question_ref
// (subjectId/moduleId/qIndex) to an actual file, and to annotate the file
// list with report counts. Loaded once, lazily, the first time it's needed.
let manifestSubjects = null;
async function loadManifest(){
  // A failed load used to be cached as [] — which is truthy, so this early
  // return fired forever after and the Reports tab stayed stuck showing raw
  // subject/module/index refs for the rest of the session. Only keep a
  // result that actually has something in it, so a blip retries.
  if(manifestSubjects && manifestSubjects.length) return manifestSubjects;
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/data/subjects.json?t=${Date.now()}`;
    const resp = await fetch(url);
    manifestSubjects = resp.ok ? JSON.parse(await resp.text()) : [];
  }catch(e){ manifestSubjects = []; }
  return manifestSubjects;
}
function findModuleInManifest(subjectId, moduleId){
  const list = manifestSubjects || [];
  const subject = list.find(s => s.id === subjectId);
  const mod = subject && (subject.modules || []).find(m => m.id === moduleId);
  return mod ? { subject, mod } : null;
}

// ---- Reports (Supabase `reports` table, grouped by question_ref) ----
let openReports = [];          // raw rows, status='open'
let reportsByQuestionRef = {}; // question_ref -> [report, ...]
let reportsLoadError = null;

async function loadReports(){
  const { data, error } = await sb.from('reports').select('*').eq('status', 'open').order('created_at', { ascending: false });
  // A failed query used to fall through to `data || []`, which renders the
  // "no open reports" all-clear — the worst possible lie on the one screen
  // whose job is surfacing problems. Keep the error so the tab can say so.
  reportsLoadError = error ? (error.message || String(error)) : null;
  openReports = data || [];
  reportsByQuestionRef = {};
  openReports.forEach(r => { (reportsByQuestionRef[r.question_ref] = reportsByQuestionRef[r.question_ref] || []).push(r); });
}
// Report counts for whatever file is currently open in the Pages editor, keyed by question index.
function reportCountsForCurrentFile(){
  const counts = {};
  if(!currentModuleRef) return counts;
  Object.keys(reportsByQuestionRef).forEach(ref => {
    const parts = ref.split('/');
    if(parts[0] === currentModuleRef.subjectId && parts[1] === currentModuleRef.moduleId){
      counts[parts[2]] = reportsByQuestionRef[ref].length;
    }
  });
  return counts;
}
let currentModuleRef = null; // { subjectId, moduleId } for whatever quiz file is open, when known from the manifest

// ---- "Add Module" (drag & drop upload) tab state ----
let uploadedFileText = null;
let uploadedParsed = null;   // { format: 'native'|'blueprint'|'unknown', questionCount, suggestedTitle }

function showGate(html, isError){
  gateEl.style.display = 'block';
  gateEl.className = 'card msg ' + (isError ? 'error' : 'info');
  gateEl.innerHTML = html;
  panelEl.style.display = 'none';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function callSave(path, content, message){
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-save-file`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
    body: JSON.stringify({ path, content, message })
  });
  const result = await resp.json();
  if(!resp.ok) throw new Error(result.error || 'Save failed');
  return result;
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    showGate('You need to be logged in first. <a href="index.html">Go log in on the main site</a>, then come back to this page.');
    return;
  }
  accessToken = session.access_token;

  const { data: profile, error } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
  if(error || !profile || profile.is_admin !== true){
    showGate('This account is not an admin, so this page is not available to you.', true);
    return;
  }

  gateEl.style.display = 'none';
  panelEl.style.display = 'block';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tabSubjectsEl.classList.toggle('hidden', btn.dataset.tab !== 'subjects');
      tabPagesEl.classList.toggle('hidden', btn.dataset.tab !== 'pages');
      tabUploadEl.classList.toggle('hidden', btn.dataset.tab !== 'upload');
      tabReportsEl.classList.toggle('hidden', btn.dataset.tab !== 'reports');
      if(btn.dataset.tab === 'pages' && fileTree.length === 0) loadFileTree();
      if(btn.dataset.tab === 'upload') renderUploadTab();
      if(btn.dataset.tab === 'reports') openReportsTab();
    });
  });

  await loadManifest();
  await loadSubjects();
}

/* ================= SUBJECTS TAB ================= */

async function loadSubjects(){
  tabSubjectsEl.innerHTML = '<div class="card msg info">Loading current subjects from GitHub…</div>';
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${INDEX_PATH}?t=${Date.now()}`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not fetch index.html (status ' + resp.status + ')');
    rawIndexHtml = await resp.text();

    const match = rawIndexHtml.match(/const SUBJECTS = (\[[\s\S]*?\]);/);
    if(!match) throw new Error('Could not find the SUBJECTS list inside index.html.');

    subjects = new Function('return ' + match[1])();

    renderSubjectsTab();
  }catch(e){
    tabSubjectsEl.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function renderSubjectsTab(){
  let rowsHtml = subjects.map((s, i) => `
    <div class="row" data-idx="${i}">
      <input type="text" value="${escapeHtml(s.name)}" data-field="name" data-idx="${i}">
      <button class="toggle-btn ${s.ready ? 'on' : ''}" data-action="toggle" data-idx="${i}">${s.ready ? 'Available' : 'Coming soon'}</button>
      <button data-action="up" data-idx="${i}" ${i===0 ? 'disabled' : ''}>↑</button>
      <button data-action="down" data-idx="${i}" ${i===subjects.length-1 ? 'disabled' : ''}>↓</button>
      <button class="danger" data-action="delete" data-idx="${i}">Delete</button>
    </div>
  `).join('');

  tabSubjectsEl.innerHTML = `
    <div class="card">
      ${rowsHtml}
      <div class="actions">
        <button id="addSubjectBtn">+ Add subject</button>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="saveSubjectsBtn">Save to site</button>
      <button id="reloadSubjectsBtn">Reload from GitHub</button>
    </div>
    <div class="save-status" id="subjectsSaveStatus"></div>
  `;

  tabSubjectsEl.querySelectorAll('input[data-field="name"]').forEach(inp => {
    inp.addEventListener('input', () => { subjects[+inp.dataset.idx].name = inp.value; });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => { const i=+btn.dataset.idx; subjects[i].ready=!subjects[i].ready; renderSubjectsTab(); });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="up"]').forEach(btn => {
    btn.addEventListener('click', () => { const i=+btn.dataset.idx; [subjects[i-1],subjects[i]]=[subjects[i],subjects[i-1]]; renderSubjectsTab(); });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="down"]').forEach(btn => {
    btn.addEventListener('click', () => { const i=+btn.dataset.idx; [subjects[i+1],subjects[i]]=[subjects[i],subjects[i+1]]; renderSubjectsTab(); });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.idx;
      const ok = await LEAConfirm(
        `Delete "${subjects[i].name}" from the subject list? (This only removes it from the menu — it does not delete any quiz files.)`,
        { title: 'Remove subject', yes: 'Remove from list' }
      );
      if(!ok) return;
      subjects.splice(i, 1);
      renderSubjectsTab();
    });
  });
  document.getElementById('addSubjectBtn').addEventListener('click', async () => {
    const name = await LEAPrompt('Name of the new subject:', { title: 'Add subject', yes: 'Add subject' });
    if(!name) return;
    const slug = slugify(name);
    subjects.push({ id: slug, name: name, href: `subjects/${slug}.html`, ready: false });
    renderSubjectsTab();
  });
  document.getElementById('saveSubjectsBtn').addEventListener('click', saveSubjects);
  document.getElementById('reloadSubjectsBtn').addEventListener('click', loadSubjects);
}

function subjectsToJsLiteral(list){
  const lines = list.map(s => {
    const parts = [`id: ${JSON.stringify(s.id)}`, `name: ${JSON.stringify(s.name)}`, `href: ${JSON.stringify(s.href)}`, `ready: ${s.ready ? 'true' : 'false'}`];
    if(s.totalQuestions !== undefined) parts.push(`totalQuestions: ${s.totalQuestions}`);
    if(s.totalModules !== undefined) parts.push(`totalModules: ${s.totalModules}`);
    return `  { ${parts.join(', ')} },`;
  });
  return `[\n${lines.join('\n')}\n]`;
}

async function saveSubjects(){
  const statusEl = document.getElementById('subjectsSaveStatus');
  const saveBtn = document.getElementById('saveSubjectsBtn');
  saveBtn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.textContent = 'Saving…';
  try{
    const newArrayText = subjectsToJsLiteral(subjects);
    const newFileText = rawIndexHtml.replace(/const SUBJECTS = \[[\s\S]*?\];/, `const SUBJECTS = ${newArrayText};`);
    await callSave(INDEX_PATH, newFileText, 'Admin: update subjects via admin panel');
    rawIndexHtml = newFileText;
    statusEl.className = 'save-status ok';
    statusEl.textContent = 'Saved! It may take a minute or two for GitHub Pages to update the live site.';
  }catch(e){
    statusEl.className = 'save-status err';
    statusEl.textContent = 'Error: ' + e.message;
  }finally{
    saveBtn.disabled = false;
  }
}

/* ================= PAGES / QUIZZES TAB ================= */

async function loadFileTree(){
  tabPagesEl.innerHTML = '<div class="card msg info">Loading list of pages from GitHub…</div>';
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not list files (status ' + resp.status + ')');
    const data = await resp.json();
    fileTree = (data.tree || []).filter(item => item.type === 'blob' &&
      (item.path.endsWith('.html') || /^data\/[^/]+\/[^/]+\.json$/.test(item.path)));
    renderPagesTab();
  }catch(e){
    tabPagesEl.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

function moduleRefForFilePath(path){
  const list = manifestSubjects || [];
  for(const subject of list){
    for(const mod of (subject.modules || [])){
      if(mod.file === path) return { subjectId: subject.id, moduleId: mod.id };
    }
  }
  return null;
}
function fileReportCount(path){
  const ref = moduleRefForFilePath(path);
  if(!ref) return 0;
  let count = 0;
  Object.keys(reportsByQuestionRef).forEach(qref => {
    const parts = qref.split('/');
    if(parts[0] === ref.subjectId && parts[1] === ref.moduleId) count += reportsByQuestionRef[qref].length;
  });
  return count;
}
function fileItemHtml(f){
  const count = fileReportCount(f.path);
  return `<div class="file-item" data-path="${escapeHtml(f.path)}">` +
    `<span>${escapeHtml(f.path)}</span>` +
    (count ? `<span class="report-badge">${count} reported</span>` : '') +
  `</div>`;
}

function renderPagesTab(filterText, onlyReported){
  filterText = (filterText || '').toLowerCase();
  let filtered = fileTree.filter(f => f.path.toLowerCase().includes(filterText));
  if(onlyReported) filtered = filtered.filter(f => fileReportCount(f.path) > 0);

  tabPagesEl.innerHTML = `
    <div class="card">
      <input type="text" id="fileSearch" placeholder="Search for a page, e.g. Structural_Quiz1 or building-laws" value="${escapeHtml(filterText)}">
      <label class="filter-row"><input type="checkbox" id="onlyReportedFilter" style="width:auto;" ${onlyReported ? 'checked' : ''}> Only reported</label>
      <div class="file-list" id="fileList">
        ${filtered.map(fileItemHtml).join('') || '<div class="msg info">No matches.</div>'}
      </div>
    </div>
    <div id="editorArea"></div>
  `;

  function reFilterAndWire(){
    const val = document.getElementById('fileSearch').value;
    const onlyRep = document.getElementById('onlyReportedFilter').checked;
    let matches = fileTree.filter(f => f.path.toLowerCase().includes(val.toLowerCase()));
    if(onlyRep) matches = matches.filter(f => fileReportCount(f.path) > 0);
    const list = document.getElementById('fileList');
    list.innerHTML = matches.map(fileItemHtml).join('') || '<div class="msg info">No matches.</div>';
    list.querySelectorAll('.file-item').forEach(el => el.addEventListener('click', () => openFile(el.dataset.path)));
  }

  document.getElementById('fileSearch').addEventListener('input', reFilterAndWire);
  document.getElementById('onlyReportedFilter').addEventListener('change', reFilterAndWire);

  tabPagesEl.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', () => openFile(el.dataset.path));
  });
}

async function openFile(path, focusQIdx){
  currentFilePath = path;
  currentModuleRef = moduleRefForFilePath(path);
  expandedQIdx = new Set(focusQIdx != null ? [focusQIdx] : []);
  const editorArea = document.getElementById('editorArea');
  editorArea.innerHTML = '<div class="card msg info">Loading ' + escapeHtml(path) + '…</div>';
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}?t=${Date.now()}`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not load file (status ' + resp.status + ')');
    currentFileRaw = await resp.text();

    if(path.endsWith('.json')){
      currentIsJsonFile = true;
      currentQuestions = JSON.parse(currentFileRaw);
      renderQuizEditor(path);
      return;
    }
    currentIsJsonFile = false;
    const qMatch = currentFileRaw.match(/const QUESTIONS = (\[[\s\S]*?\]);/);
    if(qMatch){
      try{ currentQuestions = JSON.parse(qMatch[1]); }
      catch(e){ currentQuestions = new Function('return ' + qMatch[1])(); }
      renderQuizEditor(path);
    } else {
      currentQuestions = null;
      renderTextEditor(path);
    }
  }catch(e){
    editorArea.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

function renderQuizEditor(path){
  const titleMatch = currentFileRaw.match(/<title>([^<]*)<\/title>/);
  const h1Match = currentFileRaw.match(/<h1>([^<]*)<\/h1>/);
  const pageTitle = titleMatch ? titleMatch[1] : '';
  const headingText = h1Match ? h1Match[1] : '';

  const editorArea = document.getElementById('editorArea');
  editorArea.innerHTML = (currentIsJsonFile ? '' : `
    <div class="card">
      <div class="field-label">Browser tab title</div>
      <input type="text" id="pageTitleInput" value="${escapeHtml(pageTitle)}">
      <div class="field-label">Heading shown on the page</div>
      <input type="text" id="headingInput" value="${escapeHtml(headingText)}">
    </div>
  `) + `
    <div id="questionsList"></div>
    <div class="actions">
      <button id="addQuestionBtn">+ Add question</button>
    </div>
    <div class="actions">
      <button class="primary" id="saveQuizBtn">Save to site</button>
    </div>
    <div class="save-status" id="quizSaveStatus"></div>
  `;
  renderQuestionsList();

  document.getElementById('addQuestionBtn').addEventListener('click', () => {
    // Appended at the end only — engine-spec.md §4 requires append-only so
    // existing mastered[] index arrays never point at the wrong question.
    currentQuestions.push({ s:'', q:'New question text', o:['Option A','Option B','Option C','Option D'], c:0, ref:'', n:'' });
    expandedQIdx.add(currentQuestions.length - 1);
    renderQuestionsList();
  });
  document.getElementById('saveQuizBtn').addEventListener('click', () => saveQuizFile(path));
}

// Collapsed by default (5b) — a module can have 200+ questions, and opening
// every one as a full form made finding the reported one mean scrolling
// past all the rest. Each row expands to the full q-card in place.
function renderQuestionsList(){
  const listEl = document.getElementById('questionsList');
  const reportCounts = reportCountsForCurrentFile();

  listEl.innerHTML = currentQuestions.map((q, i) => {
    const count = reportCounts[i] || 0;
    if(!expandedQIdx.has(i)){
      const preview = (q.q || '').replace(/\s+/g, ' ').trim().slice(0, 70);
      return `
        <div class="row q-row" data-idx="${i}">
          <span class="qr-text">Q${i+1} — ${escapeHtml(preview)}${q.hidden ? ' <span class="qr-hidden-tag">(hidden)</span>' : ''}</span>
          ${count ? `<span class="report-badge">${count} reported</span>` : ''}
        </div>
      `;
    }
    const stepsVal = Array.isArray(q.steps) ? q.steps.join('\n') : '';
    return `
      <div class="q-card" data-idx="${i}">
        <div class="row" style="padding-top:0;border-bottom:none;justify-content:space-between;">
          <b>Question ${i+1}</b>
          ${count ? `<span class="report-badge">${count} reported</span>` : ''}
          <button data-action="collapseQ" data-idx="${i}">Collapse</button>
        </div>
        <div class="field-label">Question ${i+1} — topic/section</div>
        <input type="text" data-field="s" data-idx="${i}" value="${escapeHtml(q.s || '')}">
        <div class="field-label">Question text</div>
        <textarea data-field="q" data-idx="${i}" rows="2">${escapeHtml(q.q || '')}</textarea>
        <div class="field-label">Answer choices (mark the correct one)</div>
        <div class="q-opts">
          ${(q.o || []).map((opt, oi) => `
            <input type="radio" name="correct-${i}" data-correct-idx="${oi}" data-idx="${i}" ${q.c === oi ? 'checked' : ''}>
            ${typeof opt === 'string'
              ? `<input type="text" data-field="o" data-oidx="${oi}" data-idx="${i}" value="${escapeHtml(opt)}">`
              : `<input type="text" value="Auto-generated (${escapeHtml(opt.tpl || '')}) — not editable here" disabled title="This option is computed from the others at run time and can't be edited as text.">`}
          `).join('')}
        </div>
        <div class="field-label">Reference (optional)</div>
        <input type="text" data-field="ref" data-idx="${i}" value="${escapeHtml(q.ref || '')}">
        <div class="field-label">Explanation note (optional)</div>
        <textarea data-field="n" data-idx="${i}" rows="2">${escapeHtml(q.n || '')}</textarea>
        <div class="field-label">Solution steps (optional — one per line)</div>
        <textarea data-field="steps" data-idx="${i}" rows="3">${escapeHtml(stepsVal)}</textarea>
        <label class="filter-row" style="margin-top:10px;">
          <input type="checkbox" data-action="toggleHidden" data-idx="${i}" style="width:auto;" ${q.hidden ? 'checked' : ''}>
          Hide this question
        </label>
        <div class="save-status" style="margin-top:0;">Hiding keeps its slot so saved progress isn't affected — it just stops being served. It doesn't delete or renumber anything.</div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.q-row').forEach(row => {
    row.addEventListener('click', () => { expandedQIdx.add(+row.dataset.idx); renderQuestionsList(); });
  });
  listEl.querySelectorAll('button[data-action="collapseQ"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); expandedQIdx.delete(+btn.dataset.idx); renderQuestionsList(); });
  });
  listEl.querySelectorAll('input[data-field="s"], input[data-field="ref"]').forEach(el => {
    el.addEventListener('input', () => { currentQuestions[+el.dataset.idx][el.dataset.field] = el.value; });
  });
  listEl.querySelectorAll('textarea[data-field="q"], textarea[data-field="n"]').forEach(el => {
    el.addEventListener('input', () => { currentQuestions[+el.dataset.idx][el.dataset.field] = el.value; });
  });
  listEl.querySelectorAll('textarea[data-field="steps"]').forEach(el => {
    el.addEventListener('input', () => {
      const lines = el.value.split('\n').map(s => s.trim()).filter(Boolean);
      const q = currentQuestions[+el.dataset.idx];
      if(lines.length) q.steps = lines; else delete q.steps;
    });
  });
  listEl.querySelectorAll('input[data-field="o"]').forEach(el => {
    el.addEventListener('input', () => { currentQuestions[+el.dataset.idx].o[+el.dataset.oidx] = el.value; });
  });
  listEl.querySelectorAll('input[data-correct-idx]').forEach(el => {
    el.addEventListener('change', () => { currentQuestions[+el.dataset.idx].c = +el.dataset.correctIdx; });
  });
  listEl.querySelectorAll('input[data-action="toggleHidden"]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('change', () => {
      const q = currentQuestions[+el.dataset.idx];
      if(el.checked) q.hidden = true; else delete q.hidden;
    });
  });
}

async function saveQuizFile(path){
  const statusEl = document.getElementById('quizSaveStatus');
  const saveBtn = document.getElementById('saveQuizBtn');
  saveBtn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.textContent = 'Saving…';
  try{
    let newText;
    if(currentIsJsonFile){
      // data/<subject>/<module>.json — the whole file IS the question array.
      newText = JSON.stringify(currentQuestions, null, 2) + '\n';
    } else {
      newText = currentFileRaw;
      const newTitle = document.getElementById('pageTitleInput').value;
      const newHeading = document.getElementById('headingInput').value;
      newText = newText.replace(/<title>[^<]*<\/title>/, `<title>${newTitle}</title>`);
      newText = newText.replace(/<h1>[^<]*<\/h1>/, `<h1>${newHeading}</h1>`);
      const newQuestionsText = JSON.stringify(currentQuestions, null, 0)
        .replace(/^\[/, '[\n')
        .replace(/\},\{/g, '},\n{')
        .replace(/\]$/, '\n]');
      newText = newText.replace(/const QUESTIONS = \[[\s\S]*?\];/, `const QUESTIONS = ${newQuestionsText};`);
    }

    await callSave(path, newText, `Admin: update quiz — ${path}`);
    currentFileRaw = newText;
    statusEl.className = 'save-status ok';
    statusEl.textContent = 'Saved! It may take a minute or two for GitHub Pages to update the live site.';
  }catch(e){
    statusEl.className = 'save-status err';
    statusEl.textContent = 'Error: ' + e.message;
  }finally{
    saveBtn.disabled = false;
  }
}

// Finds every piece of visible writing on the page (headings, paragraphs, notes, etc.)
// and turns each one into a plain text box — no code shown, ever.
let textNodeRefs = []; // {node, tag} — live references into currentDoc

function collectTextNodes(doc){
  textNodeRefs = [];
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null);
  let n;
  while((n = walker.nextNode())){
    if(!n.nodeValue || n.nodeValue.trim() === '') continue;
    const parentTag = n.parentElement ? n.parentElement.closest('script, style, noscript') : null;
    if(parentTag) continue;
    textNodeRefs.push({ node: n, tag: n.parentElement ? n.parentElement.tagName.toLowerCase() : 'text' });
  }
}

function renderTextEditor(path){
  const parser = new DOMParser();
  currentDoc = parser.parseFromString(currentFileRaw, 'text/html');
  collectTextNodes(currentDoc);

  const titleMatch = currentFileRaw.match(/<title>([^<]*)<\/title>/);
  const pageTitle = titleMatch ? titleMatch[1] : '';

  const editorArea = document.getElementById('editorArea');
  editorArea.innerHTML = `
    <div class="card">
      <div class="field-label">Browser tab title</div>
      <input type="text" id="pageTitleInput2" value="${escapeHtml(pageTitle)}">
    </div>
    <div class="card">
      ${textNodeRefs.map((ref, i) => {
        const val = ref.node.nodeValue.trim();
        const long = val.length > 60;
        return `
          <div class="field-label">${escapeHtml(ref.tag)}</div>
          ${long
            ? `<textarea data-idx="${i}" rows="3">${escapeHtml(val)}</textarea>`
            : `<input type="text" data-idx="${i}" value="${escapeHtml(val)}">`}
        `;
      }).join('')}
    </div>
    <div class="actions">
      <button class="primary" id="saveTextBtn">Save to site</button>
    </div>
    <div class="save-status" id="textSaveStatus"></div>
  `;

  editorArea.querySelectorAll('[data-idx]').forEach(el => {
    el.addEventListener('input', () => {
      textNodeRefs[+el.dataset.idx].node.nodeValue = el.value;
    });
  });

  document.getElementById('saveTextBtn').addEventListener('click', () => saveTextFile(path));
}

}

/* ================= ADD MODULE (DRAG & DROP UPLOAD) TAB ================= */
//
// Lets an admin drop in a self-contained quiz/module HTML file (built with its
// own design, own CSS, own question data) and have it wired into the site's
// three "layers" automatically:
//   1. The quiz file itself — saved under subjects/<subject>/quizzes/, with a
//      small invisible adapter appended so its answers report into the shared
//      LEAProgress tracker (assets/module-progress.js). The quiz's own markup,
//      styling and behavior are left untouched.
//   2. The subject's index.html — a new module card is added (or the subject
//      page is created from scratch if it's a brand-new subject).
//   3. The main index.html — the subject's totals are registered in SUBJECTS
//      so it shows up on the home page.
//
// Two quiz formats are auto-detected:
//   "native"    — the site's own quiz template (const QUESTIONS = [...], and
//                  already calls LEAProgress itself) — just re-point its
//                  LEA_SUBJECT_ID / LEA_MODULE_ID at the chosen module.
//   "blueprint" — the standalone "QUIZ_DATA" reviewer template (const
//                  QUIZ_DATA = [...], function selectOption(...), function
//                  showResults(...)) — gets a small adapter script appended
//                  that hooks those functions to report mastery/scores.

function parseQuizFile(text){
  const titleMatch = text.match(/<title>([^<]*)<\/title>/);
  const h1Match = text.match(/<h1>([^<]*)<\/h1>/);
  const suggestedTitle = (h1Match && h1Match[1].trim()) || (titleMatch && titleMatch[1].trim()) || '';

  function countArray(re){
    const m = text.match(re);
    if(!m) return 0;
    try{ return JSON.parse(m[1]).length; }catch(e){}
    try{ return new Function('return ' + m[1])().length; }catch(e){}
    return 0;
  }

  if(/const QUESTIONS\s*=\s*\[/.test(text) && /LEAProgress/.test(text)){
    return { format:'native', questionCount: countArray(/const QUESTIONS = (\[[\s\S]*?\]);/), suggestedTitle };
  }
  if(/const QUIZ_DATA\s*=\s*\[/.test(text) && /function\s+selectOption\s*\(/.test(text) && /function\s+showResults\s*\(/.test(text)){
    return { format:'blueprint', questionCount: countArray(/const QUIZ_DATA = (\[[\s\S]*?\]);/), suggestedTitle };
  }

  // "practice" template — a third self-built quiz shape (seen in e.g. the
  // PreBoard Practice Set style files): const QUESTIONS = [...] with each
  // item's correct option at item.c, plus its own selectAnswer(i, btn) /
  // showResults() functions and a per-run answersLog/order array. Distinct
  // enough from native (needs LEAProgress) and blueprint (needs QUIZ_DATA +
  // selectOption) that it's safe to recognize by name and wire up properly,
  // instead of falling through to the untracked generic case below.
  if(/const QUESTIONS\s*=\s*\[/.test(text) && /function\s+selectAnswer\s*\(/.test(text) && /function\s+showResults\s*\(/.test(text) && /\banswersLog\b/.test(text)){
    return { format:'practice', questionCount: countArray(/const QUESTIONS = (\[[\s\S]*?\]);/), suggestedTitle };
  }

  // Fallback for self-contained quiz files that don't match either known
  // template exactly (different variable/function names, different question
  // object shape, etc). Rather than reject the file, scan every top-level
  // `const NAME = [ ... ];` array literal in the file and accept the first
  // one that "looks like" a set of quiz questions — each item is an object
  // with at least one array property (the options) with 2+ entries. This
  // can't safely wire up LEAProgress (we don't know the file's own
  // answer-checking function names), so it's embedded as-is: no adapter
  // script is appended, progress just won't be tracked for it.
  function looksLikeQuestionArray(arr){
    if(!Array.isArray(arr) || !arr.length) return false;
    return arr.every(item => {
      if(!item || typeof item !== 'object') return false;
      return Object.values(item).some(v => Array.isArray(v) && v.length >= 2);
    });
  }
  const genericRe = /const\s+([A-Za-z_$][\w$]*)\s*=\s*(\[[\s\S]*?\]);/g;
  let genericMatch;
  while((genericMatch = genericRe.exec(text))){
    const literal = genericMatch[2];
    let arr = null;
    try{ arr = JSON.parse(literal); }catch(e){}
    if(!arr){ try{ arr = new Function('return ' + literal)(); }catch(e){} }
    if(looksLikeQuestionArray(arr)){
      return { format:'generic', questionCount: arr.length, suggestedTitle };
    }
  }

  return { format:'unknown', questionCount:0, suggestedTitle };
}

function buildAdaptedQuizHtml(raw, format, opts){
  const { subjectId, moduleId, subjectName, includeBackLink } = opts;
  let out = raw;
  const assetPath = '../../../assets/module-progress.js?v=2';

  if(format === 'native'){
    out = out.replace(/const LEA_SUBJECT_ID\s*=\s*'[^']*';/, `const LEA_SUBJECT_ID = '${subjectId}';`);
    out = out.replace(/const LEA_MODULE_ID\s*=\s*'[^']*';/, `const LEA_MODULE_ID = '${moduleId}';`);
    if(!/module-progress\.js/.test(out)){
      out = out.replace('</body>', `<script src="${assetPath}"><\/script>\n</body>`);
    }
  } else if(format === 'blueprint'){
    const adapter = `
<script src="${assetPath}"><\/script>
<script>
// ---- Auto-generated by the admin "Add Module" tool: reports this quiz's ----
// ---- answers into the shared LEAProgress tracker, without touching the  ----
// ---- quiz's own markup, styling, or behavior.                           ----
(function(){
  var LEA_SUBJECT_ID = ${JSON.stringify(subjectId)};
  var LEA_MODULE_ID = ${JSON.stringify(moduleId)};
  if (typeof selectOption === 'function') {
    var _leaOrigSelectOption = selectOption;
    selectOption = function(origIdx){
      _leaOrigSelectOption(origIdx);
      try {
        var r = results[current];
        if (r && r.isCorrect && window.LEAProgress) {
          LEAProgress.markMastered(LEA_SUBJECT_ID, LEA_MODULE_ID, order[current]);
        }
      } catch(e){}
    };
  }
  if (typeof showResults === 'function') {
    var _leaOrigShowResults = showResults;
    showResults = function(){
      _leaOrigShowResults();
      try {
        if (window.LEAProgress) {
          var correctCount = results.filter(function(r){ return r && r.isCorrect; }).length;
          LEAProgress.recordRunScore(LEA_SUBJECT_ID, LEA_MODULE_ID, correctCount, order.length);
        }
      } catch(e){}
    };
  }
})();
<\/script>
`;
    out = out.replace('</body>', adapter + '</body>');
  } else if(format === 'practice'){
    const adapter = `
<script src="${assetPath}"><\/script>
<script>
// ---- Auto-generated by the admin "Add Module" tool: reports this quiz's ----
// ---- answers into the shared LEAProgress tracker, without touching the  ----
// ---- quiz's own markup, styling, or behavior.                           ----
(function(){
  var LEA_SUBJECT_ID = ${JSON.stringify(subjectId)};
  var LEA_MODULE_ID = ${JSON.stringify(moduleId)};
  if (typeof selectAnswer === 'function') {
    var _leaOrigSelectAnswer = selectAnswer;
    selectAnswer = function(i, btn){
      var alreadyAnswered = !!answersLog[pos];
      var qIdx = order[pos];
      _leaOrigSelectAnswer(i, btn);
      try {
        if (!alreadyAnswered) {
          var logged = answersLog[pos];
          if (logged && logged.isCorrect && window.LEAProgress) {
            LEAProgress.markMastered(LEA_SUBJECT_ID, LEA_MODULE_ID, qIdx);
          }
        }
      } catch(e){}
    };
  }
  if (typeof showResults === 'function') {
    var _leaOrigShowResults = showResults;
    showResults = function(){
      _leaOrigShowResults();
      try {
        if (window.LEAProgress) {
          var correctCount = answersLog.filter(function(a){ return a && a.isCorrect; }).length;
          LEAProgress.recordRunScore(LEA_SUBJECT_ID, LEA_MODULE_ID, correctCount, order.length);
        }
      } catch(e){}
    };
  }
})();
<\/script>
`;
    out = out.replace('</body>', adapter + '</body>');
  }

  if(includeBackLink){
    const backLinkHtml = `<div style="max-width:760px;margin:0 auto 12px;font:12px 'IBM Plex Mono',monospace;">` +
      `<a href="../index.html" style="color:#8fc4ea;text-decoration:underline;">&larr; Back to ${escapeHtml(subjectName)}</a>` +
      `</div>\n`;
    out = out.replace('<body>', '<body>\n' + backLinkHtml);
  }
  return out;
}

// Appends a module card to a subject page that already uses the generic,
// loop-driven template (detected via LEAProgress.renderModuleBadge).
function appendModuleToGenericSubjectHtml(rawHtml, newModule){
  const numMatches = rawHtml.match(/module-num">Module (\d+)</g) || [];
  const nextNum = numMatches.length + 1;
  const cardHtml = moduleCardHtml(newModule, nextNum);

  const noteIdx = rawHtml.indexOf('<div class="note-panel">');
  let out;
  if(noteIdx === -1){
    // Fallback: no note-panel found — insert right before module-grid's own closing div.
    const gridStart = rawHtml.indexOf('<div class="module-grid">');
    const gridEnd = rawHtml.indexOf('</div>', gridStart);
    out = rawHtml.slice(0, gridEnd) + cardHtml + rawHtml.slice(gridEnd);
  } else {
    const beforeNote = rawHtml.slice(0, noteIdx);
    const lastAClose = beforeNote.lastIndexOf('</a>');
    const insertPos = lastAClose === -1 ? noteIdx : lastAClose + '</a>'.length;
    out = rawHtml.slice(0, insertPos) + '\n' + cardHtml + rawHtml.slice(insertPos);
  }

  out = out.replace(/const MODULES = \[[\s\S]*?\];/, (full) => {
    const m = full.match(/const MODULES = (\[[\s\S]*?\]);/);
    let list = [];
    try{ list = JSON.parse(m[1]); }catch(e){ try{ list = new Function('return ' + m[1])(); }catch(e2){} }
    list.push({ id: newModule.id, total: newModule.total, title: newModule.title });
    return `const MODULES = ${modulesArrayLiteral(list)};`;
  });
  return out;
}

// Extracts what a legacy (hand-authored, pre-generic-template) subject page
// already has, so it can be rebuilt on the generic template without losing
// its existing modules. Progress is unaffected either way since it's keyed
// by subjectId + moduleId, not by page markup.
function migrateLegacySubjectHtml(rawHtml){
  const h1Match = rawHtml.match(/<h1>([^<]*)<\/h1>/);
  const subMatch = rawHtml.match(/<div class="sub">([^<]*)<\/div>/);
  const modulesMatch = rawHtml.match(/const MODULES = (\[[\s\S]*?\]);/);
  let baseModules = [];
  if(modulesMatch){
    try{ baseModules = JSON.parse(modulesMatch[1]); }catch(e){ try{ baseModules = new Function('return ' + modulesMatch[1])(); }catch(e2){} }
  }
  const subs = Array.from(rawHtml.matchAll(/<div class="module-sub">([^<]*)<\/div>/g)).map(m => m[1]);
  const hrefs = Array.from(rawHtml.matchAll(/href="(quizzes\/[^"]+\.html)"/g)).map(m => m[1].replace('quizzes/', ''));
  const modules = baseModules.map((m, i) => ({
    id: m.id, total: m.total, title: m.title,
    sub: subs[i] || '', file: hrefs[i] || (m.id + '.html')
  }));
  return {
    subjectName: h1Match ? h1Match[1].trim() : '',
    tagline: subMatch ? subMatch[1].trim() : '',
    modules
  };
}

function upsertSubjectInIndexHtml(rawIndex, { id, name, href, addQuestions, addModules }){
  const match = rawIndex.match(/const SUBJECTS = (\[[\s\S]*?\]);/);
  const list = new Function('return ' + match[1])();
  const existing = list.find(s => s.id === id);
  if(existing){
    existing.totalQuestions = (existing.totalQuestions || 0) + addQuestions;
    existing.totalModules = (existing.totalModules || 0) + addModules;
    existing.ready = true;
  } else {
    list.push({ id, name, href, ready: true, totalQuestions: addQuestions, totalModules: addModules });
  }
  return rawIndex.replace(/const SUBJECTS = \[[\s\S]*?\];/, `const SUBJECTS = ${subjectsToJsLiteral(list)};`);
}

function handleUploadedFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    uploadedFileText = reader.result;
    uploadedParsed = parseQuizFile(uploadedFileText);
    document.getElementById('dropZoneText').textContent = 'Loaded: ' + file.name;
    const fileInfoEl = document.getElementById('fileInfo');
    const formCard = document.getElementById('uploadFormCard');

    if(uploadedParsed.format === 'unknown' || !uploadedParsed.questionCount){
      fileInfoEl.className = 'save-status err';
      fileInfoEl.textContent = 'Couldn\u2019t recognize a supported question set in this file (looked for the site\u2019s own quiz template or the standalone "QUIZ_DATA" reviewer template).';
      formCard.style.display = 'none';
      return;
    }

    fileInfoEl.className = 'save-status ok';
    const formatLabel = uploadedParsed.format === 'native' ? "LEA site quiz template"
      : uploadedParsed.format === 'blueprint' ? 'Standalone "QUIZ_DATA" reviewer template'
      : uploadedParsed.format === 'practice' ? '"Practice set" reviewer template'
      : 'Self-contained quiz file (progress tracking will not be wired up for this one)';
    fileInfoEl.textContent = `Detected ${uploadedParsed.questionCount} question(s) — format: ${formatLabel}.`;
    formCard.style.display = 'block';

    const suggestedTitle = uploadedParsed.suggestedTitle || file.name.replace(/\.html?$/i, '');
    document.getElementById('uploadModuleTitle').value = suggestedTitle;
    document.getElementById('uploadModuleId').value = slugify(suggestedTitle);
    document.getElementById('uploadFileName').value = file.name.replace(/\s+/g, '_');
  };
  reader.readAsText(file);
}

async function handleAddModule(){
  const statusEl = document.getElementById('uploadStatus');
  const btn = document.getElementById('uploadSubmitBtn');
  function log(msg){ statusEl.innerHTML += '<div>' + escapeHtml(msg) + '</div>'; }

  btn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.innerHTML = '';

  try{
    if(!uploadedFileText || !uploadedParsed || !uploadedParsed.questionCount){
      throw new Error('Drop or choose a supported quiz HTML file first.');
    }

    // ---- Resolve subject ----
    const subjectSelectVal = document.getElementById('uploadSubjectSelect').value;
    let subjectId, subjectName, subjectTagline = '', isNewSubject = false;
    if(subjectSelectVal === '__new__'){
      subjectName = document.getElementById('newSubjectName').value.trim();
      if(!subjectName) throw new Error('Enter a name for the new subject.');
      subjectId = slugify(subjectName);
      subjectTagline = document.getElementById('newSubjectTagline').value.trim();
      isNewSubject = true;
    } else {
      const s = subjects.find(s => s.id === subjectSelectVal);
      if(!s) throw new Error('Pick a subject.');
      subjectId = s.id; subjectName = s.name;
    }

    const moduleTitle = document.getElementById('uploadModuleTitle').value.trim() || uploadedParsed.suggestedTitle || 'Untitled Module';
    const moduleId = slugify(document.getElementById('uploadModuleId').value.trim() || moduleTitle);
    const moduleSub = document.getElementById('uploadModuleSub').value.trim();
    const fileName = (document.getElementById('uploadFileName').value.trim() || (slugify(moduleTitle) + '.html')).replace(/[^a-zA-Z0-9_.-]/g, '_');
    const includeBackLink = document.getElementById('uploadBackLinkChk').checked;

    if(!moduleId) throw new Error('Enter a module ID.');

    log('Preparing quiz file…');
    const adaptedHtml = buildAdaptedQuizHtml(uploadedFileText, uploadedParsed.format, {
      subjectId, moduleId, subjectName, includeBackLink
    });

    const quizPath = `subjects/${subjectId}/quizzes/${fileName}`;
    log('Saving quiz file to ' + quizPath + '…');
    await callSave(quizPath, adaptedHtml, `Admin: add module "${moduleTitle}" to ${subjectId}`);

    // ---- Subject index.html ----
    const subjectIndexPath = `subjects/${subjectId}/index.html`;
    log('Updating subject page…');
    let subjectRaw = null;
    if(!isNewSubject){
      const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${subjectIndexPath}?t=${Date.now()}`;
      const resp = await fetch(url);
      if(resp.ok) subjectRaw = await resp.text();
    }

    const newModuleDef = { id: moduleId, total: uploadedParsed.questionCount, title: moduleTitle, sub: moduleSub, file: fileName };
    let newSubjectHtml;
    if(!subjectRaw){
      newSubjectHtml = buildSubjectIndexHtml({ subjectId, subjectName, tagline: subjectTagline, modules: [newModuleDef] });
    } else if(/LEAProgress\.renderModuleBadge/.test(subjectRaw)){
      newSubjectHtml = appendModuleToGenericSubjectHtml(subjectRaw, newModuleDef);
    } else {
      log('This subject page uses the older hand-built layout — migrating it to the shared module template (existing modules and progress are preserved)…');
      const migrated = migrateLegacySubjectHtml(subjectRaw);
      newSubjectHtml = buildSubjectIndexHtml({
        subjectId,
        subjectName: migrated.subjectName || subjectName,
        tagline: migrated.tagline,
        modules: migrated.modules.concat([newModuleDef])
      });
    }
    await callSave(subjectIndexPath, newSubjectHtml, `Admin: add module "${moduleTitle}" to ${subjectId}`);

    // ---- Main index.html (SUBJECTS) ----
    log('Updating main subjects list…');
    let idx = rawIndexHtml;
    if(!idx){
      const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${INDEX_PATH}?t=${Date.now()}`;
      const resp = await fetch(url);
      idx = await resp.text();
    }
    idx = upsertSubjectInIndexHtml(idx, {
      id: subjectId, name: subjectName, href: `subjects/${subjectId}/index.html`,
      addQuestions: uploadedParsed.questionCount, addModules: 1
    });
    await callSave(INDEX_PATH, idx, `Admin: register module "${moduleTitle}" under ${subjectId}`);
    rawIndexHtml = idx;

    statusEl.className = 'save-status ok';
    log('✅ Done! "' + moduleTitle + '" is live under ' + subjectName + '. It may take a minute or two for GitHub Pages to update the live site.');

    await loadSubjects();
    renderUploadTab();
  }catch(e){
    statusEl.className = 'save-status err';
    log('Error: ' + e.message);
  }finally{
    btn.disabled = false;
  }
}

/* ================= REPORTS TAB ================= */

function reasonSummary(reports){
  const counts = {};
  reports.forEach(r => { counts[r.reason] = (counts[r.reason] || 0) + 1; });
  return Object.keys(counts).map(reason => (counts[reason] > 1 ? counts[reason] + '× ' : '') + reason).join(', ');
}

async function openReportsTab(){
  tabReportsEl.innerHTML = '<div class="card msg info">Loading reports…</div>';
  await loadManifest();
  await loadReports();
  renderReportsTab();
}

function renderReportsTab(){
  if(reportsLoadError){
    tabReportsEl.innerHTML =
      '<div class="card msg error"><b>Couldn\'t load reports.</b><br>' +
      escapeHtml(reportsLoadError) +
      '<br><br>Reports submitted from the app are being held in each reader\'s browser until this is fixed — none are lost, but none are visible here either.</div>';
    return;
  }
  const refs = Object.keys(reportsByQuestionRef);
  if(refs.length === 0){
    tabReportsEl.innerHTML = '<div class="card msg info">No open reports. Nice.</div>';
    return;
  }
  // Newest report in each group first, so the freshest problems surface at the top.
  refs.sort((a, b) => {
    const la = Math.max(...reportsByQuestionRef[a].map(r => new Date(r.created_at).getTime()));
    const lb = Math.max(...reportsByQuestionRef[b].map(r => new Date(r.created_at).getTime()));
    return lb - la;
  });

  tabReportsEl.innerHTML = refs.map(ref => {
    const reports = reportsByQuestionRef[ref];
    const [subjectId, moduleId, qIndexStr] = ref.split('/');
    const qIndex = parseInt(qIndexStr, 10);
    const found = findModuleInManifest(subjectId, moduleId);
    const loc = found ? `${found.subject.name} · ${found.mod.title} · Q${qIndex + 1}` : ref;
    const comments = reports.filter(r => r.comment).map(r => escapeHtml(r.comment));
    return `
      <div class="report-card" data-ref="${escapeHtml(ref)}">
        <div class="rc-top">
          <div class="rc-loc">${escapeHtml(loc)}</div>
          <div class="rc-count">${reports.length} report${reports.length === 1 ? '' : 's'}</div>
        </div>
        <div class="rc-reasons"><b>Reasons:</b> ${escapeHtml(reasonSummary(reports))}</div>
        ${comments.map(c => `<div class="rc-comment">"${c}"</div>`).join('')}
        <div class="actions">
          <button class="primary" data-action="editQ" data-ref="${escapeHtml(ref)}">Edit question</button>
          <button class="danger" data-action="hideQ" data-ref="${escapeHtml(ref)}">Hide item</button>
          <button data-action="dismissQ" data-ref="${escapeHtml(ref)}">Dismiss</button>
        </div>
        <div class="save-status" id="status-${cssEscapeRef(ref)}"></div>
      </div>
    `;
  }).join('');

  tabReportsEl.querySelectorAll('button[data-action="editQ"]').forEach(btn => {
    btn.addEventListener('click', () => openReportInEditor(btn.dataset.ref));
  });
  tabReportsEl.querySelectorAll('button[data-action="hideQ"]').forEach(btn => {
    btn.addEventListener('click', () => hideReportedQuestion(btn.dataset.ref));
  });
  tabReportsEl.querySelectorAll('button[data-action="dismissQ"]').forEach(btn => {
    btn.addEventListener('click', () => dismissReportGroup(btn.dataset.ref));
  });
}

// "Change key" isn't a one-click action here (unlike Hide) — a report only
// ever carries a fixed reason + free-text comment, never a structured "the
// right answer is X" field, so there's nothing safe to act on without a
// human reading the question. That case routes through "Edit question"
// instead, opening the real form with this question expanded.
async function hideReportedQuestion(ref){
  const statusEl = document.getElementById('status-' + cssEscapeRef(ref));
  const [subjectId, moduleId, qIndexStr] = ref.split('/');
  const qIndex = parseInt(qIndexStr, 10);
  const found = findModuleInManifest(subjectId, moduleId);
  if(!found){ await LEAAlert('Could not find this question in the current manifest.'); return; }
  const okHide = await LEAConfirm(
    'Hide Q' + (qIndex + 1) + ' in "' + found.mod.title + '"? It keeps its slot and stops being served — this does not delete or renumber anything, so saved progress is unaffected.',
    { title: 'Hide question', yes: 'Hide question' }
  );
  if(!okHide) return;
  if(statusEl){ statusEl.className = 'save-status'; statusEl.textContent = 'Hiding…'; }
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${found.mod.file}?t=${Date.now()}`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not load the module file');
    const raw = await resp.text();
    let questions, newText;
    if(found.mod.file.endsWith('.json')){
      questions = JSON.parse(raw);
      questions[qIndex].hidden = true;
      newText = JSON.stringify(questions, null, 2) + '\n';
    } else {
      const qMatch = raw.match(/const QUESTIONS = (\[[\s\S]*?\]);/);
      if(!qMatch) throw new Error('Could not find this file’s question list');
      try{ questions = JSON.parse(qMatch[1]); }catch(e){ questions = new Function('return ' + qMatch[1])(); }
      questions[qIndex].hidden = true;
      const newQuestionsText = JSON.stringify(questions, null, 0).replace(/^\[/, '[\n').replace(/\},\{/g, '},\n{').replace(/\]$/, '\n]');
      newText = raw.replace(/const QUESTIONS = \[[\s\S]*?\];/, `const QUESTIONS = ${newQuestionsText};`);
    }
    await callSave(found.mod.file, newText, `Admin: hide Q${qIndex+1} in ${found.mod.file} (from report)`);
    if(statusEl){ statusEl.className = 'save-status ok'; statusEl.textContent = 'Hidden.'; }
  }catch(e){
    if(statusEl){ statusEl.className = 'save-status err'; statusEl.textContent = 'Error: ' + e.message; }
  }
}

function cssEscapeRef(ref){ return ref.replace(/[^a-zA-Z0-9]/g, '_'); }

// Jumps to the Pages & Quizzes tab, opens the right file, and expands the
// exact reported question — this IS the "Change key" / "Hide" path (5a):
// both are just edits made in the normal question form, not separate
// one-click actions, since a report only carries a reason + free-text
// comment, never a structured "the answer should be X" field to act on
// blindly.
function openReportInEditor(ref){
  const [subjectId, moduleId, qIndexStr] = ref.split('/');
  const qIndex = parseInt(qIndexStr, 10);
  const found = findModuleInManifest(subjectId, moduleId);
  if(!found){
    LEAAlert('Could not find this question in the current manifest — it may belong to a module not yet listed in data/subjects.json.');
    return;
  }
  document.querySelector('.tab-btn[data-tab="pages"]').click();
  if(fileTree.length === 0){
    loadFileTree().then(() => openFile(found.mod.file, qIndex));
  } else {
    openFile(found.mod.file, qIndex);
  }
}

async function dismissReportGroup(ref){
  const statusEl = document.getElementById('status-' + cssEscapeRef(ref));
  const reports = reportsByQuestionRef[ref] || [];
  const okDismiss = await LEAConfirm(
    'Dismiss ' + reports.length + ' report' + (reports.length === 1 ? '' : 's') + ' for this question? This marks them resolved without changing the question.',
    { title: 'Dismiss reports', yes: 'Dismiss' }
  );
  if(!okDismiss) return;
  if(statusEl){ statusEl.className = 'save-status'; statusEl.textContent = 'Dismissing…'; }
  try{
    const ids = reports.map(r => r.id);
    const { error } = await sb.from('reports').update({ status: 'dismissed' }).in('id', ids);
    if(error) throw error;
    await loadReports();
    renderReportsTab();
  }catch(e){
    if(statusEl){ statusEl.className = 'save-status err'; statusEl.textContent = 'Error: ' + e.message; }
  }
}

init();
</script>

  document.querySelectorAll('.btn-ico[data-icon]').forEach(function(el){
    var fn = LEAIcons[el.getAttribute('data-icon')];
    if(fn) el.innerHTML = fn(15);
  });
