<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<title>LEA Reviewer — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/lea-confirm.js?v=16"></script>
<script src="assets/icons.js?v=16"></script>
<!-- The same reader the app uses, so what the editor sees is exactly what a
     reader gets. Its balanced-bracket scan also survives question text that a
     regex would truncate. -->
<script src="assets/quiz-source.js?v=16"></script>
<script src="assets/quiz-rework.js?v=16"></script>
<script src="assets/docx-quiz.js?v=16"></script>
<script src="assets/image-intake.js?v=16"></script>
<script src="assets/theme.js?v=16" data-alt-class="light-mode" data-default-is="dark"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-deep:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268;
    --rose:#6fa8cf; --rose-bright:#8fc4ea; --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-head: 'Big Shoulders Display', sans-serif; --font-body: 'Space Grotesk', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-deep:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c;
    --rose:#2f6c95; --rose-bright:#1b4a6b; --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  /* inline SVG icons sitting inside a text label */
  .btn-ico{ display:inline-flex; vertical-align:-2px; margin-right:2px; }
  .btn-ico svg{ width:15px; height:15px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh; padding:32px 16px 80px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-family:var(--font-head);font-weight:800;font-size:36px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;color:var(--ink);}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab-btn{
    font-family:var(--font-body); cursor:pointer; border-radius:8px 8px 0 0; border:1px solid var(--line);
    border-bottom:none; background:var(--bg-panel-deep); color:var(--muted); padding:10px 16px; font-size:14px;
  }
  .tab-btn.active{background:var(--bg-panel);color:var(--gold-bright);font-weight:600;}
  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;}
  .msg{padding:16px;border-radius:10px;font-size:14px;}
  .msg.error{background:rgba(198,90,82,0.15);border:1px solid var(--bad);color:var(--bad);}
  .msg.info{background:rgba(201,154,70,0.12);border:1px solid var(--line);color:var(--muted);}
  a{color:var(--gold-bright);}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  /* Subjects — one collapsed card each, opened to edit. Same shape as the
     report cards (.rep-*): a head you tap, a body that unfolds beneath it.
     At rest the whole tab is a short list of names, which is the point:
     it mostly gets read on a phone. */
  .subj{border:1px solid var(--line);border-radius:12px;background:var(--bg-panel-deep);
        margin-bottom:12px;overflow:hidden;}
  .subj.open{border-color:var(--gold);}
  .subj-head{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;cursor:pointer;}
  .subj-head:hover{background:rgba(111,168,207,0.05);}
  .subj-caret{color:var(--muted);font-size:13px;line-height:1.5;flex-shrink:0;width:12px;transition:transform .15s ease;}
  .subj.open .subj-caret{transform:rotate(90deg);}
  .subj-main{flex:1;min-width:0;}
  /* Subject names run long ("Professional Practice and Ethics"); breaking is
     better than a head that pushes the status pill off the screen edge. */
  .subj-name{font-size:15px;font-weight:600;line-height:1.4;word-break:break-word;}
  .subj-count{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .subj-pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
             color:var(--muted);flex-shrink:0;white-space:nowrap;}
  .subj-pill.live{color:var(--good);border-color:var(--good);background:rgba(95,191,130,.12);}

  .subj-body{padding:0 16px 16px;border-top:1px solid var(--line);}
  .subj-field{margin-top:16px;}
  .subj-field > label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .subj-field > label span{color:var(--muted);font-weight:400;}
  .subj-field input[type="text"]{width:100%;margin:0;}
  /* Move/Delete sit below everything the card can edit, fenced off, so the
     destructive one is never the button next to the name field. */
  .subj-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;
             border-top:1px solid var(--line);}
  .subj-btns .spacer{flex:1;}
  .subj-more{margin-top:4px;}
  .subj-more summary{cursor:pointer;font-size:13px;color:var(--muted);}
  .subj-more summary:hover{color:var(--gold-bright);}

  /* One module per row: what it is on the first line, what you can do to it
     on the second. The file path lives in the Pages tab and is not repeated
     here — it was the longest thing on the row and the least often needed. */
  .mod-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .mod-row:last-child{border-bottom:none;}
  .mod-line{display:flex;gap:10px;align-items:baseline;}
  .mod-no{font-family:var(--font-mono);font-size:11px;color:var(--muted);min-width:20px;flex-shrink:0;}
  .mod-title{flex:1;min-width:0;font-size:13.5px;line-height:1.45;word-break:break-word;}
  .mod-count{font-size:12px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
  .mod-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-left:30px;}
  .mod-colours{display:flex;gap:5px;}
  .mod-row button.mod-x{padding:4px 11px;font-size:11px;margin-left:auto;}
  .mod-none{font-size:13px;color:var(--muted);margin-top:8px;}
  .swatch{width:19px;height:19px;padding:0;border-radius:50%;border:1px solid var(--line);cursor:pointer;}
  .swatch.none{background:transparent;position:relative;}
  /* A line through the empty circle, so "no colour" does not read as
     "a colour that has not loaded". */
  .swatch.none::after{content:'';position:absolute;left:3px;right:3px;top:8px;
                      height:1px;background:var(--muted);transform:rotate(-45deg);}
  .swatch.on{outline:2px solid var(--ink);outline-offset:1px;}
  .unlisted-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
                padding:10px 0;border-bottom:1px solid var(--line);}
  .unlisted-row .u-path{font-family:var(--font-mono);font-size:12px;flex:1 1 100%;word-break:break-all;}
  .unlisted-row .u-path button{padding:1px 7px;font-size:11px;margin-left:6px;}
  .u-peek-out{flex:1 1 100%;font-size:12px;color:var(--muted);margin:-2px 0 2px;}
  .unlisted-row.done{opacity:.75;}
  .unlisted-row.was-hidden{opacity:.55;}
  .u-done{flex:1 1 100%;font-size:13px;color:var(--good);}
  /* A title that was recovered rather than typed, so it is obvious which is which. */
  input.u-title-found{border-color:var(--good);}
  .unlisted-row input[type="text"]{flex:2 1 200px;min-width:0;margin:0;}
  .unlisted-row select{flex:1 1 160px;min-width:0;margin:0;}

  /* ===== picture on a question ===== */
  .q-img{
    display:flex; align-items:center; gap:12px; padding:10px;
    border:2px dashed var(--line); border-radius:10px; cursor:pointer;
    background:var(--bg-panel-2); margin-bottom:4px;
  }
  .q-img:hover, .q-img:focus{ border-color:var(--gold); outline:none; }
  .q-img.over{ border-color:var(--gold); background:rgba(224,168,63,0.08); }
  .q-img img{ max-width:150px; max-height:90px; border-radius:6px; display:block; background:#fff; }
  .q-img .q-img-say{ flex:1; font-size:12px; color:var(--muted); line-height:1.6; }
  .q-img .q-img-say b{ color:var(--ink); font-weight:600; }
  .q-img .q-img-say .warn{ color:var(--bad); }
  .q-img-drop{ margin-bottom:10px; }
  /* A figure that still came from the review centre. Marked so it can be
     found and replaced; the mark disappears by itself once a picture is
     pasted over it, because a pasted picture is stored inline rather than
     as a file. Nothing to tick off by hand. */
  .q-img.from-rc{ border-color:var(--bad); background:rgba(226,96,74,0.07); }
  .q-img .rc-tag{
    display:inline-block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--bad); border:1px solid var(--bad); border-radius:20px; padding:2px 7px; margin-bottom:4px;
  }
  .rc-banner{
    background:rgba(226,96,74,0.12); border:1px solid var(--bad); color:var(--ink);
    border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.6;
  }
  .rc-banner b{ color:var(--bad); }
  .q-img-drop .drop-x{
    background:none; border:none; color:var(--bad); cursor:pointer; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; padding:4px 8px; flex-shrink:0;
  }
  .row:last-child{border-bottom:none;}
  input[type="text"], textarea, select{
    background:var(--bg-panel-deep); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:8px; font-family:var(--font-body); font-size:14px; width:100%;
  }
  .row input[type="text"]{flex:1;}
  textarea{resize:vertical;}
  .status-tag{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;}
  button{
    font-family:var(--font-body); cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-panel-deep); color:var(--ink); padding:7px 10px; font-size:13px;
  }
  button:hover{border-color:var(--gold);}
  button.primary{background:var(--gold);color:var(--bg-deep);border:none;font-weight:600;}
  button.primary:hover{background:var(--gold-bright);}
  button.danger{color:var(--bad);border-color:var(--bad);}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .toggle-btn.on{color:var(--good);border-color:var(--good);}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .save-status{font-size:13px;margin-top:10px;min-height:18px;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--bad);}
  .field-label{font-size:12px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:0.06em;}
  .file-list{max-height:280px;overflow-y:auto;}

  /* ===== scrollbars =====
     The platform scrollbar is a light slab with a boxed track and arrow
     buttons; on a dark panel it reads as a sticker stuck to the page rather
     than part of it. This leaves just a thin thumb in the palette, quiet at
     rest and brightening on hover so it stays easy to grab.

     Chrome ignores ::-webkit-scrollbar entirely the moment scrollbar-width is
     set, so the standard properties sit behind @supports for Firefox, which
     is the engine with no webkit pseudo-elements. */
  .file-list::-webkit-scrollbar{ width:8px; height:8px; }
  .file-list::-webkit-scrollbar-track{ background:transparent; }
  .file-list::-webkit-scrollbar-button{ display:none; width:0; height:0; }
  .file-list::-webkit-scrollbar-thumb{ background:var(--muted); border-radius:4px; border:2px solid transparent; background-clip:content-box; }
  .file-list::-webkit-scrollbar-thumb:hover{ background:var(--blue-bright); background-clip:content-box; }
  @supports not selector(::-webkit-scrollbar){
    .file-list{ scrollbar-width:thin; scrollbar-color:var(--muted) transparent; }
  }

  .file-item{
    padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-family:monospace;
    display:flex;justify-content:space-between;
  }
  .file-item:hover{background:var(--bg-panel-deep);}
  .q-card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--bg-panel-deep);}
  .q-opts{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:6px;}
  .hidden{display:none;}

  /* Rework Module tab */
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px;}
  .field-note{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.5;}
  .msg.ok-msg{background:rgba(95,191,130,0.12);border:1px solid var(--good);color:var(--good);}
  .rw-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .rw-table th,.rw-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  .rw-table th{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;}
  .rw-pre{background:var(--bg-panel-deep);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:12px;font-family:var(--font-mono);}
  #tab-rework details{margin-top:12px;}
  #tab-rework details>summary{cursor:pointer;color:var(--gold-bright);font-size:13px;}

  .q-row{cursor:pointer;}
  .q-row .qr-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .q-row .qr-hidden-tag{color:var(--muted);font-style:italic;}
  .report-badge{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(226,96,74,0.15);border:1px solid var(--bad);color:var(--bad);white-space:nowrap;}
  .filter-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted);}
  .report-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--bg-panel-deep);}
  .report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .report-card .rc-loc{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .report-card .rc-count{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(226,96,74,0.15);border:1px solid var(--bad);color:var(--bad);white-space:nowrap;flex-shrink:0;}
  .report-card .rc-question{font-size:14px;margin:6px 0 10px;}
  .report-card .rc-reasons{font-size:12.5px;color:var(--muted);margin-bottom:6px;line-height:1.6;}
  .report-card .rc-reasons b{color:var(--ink);}
  .report-card .rc-comment{font-size:12.5px;color:var(--ink);background:var(--bg-panel);border-radius:6px;padding:8px 10px;margin:4px 0;}

  /* ===== Rework tab ===== */
  .rw-drop{border:2px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;
    cursor:pointer;color:var(--muted);transition:border-color .15s ease, background .15s ease;}
  .rw-drop:hover,.rw-drop.over{border-color:var(--gold);background:rgba(224,168,63,.06);}
  .rw-drop b{color:var(--ink);font-size:15px;display:inline-block;margin-bottom:4px;}
  .rw-drop span{font-size:13px;}
  .rw-more{margin-top:12px;}
  .rw-more summary{cursor:pointer;font-size:13px;color:var(--muted);}
  .rw-more summary:hover{color:var(--gold-bright);}

  .rw-job-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .rw-state{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .rw-state.ok{color:var(--good);}
  .rw-state.bad{color:var(--bad);}
  .rw-job-btns{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;}

  /* The question preview: what a reader will actually see, not a stats table. */
  .rw-peek{margin-top:14px;border:1px solid var(--line);border-radius:10px;
    padding:16px;background:var(--bg-panel-deep);}
  .rw-peek-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:14px;font-size:13px;color:var(--muted);}
  .rw-peek-topic{font-size:12px;color:var(--gold-bright);margin-bottom:6px;}
  .rw-peek-stem{font-size:15px;line-height:1.55;margin-bottom:14px;}
  .rw-choice{display:flex;gap:10px;align-items:baseline;padding:9px 12px;margin-bottom:6px;
    border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.5;}
  .rw-choice.right{border-color:var(--good);background:rgba(95,191,130,.10);}
  .rw-letter{color:var(--muted);font-size:12.5px;width:16px;flex-shrink:0;}
  .rw-choice.right .rw-letter{color:var(--good);}
  .rw-right-tag{margin-left:auto;color:var(--good);font-size:12px;flex-shrink:0;}
  .rw-peek input[type="text"],.rw-peek textarea{width:100%;}
  .rw-peek .rw-choice{gap:9px;align-items:center;}
  .rw-peek .rw-choice input[type="radio"]{width:16px;height:16px;flex-shrink:0;accent-color:var(--good);cursor:pointer;margin:0;}
  .rw-opt{flex:1;min-width:0;}
  .rw-x{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;
    padding:2px 6px;flex-shrink:0;}
  .rw-x:hover{color:var(--bad);}
  .rw-peek-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:16px;flex-wrap:wrap;}
  .rw-state.warn{color:var(--gold-bright);}

  /* ===== Reports tab =====
     A report opens where it sits. The old card had an "Edit question" button
     that threw you into the Pages tab and left you to find the question
     yourself; everything needed to settle a report is now in the card. */
  .rep-head-strip{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .rep-head-strip h2{font-family:var(--font-body);font-size:17px;font-weight:600;margin:0;}
  .rep-head-strip .note{font-size:13px;color:var(--muted);}
  .rep-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .rep-chip{font-size:13px;padding:6px 12px;border-radius:20px;background:transparent;}
  .rep-chip.on{background:var(--gold);color:var(--bg-deep);border-color:var(--gold);font-weight:600;}

  .rep{border:1px solid var(--line);border-radius:12px;background:var(--bg-panel-deep);margin-bottom:14px;overflow:hidden;}
  .rep.open{border-color:var(--gold);}
  .rep.done{opacity:.55;}
  .rep-head{display:flex;gap:14px;align-items:flex-start;padding:16px;cursor:pointer;}
  .rep-head:hover{background:rgba(111,168,207,0.05);}
  .rep-caret{color:var(--muted);font-size:13px;line-height:1.5;flex-shrink:0;width:12px;transition:transform .15s ease;}
  .rep.open .rep-caret{transform:rotate(90deg);}
  .rep-main{flex:1;min-width:0;}
  .rep-where{font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .rep-q{font-size:14.5px;line-height:1.5;margin-bottom:8px;}
  .rep-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .rep-meta .by b{color:var(--ink);font-weight:600;}
  .rep-tag{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);}
  .rep-tag.key{color:var(--bad);border-color:var(--bad);background:rgba(226,96,74,.12);}
  .rep-tag.wording{color:var(--gold-bright);border-color:var(--gold);background:rgba(224,168,63,.12);}

  .rep-body{padding:0 16px 16px;border-top:1px solid var(--line);}
  .rep-sec{margin-top:18px;}
  .rep-sec-title{font-size:13px;font-weight:600;margin-bottom:8px;}
  .rep-sec-title span{color:var(--muted);font-weight:400;}
  .rep-said{background:var(--bg-panel);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:8px;}
  .rep-said .who{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .rep-choice{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .rep-choice input[type="radio"]{width:17px;height:17px;flex-shrink:0;accent-color:var(--good);cursor:pointer;}
  .rep-choice input[type="text"]{flex:1;}
  .rep-choice.correct input[type="text"]{border-color:var(--good);}

let currentFileRaw = '';

// ---- Manifest (data/subjects.json) ----
// This is the catalogue the live site reads: which subjects exist, which
// modules each has, and what file each module's questions live in. It backs
// the Subjects tab, resolves a report's question_ref (subjectId/moduleId/
// qIndex) to an actual file, and annotates the file list with report counts.
//
// `manifestSubjects` and `subjects` are deliberately the SAME array. The
// Subjects tab edits it in place and the Reports tab reads it; two copies
// would drift the moment either saved.
let manifestSubjects = null;

function parseManifestText(text){
  const parsed = JSON.parse(text);
  if(!Array.isArray(parsed)) throw new Error(MANIFEST_PATH + ' is not a list of subjects.');
  return parsed;
}

// raw.githubusercontent.com is a CDN, and it kept serving the previous commit
// for minutes after a save. Every save here is "read the manifest, append to
// it, write it back", so a stale read wrote back a list missing whatever the
// save before it had added — silently, under a success message. Fourteen
// modules were committed to the repository and dropped from the site that
// way. The contents API reads the branch itself and does not lag, so it is
// asked first; raw is only the fallback for when it is unavailable.
async function fetchManifest(){
  try{
    const api = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MANIFEST_PATH}?ref=${GITHUB_BRANCH}&t=${Date.now()}`;
    const resp = await fetch(api, { cache: 'no-store', headers: { 'Accept': 'application/vnd.github.raw' } });
    // A 403 here is the unauthenticated rate limit (60 an hour), not a real
    // failure — fall through rather than locking the admin out of saving.
    if(resp.ok) return parseManifestText(await resp.text());
  }catch(e){ /* offline, blocked, or rate-limited — fall through to raw */ }

  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${MANIFEST_PATH}?t=${Date.now()}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if(!resp.ok) throw new Error('Could not fetch ' + MANIFEST_PATH + ' (status ' + resp.status + ')');
  return parseManifestText(await resp.text());
}

/* ---- Never write a manifest that would drop a module ---------------------
 * Belt and braces for the above. Every module the site is known to have is
 * remembered on this device as "subjectId|moduleId". A manifest that comes
 * back missing one of them is a read that has not caught up, not a deletion,
 * and must never be used as the base for a write. Removing something on
 * purpose records it in removedModuleKeys first, so a deliberate delete does
 * not trip the guard.
 */
const MANIFEST_KNOWN_KEY = 'lea-admin-known-modules';
const removedModuleKeys = new Set();
// Modules removed on screen this session, waiting for "Save to site" to
// actually archive their file content and free their number. Kept separate
// from removedModuleKeys (which only guards the stale-manifest check) because
// this one needs the full module object, not just its id.
let pendingModuleArchives = [];

function manifestKeys(list){
  const out = [];
  (list || []).forEach(s => (s.modules || []).forEach(m => out.push(s.id + '|' + m.id)));
  return out;
}
function readKnownModules(){
  try{
    const v = JSON.parse(localStorage.getItem(MANIFEST_KNOWN_KEY));
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
// After a write, or when the admin explicitly asks for a fresh copy: this is
// exactly what the site holds now, so replace what was remembered.
function rememberManifest(list){
  try{ localStorage.setItem(MANIFEST_KNOWN_KEY, JSON.stringify(manifestKeys(list))); }catch(e){}
}
// After an ordinary read, which might itself be the stale copy this whole
// guard exists to catch. Only ever adds, so a stale read cannot quietly
// shrink the list and disarm the check.
function noteManifestSeen(list){
  const merged = new Set(readKnownModules());
  manifestKeys(list).forEach(k => merged.add(k));
  try{ localStorage.setItem(MANIFEST_KNOWN_KEY, JSON.stringify([...merged])); }catch(e){}
}
function missingFromManifest(list){
  const have = new Set(manifestKeys(list));
  return readKnownModules().filter(k => !have.has(k) && !removedModuleKeys.has(k));
}
const waitMs = ms => new Promise(r => setTimeout(r, ms));

// The only read allowed to be the base of a write. Polls until GitHub is
// serving everything we already know is on the site, then refuses rather than
// writing a list that would delete someone's work.
async function fetchManifestForWrite(log){
  let manifest = null, missing = [];
  for(let attempt = 0; attempt < 6; attempt++){
    manifest = await fetchManifest();
    missing = missingFromManifest(manifest);
    if(!missing.length) return manifest;
    if(log) log('GitHub is still catching up — ' + missing.length + ' module' +
                (missing.length === 1 ? ' it already has is' : 's it already has are') +
                ' not in the copy it just handed back. Waiting…');
    await waitMs(2500);
  }
  throw new Error(
    'GitHub is still serving an out-of-date ' + MANIFEST_PATH + ' — ' + missing.length +
    ' module' + (missing.length === 1 ? ' is' : 's are') + ' missing from it (' +
    missing.slice(0, 3).join(', ') + (missing.length > 3 ? ', and more' : '') +
    '). Nothing was written: saving on top of that copy would have removed ' +
    (missing.length === 1 ? 'it' : 'them') + ' from the site. Wait a minute and try again. ' +
    'If ' + (missing.length === 1 ? 'it was' : 'they were') + ' removed on purpose from ' +
    'somewhere else, press "Reload from GitHub" on the Subjects tab first.');
}

async function loadManifest(){
  // A failed load used to be cached as [] — which is truthy, so this early
  // return fired forever after and the Reports tab stayed stuck showing raw
  // subject/module/index refs for the rest of the session. Only keep a
  // result that actually has something in it, so a blip retries.
  if(manifestSubjects && manifestSubjects.length) return manifestSubjects;
  try{
    manifestSubjects = await fetchManifest();
    subjects = manifestSubjects;
    noteManifestSeen(manifestSubjects);
  }catch(e){ manifestSubjects = []; }
  return manifestSubjects;
}

// Total questions across a subject's modules — shown read-only, since it is
// derived from the modules rather than typed.
function subjectQuestionCount(s){
  return (s.modules || []).reduce((n, m) => n + (Number(m.total) || 0), 0);
}

// Modules are numbered "01", "02", … in the order they appear. Read off the
// highest existing number rather than the array length, so a manifest that
// was hand-edited into a gap still gets a fresh number.
function nextModuleNo(subject){
  const used = (subject.modules || []).map(m => parseInt(m.no, 10)).filter(n => !isNaN(n));
  const next = used.length ? Math.max.apply(null, used) + 1 : 1;
  return String(next).padStart(2, '0');
}
function findModuleInManifest(subjectId, moduleId){
  const list = manifestSubjects || [];
  const subject = list.find(s => s.id === subjectId);
  const mod = subject && (subject.modules || []).find(m => m.id === moduleId);
  return mod ? { subject, mod } : null;
}

// ---- Reading and writing a module's questions, whatever it is stored as ----
//
// Three shapes are in the repository:
//   data/<subject>/<module>.json  — the file IS the question array
//   quiz page, `const QUESTIONS`  — already the canonical { s, q, o, c } shape
//   quiz page, `const QUIZ_DATA`  — older shape: each option carries its own
//                                   letter, and `correct` is that letter
//
// The editor works in the canonical shape only. QUIZ_DATA rows are mapped in
// on open and mapped back out on save, writing into a copy of the ORIGINAL
// row so any key the editor doesn't know about survives the round trip.

function quizDataToEditor(rows){
  return rows.map(row => {
    row = row || {};
    const opts = row.options || [];
    const texts = [];
    let correctIdx = -1;
    opts.forEach((o, j) => {
      if(o && typeof o === 'object'){
        texts.push(o.text);
        if(o.letter != null && String(o.letter) === String(row.correct)) correctIdx = j;
      } else {
        texts.push(o);
      }
    });
    if(correctIdx === -1) correctIdx = texts.indexOf(row.correct);
    return {
      s: row.s || '',
      q: row.question != null ? row.question : (row.q || ''),
      o: texts,
      c: correctIdx,
      n: row.explanation || row.n || '',
      ref: row.ref || '',
      // Left exactly as written. LEAQuizSource rebases image paths for
      // rendering from the site root; rebasing here and writing back would
      // double the prefix on every save.
      img: row.img,
      nimg: row.nimg,
      scenario: row.scenario || '',
      hidden: !!row.hidden
    };
  });
}

function editorToQuizData(edited, originals){
  return edited.map((q, i) => {
    const orig = (originals && originals[i]) || null;
    const row = orig ? Object.assign({}, orig) : {};

    // Keep whichever key this file already used for the question text.
    if(orig && orig.q !== undefined && orig.question === undefined) row.q = q.q;
    else row.question = q.q;

    const origOpts = (orig && orig.options) || [];
    const objectShaped = origOpts.length ? (origOpts[0] && typeof origOpts[0] === 'object') : true;
    row.options = (q.o || []).map((text, j) => {
      const oo = origOpts[j];
      if(oo && typeof oo === 'object') return Object.assign({}, oo, { text: text });
      if(objectShaped) return { letter: String.fromCharCode(65 + j), text: text };
      return text;
    });

    // The answer is stored as a letter where the options carry letters, and as
    // the answer's own text where they don't.
    const chosen = row.options[q.c];
    if(chosen && typeof chosen === 'object') row.correct = chosen.letter;
    else if(chosen !== undefined) row.correct = chosen;

    if(orig && orig.n !== undefined && orig.explanation === undefined){ if(q.n) row.n = q.n; else delete row.n; }
    else if(q.n) row.explanation = q.n;
    else delete row.explanation;

    if(q.ref) row.ref = q.ref; else delete row.ref;
    // Written only when set: QUIZ_DATA carries no topic of its own, and an
    // empty string would make an untagged module look tagged to the topics
    // block on the subject page.
    if(q.s) row.s = q.s; else delete row.s;
    if(q.img) row.img = q.img; else delete row.img;
    if(q.nimg) row.nimg = q.nimg; else delete row.nimg;
    if(q.scenario) row.scenario = q.scenario; else delete row.scenario;
    if(q.hidden) row.hidden = true; else delete row.hidden;
    return row;
  });
}

// One question per line — big arrays stay diffable without being reformatted
// wholesale.
function arrayToLiteralText(rows){
  return JSON.stringify(rows, null, 0)
    .replace(/^\[/, '[\n')
    .replace(/\},\{/g, '},\n{')
    .replace(/\]$/, '\n]');
}

/**
 * Parse a module file into { kind, rows, editable, varName }.
 * `rows` is what gets written back; `editable` is the canonical shape shown in
 * the form. For every kind but quizdata they are the same array.
 * Returns null when the file holds no recognisable question list.
 */
function readQuestionSource(path, raw){
  if(path.endsWith('.json')){
    const rows = JSON.parse(raw);
    return { kind:'json', rows, editable: rows, varName:null };
  }
  const asQuestions = LEAQuizSource.extractArrayLiteral(raw, 'QUESTIONS');
  if(asQuestions) return { kind:'questions', rows: asQuestions, editable: asQuestions, varName:'QUESTIONS' };
  const asQuizData = LEAQuizSource.extractArrayLiteral(raw, 'QUIZ_DATA');
  if(asQuizData) return { kind:'quizdata', rows: asQuizData, editable: quizDataToEditor(asQuizData), varName:'QUIZ_DATA' };
  return null;
}

/** Serialise edited questions back into the file they came from. */
function writeQuestionSource(kind, varName, rawFileText, originals, edited){
  if(kind === 'json') return JSON.stringify(edited, null, 2) + '\n';
  const rows = (kind === 'quizdata') ? editorToQuizData(edited, originals) : edited;
  const out = LEAQuizSource.replaceArrayLiteral(rawFileText, varName, arrayToLiteralText(rows));
  if(out === null) throw new Error('Could not find the ' + varName + ' list in this file any more.');
  return out;
}

// ---- Reports (Supabase `reports` table, grouped by question_ref) ----
let openReports = [];          // raw rows, status='open'
let reportsByQuestionRef = {}; // question_ref -> [report, ...]
let reportsLoadError = null;

let reporterNames = {};   // user_id -> username, filled from `profiles`

// reports.user_id has its foreign key on auth.users, not profiles, so
// PostgREST will not join the two in one select. The names come from a second
// read of profiles, which is publicly readable.
async function loadReporterNames(){
  const ids = [...new Set(openReports.map(r => r.user_id).filter(Boolean))]
    .filter(id => !(id in reporterNames));
  if(!ids.length) return;
  const { data } = await sb.from('profiles').select('id,username').in('id', ids);
  (data || []).forEach(p => { reporterNames[p.id] = p.username; });
}
function reporterName(r){ return reporterNames[r.user_id] || 'someone'; }

async function loadReports(){
  const { data, error } = await sb.from('reports').select('*').eq('status', 'open').order('created_at', { ascending: false });
  // A failed query used to fall through to `data || []`, which renders the
  // "no open reports" all-clear — the worst possible lie on the one screen
  // whose job is surfacing problems. Keep the error so the tab can say so.
  reportsLoadError = error ? (error.message || String(error)) : null;
  openReports = data || [];
  reportsByQuestionRef = {};
  openReports.forEach(r => { (reportsByQuestionRef[r.question_ref] = reportsByQuestionRef[r.question_ref] || []).push(r); });
  await loadReporterNames();
}
// Report counts for whatever file is currently open in the Pages editor, keyed by question index.
function reportCountsForCurrentFile(){
  const counts = {};
  if(!currentModuleRef) return counts;
  Object.keys(reportsByQuestionRef).forEach(ref => {
    const parts = ref.split('/');
    if(parts[0] === currentModuleRef.subjectId && parts[1] === currentModuleRef.moduleId){
      counts[parts[2]] = reportsByQuestionRef[ref].length;
    }
  });
  return counts;
}
let currentModuleRef = null; // { subjectId, moduleId } for whatever quiz file is open, when known from the manifest

// ---- "Add Module" (drag & drop upload) tab state ----
let uploadedFileText = null;
let uploadedParsed = null;   // { format: 'native'|'blueprint'|'unknown', questionCount, suggestedTitle }

function showGate(html, isError){
  gateEl.style.display = 'block';
  gateEl.className = 'card msg ' + (isError ? 'error' : 'info');
  gateEl.innerHTML = html;
  panelEl.style.display = 'none';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function callSave(path, content, message){
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/admin-save-file`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
    body: JSON.stringify({ path, content, message })
  });
  const result = await resp.json();
  if(!resp.ok) throw new Error(result.error || 'Save failed');
  return result;
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    showGate('You need to be logged in first. <a href="index.html">Go log in on the main site</a>, then come back to this page.');
    return;
  }
  accessToken = session.access_token;

  const { data: profile, error } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
  if(error || !profile || profile.is_admin !== true){
    showGate('This account is not an admin, so this page is not available to you.', true);
    return;
  }

  gateEl.style.display = 'none';
  panelEl.style.display = 'block';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tabSubjectsEl.classList.toggle('hidden', btn.dataset.tab !== 'subjects');
      tabPagesEl.classList.toggle('hidden', btn.dataset.tab !== 'pages');
      tabUploadEl.classList.toggle('hidden', btn.dataset.tab !== 'upload');
      tabReworkEl.classList.toggle('hidden', btn.dataset.tab !== 'rework');
      tabDeletedEl.classList.toggle('hidden', btn.dataset.tab !== 'deleted');
      tabReportsEl.classList.toggle('hidden', btn.dataset.tab !== 'reports');
      if(btn.dataset.tab === 'pages' && fileTree.length === 0) loadFileTree();
      if(btn.dataset.tab === 'upload') renderUploadTab();
      if(btn.dataset.tab === 'rework') renderReworkTab();
      if(btn.dataset.tab === 'deleted') scanDeletedModules();
      if(btn.dataset.tab === 'reports') openReportsTab();
    });
  });

  // loadSubjects() populates the manifest too — they are one array.
  await loadSubjects();
}

/* ================= SUBJECTS TAB ================= */

async function loadSubjects(fromReloadButton){

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// The palette the site paints modules with — assets/blueprint.css holds the
// same eight, and the two have to move together. A colour marks a group in a
// long list, so what matters is that they stay apart from one another.
const MODULE_COLOURS = [
  { id: 'amber',  hex: '#d99a2b', name: 'Amber'  },
  { id: 'orange', hex: '#d97b3c', name: 'Orange' },
  { id: 'red',    hex: '#cf5b52', name: 'Red'    },
  { id: 'rose',   hex: '#d4607d', name: 'Rose'   },
  { id: 'violet', hex: '#8b7ac9', name: 'Violet' },
  { id: 'blue',   hex: '#4a8fc4', name: 'Blue'   },

];

function swatchesHtml(subjectIdx, mod){
  const current = mod.color || '';

// One row per module, each with a way to take it off the site. Removing is
// deliberately only an edit to the list on screen — nothing is written until
// "Save to site", the same as renaming a subject, so a misclick costs nothing.
function moduleRowsHtml(subject, subjectIdx){
  const mods = subject.modules || [];
  if(!mods.length) return '<div class="mod-none">Nothing here yet. Add one from the <b>Add Module</b> or <b>Rework Module</b> tab.</div>';
  return mods.map(m => {
    const total = Number(m.total) || 0;

    <div class="mod-row">

      </div>
