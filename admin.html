/* ---------------- "Rework Module" tab ---------------- */
//
// Takes a question set that already exists — one of the site's own modules, or
// a file — reshapes it (restructured stems, choices moved, questions
// re-sequenced) and writes the result straight into the site as a new
// data/<subject>/NN.json module, registered in data/subjects.json.
//
// The reshaping itself lives in assets/quiz-rework.js, shared with
// tools/quiz-builder.html so the two can never disagree. What is here is the
// part that only makes sense inside the admin: picking a source module,
// choosing where the result lands, and saving it.
//
// Nothing is written until the integrity check passes. If a question stops
// selecting the same answer it selected before, saving is refused outright —
// a quiz that scores wrongly is worse than no quiz.

let reworkLoaded = null;   // canonical rows read in
let reworkResult = null;   // what build() produced
let reworkOrigin = '';     // human description of where the rows came from

function renderReworkTab(){
  const subjectOptions = subjects.map(s =>
    `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join('');

  const moduleOptions = subjects.map(s => {
    const mods = (s.modules || []).map(m =>
      `<option value="${escapeHtml(s.id)}::${escapeHtml(m.id)}">${escapeHtml(m.no)} — ${escapeHtml(m.title)} (${m.total || '?'})</option>`
    ).join('');
    return mods ? `<optgroup label="${escapeHtml(s.name)}">${mods}</optgroup>` : '';
  }).join('');

  tabReworkEl.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">Rework an existing module</h2>
      <p class="field-note">Reshapes questions you already have — it does not write new ones.
        Stems it recognises get restructured, answer choices move to new positions, and the
        running order is pushed away from the original. The result is saved as a new module;
        the one you started from is left alone.</p>

      <div class="field-label">Start from a module on the site</div>
      <select id="rwSource">
        <option value="">— choose a module —</option>
        ${moduleOptions}
      </select>

      <div style="margin:10px 0 4px;color:var(--muted);font-size:13px;">…or load a file instead</div>
      <div id="rwDrop" style="border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s ease;">Drop a .docx answer key, or a .json / .html quiz — or click to choose</div>
      <input type="file" id="rwFile" accept=".docx,.json,.html,.htm" style="display:none;">

      <div id="rwLoadMsg"></div>
    </div>

    <div class="card hidden" id="rwOptionsCard">
      <h2 style="margin-top:0;">What to change</h2>
      <div class="field-grid">
        <div>
          <div class="field-label">Restructure stems</div>
          <select id="rwRewrite">
            <option value="on" selected>Patterns only — safe, changes few</option>
            <option value="ai">Local model — EXPERIMENTAL, check every line</option>
            <option value="off">Off — leave wording alone</option>
          </select>
          <div class="field-note" id="rwAiStatus" style="margin-top:4px;"></div>
        </div>
        <div>
          <div class="field-label">Move answer choices</div>
          <select id="rwShuffle">
            <option value="on" selected>On — key moves with them</option>
            <option value="off">Off</option>
          </select>
        </div>
        <div>
          <div class="field-label">Re-sequence questions</div>
          <select id="rwReorder">
            <option value="on" selected>On</option>
            <option value="off">Off — keep original order</option>
          </select>
        </div>
        <div>
          <div class="field-label">Seed</div>
          <input type="number" id="rwSeed" value="42" min="1">
        </div>
      </div>
      <div style="margin-top:12px;">
        <button class="primary" id="rwPreviewBtn">Preview the result</button>
      </div>
      <div id="rwPreviewMsg"></div>
    </div>

    <div class="card hidden" id="rwResultCard">
      <h2 style="margin-top:0;">Result</h2>
      <div id="rwReport"></div>

      <h3 style="margin:18px 0 6px;font-size:15px;">Save it as</h3>
      <div class="field-grid">
        <div>
          <div class="field-label">Subject</div>
          <select id="rwDestSubject">${subjectOptions}</select>
        </div>
        <div>
          <div class="field-label">Module number</div>
          <input type="text" id="rwDestNo" placeholder="auto">
        </div>
        <div>
          <div class="field-label">Module id</div>
          <input type="text" id="rwDestId" placeholder="auto">
        </div>
        <div>
          <div class="field-label">Title</div>
          <input type="text" id="rwDestTitle" placeholder="Module title">
        </div>
      </div>
      <p class="field-note" id="rwDestPath" style="margin-top:8px;"></p>
      <div style="margin-top:12px;">
        <button class="primary" id="rwSaveBtn">Save to the site</button>
      </div>
      <div class="save-status" id="rwStatus"></div>
    </div>
  `;

  // --- source: an existing module ---
  document.getElementById('rwSource').addEventListener('change', async (e) => {
    const val = e.target.value;
    if(!val) return;
    const [subjectId, moduleId] = val.split('::');
    const subject = subjects.find(s => s.id === subjectId);
    const mod = subject && (subject.modules || []).find(m => m.id === moduleId);
    if(!mod) return;
    const msg = document.getElementById('rwLoadMsg');
    msg.innerHTML = '<div class="msg info">Loading ' + escapeHtml(mod.title) + '…</div>';
    try{
      // Same reader the site itself uses, so every module format it can run,
      // this can rework.
      const arr = await LEAQuizSource.loadModuleQuestions(mod);
      if(!arr || !arr.length) throw new Error('That module could not be read.');
      const rows = arr.map(LEAQuizRework.canonical).filter(Boolean);
      if(!rows.length) throw new Error('Read the module but found no usable questions.');
      reworkOrigin = subject.name + ' — ' + mod.title;
      acceptRows(rows, reworkOrigin, arr.length);
      const t = document.getElementById('rwDestTitle');
      if(t && !t.value) t.value = mod.title + ' II';
      const ds = document.getElementById('rwDestSubject');
      if(ds) { ds.value = subjectId; refreshDestDefaults(); }
    }catch(err){
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
    }
  });

  // --- source: a file ---
  const drop = document.getElementById('rwDrop');
  const fileInput = document.getElementById('rwFile');
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    const f = e.dataTransfer.files[0]; if(f) readReworkFile(f);
  });
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0]; if(f) readReworkFile(f);
  });

  document.getElementById('rwPreviewBtn').addEventListener('click', previewRework);

  // Say plainly whether a local model is available, rather than letting the
  // first preview fail to explain it.
  LEAReframeAI.available().then(st => {
    const el = document.getElementById('rwAiStatus');
    if(!el) return;
    if(st.ok && st.models.length){
      el.innerHTML = '✓ local model ready (' + escapeHtml(st.models[0]) + ') — nothing leaves this machine';
    } else if(st.ok){
      el.innerHTML = '⚠ Ollama is running but has no model. Run <code>ollama pull llama3.1:8b</code>.';
    } else {
      el.innerHTML = '⚠ no local model running — start Ollama, or choose “Patterns only”';
    }
  });
  document.getElementById('rwSaveBtn').addEventListener('click', saveRework);
  ['rwDestSubject','rwDestNo','rwDestId'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', refreshDestDefaults);
  });
}

function readReworkFile(f){
  const msg = document.getElementById('rwLoadMsg');

  // A .docx is a zip, not text — it takes the reader that knows the house
  // layout (bold choice = the answer, italics = explanation and source).
  if(/\.docx$/i.test(f.name)){
    msg.innerHTML = '<div class="msg info">Reading ' + escapeHtml(f.name) + '…</div>';
    LEADocxQuiz.read(f).then(res => {
      const rows = res.rows.map(LEAQuizRework.canonical).filter(Boolean);
      if(!rows.length) throw new Error('No usable questions in that document.');
      acceptRows(rows, f.name, res.rows.length);
      if(res.warnings.length){
        document.getElementById('rwLoadMsg').innerHTML +=
          '<div class="msg info">' + res.warnings.length + ' item(s) were skipped:<br>' +
          res.warnings.map(escapeHtml).join('<br>') + '</div>';
      }
      const t = document.getElementById('rwDestTitle');
      if(t && !t.value) t.value = f.name.replace(/\.docx$/i, '');
    }).catch(err => {
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
    });
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try{
      const { rows, kind } = LEAQuizRework.parseAny(reader.result, f.name);
      reworkOrigin = f.name;
      acceptRows(rows, f.name + ' (' + kind + ')', rows.length);
      const t = document.getElementById('rwDestTitle');
      if(t && !t.value) t.value = f.name.replace(/\.(json|html?)$/i, '');
    }catch(err){
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
    }
  };
  reader.readAsText(f);
}

function acceptRows(rows, label, rawCount){
  reworkLoaded = rows;
  reworkResult = null;
  const subs = new Set(rows.map(r => r.s).filter(Boolean));
  let note = 'Loaded ' + rows.length + ' question(s)';
  if(subs.size) note += ' across ' + subs.size + ' subtopic(s)';
  note += ' from ' + label + '.';
  if(rawCount && rawCount !== rows.length){
    note += ' ' + (rawCount - rows.length) + ' row(s) were skipped as unreadable.';
  }
  document.getElementById('rwLoadMsg').innerHTML = '<div class="msg ok-msg">' + escapeHtml(note) + '</div>';
  document.getElementById('rwOptionsCard').classList.remove('hidden');
  document.getElementById('rwResultCard').classList.add('hidden');
  refreshDestDefaults();
}

// A subject's data folder is NOT always its id — "history" keeps its modules
// in data/history-of-architecture/. Read the folder off the modules that are
// already there, so a new one lands beside its siblings instead of creating a
// second folder that only differs in name.
function subjectFolder(subject){
  const mods = subject.modules || [];
  for(const m of mods){
    const f = m.file || '';
    if(f.startsWith('data/') && f.split('/').length >= 3) return f.split('/')[1];
  }
  return subject.id;
}

function refreshDestDefaults(){
  const sel = document.getElementById('rwDestSubject');
  if(!sel) return;
  const subject = subjects.find(s => s.id === sel.value);
  if(!subject) return;
  const noEl = document.getElementById('rwDestNo');
  const idEl = document.getElementById('rwDestId');
  if(noEl && !noEl.dataset.touched) noEl.value = nextModuleNo(subject);
  if(idEl && !idEl.dataset.touched) idEl.value = subject.id + '-' + (noEl ? noEl.value : '01');
  const folder = subjectFolder(subject);
  const pathEl = document.getElementById('rwDestPath');
  if(pathEl) pathEl.innerHTML = 'Will be written to <code>data/' +
    escapeHtml(folder) + '/' + escapeHtml(noEl ? noEl.value : '01') +
    '.json</code> and added to <code>' + escapeHtml(MANIFEST_PATH) + '</code>.' +
    (folder !== subject.id ? ' <em>(this subject\'s folder is named differently from its id)</em>' : '');
  ['rwDestNo','rwDestId'].forEach(id => {
    const el = document.getElementById(id);
    if(el && !el._wired){ el._wired = true; el.addEventListener('input', () => { el.dataset.touched = '1'; }); }
  });
}

let reworkAiReport = null;   // what the local model did, when it was used

async function previewRework(){
  const msg = document.getElementById('rwPreviewMsg');
  const btn = document.getElementById('rwPreviewBtn');
  msg.innerHTML = '';
  reworkAiReport = null;
  if(!reworkLoaded){ msg.innerHTML = '<div class="msg error">Load a module or a file first.</div>'; return; }

  const mode = document.getElementById('rwRewrite').value;
  const seed = parseInt(document.getElementById('rwSeed').value, 10) || 42;
  let rowsForBuild = reworkLoaded;

  if(mode === 'ai'){
    const status = await LEAReframeAI.available();
    if(!status.ok){
      msg.innerHTML = '<div class="msg error">No local model is running. Start Ollama, or ' +
        'switch “Restructure stems” to “Patterns only”.</div>';
      return;
    }
    const model = status.models.find(m => /llama3|qwen|mistral|phi/i.test(m)) || status.models[0];
    if(!model){
      msg.innerHTML = '<div class="msg error">Ollama is running but has no model installed. ' +
        'Run <code>ollama pull llama3.1:8b</code> first.</div>';
      return;
    }
    // Tested on a 60-question module: every stem came back "accepted", and the
    // output still had an option pasted into a stem, two different questions
    // collapsed into the same wording, and 37 of 60 opening with the same two
    // phrases. The reply check guards numbers, citations and units — it cannot
    // tell that a question now asks something else. Until it also checks for
    // leaked options, duplicate stems and content drift, this stays opt-in and
    // says so.
    if(!confirm('The local model rewrites every stem, and the safety check cannot tell '
      + 'when it changes what a question asks.\n\n'
      + 'In testing it pasted an answer into one stem, collapsed two different '
      + 'questions into the same wording, and started 37 of 60 with the same two '
      + 'phrases — while reporting all 60 as fine.\n\n'
      + 'Read every line in the preview before saving. Continue?')){
      msg.innerHTML = '';
      return;
    }
    btn.disabled = true;
    msg.innerHTML = '<div class="msg info" id="rwAiProgress">Reframing with ' +
      escapeHtml(model) + ' — 0 of ' + reworkLoaded.length + '…</div>';
    try{
      const res = await LEAReframeAI.reframeAll(reworkLoaded, {
        model, seed,
        onProgress: (done, total) => {
          const el = document.getElementById('rwAiProgress');
          if(el) el.textContent = 'Reframing with ' + model + ' — ' + done + ' of ' + total + '…';
        }
      });
      reworkAiReport = { model, accepted: res.accepted, rejected: res.rejected, stems: res.stems };
      rowsForBuild = reworkLoaded.map((r, i) => Object.assign({}, r, { q: res.stems[i] }));
      msg.innerHTML = '';
    }catch(err){
      msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
      btn.disabled = false; return;
    }
    btn.disabled = false;
  }

  try{
    reworkResult = LEAQuizRework.build(rowsForBuild, {
      seed: seed,
      rewrite: mode === 'on',
      shuffleOptions: document.getElementById('rwShuffle').value === 'on',
      reorder: document.getElementById('rwReorder').value === 'on'
    });
  }catch(err){
    msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>'; return;
  }
  renderReworkReport();
  document.getElementById('rwResultCard').classList.remove('hidden');
  document.getElementById('rwResultCard').scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderReworkReport(){
  const { rows, rewritten, skipped, stats, keyOk, checked, templated } = reworkResult;
  let html = '';

  html += '<div class="msg ' + (keyOk ? 'ok-msg' : 'error') + '">' +
    (keyOk
      ? 'Answer key verified on ' + checked + ' of ' + rows.length +
        ' question(s) — each still selects the same answer it did before.' +
        (templated ? ' ' + templated + ' “Both A and B” option(s) had their internal references renumbered.' : '')
      : 'Answer key mismatch — a question no longer selects the answer it started with. Saving is blocked.') +
    '</div>';

  // In model mode the rule engine never runs, so its counters are both zero —
  // reporting "0 stems restructured" next to fourteen reframed questions reads
  // as a failure. Count whichever actually did the work.
  const reframedCount = reworkAiReport ? reworkAiReport.accepted : rewritten.length;
  const untouchedCount = reworkAiReport ? reworkAiReport.rejected.length : skipped.length;
  html += '<p class="field-note" style="margin-top:10px;">' +
    rows.length + ' questions · ' + reframedCount + ' reframed · ' +
    untouchedCount + ' left as written' +
    (stats ? ' · moved ' + stats.mean + ' places on average, ' + stats.adj + ' neighbouring pairs still together' : '') +
    '</p>';

  if(reworkAiReport){
    const ai = reworkAiReport;
    html += '<p class="field-note">Reframed by <code>' + escapeHtml(ai.model) + '</code>: ' +
      '<b>' + ai.accepted + '</b> of ' + rows.length + ' accepted, ' +
      ai.rejected.length + ' rejected and left as written.</p>';
    const shown = reworkLoaded.slice(0, 8).map((r, i) =>
      r.q !== ai.stems[i]
        ? '<tr><td style="color:var(--muted);">' + escapeHtml(r.q) + '</td><td style="color:var(--good);">' +
          escapeHtml(ai.stems[i]) + '</td></tr>' : '').filter(Boolean).join('');
    if(shown) html += '<details open><summary>Sample of what changed</summary>' +
      '<table class="rw-table"><tr><th>Before</th><th>After</th></tr>' + shown + '</table></details>';
    if(ai.rejected.length) html += '<details><summary>' + ai.rejected.length +
      ' rejected — the model\'s reply was not safe to use</summary>' +
      '<p class="field-note">A reply is thrown away if it loses a number, a citation or a unit, ' +
      'answers the question, or drifts too far in length. The original stem is kept.</p>' +
      '<table class="rw-table"><tr><th>#</th><th>Why</th><th>It said</th></tr>' +
      ai.rejected.slice(0, 20).map(r => '<tr><td class="n">' + (r.i + 1) + '</td><td class="field-note">' +
        escapeHtml(r.why) + '</td><td class="field-note">' + escapeHtml(r.got) + '</td></tr>').join('') +
      '</table></details>';
  }

  if(rewritten.length){
    html += '<details open><summary>' + rewritten.length + ' stem(s) restructured</summary>' +
      '<table class="rw-table"><tr><th>Before</th><th>After</th></tr>' +
      rewritten.map(r => '<tr><td style="color:var(--muted);">' + escapeHtml(r.from) +
        '</td><td style="color:var(--good);">' + escapeHtml(r.to) + '</td></tr>').join('') +
      '</table></details>';
  }
  if(skipped.length){
    html += '<details><summary>' + skipped.length +
      ' stem(s) left exactly as they were</summary>' +
      '<p class="field-note">These did not match a pattern it knows how to reshape safely, so it left ' +
      'them alone rather than guess. Reword them by hand if it matters.</p>' +
      '<table class="rw-table"><tr><th>Stem</th><th>Why</th></tr>' +
      skipped.map(r => '<tr><td>' + escapeHtml(r.q) + '</td><td class="field-note">' +
        escapeHtml(r.why) + '</td></tr>').join('') + '</table></details>';
  }
  document.getElementById('rwReport').innerHTML = html;
  document.getElementById('rwSaveBtn').disabled = !keyOk;
}


// Shown when the backend refuses to create a new file. Everything needed to
// land the module by hand is right here: the file, and the one line that
// registers it.
function offerManualSave(path, moduleJson, entry){
  const box = document.getElementById('rwStatus');
  const blobUrl = URL.createObjectURL(new Blob([moduleJson], { type: 'application/json' }));
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.style.marginTop = '14px';
  wrap.innerHTML =
    '<div class="msg info">The module is built and its answer key checks out — the site just ' +
    'cannot create a brand-new file yet. Two steps and it is done:</div>' +
    '<p class="field-note">1 — Download it and put it at <code>' + escapeHtml(path) + '</code> ' +
    'in the repository.</p>' +
    '<p class="field-note">2 — Add this to that subject\'s <code>modules</code> list in ' +
    '<code>' + escapeHtml(MANIFEST_PATH) + '</code>, then commit both.</p>' +
    '<pre class="rw-pre">' + escapeHtml(JSON.stringify(entry, null, 2)) + '</pre>';

  const dl = document.createElement('button');
  dl.className = 'primary';
  dl.textContent = 'Download ' + path.split('/').pop();
  dl.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = blobUrl; a.download = path.split('/').pop();
    document.body.appendChild(a); a.click(); a.remove();
  });

  const copy = document.createElement('button');
  copy.textContent = 'Copy the manifest line';
  copy.style.marginLeft = '8px';
  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(JSON.stringify(entry, null, 2)).then(() => {
      copy.textContent = 'Copied';
      setTimeout(() => copy.textContent = 'Copy the manifest line', 1400);
    }, () => {});
  });

  const row = document.createElement('div');
  row.style.marginTop = '10px';
  row.appendChild(dl); row.appendChild(copy);
  wrap.appendChild(row);
  box.parentNode.insertBefore(wrap, box.nextSibling);
}

async function saveRework(){
  const btn = document.getElementById('rwSaveBtn');
  const statusEl = document.getElementById('rwStatus');
  function log(msg){ statusEl.innerHTML += '<div>' + escapeHtml(msg) + '</div>'; }

  statusEl.className = 'save-status';
  statusEl.innerHTML = '';
  btn.disabled = true;

  try{
    if(!reworkResult) throw new Error('Preview the result first.');
    if(!reworkResult.keyOk)
      throw new Error('The answer-key check failed — this will not be saved.');

    const subjectId = document.getElementById('rwDestSubject').value;
    const no = (document.getElementById('rwDestNo').value || '').trim();
    const moduleId = (document.getElementById('rwDestId').value || '').trim();
    const title = (document.getElementById('rwDestTitle').value || '').trim();
    if(!subjectId) throw new Error('Choose a subject.');
    if(!/^\d{2}$/.test(no)) throw new Error('Module number should be two digits, like 05.');
    if(!moduleId) throw new Error('Give the module an id.');
    if(!title) throw new Error('Give the module a title.');

    const manifest = await fetchManifestForWrite(log);
    const subject = manifest.find(s => s.id === subjectId);
    if(!subject) throw new Error('That subject is no longer in the manifest.');
    subject.modules = subject.modules || [];
    if(subject.modules.some(m => m.id === moduleId))
      throw new Error('A module with id "' + moduleId + '" already exists in that subject.');

    const path = 'data/' + subjectFolder(subject) + '/' + no + '.json';
    if(subject.modules.some(m => m.file === path))
      throw new Error(path + ' is already used by another module. Pick a different number.');

    log('Writing ' + path + ' …');
    const moduleJson = JSON.stringify(reworkResult.rows, null, 2) + '\n';
    try{
      await callSave(path, moduleJson, 'Admin: rework "' + title + '" into ' + subjectId);
    }catch(err){
      // admin-save-file reads a file's current contents to get the SHA that
      // GitHub needs for an update. On a path that does not exist yet the read
      // 404s and it gives up, so it can edit files but not create them. Every
      // reworked module is a new file, so this is not an edge case here — it is
      // the normal path. Rather than lose the work, hand it over as a download
      // plus the manifest line, which is exactly what a manual commit needs.
      if(/could not read current file|not found|404/i.test(err.message || '')){
        offerManualSave(path, moduleJson, {
          id: moduleId, no: no, title: title,
          total: reworkResult.rows.length, file: path, format: 'json'
        });
        throw new Error('The site can only update files that already exist, not ' +
          'create new ones — see the box above to finish this by hand.');
      }
      throw err;
    }

    log('Adding it to ' + MANIFEST_PATH + ' …');
    subject.modules.push({ id: moduleId, no: no, title: title,
                           total: reworkResult.rows.length, file: path, format: 'json' });
    await callSave(MANIFEST_PATH, manifestToJson(manifest),
      'Admin: add reworked module "' + title + '" to ' + subjectId);
    rememberManifest(manifest);

    manifestSubjects = manifest;
    subjects = manifest;

    statusEl.className = 'save-status ok';
    log('Done. "' + title + '" is live with ' + reworkResult.rows.length +
        ' questions — it will appear under ' + subject.name + ' on the site.');
    log('It runs through the site’s own quiz engine, so progress and mastery are tracked already.');
  }catch(err){
    statusEl.className = 'save-status err';
    log('Failed: ' + err.message);
  }finally{
    btn.disabled = false;
  }
}
