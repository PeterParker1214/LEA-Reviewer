  `;}).join('');
}

// Which subject cards are unfolded. Keyed by subject id rather than by index
// so that re-rendering after a toggle, a colour change or a Move up leaves
// the card you were working in open — an index would follow the wrong card
// the moment two subjects swap places.
const openSubjects = new Set();

function renderSubjectsTab(){
  let cardsHtml = subjects.map((s, i) => {
    const mods = (s.modules || []).length;
    const qs = subjectQuestionCount(s);
    const open = openSubjects.has(s.id);
    const count = mods
      ? `${mods} module${mods===1?'':'s'} &middot; ${qs.toLocaleString()} question${qs===1?'':'s'}`
      : 'No modules yet';
    const body = !open ? '' : `
      <div class="subj-body">
        <div class="subj-field">
          <label for="subjName${i}">Subject name</label>
          <input type="text" id="subjName${i}" value="${escapeHtml(s.name)}" data-field="name" data-idx="${i}">
        </div>
        <div class="subj-field">
          <label for="subjBlurb${i}">Short line under the name <span>&mdash; optional</span></label>
          <input type="text" id="subjBlurb${i}" value="${escapeHtml(s.blurb || '')}" data-field="blurb" data-idx="${i}"
                 placeholder="Left blank, that line stays empty">
        </div>
        <div class="subj-field">
          <label>Show to readers</label>
          <button class="toggle-btn ${s.ready ? 'on' : ''}" data-action="toggle" data-idx="${i}">${s.ready ? 'Yes &mdash; available now' : 'No &mdash; coming soon'}</button>
        </div>
        <div class="subj-field">
          <label>Modules <span>&mdash; ${mods}</span></label>
          ${moduleRowsHtml(s, i)}
        </div>
        <div class="subj-btns">
          <button data-action="up" data-idx="${i}" ${i===0 ? 'disabled' : ''}>Move up</button>
          <button data-action="down" data-idx="${i}" ${i===subjects.length-1 ? 'disabled' : ''}>Move down</button>
          <span class="spacer"></span>
          <button class="danger" data-action="delete" data-idx="${i}">Delete subject</button>
        </div>
      </div>`;
    return `
    <div class="subj ${open ? 'open' : ''}" data-idx="${i}" data-sid="${escapeHtml(s.id)}">
      <div class="subj-head" data-action="open" data-idx="${i}">
        <span class="subj-caret">&#9656;</span>
        <div class="subj-main">
          <div class="subj-name">${escapeHtml(s.name) || 'Untitled subject'}</div>
          <div class="subj-count">${count}</div>
        </div>
        <span class="subj-pill ${s.ready ? 'live' : ''}">${s.ready ? 'Available' : 'Coming soon'}</span>
      </div>
      ${body}
    </div>
  `;}).join('');

  tabSubjectsEl.innerHTML = `
    <div class="rep-head-strip">
      <h2>Subjects</h2>
      <span class="note">Tap a subject to edit it</span>
    </div>
    <div class="card msg info">
      This is the list readers see on the home screen, top to bottom.
      Nothing here changes the live site until you press <b>Save to site</b>.
    </div>
    ${cardsHtml}
    <div class="actions">
      <button id="addSubjectBtn">+ Add subject</button>
    </div>
    <div class="actions">
      <button class="primary" id="saveSubjectsBtn">Save to site</button>
      <button id="reloadSubjectsBtn">Reload from GitHub</button>
    </div>
    <div class="save-status" id="subjectsSaveStatus"></div>

    <div class="card">
      <details class="subj-more">
        <summary>Find quiz files that aren&rsquo;t on the site</summary>
        <p style="font-size:13px;color:var(--muted);margin:10px 0 0;">
          A quiz file can sit in the repository without being on the site &mdash; that is what
          an upload which reported success but never appeared looks like. Scanning finds them,
          and adding one back here puts it in front of readers again.
        </p>
        <div class="actions">
          <button id="scanUnlistedBtn">Scan for unlisted files</button>
        </div>
        <div id="unlistedOut"></div>
      </details>
    </div>
  `;

  // Re-render, then put the named card back under the thumb. Used after a
  // move, where the card the owner is holding onto changes position.
  function revealSubject(sid){
    const el = tabSubjectsEl.querySelector('.subj[data-sid="' + CSS.escape(sid) + '"]');
    if(el) el.scrollIntoView({ block: 'nearest' });
  }

  tabSubjectsEl.querySelectorAll('.subj-head').forEach(head => {
    head.addEventListener('click', () => {
      const sid = subjects[+head.dataset.idx].id;
      if(openSubjects.has(sid)) openSubjects.delete(sid);
      else openSubjects.add(sid);
      renderSubjectsTab();
      revealSubject(sid);
    });
  });
  tabSubjectsEl.querySelectorAll('input[data-field="name"]').forEach(inp => {
    // The head above shows this name too, but it is deliberately not
    // re-rendered on every keystroke: that would tear the field out from
    // under the caret mid-word.
    inp.addEventListener('input', () => { subjects[+inp.dataset.idx].name = inp.value; });
  });
  tabSubjectsEl.querySelectorAll('input[data-field="blurb"]').forEach(inp => {
    inp.addEventListener('input', () => { subjects[+inp.dataset.idx].blurb = inp.value; });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => { const i=+btn.dataset.idx; subjects[i].ready=!subjects[i].ready; renderSubjectsTab(); });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="up"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i=+btn.dataset.idx, sid=subjects[i].id;
      [subjects[i-1],subjects[i]]=[subjects[i],subjects[i-1]];
      renderSubjectsTab(); revealSubject(sid);
    });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="down"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i=+btn.dataset.idx, sid=subjects[i].id;
      [subjects[i+1],subjects[i]]=[subjects[i],subjects[i+1]];
      renderSubjectsTab(); revealSubject(sid);
    });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.idx;
      const mods = (subjects[i].modules || []).length;
      // Deleting a subject now takes its module list with it, which is a much
      // bigger deal than removing a menu entry used to be — say so plainly.
      const ok = await LEAConfirm(
        `Delete "${subjects[i].name}"?` +
        (mods ? ` This also removes its ${mods} module${mods===1?'':'s'} from the site, so nobody can reach ${mods===1?'it':'them'} any more.` : '') +
        ' The quiz files themselves stay in the repository, and readers keep their saved progress.',
        { title: 'Remove subject', yes: 'Remove from site' }
      );
      if(!ok) return;
      openSubjects.delete(subjects[i].id);
      subjects.splice(i, 1);
      renderSubjectsTab();
    });
  });
  document.getElementById('addSubjectBtn').addEventListener('click', async () => {
    const name = await LEAPrompt('Name of the new subject:', { title: 'Add subject', yes: 'Add subject' });
    if(!name) return;
    const slug = slugify(name);
    if(subjects.some(s => s.id === slug)){
      await LEAAlert('There is already a subject with the ID "' + slug + '".');
      return;
    }
    // Starts empty and not ready: a subject with no modules would show as a
    // 0% row on Home, which reads as broken rather than as "coming".
    subjects.push({ id: slug, name: name, blurb: '', ready: false, modules: [] });
    // Opened straight away — a new subject is always about to be edited.
    openSubjects.add(slug);
    renderSubjectsTab();
    const fresh = tabSubjectsEl.querySelector('.subj[data-sid="' + CSS.escape(slug) + '"]');
    if(fresh) fresh.scrollIntoView({ block: 'nearest' });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="mod-colour"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const subject = subjects[+btn.dataset.idx];
      const mod = (subject.modules || []).find(m => m.id === btn.dataset.mid);
      if(!mod) return;
      const chosen = btn.dataset.colour;
      // Picking the colour a module already has clears it, so there is a way
      // back to plain without a ninth button that only means "undo".
      if(chosen && mod.color !== chosen) mod.color = chosen;
      else delete mod.color;
      renderSubjectsTab();
      const status = document.getElementById('subjectsSaveStatus');
      status.className = 'save-status';
      status.textContent = 'Colours changed. Press "Save to site" to publish them.';
    });
  });
  tabSubjectsEl.querySelectorAll('button[data-action="mod-del"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const i = +btn.dataset.idx;
      const subject = subjects[i];
      const mod = (subject.modules || []).find(m => m.id === btn.dataset.mid);
      if(!mod) return;
      const ok = await LEAConfirm(
        `Take "${mod.title || mod.id}" off ${subject.name}?` +
        ' Readers will no longer see it. The question file stays in the repository, so it can be' +
        ' put back from the scan at the bottom of this tab, and anyone who already answered keeps' +
        ' their progress. Nothing changes on the site until you press "Save to site".',
        { title: 'Remove module', yes: 'Remove from site' }
      );
      if(!ok) return;
      // Recorded before the splice so the stale-read guard knows this one is
      // gone on purpose and does not block the save that follows.
      removedModuleKeys.add(subject.id + '|' + mod.id);
      // Remembered so "Save to site" can archive its file content and free
      // its number/id for reuse — see saveSubjects().
      pendingModuleArchives.push({ subjectId: subject.id, mod });
      subject.modules = (subject.modules || []).filter(m => m.id !== mod.id);
      renderSubjectsTab();
    });
  });
  document.getElementById('saveSubjectsBtn').addEventListener('click', saveSubjects);
  document.getElementById('reloadSubjectsBtn').addEventListener('click', () => loadSubjects(true));
  document.getElementById('scanUnlistedBtn').addEventListener('click', scanUnlistedFiles);
}

/* ---- Files in the repository that no subject points at -------------------
 * Every module the site can reach is named in data/subjects.json. Anything
 * under data/ that nothing names is invisible to readers however good it is,
 * so list those and offer to put them back.
 */
async function scanUnlistedFiles(){
  const out = document.getElementById('unlistedOut');
  out.innerHTML = '<div class="msg info" style="margin-top:14px;">Reading the file list from GitHub…</div>';
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const resp = await fetch(url, { cache: 'no-store' });
    if(!resp.ok) throw new Error('Could not list the files (status ' + resp.status + ')');
    const data = await resp.json();

    const listed = new Set();
    subjects.forEach(s => (s.modules || []).forEach(m => listed.add(m.file)));

    const hidden = readHiddenFiles();
    const unlisted = (data.tree || [])
      .filter(it => it.type === 'blob' && /^data\/[^/]+\/[^/]+\.json$/.test(it.path))
      .map(it => it.path)
      .filter(path => path !== MANIFEST_PATH && !listed.has(path))
      .filter(path => !path.startsWith('data/_deleted/')) // deliberate archives, not stranded uploads
      .filter(path => showHiddenFiles || hidden.indexOf(path) === -1)
      .sort();

    const hiddenNote = hidden.length
      ? '<div class="actions"><button id="toggleHiddenBtn">' +
        (showHiddenFiles ? 'hide the hidden ones again' : 'show the ' + hidden.length + ' hidden one' +
          (hidden.length === 1 ? '' : 's')) + '</button></div>'
      : '';

    if(!unlisted.length){
      out.innerHTML = '<div class="msg ok-msg" style="margin-top:14px;">' +
        'Every question file under <code>data/</code> is on the site or hidden. Nothing is stranded.</div>' +
        hiddenNote;
      wireHiddenToggle(out);
      return;
    }

    const options = subjects.map(s =>
      '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>').join('');

    out.innerHTML =
      '<div class="msg info" style="margin:14px 0;">' + unlisted.length + ' file' +
      (unlisted.length === 1 ? ' is' : 's are') + ' in the repository but on no subject. ' +
      'The title each one was uploaded under is filled in for you; change it if ' +
      'you want something different, check the subject, and press the button. ' +
      'That publishes it on its own — there is nothing else to press afterwards. ' +
      'Press <b>not wanted</b> on the ones you are never going to use and they ' +
      'stop being offered.<div id="titleLookupNote" style="margin-top:8px;"></div></div>' +
      unlisted.map(path =>
        '<div class="unlisted-row' + (hidden.indexOf(path) !== -1 ? ' was-hidden' : '') +
          '" data-path="' + escapeHtml(path) + '">' +
          '<span class="u-path">' + escapeHtml(path) +
            ' <button data-action="u-peek">what is in it?</button>' +
            ' <button data-action="u-hide">not wanted</button></span>' +
          '<input type="text" data-role="u-title" placeholder="Looking up the title…">' +
          '<select data-role="u-subject">' + options + '</select>' +
          '<button class="primary" data-action="u-add">Put it back on the site</button>' +
        '</div>').join('') +
      hiddenNote;

    const rows = [...out.querySelectorAll('.unlisted-row')];
    rows.forEach(row => {
      const folder = row.dataset.path.split('/')[1];
      const guess = subjects.find(s => subjectFolder(s) === folder) || subjects.find(s => s.id === folder);
      if(guess) row.querySelector('select[data-role="u-subject"]').value = guess.id;
      row.querySelector('button[data-action="u-add"]').addEventListener('click', () => addUnlistedFile(row));
      row.querySelector('button[data-action="u-peek"]').addEventListener('click', () => peekUnlistedFile(row));
      row.querySelector('button[data-action="u-hide"]').addEventListener('click', () => hideUnlistedFile(row));
    });
    wireHiddenToggle(out);
    fillInKnownTitles(rows);
  }catch(e){
    out.innerHTML = '<div class="msg error" style="margin-top:14px;">' + escapeHtml(e.message) + '</div>';
  }
}

/* The title each file was uploaded under is still in the commit that created
 * it — "Admin: rework \"FAMOUS ARCHITECTS\" into ..." — so asking for it again
 * was asking for something already written down. Looked up once per file and
 * kept, because the unauthenticated API allows sixty calls an hour and a
 * rescan should not spend them twice.
 */
const TITLE_CACHE_KEY = 'lea-admin-file-titles';

function readTitleCache(){
  try{ return JSON.parse(localStorage.getItem(TITLE_CACHE_KEY)) || {}; }catch(e){ return {}; }
}
function writeTitleCache(map){
  try{ localStorage.setItem(TITLE_CACHE_KEY, JSON.stringify(map)); }catch(e){}
}

async function titleForFile(path){
  const cache = readTitleCache();
  if(cache[path] !== undefined) return cache[path];
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits` +
                `?path=${encodeURIComponent(path)}&per_page=1`;
    const resp = await fetch(url, { cache: 'no-store' });
    // Only an answer gets remembered. A refused or rate-limited call is not an
    // answer, and caching it as "this file has no title" would leave the field
    // blank for good — the exact thing this lookup exists to avoid.
    if(!resp.ok) return '';
    const commits = await resp.json();
    const message = (commits[0] && commits[0].commit && commits[0].commit.message) || '';
    // Both the upload and the rework tab quote the title in the message.
    const quoted = message.match(/"([^"]+)"/);
    const title = quoted ? quoted[1] : '';
    cache[path] = title;
    writeTitleCache(cache);
    return title;
  }catch(e){
    return '';   // offline or blocked: the admin types it, as before
  }
}

// Fills the titles in once the rows are on screen. A few at a time: one after
// another took the best part of a minute over fourteen files, and all at once
// is a burst at an API that allows sixty calls an hour. Rows already typed
// into are left alone.
async function fillInKnownTitles(rows){
  const queue = rows.filter(r => {
    const input = r.querySelector('input[data-role="u-title"]');
    return input && !input.value.trim();
  });
  const note = document.getElementById('titleLookupNote');
  if(note && queue.length) note.textContent = 'Looking up what each of these was called…';

  let next = 0;
  async function worker(){
    while(next < queue.length){
      const row = queue[next++];
      const input = row.querySelector('input[data-role="u-title"]');
      const title = await titleForFile(row.dataset.path);
      if(input.value.trim()) continue;          // typed into while we were away
      if(title){
        input.value = title;
        input.classList.add('u-title-found');
      }else{
        input.placeholder = 'Title readers will see';
      }
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  if(note) note.textContent = '';
}

/* ---- 1. Files worth nothing should stop being offered --------------------
 * Trial-and-error left duplicates behind, and there is no point being asked
 * about them at every scan. Hiding one keeps it out of this list for good.
 * The file itself stays in the repository — readers cannot reach it either
 * way — and "show the hidden ones" brings them all back.
 */
const HIDDEN_FILES_KEY = 'lea-admin-hidden-files';
let showHiddenFiles = false;

function readHiddenFiles(){
  try{
    const v = JSON.parse(localStorage.getItem(HIDDEN_FILES_KEY));
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function writeHiddenFiles(list){
  try{ localStorage.setItem(HIDDEN_FILES_KEY, JSON.stringify(list)); }catch(e){}
}
async function hideUnlistedFile(row){
  const path = row.dataset.path;
  const ok = await LEAConfirm(
    'Stop offering ' + path + '?\n\n' +
    'It will not appear in this list again. The file stays in the repository — ' +
    'nothing on the site points at it either way — and "show the hidden ones" ' +
    'below brings it back.',
    { title: 'Hide this file', yes: 'Hide it' }
  );
  if(!ok) return;
  const hidden = readHiddenFiles();
  if(hidden.indexOf(path) === -1) hidden.push(path);
  writeHiddenFiles(hidden);
  scanUnlistedFiles();
}

// A path is not enough to decide by. One question out of the file says what
// it is, which is the difference between putting it back and guessing.
async function peekUnlistedFile(row){
  const btn = row.querySelector('button[data-action="u-peek"]');
  btn.disabled = true;
  btn.textContent = 'reading…';
  try{
    const rows = await readModuleFile(row.dataset.path);
    const first = rows[0] || {};
    const stem = first.q || first.question || first.stem || first.text || '';
    row.querySelector('.u-peek-out') ||
      row.querySelector('.u-path').insertAdjacentHTML('afterend',
        '<div class="u-peek-out">' + rows.length + ' questions &middot; first one: ' +
        escapeHtml(String(stem).slice(0, 160)) + (String(stem).length > 160 ? '…' : '') + '</div>');
    btn.remove();
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'what is in it?';
    await LEAAlert(e.message);
  }
}

async function readModuleFile(path){
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}?t=${Date.now()}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if(!resp.ok) throw new Error('Could not read ' + path + ' (status ' + resp.status + ')');
  const rows = JSON.parse(await resp.text());
  if(!Array.isArray(rows) || !rows.length) throw new Error(path + ' does not hold a list of questions.');
  return rows;
}

// One press puts the file back on the site. This used to only add the entry
// to the list on screen and leave the publishing to the "Save to site" button
// further up — and the panel redrew on the way, taking the note that said so
// off screen with it. The button said the work was done and the site never
// heard about it, which is the same shape of failure this whole tab exists to
// clean up after. It publishes on its own now.
function wireHiddenToggle(out){
  const btn = out.querySelector('#toggleHiddenBtn');
  if(btn) btn.addEventListener('click', () => { showHiddenFiles = !showHiddenFiles; scanUnlistedFiles(); });
}

async function addUnlistedFile(row){
  const btn = row.querySelector('button[data-action="u-add"]');
  const path = row.dataset.path;
  const title = (row.querySelector('input[data-role="u-title"]').value || '').trim();
  const subjectId = row.querySelector('select[data-role="u-subject"]').value;
  if(!title){ await LEAAlert('Give it a title first — that is what readers see.'); return; }

  btn.disabled = true;
  const original = btn.textContent;
  try{
    btn.textContent = 'Reading…';
    // The question count has to be right — the site reports mastery as a
    // fraction of it, so a guessed number would misreport everyone's progress.
    const rows = await readModuleFile(path);

    btn.textContent = 'Publishing…';
    // Through the guard, like every other write, so putting one file back can
    // never be what knocks another off.
    const manifest = await fetchManifestForWrite();
    const target = manifest.find(x => x.id === subjectId);
    if(!target) throw new Error('That subject is no longer on the site. Press "Reload from GitHub" and scan again.');
    target.modules = target.modules || [];
    if(target.modules.some(m => m.file === path))
      throw new Error('Something already points at ' + path + ' — it is on the site. Scan again to refresh this list.');

    // The number in the filename is the one the file was written under, and
    // reusing it keeps the file and the entry describing each other.
    const no = (path.split('/').pop().replace(/\.json$/, '') || nextModuleNo(target)).padStart(2, '0');
    let id = target.id + '-' + no;
    while(target.modules.some(m => m.id === id)) id = id + 'b';

    const entry = { id, no, title, total: rows.length, file: path, format: 'json' };
    target.modules.push(entry);
    // A subject nobody can reach would hide the file all over again.
    if(!target.ready) target.ready = true;

    await callSave(MANIFEST_PATH, manifestToJson(manifest),
      'Admin: put "' + title + '" back on ' + subjectId);
    rememberManifest(manifest);

    // The copy the Subjects tab is showing gets the same entry, so the counts
    // above stay honest — without replacing the array, which would throw away
    // any renaming or removing not yet saved.
    const onScreen = subjects.find(x => x.id === subjectId);
    if(onScreen){
      onScreen.modules = onScreen.modules || [];
      if(!onScreen.modules.some(m => m.file === path)) onScreen.modules.push(entry);
      if(!onScreen.ready) onScreen.ready = true;
    }
    removedModuleKeys.delete(subjectId + '|' + id);

    row.className = 'unlisted-row done';
    row.innerHTML = '<span class="u-path">' + escapeHtml(path) + '</span>' +
      '<div class="u-done">&#10003; "' + escapeHtml(title) + '" is on the site now &mdash; ' +
      rows.length + ' questions under ' + escapeHtml(target.name) + '. ' +
      'Give GitHub a minute, then reload the site.</div>';
  }catch(e){
    await LEAAlert(e.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

/* ================= DELETED MODULES TAB =================
 * Every module removed since the archive-on-delete feature shipped has its
 * content copied to data/_deleted/ before its old slot is blanked (see
 * saveSubjects). Nothing here can be reached by a reader — this tab is only
 * a way to browse those copies and, on purpose, publish one back under a
 * new module id, number, and title. It never reuses the old identity: a
 * fresh id/no is required every time, so this can never collide with
 * whatever new module has since taken the old slot.
 */
async function scanDeletedModules(){
  tabDeletedEl.innerHTML = '<div class="card msg info">Reading the archive from GitHub…</div>';
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const resp = await fetch(url, { cache: 'no-store' });
    if(!resp.ok) throw new Error('Could not list the files (status ' + resp.status + ')');
    const data = await resp.json();

    const archived = (data.tree || [])
      .filter(it => it.type === 'blob' && it.path.startsWith('data/_deleted/') && it.path.endsWith('.json'))
      .map(it => it.path)
      .sort().reverse(); // most recently deleted first (timestamp is in the filename)

    if(!archived.length){
      tabDeletedEl.innerHTML = '<div class="card msg info">Nothing archived yet. Removing a module ' +
        '(Subjects tab) and pressing "Save to site" is what puts a copy here.</div>';
      return;
    }

    const options = subjects.map(s =>
      '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>').join('');

    tabDeletedEl.innerHTML =
      '<div class="card msg info">' + archived.length + ' archived module file' +
      (archived.length === 1 ? '' : 's') + '. Publishing one writes a fresh copy of its questions ' +
      'under a new number and takes effect immediately &mdash; there is nothing else to press ' +
      'afterwards. The archived copy is left exactly as is either way.' +
      '<div id="deletedTitleNote" style="margin-top:8px;"></div></div>' +
      '<div class="card">' + archived.map(path => `
        <div class="unlisted-row" data-path="${escapeHtml(path)}">
          <span class="u-path">${escapeHtml(path)} <button data-action="d-peek">what is in it?</button></span>
          <input type="text" data-role="u-title" placeholder="Looking up its old title…">
          <select data-role="d-subject">${options}</select>
          <input type="text" data-role="d-no" placeholder="New number, e.g. 05" maxlength="2" style="width:110px;">
          <input type="text" data-role="d-id" placeholder="New module id">
          <button class="primary" data-action="d-publish">Publish again</button>
        </div>`).join('') + '</div>';

    const rows = [...tabDeletedEl.querySelectorAll('.unlisted-row')];
    rows.forEach(row => {
      row.querySelector('button[data-action="d-peek"]').addEventListener('click', () => peekUnlistedFile(row));
      row.querySelector('button[data-action="d-publish"]').addEventListener('click', () => publishArchivedFile(row));
      // Prefills a subject guess and a free number the moment a subject is
      // picked — typed over freely, this is a starting point, not a rule.
      const subjSel = row.querySelector('select[data-role="d-subject"]');
      const noInput = row.querySelector('input[data-role="d-no"]');
      const fillNo = () => {
        if(noInput.value.trim()) return;
        const s = subjects.find(x => x.id === subjSel.value);
        if(s) noInput.value = nextModuleNo(s);
      };
      subjSel.addEventListener('change', fillNo);
      fillNo();
    });

    // Re-uses the same lookup as "unlisted files": the commit that created
    // the archive copy quotes the module's old title, same as an upload does.
    const note = document.getElementById('deletedTitleNote');
    if(note) note.textContent = 'Looking up what each of these used to be called…';
    await fillInKnownTitles(rows);
    if(note) note.textContent = '';
  }catch(e){
    tabDeletedEl.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

async function publishArchivedFile(row){
  const btn = row.querySelector('button[data-action="d-publish"]');
  const path = row.dataset.path;
  const title = (row.querySelector('input[data-role="d-title"]').value || '').trim();
  const subjectId = row.querySelector('select[data-role="d-subject"]').value;
  const no = (row.querySelector('input[data-role="d-no"]').value || '').trim();
  const moduleId = (row.querySelector('input[data-role="d-id"]').value || '').trim();

  if(!title){ await LEAAlert('Give it a title first — that is what readers see.'); return; }
  if(!/^\d{2}$/.test(no)){ await LEAAlert('Module number should be two digits, like 05.'); return; }
  if(!moduleId){ await LEAAlert('Give it a module id.'); return; }

  btn.disabled = true;
  const original = btn.textContent;
  try{
    btn.textContent = 'Reading…';
    const rows = await readModuleFile(path);

    btn.textContent = 'Publishing…';
    const manifest = await fetchManifestForWrite();
    const subject = manifest.find(x => x.id === subjectId);
    if(!subject) throw new Error('That subject is no longer on the site. Reload and try again.');
    subject.modules = subject.modules || [];
    if(subject.modules.some(m => m.id === moduleId))
      throw new Error('"' + subject.name + '" already has a module with the id "' + moduleId + '". Pick another.');

    const newPath = 'data/' + subjectFolder(subject) + '/' + no + '.json';
    if(subject.modules.some(m => m.file === newPath))
      throw new Error(newPath + ' is already used by another module. Pick a different number.');

    // A fresh copy at a real slot, not a manifest entry pointing back into
    // data/_deleted/ — the archive stays untouched as a pure backup, and the
    // live module lives exactly where every other module does.
    await callSave(newPath, JSON.stringify(rows, null, 2) + '\n',
      'Admin: publish "' + title + '" from archive into ' + subjectId);

    const entry = { id: moduleId, no, title, total: rows.length, file: newPath, format: 'json' };
    subject.modules.push(entry);
    if(!subject.ready) subject.ready = true;

    await callSave(MANIFEST_PATH, manifestToJson(manifest),
      'Admin: add "' + title + '" (from archive) to ' + subjectId);
    rememberManifest(manifest);

    const onScreen = subjects.find(x => x.id === subjectId);
    if(onScreen){
      onScreen.modules = onScreen.modules || [];
      if(!onScreen.modules.some(m => m.file === newPath)) onScreen.modules.push(entry);
      if(!onScreen.ready) onScreen.ready = true;
    }
    removedModuleKeys.delete(subjectId + '|' + moduleId);

    row.className = 'unlisted-row done';
    row.innerHTML = '<span class="u-path">' + escapeHtml(path) + '</span>' +
      '<div class="u-done">&#10003; "' + escapeHtml(title) + '" is on the site again as ' + no +
      ' under ' + escapeHtml(subject.name) + '. Give GitHub a minute, then reload the site. ' +
      'The archive copy is untouched.</div>';
  }catch(e){
    await LEAAlert(e.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Serialised the way the checked-in file is written, so a save from here
// produces a readable diff rather than one enormous line.
//
// The order of a subject's modules is the order readers see, and it had been
// drifting away from the numbers printed on them: modules were appended as
// they arrived, so 05 could sit after 33 and a recovered 06 landed at the
// very end. Sorting on the way out means every save leaves the whole site in
// number order, whatever put the entries there.
function manifestToJson(list){
  const ordered = (list || []).map(s => Object.assign({}, s, {
    modules: (s.modules || []).slice().sort((a, b) => {
      const na = parseInt(a.no, 10), nb = parseInt(b.no, 10);
      if(isNaN(na) && isNaN(nb)) return 0;
      if(isNaN(na)) return 1;          // anything unnumbered goes last
      if(isNaN(nb)) return -1;
      return na - nb;
    })
  }));
  return JSON.stringify(ordered, null, 2) + '\n';
}

// Reads a file's current raw content straight from the branch. Used to copy a
// module's content out before it gets blanked — a plain unauthenticated GET,
// same as the manifest's raw fallback, so it works for any public file.
async function fetchRawFile(path){
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${encodeURIComponent(path).replace(/%2F/g, '/')}?t=${Date.now()}`;
  const resp = await fetch(url, { cache: 'no-store' });
  if(!resp.ok) throw new Error('Could not read ' + path + ' (status ' + resp.status + ')');
  return await resp.text();
}

async function saveSubjects(){
  const statusEl = document.getElementById('subjectsSaveStatus');
  const saveBtn = document.getElementById('saveSubjectsBtn');
  saveBtn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.textContent = 'Saving…';
  try{
    // This tab may have been open a while, and a module added from another
    // tab since. Writing what is on screen would delete it, so compare
    // against the site first and stop rather than lose it.
    const remote = await fetchManifest();
    const onScreen = new Set(manifestKeys(subjects));
    const wouldLose = manifestKeys(remote).filter(k => !onScreen.has(k) && !removedModuleKeys.has(k));
    if(wouldLose.length){
      throw new Error(wouldLose.length + ' module' + (wouldLose.length === 1 ? '' : 's') +
        ' added since this tab loaded (' + wouldLose.slice(0, 3).join(', ') +
        (wouldLose.length > 3 ? ', and more' : '') + ') would be removed by this save. ' +
        'Nothing was written — press "Reload from GitHub", redo your edits, and save again.');
    }

    // Only .json-backed modules (Rework tab) have a fixed number->path, so
    // only those can collide on reuse. HTML-uploaded modules pick their own
    // filename each time and are left alone.
    const toArchive = pendingModuleArchives.filter(p => p.mod.format === 'json' && p.mod.file);

    // Copy each removed module's real content out to data/_deleted/ BEFORE
    // touching anything live, so a failure here leaves the site exactly as
    // it was — nothing blanked, nothing unlisted yet.
    for(const { subjectId, mod } of toArchive){
      statusEl.textContent = 'Archiving "' + (mod.title || mod.id) + '"…';
      const content = await fetchRawFile(mod.file);
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const archivePath = `data/_deleted/${subjectId}-${mod.no || mod.id}-${stamp}.json`;
      await callSave(archivePath, content,
        'Admin: archive "' + (mod.title || mod.id) + '" removed from ' + subjectId);
      mod._archivePath = archivePath; // remembered for the status message only
    }

    statusEl.textContent = 'Saving…';
    await callSave(MANIFEST_PATH, manifestToJson(subjects), 'Admin: update subjects');
    rememberManifest(subjects);
    removedModuleKeys.clear();

    // Only now, with the module fully unlisted, blank its old file so the
    // number/id is a clean slate — the real content already lives safely
    // under data/_deleted/. Not fatal if this step fails; worst case the
    // number just overwrites the (already-archived) old content next time
    // it's reused, same as before this feature existed.
    for(const { mod } of toArchive){
      try{
        await callSave(mod.file, '[]\n',
          'Admin: clear ' + mod.file + ' — archived to ' + mod._archivePath);
      }catch(e){ /* see comment above */ }
    }
    pendingModuleArchives = pendingModuleArchives.filter(p => toArchive.indexOf(p) === -1);

    statusEl.className = 'save-status ok';
    statusEl.textContent = 'Saved!' +
      (toArchive.length ? ' Archived ' + toArchive.length + ' removed module file' +
        (toArchive.length === 1 ? '' : 's') + ' to data/_deleted/ and freed its number for reuse.' : '') +
      ' It may take a minute or two for GitHub Pages to update the live site.';
  }catch(e){
    statusEl.className = 'save-status err';
    statusEl.textContent = 'Error: ' + e.message;
  }finally{
    saveBtn.disabled = false;
  }
}

/* ================= PAGES / QUIZZES TAB ================= */

async function loadFileTree(){
  tabPagesEl.innerHTML = '<div class="card msg info">Loading list of pages from GitHub…</div>';
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not list files (status ' + resp.status + ')');
    const data = await resp.json();
    fileTree = (data.tree || []).filter(item => item.type === 'blob' &&
      (item.path.endsWith('.html') || /^data\/[^/]+\/[^/]+\.json$/.test(item.path)));
    renderPagesTab();
  }catch(e){
    tabPagesEl.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

function moduleRefForFilePath(path){
  const list = manifestSubjects || [];
  for(const subject of list){
    for(const mod of (subject.modules || [])){
      if(mod.file === path) return { subjectId: subject.id, moduleId: mod.id };
    }
  }
  return null;
}
function fileReportCount(path){
  const ref = moduleRefForFilePath(path);
  if(!ref) return 0;
  let count = 0;
  Object.keys(reportsByQuestionRef).forEach(qref => {
    const parts = qref.split('/');
    if(parts[0] === ref.subjectId && parts[1] === ref.moduleId) count += reportsByQuestionRef[qref].length;
  });
  return count;
}
function fileItemHtml(f){
  const count = fileReportCount(f.path);
  return `<div class="file-item" data-path="${escapeHtml(f.path)}">` +
    `<span>${escapeHtml(f.path)}</span>` +
    (count ? `<span class="report-badge">${count} reported</span>` : '') +
  `</div>`;
}

function renderPagesTab(filterText, onlyReported){
  filterText = (filterText || '').toLowerCase();
  let filtered = fileTree.filter(f => f.path.toLowerCase().includes(filterText));
  if(onlyReported) filtered = filtered.filter(f => fileReportCount(f.path) > 0);

  tabPagesEl.innerHTML = `
    <div class="card">
      <input type="text" id="fileSearch" placeholder="Search for a page, e.g. Structural_Quiz1 or building-laws" value="${escapeHtml(filterText)}">
      <label class="filter-row"><input type="checkbox" id="onlyReportedFilter" style="width:auto;" ${onlyReported ? 'checked' : ''}> Only reported</label>
      <div class="file-list" id="fileList">
        ${filtered.map(fileItemHtml).join('') || '<div class="msg info">No matches.</div>'}
      </div>
    </div>
    <div id="editorArea"></div>
  `;

  function reFilterAndWire(){
    const val = document.getElementById('fileSearch').value;
    const onlyRep = document.getElementById('onlyReportedFilter').checked;
    let matches = fileTree.filter(f => f.path.toLowerCase().includes(val.toLowerCase()));
    if(onlyRep) matches = matches.filter(f => fileReportCount(f.path) > 0);
    const list = document.getElementById('fileList');
    list.innerHTML = matches.map(fileItemHtml).join('') || '<div class="msg info">No matches.</div>';
    list.querySelectorAll('.file-item').forEach(el => el.addEventListener('click', () => openFile(el.dataset.path)));
  }

  document.getElementById('fileSearch').addEventListener('input', reFilterAndWire);
  document.getElementById('onlyReportedFilter').addEventListener('change', reFilterAndWire);

  tabPagesEl.querySelectorAll('.file-item').forEach(el => {
    el.addEventListener('click', () => openFile(el.dataset.path));
  });
}

async function openFile(path, focusQIdx){
  currentFilePath = path;
  currentModuleRef = moduleRefForFilePath(path);
  expandedQIdx = new Set(focusQIdx != null ? [focusQIdx] : []);
  const editorArea = document.getElementById('editorArea');
  editorArea.innerHTML = '<div class="card msg info">Loading ' + escapeHtml(path) + '…</div>';
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}?t=${Date.now()}`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('Could not load file (status ' + resp.status + ')');
    currentFileRaw = await resp.text();

    const source = readQuestionSource(path, currentFileRaw);
    if(source){
      currentIsJsonFile = source.kind === 'json';
      currentSourceKind = source.kind;
      currentSourceVar = source.varName;
      currentRawRows = source.rows;
      currentQuestions = source.editable;
      renderQuizEditor(path);
    } else {
      currentIsJsonFile = false;
      currentSourceKind = null; currentSourceVar = null; currentRawRows = null;
      currentQuestions = null;
      renderTextEditor(path);
    }
  }catch(e){
    editorArea.innerHTML = '<div class="card msg error">' + escapeHtml(e.message) + '</div>';
  }
}

function renderQuizEditor(path){
  const titleMatch = currentFileRaw.match(/<title>([^<]*)<\/title>/);
  const h1Match = currentFileRaw.match(/<h1>([^<]*)<\/h1>/);
  const pageTitle = titleMatch ? titleMatch[1] : '';
  const headingText = h1Match ? h1Match[1] : '';

  const editorArea = document.getElementById('editorArea');
  editorArea.innerHTML = (currentIsJsonFile ? '' : `
    <div class="card">
      <div class="field-label">Browser tab title</div>
      <input type="text" id="pageTitleInput" value="${escapeHtml(pageTitle)}">
      <div class="field-label">Heading shown on the page</div>
      <input type="text" id="headingInput" value="${escapeHtml(headingText)}">
    </div>
  `) + `
    <div id="questionsList"></div>
    <div class="actions">
      <button id="addQuestionBtn">+ Add question</button>
    </div>
    <div class="actions">
      <button class="primary" id="saveQuizBtn">Save to site</button>
    </div>
    <div class="save-status" id="quizSaveStatus"></div>
  `;
  renderQuestionsList();

  document.getElementById('addQuestionBtn').addEventListener('click', () => {
    // Appended at the end only — engine-spec.md §4 requires append-only so
    // existing mastered[] index arrays never point at the wrong question.
    currentQuestions.push({ s:'', q:'New question text', o:['Option A','Option B','Option C','Option D'], c:0, ref:'', n:'' });
    expandedQIdx.add(currentQuestions.length - 1);
    renderQuestionsList();
  });
  document.getElementById('saveQuizBtn').addEventListener('click', () => saveQuizFile(path));
}

// Collapsed by default (5b) — a module can have 200+ questions, and opening
// every one as a full form made finding the reported one mean scrolling
// past all the rest. Each row expands to the full q-card in place.
/**
 * Is this picture still the review centre's?
 *
 * Derived rather than stored, so there is no flag to keep in step:
 *   - a data: URI was pasted in by the owner, so it is theirs
 *   - fig-*.svg was drawn for this project
 *   - the architectural-sites bank is the project's own photography
 *   - anything else that is a file came in with the review-centre material
 *
 * Paste a replacement and the value becomes a data: URI, so the mark clears
 * itself. Nothing to tick off by hand.
 */
function isReviewCentreImg(value){
  if(typeof value !== 'string' || !value) return false;
  if(value.indexOf('data:') === 0) return false;
  const full = resolveImgPath(value);
  if(/\/fig-[^/]*$/.test(full)) return false;
  if(full.indexOf('architectural-sites-proponents-styles') !== -1) return false;
  return true;
}

// One picture slot. `field` is 'img' for the question's figure or 'nimg' for
// the explanation's. A value that is not a data: URI is a path into the
// module's own img/ folder — those are shown but left alone, since replacing
// one would affect every question that shares the file.
function imgFieldHtml(i, field, value){
  const isData = typeof value === 'string' && value.indexOf('data:') === 0;
  const has = !!value;
  const preview = has
    ? '<img src="' + escapeHtml(isData ? value : resolveImgPath(value)) + '" alt="">'
    : '';
  const fromRC = isReviewCentreImg(value);
  const say = has
    ? (isData
        ? '<b>Pasted image.</b><br>Click, drop or paste to replace it.'
        : (fromRC ? '<span class="rc-tag">From the review centre</span><br>' : '') +
          '<b>' + escapeHtml(String(value)) + '</b><br>A file in the module folder, shared with any other question using it. Click, drop or paste to replace it on this question only.')
    : '<b>No figure.</b><br>Click to browse, drop a file here, or focus this box and press Ctrl+V.';
  return `
    <div class="q-img-drop">
      <div class="q-img${fromRC ? ' from-rc' : ''}" data-imgfield="${field}" data-idx="${i}">
        ${preview}
        <div class="q-img-say" data-say>${say}</div>
        ${has ? `<button class="drop-x" data-imgclear="${field}" data-idx="${i}">Remove</button>` : ''}
      </div>
    </div>`;
}

// A stored path is relative to the quiz file; the admin previews from the repo
// root, so it needs the same rebasing the app does.
function resolveImgPath(v){
  if(!currentFilePath || /^(data:|https?:|\/)/.test(v)) return v;
  const slash = currentFilePath.lastIndexOf('/');
  return slash === -1 ? v : currentFilePath.slice(0, slash + 1) + v;
}

function renderQuestionsList(){
  const listEl = document.getElementById('questionsList');
  const reportCounts = reportCountsForCurrentFile();

  // Which questions in this file still show a review-centre picture, and how
  // many distinct files that is — several questions usually share one sheet.
  const rcQuestions = [];
  const rcFiles = new Set();
  currentQuestions.forEach((q, i) => {
    let hit = false;
    ['img', 'nimg'].forEach(f => {
      if(isReviewCentreImg(q[f])){ hit = true; rcFiles.add(String(q[f])); }
    });
    if(hit) rcQuestions.push(i + 1);
  });
  const rcBanner = rcQuestions.length ? `
    <div class="rc-banner">
      <b>${rcFiles.size} figure${rcFiles.size === 1 ? '' : 's'} here still came from the review centre</b>,
      shown on ${rcQuestions.length} question${rcQuestions.length === 1 ? '' : 's'}:
      Q${rcQuestions.slice(0, 12).join(', Q')}${rcQuestions.length > 12 ? ' and ' + (rcQuestions.length - 12) + ' more' : ''}.
      Each is outlined in red below. Paste your own picture over one and the mark clears itself.
    </div>` : '';

  listEl.innerHTML = rcBanner + currentQuestions.map((q, i) => {
    const count = reportCounts[i] || 0;
    if(!expandedQIdx.has(i)){
      const preview = (q.q || '').replace(/\s+/g, ' ').trim().slice(0, 70);
      return `
        <div class="row q-row" data-idx="${i}">
          <span class="qr-text">Q${i+1} — ${escapeHtml(preview)}${q.hidden ? ' <span class="qr-hidden-tag">(hidden)</span>' : ''}</span>
          ${count ? `<span class="report-badge">${count} reported</span>` : ''}
        </div>
      `;
    }
    const stepsVal = Array.isArray(q.steps) ? q.steps.join('\n') : '';
    return `
      <div class="q-card" data-idx="${i}">
        <div class="row" style="padding-top:0;border-bottom:none;justify-content:space-between;">
          <b>Question ${i+1}</b>
          ${count ? `<span class="report-badge">${count} reported</span>` : ''}
          <button data-action="collapseQ" data-idx="${i}">Collapse</button>
        </div>
        <div class="field-label">Question ${i+1} — topic/section</div>
        <input type="text" data-field="s" data-idx="${i}" value="${escapeHtml(q.s || '')}">
        <div class="field-label">Scenario — reference text shown before the question (optional; often shared by several questions in a row)</div>
        <textarea data-field="scenario" data-idx="${i}" rows="3">${escapeHtml(q.scenario || '')}</textarea>
        <div class="field-label">Question text</div>
        <textarea data-field="q" data-idx="${i}" rows="2">${escapeHtml(q.q || '')}</textarea>
        <div class="field-label">Answer choices (mark the correct one)</div>
        <div class="q-opts">
          ${(q.o || []).map((opt, oi) => `
            <input type="radio" name="correct-${i}" data-correct-idx="${oi}" data-idx="${i}" ${q.c === oi ? 'checked' : ''}>
            ${typeof opt === 'string'
              ? `<input type="text" data-field="o" data-oidx="${oi}" data-idx="${i}" value="${escapeHtml(opt)}">`
              : `<input type="text" value="Auto-generated (${escapeHtml(opt.tpl || '')}) — not editable here" disabled title="This option is computed from the others at run time and can't be edited as text.">`}
          `).join('')}
        </div>
        <div class="field-label">Figure shown with the question (optional)</div>
        ${imgFieldHtml(i, 'img', q.img)}
        <div class="field-label">Reference (optional)</div>
        <input type="text" data-field="ref" data-idx="${i}" value="${escapeHtml(q.ref || '')}">
        <div class="field-label">Explanation note (optional)</div>
        <textarea data-field="n" data-idx="${i}" rows="2">${escapeHtml(q.n || '')}</textarea>
        <div class="field-label">Figure shown with the explanation (optional)</div>
        ${imgFieldHtml(i, 'nimg', q.nimg)}
        <div class="field-label">Solution steps (optional — one per line)</div>
        <textarea data-field="steps" data-idx="${i}" rows="3">${escapeHtml(stepsVal)}</textarea>
        <label class="filter-row" style="margin-top:10px;">
          <input type="checkbox" data-action="toggleHidden" data-idx="${i}" style="width:auto;" ${q.hidden ? 'checked' : ''}>
          Hide this question
        </label>
        <div class="save-status" style="margin-top:0;">Hiding keeps its slot so saved progress isn't affected — it just stops being served. It doesn't delete or renumber anything.</div>
      </div>
    `;
  }).join('');

  // Picture slots. Re-rendering the whole list on every change would collapse
  // the card being edited, so the box updates itself in place.
  listEl.querySelectorAll('.q-img').forEach(box => {
    const idx = +box.dataset.idx;
    const field = box.dataset.imgfield;
    const say = box.querySelector('[data-say]');
    LEAImageIntake.attach(box, {
      onStart(){ say.innerHTML = 'Working…'; },
      onError(msg){ say.innerHTML = '<span class="warn">' + escapeHtml(msg) + '</span>'; },
      onImage(res){
        currentQuestions[idx][field] = res.dataUrl;
        let note = '<b>Pasted image.</b> ' + res.width + '×' + res.height + ' ' + res.type +
                   ', ' + LEAImageIntake.readable(res.bytes) +
                   (res.scaled ? ' (shrunk to fit)' : '');
        if(res.heavy){
          note += '<br><span class="warn">That is large for a question — it is stored ' +
                  'inside the module file, so a few of these add up. Crop it if you can.</span>';
        }
        note += '<br>Remember to press <b>Save to site</b>.';
        let img = box.querySelector('img');
        if(!img){ img = document.createElement('img'); box.insertBefore(img, say); }
        img.src = res.dataUrl;
        say.innerHTML = note;
        if(!box.querySelector('.drop-x')) renderQuestionsList();
      }
    });
  });
  listEl.querySelectorAll('button[data-imgclear]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();   // the box itself opens a file picker on click
      delete currentQuestions[+btn.dataset.idx][btn.dataset.imgclear];
      renderQuestionsList();
    });
  });

  listEl.querySelectorAll('.q-row').forEach(row => {
    row.addEventListener('click', () => { expandedQIdx.add(+row.dataset.idx); renderQuestionsList(); });
  });
  listEl.querySelectorAll('button[data-action="collapseQ"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); expandedQIdx.delete(+btn.dataset.idx); renderQuestionsList(); });
  });
  listEl.querySelectorAll('input[data-field="s"], input[data-field="ref"]').forEach(el => {
    el.addEventListener('input', () => { currentQuestions[+el.dataset.idx][el.dataset.field] = el.value; });
  });
  listEl.querySelectorAll('textarea[data-field="q"], textarea[data-field="n"], textarea[data-field="scenario"]').forEach(el => {

  });
  listEl.querySelectorAll('textarea[data-field="steps"]').forEach(el => {
    el.addEventListener('input', () => {
      const lines = el.value.split('\n').map(s => s.trim()).filter(Boolean);

      if(lines.length) q.steps = lines; else delete q.steps;
    });
  });
  listEl.querySelectorAll('input[data-field="o"]').forEach(el => {
    el.addEventListener('input', () => { currentQuestions[+el.dataset.idx].o[+el.dataset.oidx] = el.value; });
  });
  listEl.querySelectorAll('input[data-correct-idx]').forEach(el => {
    el.addEventListener('change', () => { currentQuestions[+el.dataset.idx].c = +el.dataset.correctIdx; });

  listEl.querySelectorAll('input[data-action="toggleHidden"]').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());

}

// Finds every piece of visible writing on the page (headings, paragraphs, notes, etc.)
// and turns each one into a plain text box — no code shown, ever.
let textNodeRefs = []; // {node, tag} — live references into currentDoc

function collectTextNodes(doc){
  textNodeRefs = [];
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null);
  let n;
  while((n = walker.nextNode())){
    if(!n.nodeValue || n.nodeValue.trim() === '') continue;
    const parentTag = n.parentElement ? n.parentElement.closest('script, style, noscript') : null;
    if(parentTag) continue;
    textNodeRefs.push({ node: n, tag: n.parentElement ? n.parentElement.tagName.toLowerCase() : 'text' });
  }
}

function renderTextEditor(path){
  const parser = new DOMParser();

/* ================= ADD MODULE (DRAG & DROP UPLOAD) TAB ================= */
//
// Lets an admin drop in a self-contained quiz/module HTML file (built with its
// own design, own CSS, own question data) and have it wired into the site's
// three "layers" automatically:
//   1. The quiz file itself — saved under subjects/<subject>/quizzes/, with a
//      small invisible adapter appended so its answers report into the shared
//      LEAProgress tracker (assets/module-progress.js). The quiz's own markup,
//      styling and behavior are left untouched.
//   2. The subject's index.html — a new module card is added (or the subject
//      page is created from scratch if it's a brand-new subject).
//   3. The main index.html — the subject's totals are registered in SUBJECTS
//      so it shows up on the home page.
//
// Two quiz formats are auto-detected:
//   "native"    — the site's own quiz template (const QUESTIONS = [...], and
//                  already calls LEAProgress itself) — just re-point its
//                  LEA_SUBJECT_ID / LEA_MODULE_ID at the chosen module.
//   "blueprint" — the standalone "QUIZ_DATA" reviewer template (const
//                  QUIZ_DATA = [...], function selectOption(...), function
//                  showResults(...)) — gets a small adapter script appended
//                  that hooks those functions to report mastery/scores.

function parseQuizFile(text){
  const titleMatch = text.match(/<title>([^<]*)<\/title>/);
  const h1Match = text.match(/<h1>([^<]*)<\/h1>/);
  const suggestedTitle = (h1Match && h1Match[1].trim()) || (titleMatch && titleMatch[1].trim()) || '';

  function countArray(re){
    const m = text.match(re);
    if(!m) return 0;
    try{ return JSON.parse(m[1]).length; }catch(e){}
    try{ return new Function('return ' + m[1])().length; }catch(e){}
    return 0;
  }

  if(/const QUESTIONS\s*=\s*\[/.test(text) && /LEAProgress/.test(text)){
    return { format:'native', questionCount: countArray(/const QUESTIONS = (\[[\s\S]*?\]);/), suggestedTitle };
  }
  if(/const QUIZ_DATA\s*=\s*\[/.test(text) && /function\s+selectOption\s*\(/.test(text) && /function\s+showResults\s*\(/.test(text)){
    return { format:'blueprint', questionCount: countArray(/const QUIZ_DATA = (\[[\s\S]*?\]);/), suggestedTitle };
  }

  // "practice" template — a third self-built quiz shape (seen in e.g. the
  // PreBoard Practice Set style files): const QUESTIONS = [...] with each
  // item's correct option at item.c, plus its own selectAnswer(i, btn) /
  // showResults() functions and a per-run answersLog/order array. Distinct
  // enough from native (needs LEAProgress) and blueprint (needs QUIZ_DATA +
  // selectOption) that it's safe to recognize by name and wire up properly,
  // instead of falling through to the untracked generic case below.
  if(/const QUESTIONS\s*=\s*\[/.test(text) && /function\s+selectAnswer\s*\(/.test(text) && /function\s+showResults\s*\(/.test(text) && /\banswersLog\b/.test(text)){
    return { format:'practice', questionCount: countArray(/const QUESTIONS = (\[[\s\S]*?\]);/), suggestedTitle };
  }

  // Fallback for self-contained quiz files that don't match either known
  // template exactly (different variable/function names, different question
  // object shape, etc). Rather than reject the file, scan every top-level
  // `const NAME = [ ... ];` array literal in the file and accept the first
  // one that "looks like" a set of quiz questions — each item is an object
  // with at least one array property (the options) with 2+ entries. This
  // can't safely wire up LEAProgress (we don't know the file's own
  // answer-checking function names), so it's embedded as-is: no adapter
  // script is appended, progress just won't be tracked for it.
  function looksLikeQuestionArray(arr){
    if(!Array.isArray(arr) || !arr.length) return false;
    return arr.every(item => {
      if(!item || typeof item !== 'object') return false;
      return Object.values(item).some(v => Array.isArray(v) && v.length >= 2);
    });
  }
  const genericRe = /const\s+([A-Za-z_$][\w$]*)\s*=\s*(\[[\s\S]*?\]);/g;
  let genericMatch;
  while((genericMatch = genericRe.exec(text))){
    const literal = genericMatch[2];
    let arr = null;
    try{ arr = JSON.parse(literal); }catch(e){}
    if(!arr){ try{ arr = new Function('return ' + literal)(); }catch(e){} }
    if(looksLikeQuestionArray(arr)){
      return { format:'generic', questionCount: arr.length, suggestedTitle };
    }
  }

  return { format:'unknown', questionCount:0, suggestedTitle };
}

function buildAdaptedQuizHtml(raw, format, opts){
  const { subjectId, moduleId, subjectName, includeBackLink } = opts;
  let out = raw;
  const assetPath = '../../../assets/module-progress.js?v=16';

  if(format === 'native'){
    out = out.replace(/const LEA_SUBJECT_ID\s*=\s*'[^']*';/, `const LEA_SUBJECT_ID = '${subjectId}';`);
    out = out.replace(/const LEA_MODULE_ID\s*=\s*'[^']*';/, `const LEA_MODULE_ID = '${moduleId}';`);
    if(!/module-progress\.js/.test(out)){
      out = out.replace('</body>', `<script src="${assetPath}"><\/script>\n</body>`);
    }
  } else if(format === 'blueprint'){
    const adapter = `
<script src="${assetPath}"><\/script>
<script>
// ---- Auto-generated by the admin "Add Module" tool: reports this quiz's ----
// ---- answers into the shared LEAProgress tracker, without touching the  ----
// ---- quiz's own markup, styling, or behavior.                           ----
(function(){
  var LEA_SUBJECT_ID = ${JSON.stringify(subjectId)};
  var LEA_MODULE_ID = ${JSON.stringify(moduleId)};
  if (typeof selectOption === 'function') {
    var _leaOrigSelectOption = selectOption;
    selectOption = function(origIdx){
      _leaOrigSelectOption(origIdx);
      try {
        var r = results[current];
        if (r && r.isCorrect && window.LEAProgress) {
          LEAProgress.markMastered(LEA_SUBJECT_ID, LEA_MODULE_ID, order[current]);
        }
      } catch(e){}
    };
  }
  if (typeof showResults === 'function') {
    var _leaOrigShowResults = showResults;
    showResults = function(){
      _leaOrigShowResults();
      try {
        if (window.LEAProgress) {
          var correctCount = results.filter(function(r){ return r && r.isCorrect; }).length;
          LEAProgress.recordRunScore(LEA_SUBJECT_ID, LEA_MODULE_ID, correctCount, order.length);
        }
      } catch(e){}
    };
  }
})();
<\/script>
`;
    out = out.replace('</body>', adapter + '</body>');
  } else if(format === 'practice'){
    const adapter = `
<script src="${assetPath}"><\/script>
<script>
// ---- Auto-generated by the admin "Add Module" tool: reports this quiz's ----
// ---- answers into the shared LEAProgress tracker, without touching the  ----
// ---- quiz's own markup, styling, or behavior.                           ----
(function(){
  var LEA_SUBJECT_ID = ${JSON.stringify(subjectId)};
  var LEA_MODULE_ID = ${JSON.stringify(moduleId)};
  if (typeof selectAnswer === 'function') {
    var _leaOrigSelectAnswer = selectAnswer;
    selectAnswer = function(i, btn){
      var alreadyAnswered = !!answersLog[pos];
      var qIdx = order[pos];
      _leaOrigSelectAnswer(i, btn);
      try {
        if (!alreadyAnswered) {
          var logged = answersLog[pos];
          if (logged && logged.isCorrect && window.LEAProgress) {

        }
      } catch(e){}
    };
  }
  if (typeof showResults === 'function') {

    showResults = function(){
      _leaOrigShowResults();
      try {
        if (window.LEAProgress) {
          var correctCount = answersLog.filter(function(a){ return a && a.isCorrect; }).length;
          LEAProgress.recordRunScore(LEA_SUBJECT_ID, LEA_MODULE_ID, correctCount, order.length);
        }
      } catch(e){}
    };
  }
})();
<\/script>
`;
    out = out.replace('</body>', adapter + '</body>');
  }

  if(includeBackLink){
    const backLinkHtml = `<div style="max-width:760px;margin:0 auto 12px;font:12px 'IBM Plex Mono',monospace;">` +
      `<a href="../index.html" style="color:#8fc4ea;text-decoration:underline;">&larr; Back to ${escapeHtml(subjectName)}</a>` +
      `</div>\n`;
    out = out.replace('<body>', '<body>\n' + backLinkHtml);

  return out;
}

function handleUploadedFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    uploadedFileText = reader.result;
    uploadedParsed = parseQuizFile(uploadedFileText);
    document.getElementById('dropZoneText').textContent = 'Loaded: ' + file.name;
    const fileInfoEl = document.getElementById('fileInfo');
    const formCard = document.getElementById('uploadFormCard');

    if(uploadedParsed.format === 'unknown' || !uploadedParsed.questionCount){
      fileInfoEl.className = 'save-status err';
      fileInfoEl.textContent = 'Couldn\u2019t recognize a supported question set in this file (looked for the site\u2019s own quiz template or the standalone "QUIZ_DATA" reviewer template).';
      formCard.style.display = 'none';
      return;
    }

    fileInfoEl.className = 'save-status ok';
    const formatLabel = uploadedParsed.format === 'native' ? "LEA site quiz template"
      : uploadedParsed.format === 'blueprint' ? 'Standalone "QUIZ_DATA" reviewer template'
      : uploadedParsed.format === 'practice' ? '"Practice set" reviewer template'
      : 'Self-contained quiz file (progress tracking will not be wired up for this one)';
    fileInfoEl.textContent = `Detected ${uploadedParsed.questionCount} question(s) — format: ${formatLabel}.`;
    formCard.style.display = 'block';

    const suggestedTitle = uploadedParsed.suggestedTitle || file.name.replace(/\.html?$/i, '');
    document.getElementById('uploadModuleTitle').value = suggestedTitle;
    document.getElementById('uploadModuleId').value = slugify(suggestedTitle);
    document.getElementById('uploadFileName').value = file.name.replace(/\s+/g, '_');
  };
  reader.readAsText(file);
}

async function handleAddModule(){
  const statusEl = document.getElementById('uploadStatus');
  const btn = document.getElementById('uploadSubmitBtn');
  function log(msg){ statusEl.innerHTML += '<div>' + escapeHtml(msg) + '</div>'; }

  btn.disabled = true;
  statusEl.className = 'save-status';
  statusEl.innerHTML = '';

  try{
    if(!uploadedFileText || !uploadedParsed || !uploadedParsed.questionCount){
      throw new Error('Drop or choose a supported quiz HTML file first.');
    }

    // ---- Resolve subject ----
    const subjectSelectVal = document.getElementById('uploadSubjectSelect').value;
    let subjectId, subjectName, subjectTagline = '', isNewSubject = false;
    if(subjectSelectVal === '__new__'){
      subjectName = document.getElementById('newSubjectName').value.trim();
      if(!subjectName) throw new Error('Enter a name for the new subject.');
      subjectId = slugify(subjectName);
      subjectTagline = document.getElementById('newSubjectTagline').value.trim();
      isNewSubject = true;
    } else {
      const s = subjects.find(s => s.id === subjectSelectVal);
      if(!s) throw new Error('Pick a subject.');
      subjectId = s.id; subjectName = s.name;
    }

    const moduleTitle = document.getElementById('uploadModuleTitle').value.trim() || uploadedParsed.suggestedTitle || 'Untitled Module';
    const moduleId = slugify(document.getElementById('uploadModuleId').value.trim() || moduleTitle);
    const moduleHard = document.getElementById('uploadHardChk').checked;
    const fileName = (document.getElementById('uploadFileName').value.trim() || (slugify(moduleTitle) + '.html')).replace(/[^a-zA-Z0-9_.-]/g, '_');
    const includeBackLink = document.getElementById('uploadBackLinkChk').checked;

    if(!moduleId) throw new Error('Enter a module ID.');

    // Checked before anything is written. A duplicate module ID would collide
    // in every reader's stored progress, which is not recoverable by editing
    // the manifest afterwards.
    const existingSubject = subjects.find(x => x.id === subjectId);
    if(existingSubject && (existingSubject.modules || []).some(m => m.id === moduleId)){
      throw new Error('"' + subjectName + '" already has a module with the ID "' + moduleId + '". Pick another.');
    }

    log('Preparing quiz file…');
    const adaptedHtml = buildAdaptedQuizHtml(uploadedFileText, uploadedParsed.format, {
      subjectId, moduleId, subjectName, includeBackLink
    });

    const quizPath = `subjects/${subjectId}/quizzes/${fileName}`;
    log('Saving quiz file to ' + quizPath + '…');
    await callSave(quizPath, adaptedHtml, `Admin: add module "${moduleTitle}" to ${subjectId}`);

    // ---- data/subjects.json ----
    // The single place the site looks. Re-fetched immediately before the edit
    // rather than trusting what this tab loaded minutes ago, so two admins
    // working at once cannot silently drop each other's subject.
    log('Updating ' + MANIFEST_PATH + '…');
    const manifest = await fetchManifestForWrite(log);

    let subject = manifest.find(x => x.id === subjectId);
    if(!subject){
      subject = { id: subjectId, name: subjectName, blurb: subjectTagline, ready: true, modules: [] };
      manifest.push(subject);
      log('Added a new subject: ' + subjectName + '.');
    }
    if(!Array.isArray(subject.modules)) subject.modules = [];

    // Re-checked against the just-fetched copy, not the stale one.
    if(subject.modules.some(m => m.id === moduleId)){
      throw new Error('"' + subject.name + '" already has a module with the ID "' + moduleId +
                      '" — the quiz file was saved, but nothing was added to the site. Rename the module ID and try again.');
    }

    const moduleEntry = {
      id: moduleId,
      no: nextModuleNo(subject),
      title: moduleTitle,
      total: uploadedParsed.questionCount,
      file: quizPath,
      format: 'html'
    };
    if(moduleHard) moduleEntry.hard = true;

    // Appended, never inserted. Readers' progress is keyed on module id, but
    // the order here is the order they see, and a module that appears in the
    // middle of a list they know reads as a mistake.
    subject.modules.push(moduleEntry);

    // A subject with modules is reachable; leaving ready:false would hide the
    // module that was just added.
    if(!subject.ready){
      subject.ready = true;
      log('Marked "' + subject.name + '" as available.');
    }

    await callSave(MANIFEST_PATH, manifestToJson(manifest), `Admin: add module "${moduleTitle}" to ${subjectId}`);
    rememberManifest(manifest);

    statusEl.className = 'save-status ok';
    log('✅ Done! "' + moduleTitle + '" is module ' + moduleEntry.no + ' of ' + subject.name +
        ', with ' + moduleEntry.total + ' questions. It may take a minute or two for GitHub Pages to update the live site.');

    await loadSubjects();
    renderUploadTab();
  }catch(e){
    statusEl.className = 'save-status err';
    log('Error: ' + e.message);
  }finally{
    btn.disabled = false;
  }
}
