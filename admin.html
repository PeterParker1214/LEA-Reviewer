// The reasons the reader-facing form offers are phrased for a reader mid-quiz.
// On this screen they are labels on a to-do list, so they get shorter names.
const REASON_LABELS = {
  'Answer key looks wrong': { text: 'Wrong answer', cls: 'key' },
  'Typo or unclear wording': { text: 'Wording', cls: 'wording' }
};
function reasonLabel(reason){
  return REASON_LABELS[reason] || { text: reason, cls: 'wording' };
}
function shortWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

let reportOpenRef = null;   // the one report card expanded right now
let reportFilter = 'all';   // 'all', or a reason string
const reportFileCache = {}; // module file path -> { raw, source }
const reportQ = {};         // question_ref -> { file, qIndex, row, where } or { error }

async function fetchModuleSource(file){
  if(reportFileCache[file]) return reportFileCache[file];
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${file}?t=${Date.now()}`;
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('Could not load ' + file);
  const raw = await resp.text();
  const source = readQuestionSource(file, raw);
  if(!source) throw new Error('Could not find a question list in ' + file);
  reportFileCache[file] = { raw, source };
  return reportFileCache[file];
}

// Every reported question is pulled up front, so a collapsed card can show the
// question itself rather than a path only its author would recognise. One
// fetch per file, however many reports point into it.
async function prefetchReportedQuestions(){
  const refs = Object.keys(reportsByQuestionRef).filter(ref => !reportQ[ref]);
  await Promise.all(refs.map(async ref => {
    const [subjectId, moduleId, qIndexStr] = ref.split('/');
    const qIndex = parseInt(qIndexStr, 10);
    const found = findModuleInManifest(subjectId, moduleId);
    if(!found){
      reportQ[ref] = { error: 'This question belongs to a module that is no longer listed in data/subjects.json.' };
      return;
    }
    try{
      const { source } = await fetchModuleSource(found.mod.file);
      const row = source.editable[qIndex];
      if(!row) throw new Error('This module has no question ' + (qIndex + 1) + ' any more — the report is probably older than an edit.');
      reportQ[ref] = {
        file: found.mod.file,
        qIndex,
        row,
        where: found.subject.name + ' \u00b7 ' + found.mod.title + ' \u00b7 Question ' + (qIndex + 1)
      };
    }catch(e){
      reportQ[ref] = { error: e.message };
    }
  }));
}

async function openReportsTab(){
  tabReportsEl.innerHTML = '<div class="card msg info">Loading reports\u2026</div>';
  await loadManifest();
  await loadReports();
  await prefetchReportedQuestions();
  renderReportsTab();
}

function renderReportsTab(){
  if(reportsLoadError){
    tabReportsEl.innerHTML =
      '<div class="card msg error"><b>Couldn\'t load reports.</b><br>' +
      escapeHtml(reportsLoadError) +
      '<br><br>Reports sent from the app are being held in each reader\'s browser until this is fixed \u2014 none are lost, but none are visible here either.</div>';
    return;
  }
  const allRefs = Object.keys(reportsByQuestionRef);
  if(allRefs.length === 0){
    tabReportsEl.innerHTML =
      '<div class="card"><div class="empty" style="text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.6;">' +
      'All clear \u2014 nothing waiting.<br>Questions readers flag in the app land here.</div></div>';
    return;
  }

  // Newest report in each group first, so the freshest problems surface at the top.
  allRefs.sort((a, b) => {
    const la = Math.max(...reportsByQuestionRef[a].map(r => new Date(r.created_at).getTime()));
    const lb = Math.max(...reportsByQuestionRef[b].map(r => new Date(r.created_at).getTime()));
    return lb - la;
  });

  const reasons = [...new Set(allRefs.map(ref => reportsByQuestionRef[ref][0].reason))];
  const chips = ['all'].concat(reasons).map(v =>
    '<button class="rep-chip' + (reportFilter === v ? ' on' : '') + '" data-filter="' + escapeHtml(v) + '">' +
    (v === 'all' ? 'All' : escapeHtml(reasonLabel(v).text)) + '</button>').join('');

  const refs = allRefs.filter(ref => reportFilter === 'all' || reportsByQuestionRef[ref][0].reason === reportFilter);

  tabReportsEl.innerHTML =
    '<div class="card">' +
      '<div class="rep-head-strip">' +
        '<h2>' + allRefs.length + ' question' + (allRefs.length === 1 ? '' : 's') + ' need' + (allRefs.length === 1 ? 's' : '') + ' a look</h2>' +
        '<div class="note">Fix it here, then tell the person who flagged it.</div>' +
      '</div>' +
      '<div class="rep-chips">' + chips + '</div>' +
      (refs.length ? refs.map(repCardHtml).join('')
                   : '<div style="color:var(--muted);font-size:14px;padding:20px 0;">Nothing under this filter.</div>') +
    '</div>';

  wireReportsTab();
}

function repCardHtml(ref){
  const reports = reportsByQuestionRef[ref];
  const info = reportQ[ref] || {};
  const isOpen = reportOpenRef === ref;
  const label = reasonLabel(reports[0].reason);
  const names = [...new Set(reports.map(reporterName))];
  const stem = info.row ? info.row.q : (info.error || ref);

  return '' +
  '<div class="rep' + (isOpen ? ' open' : '') + '" data-ref="' + escapeHtml(ref) + '">' +
    '<div class="rep-head" data-head="' + escapeHtml(ref) + '">' +
      '<div class="rep-caret">&#9656;</div>' +
      '<div class="rep-main">' +
        '<div class="rep-where">' + escapeHtml(info.where || ref) + '</div>' +
        '<div class="rep-q">' + escapeHtml(stem) + '</div>' +
        '<div class="rep-meta">' +
          '<span class="rep-tag ' + label.cls + '">' + escapeHtml(label.text) + '</span>' +
          '<span class="by">Reported by <b>' + escapeHtml(names[0]) + '</b>' +
            (names.length > 1 ? ' and ' + (names.length - 1) + ' other' + (names.length > 2 ? 's' : '') : '') + '</span>' +
          '<span>' + escapeHtml(shortWhen(reports[0].created_at)) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    (isOpen ? repBodyHtml(ref) : '') +
  '</div>';
}

function repBodyHtml(ref){
  const reports = reportsByQuestionRef[ref];
  const info = reportQ[ref] || {};
  const k = cssEscapeRef(ref);
  const who = [...new Set(reports.map(reporterName))].join(' and ');

  const said = reports.map(r =>
    '<div class="rep-said">' +
      '<span class="who">' + escapeHtml(reporterName(r)) + ', ' + escapeHtml(shortWhen(r.created_at)) +
        ' \u00b7 ' + escapeHtml(r.reason) + '</span>' +
      (r.comment ? escapeHtml(r.comment) : '<span style="color:var(--muted);">No comment left.</span>') +
    '</div>').join('');

  if(info.error){
    return '<div class="rep-body">' +
      '<div class="rep-sec"><div class="rep-sec-title">What they said</div>' + said + '</div>' +
      '<div class="msg error" style="margin-top:18px;">' + escapeHtml(info.error) + '</div>' +
      '<div class="rep-btns">' +
        '<button data-act="dismiss" data-ref="' + escapeHtml(ref) + '">Dismiss</button>' +
      '</div>' +
      '<div class="save-status" id="status-' + k + '"></div>' +
    '</div>';
  }

  const row = info.row;
  const choices = (row.o || []).map((c, i) =>
    '<div class="rep-choice' + (i === row.c ? ' correct' : '') + '">' +
      '<input type="radio" name="rq-ans-' + k + '" value="' + i + '"' + (i === row.c ? ' checked' : '') + '>' +
      '<input type="text" value="' + escapeHtml(c) + '">' +
      '<span class="mark">' + (i === row.c ? 'Correct' : '') + '</span>' +
    '</div>').join('');

  return '<div class="rep-body">' +
    '<div class="rep-sec"><div class="rep-sec-title">What they said</div>' + said + '</div>' +

    '<div class="rep-sec">' +
      '<div class="rep-sec-title">The question</div>' +
      '<textarea id="rq-stem-' + k + '" rows="3">' + escapeHtml(row.q || '') + '</textarea>' +
      '<p class="rep-hint">Topic shown on screen above this question: ' +
        (row.s ? escapeHtml(row.s) : 'none') + '</p>' +
    '</div>' +

    '<div class="rep-sec">' +
      '<div class="rep-sec-title">Choices <span>\u2014 tick the right one</span></div>' +
      '<div id="rq-opts-' + k + '">' + choices + '</div>' +
    '</div>' +

    '<div class="rep-sec">' +
      '<div class="rep-sec-title">Why it\'s the answer <span>(shown after they answer)</span></div>' +
      '<textarea id="rq-note-' + k + '" rows="2" placeholder="Leave blank if there is nothing to explain.">' +
        escapeHtml(row.n || '') + '</textarea>' +
    '</div>' +

    '<div class="rep-sec">' +
      '<div class="rep-sec-title">Message to ' + escapeHtml(who) + ' <span>(optional)</span></div>' +
      '<textarea id="rq-reply-' + k + '" class="rep-reply" rows="2" ' +
        'placeholder="They see this in the app. Sent with a reply, or with Mark solved."></textarea>' +
    '</div>' +

    '<div class="rep-btns">' +
      '<button class="primary" data-act="saveSolve" data-ref="' + escapeHtml(ref) + '">Save fix &amp; tell ' + escapeHtml(who) + '</button>' +
      '<button data-act="save" data-ref="' + escapeHtml(ref) + '">Save without closing</button>' +
      '<button data-act="reply" data-ref="' + escapeHtml(ref) + '">Send reply only</button>' +
      '<span class="spacer"></span>' +
      '<button data-act="open" data-ref="' + escapeHtml(ref) + '">Open in full editor</button>' +
      '<button data-act="hide" data-ref="' + escapeHtml(ref) + '">Hide question</button>' +
      '<button class="danger" data-act="dismiss" data-ref="' + escapeHtml(ref) + '">Dismiss</button>' +
    '</div>' +
    '<div class="save-status" id="status-' + k + '"></div>' +
  '</div>';
}

function wireReportsTab(){
  tabReportsEl.querySelectorAll('.rep-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      reportFilter = chip.dataset.filter;
      renderReportsTab();
    });
  });

  tabReportsEl.querySelectorAll('[data-head]').forEach(el => {
    el.addEventListener('click', () => {
      const ref = el.dataset.head;
      reportOpenRef = (reportOpenRef === ref) ? null : ref;
      renderReportsTab();
    });
  });

  // Ticking a different answer restages the highlight straight away, so the
  // key you are about to save is the one you can see.
  tabReportsEl.querySelectorAll('.rep-choice input[type="radio"]').forEach(radio => {
    radio.addEventListener('change', () => {
      const body = radio.closest('.rep-body');
      body.querySelectorAll('.rep-choice').forEach(c => {
        const on = c.querySelector('input[type="radio"]').checked;
        c.classList.toggle('correct', on);
        c.querySelector('.mark').textContent = on ? 'Correct' : '';
      });
    });
  });

  const acts = {
    saveSolve: saveAndSolve,
    save: saveReportedQuestion,
    solve: markReportSolved,
    reply: sendReportReply,
    open: openReportInEditor,
    hide: hideReportedQuestion,
    dismiss: dismissReportGroup
  };
  tabReportsEl.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => acts[btn.dataset.act](btn.dataset.ref));
  });
}

function repStatus(ref, text, kind){
  const el = document.getElementById('status-' + cssEscapeRef(ref));
  if(!el) return;
  el.className = 'save-status' + (kind ? ' ' + kind : '');
  el.textContent = text;
}

async function saveReportedQuestion(ref){
  const info = reportQ[ref];
  if(!info || !info.row) return false;
  const k = cssEscapeRef(ref);
  const stem = document.getElementById('rq-stem-' + k).value.trim();
  const note = document.getElementById('rq-note-' + k).value.trim();
  const opts = [...document.querySelectorAll('#rq-opts-' + k + ' input[type="text"]')].map(i => i.value.trim());
  const picked = document.querySelector('input[name="rq-ans-' + k + '"]:checked');

  if(!stem){ repStatus(ref, 'The question cannot be empty.', 'err'); return false; }
  if(opts.some(o => !o)){ repStatus(ref, 'Every choice needs some text.', 'err'); return false; }
  if(!picked){ repStatus(ref, 'Tick which choice is the right one.', 'err'); return false; }

  repStatus(ref, 'Saving\u2026');
  try{
    // info.row IS source.editable[qIndex], so writing here is writing into the
    // array that gets serialised — no copy to keep in step.
    info.row.q = stem;
    info.row.o = opts;
    info.row.c = Number(picked.value);
    info.row.n = note;

    const cached = reportFileCache[info.file];
    const newText = writeQuestionSource(
      cached.source.kind, cached.source.varName, cached.raw, cached.source.rows, cached.source.editable);
    await callSave(info.file, newText, 'Admin: fix Q' + (info.qIndex + 1) + ' in ' + info.file + ' (from report)');
    // Keep the cache in step with what is now on the site, so a second save in
    // the same sitting does not rewrite from a stale copy.
    cached.raw = newText;
    repStatus(ref, 'Saved to the site.', 'ok');
    return true;
  }catch(e){
    repStatus(ref, 'Error: ' + e.message, 'err');
    return false;
  }
}

// The everyday path: write the fix, then close the report and tell whoever
// raised it. The two stay separate underneath so a failed save can never
// send someone a "fixed" notice about a question that did not change.
async function saveAndSolve(ref){
  const info = reportQ[ref];
  if(!info || !info.row) return;
  const saved = await saveReportedQuestion(ref);
  if(!saved) return;
  await markReportSolved(ref);
}

// Closes the report AND tells whoever raised it. The message is whatever is in
// the reply box, or nothing — the reader still sees that it was dealt with.
async function markReportSolved(ref){
  const reports = reportsByQuestionRef[ref] || [];
  const who = [...new Set(reports.map(reporterName))].join(' and ');
  const k = cssEscapeRef(ref);
  const replyEl = document.getElementById('rq-reply-' + k);
  const message = replyEl ? replyEl.value.trim() : '';

  const ok = await LEAConfirm(
    'Close ' + reports.length + ' report' + (reports.length === 1 ? '' : 's') + ' on this question and tell ' + who + ' it is fixed?',
    { title: 'Mark solved', yes: 'Mark solved' }
  );
  if(!ok) return;

  repStatus(ref, 'Closing\u2026');
  try{
    const now = new Date().toISOString();
    const patch = { status: 'solved', resolved_at: now, seen_by_reporter: false };
    if(message){ patch.admin_reply = message; patch.replied_at = now; }
    const { error } = await sb.from('reports').update(patch).in('id', reports.map(r => r.id));
    if(error) throw error;
    reportOpenRef = null;
    await loadReports();
    await prefetchReportedQuestions();
    renderReportsTab();
  }catch(e){
    repStatus(ref, 'Error: ' + e.message, 'err');
  }
}

// A reply without closing anything, for when you need to ask something back.
async function sendReportReply(ref){
  const reports = reportsByQuestionRef[ref] || [];
  const k = cssEscapeRef(ref);
  const replyEl = document.getElementById('rq-reply-' + k);
  const message = replyEl ? replyEl.value.trim() : '';
  if(!message){ repStatus(ref, 'Write a message first.', 'err'); return; }

  repStatus(ref, 'Sending\u2026');
  try{
    const now = new Date().toISOString();
    const { error } = await sb.from('reports')
      .update({ admin_reply: message, replied_at: now, seen_by_reporter: false })
      .in('id', reports.map(r => r.id));
    if(error) throw error;
    repStatus(ref, 'Sent. The report stays open.', 'ok');
  }catch(e){
    repStatus(ref, 'Error: ' + e.message, 'err');
  }
}

// Hiding keeps the question's slot and stops it being served, so saved
// progress and question numbering are unaffected.
async function hideReportedQuestion(ref){
  const info = reportQ[ref];
  if(!info || !info.row){ await LEAAlert('This question could not be loaded, so there is nothing to hide.'); return; }
  const okHide = await LEAConfirm(
    'Hide question ' + (info.qIndex + 1) + '? It keeps its slot and stops being served \u2014 this does not delete or renumber anything, so saved progress is unaffected.',
    { title: 'Hide question', yes: 'Hide question' }
  );
  if(!okHide) return;
  repStatus(ref, 'Hiding\u2026');
  try{
    info.row.hidden = true;
    const cached = reportFileCache[info.file];
    const newText = writeQuestionSource(
      cached.source.kind, cached.source.varName, cached.raw, cached.source.rows, cached.source.editable);
    await callSave(info.file, newText, 'Admin: hide Q' + (info.qIndex + 1) + ' in ' + info.file + ' (from report)');
    cached.raw = newText;
    repStatus(ref, 'Hidden.', 'ok');
  }catch(e){
    repStatus(ref, 'Error: ' + e.message, 'err');
  }
}

function cssEscapeRef(ref){ return ref.replace(/[^a-zA-Z0-9]/g, '_'); }

// Still here for the times a report turns out to be about the module rather
// than the one question — it opens the whole file with this question expanded.
function openReportInEditor(ref){
  const info = reportQ[ref];
  if(!info || !info.file){
    LEAAlert('Could not find this question in the current manifest \u2014 it may belong to a module not listed in data/subjects.json.');
    return;
  }
  document.querySelector('.tab-btn[data-tab="pages"]').click();
  if(fileTree.length === 0){
    loadFileTree().then(() => openFile(info.file, info.qIndex));
  } else {
    openFile(info.file, info.qIndex);
  }
}

// Dismiss leaves the question exactly as it is and closes the report unread by
// the reader — used when the report is mistaken, not when it is fixed.
async function dismissReportGroup(ref){
  const reports = reportsByQuestionRef[ref] || [];
  const okDismiss = await LEAConfirm(
    'Dismiss ' + reports.length + ' report' + (reports.length === 1 ? '' : 's') + ' on this question? The question is left as it is.',
    { title: 'Dismiss reports', yes: 'Dismiss' }
  );
  if(!okDismiss) return;
  repStatus(ref, 'Dismissing\u2026');
  try{
    const { error } = await sb.from('reports')
      .update({ status: 'dismissed', resolved_at: new Date().toISOString() })
      .in('id', reports.map(r => r.id));
    if(error) throw error;
    reportOpenRef = null;
    await loadReports();
    await prefetchReportedQuestions();
    renderReportsTab();
  }catch(e){
    repStatus(ref, 'Error: ' + e.message, 'err');
  }
}

init();
</script>
<script>

/* ---------------- "Rework Module" tab ---------------- */
//
// Takes a question set that already exists — one of the site's own modules, or
// a file — reshapes it (restructured stems, choices moved, questions
// re-sequenced) and writes the result straight into the site as a new
// data/<subject>/NN.json module, registered in data/subjects.json.
//
// The reshaping itself lives in assets/quiz-rework.js, shared with
// tools/quiz-builder.html so the two can never disagree. What is here is the
// part that only makes sense inside the admin: picking a source module,
// choosing where the result lands, and saving it.
//
// Nothing is written until the integrity check passes. If a question stops
// selecting the same answer it selected before, saving is refused outright —
// a quiz that scores wrongly is worse than no quiz.


// ===========================================================================
// Rework tab
//
// Rebuilt around a queue. It used to hold exactly one file: drop a second and
// the first was gone, so twelve modules meant twelve full passes through load,
// preview, name, save. Now every dropped file becomes a job with its own
// destination, they are checked together, and the manifest is written once at
// the end instead of once per module.
//
// The "local model" rewrite option is gone. It rewrote every stem through
// Ollama and reported all of them fine, while in testing it pasted an answer
// into a stem, collapsed two different questions into the same wording, and
// opened 37 of 60 with the same two phrases. It also only ever worked on a
// machine running Ollama, which is not the phone this panel is usually opened
// on. assets/quiz-reframe-ai.js is left in place, unreferenced, in case it is
// ever worth revisiting.
// ===========================================================================

// A subject's data folder is NOT always its id — "history" keeps its modules
// in data/history-of-architecture/. Read the folder off the modules that are
// already there, so a new one lands beside its siblings instead of creating a
// second folder that only differs in name.
function subjectFolder(subject){
  const mods = subject.modules || [];
  for(const m of mods){
    const f = m.file || '';
    if(f.startsWith('data/') && f.split('/').length >= 3) return f.split('/')[1];
  }
  return subject.id;
}

let rwJobs = [];      // one per file or module loaded
let rwJobSeq = 0;

function rwJob(id){ return rwJobs.find(j => j.id === id); }

function renderReworkTab(){
  const subjectOptions = subjects.map(s =>
    '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + '</option>').join('');

  const moduleOptions = subjects.map(s => {
    const mods = (s.modules || []).map(m =>
      '<option value="' + escapeHtml(s.id) + '::' + escapeHtml(m.id) + '">' +
      escapeHtml(m.no) + ' — ' + escapeHtml(m.title) + ' (' + (m.total || '?') + ')</option>').join('');
    return mods ? '<optgroup label="' + escapeHtml(s.name) + '">' + mods + '</optgroup>' : '';
  }).join('');

  tabReworkEl.innerHTML =
    '<div class="card">' +
      '<h2 style="margin-top:0;">Add quizzes</h2>' +
      '<p class="field-note">Drop in answer keys or quiz files and they become modules on the site. ' +
        'Questions get shuffled so the new module is not a copy of the file you started from. ' +
        'Nothing you already have is changed.</p>' +

      '<div id="rwDrop" class="rw-drop">' +
        '<b>Drop your files here</b><br>' +
        '<span>Word documents, or .json / .html quizzes. Several at once is fine.</span>' +
      '</div>' +
      '<input type="file" id="rwFile" accept=".docx,.json,.html,.htm" multiple style="display:none;">' +

      '<details class="rw-more"><summary>Or start from a quiz already on the site</summary>' +
        '<select id="rwSource" style="margin-top:10px;">' +
          '<option value="">— choose a module —</option>' + moduleOptions +
        '</select>' +
      '</details>' +

      '<div id="rwLoadMsg"></div>' +
    '</div>' +

    '<div class="card hidden" id="rwOptionsCard">' +
      '<h2 style="margin-top:0;">How to shuffle them</h2>' +
      '<p class="field-note">These apply to everything in the list below.</p>' +
      '<div class="field-grid">' +
        '<div>' +
          '<div class="field-label">Reword the questions</div>' +
          '<select id="rwRewrite">' +
            '<option value="on" selected>Yes, where it is safe</option>' +
            '<option value="off">No, leave the wording alone</option>' +
          '</select>' +
          '<div class="field-note">Only reshapes sentences it recognises. It never touches the choices.</div>' +
        '</div>' +
        '<div>' +
          '<div class="field-label">Move the choices around</div>' +
          '<select id="rwShuffle">' +
            '<option value="on" selected>Yes</option>' +
            '<option value="off">No</option>' +
          '</select>' +
          '<div class="field-note">The right answer moves with them.</div>' +
        '</div>' +
        '<div>' +
          '<div class="field-label">Change the question order</div>' +
          '<select id="rwReorder">' +
            '<option value="on" selected>Yes</option>' +
            '<option value="off">No, keep the original order</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<details class="rw-more"><summary>Advanced</summary>' +
        '<div class="field-label" style="margin-top:10px;">Shuffle seed</div>' +
        '<input type="number" id="rwSeed" value="42" min="1" style="max-width:140px;">' +
        '<div class="field-note">The same seed shuffles the same way every time. Change it to get a different arrangement.</div>' +
      '</details>' +
      '<div style="margin-top:14px;">' +
        '<button class="primary" id="rwPreviewBtn">Check them all</button>' +
      '</div>' +
      '<div id="rwPreviewMsg"></div>' +
    '</div>' +

    '<div id="rwJobs"></div>' +

    '<div class="card hidden" id="rwSaveCard">' +
      '<button class="primary" id="rwSaveBtn">Save everything to the site</button>' +
      '<div class="save-status" id="rwStatus"></div>' +
    '</div>';

  document.getElementById('rwSource').addEventListener('change', loadModuleAsJob);

  const drop = document.getElementById('rwDrop');
  const fileInput = document.getElementById('rwFile');
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('over');
    [...e.dataTransfer.files].forEach(readReworkFile);
  });
  fileInput.addEventListener('change', e => {
    [...e.target.files].forEach(readReworkFile);
    e.target.value = '';       // so dropping the same file twice still fires
  });

  document.getElementById('rwPreviewBtn').addEventListener('click', previewAllJobs);
  document.getElementById('rwSaveBtn').addEventListener('click', saveAllJobs);

  renderJobs();
}

// ---------------------------------------------------------------- loading ---

async function loadModuleAsJob(e){
  const val = e.target.value;
  if(!val) return;
  e.target.value = '';
  const [subjectId, moduleId] = val.split('::');
  const subject = subjects.find(s => s.id === subjectId);
  const mod = subject && (subject.modules || []).find(m => m.id === moduleId);
  if(!mod) return;
  const msg = document.getElementById('rwLoadMsg');
  msg.innerHTML = '<div class="msg info">Reading ' + escapeHtml(mod.title) + '…</div>';
  try{
    const arr = await LEAQuizSource.loadModuleQuestions(mod);
    if(!arr || !arr.length) throw new Error('That module could not be read.');
    const rows = arr.map(LEAQuizRework.canonical).filter(Boolean);
    if(!rows.length) throw new Error('Read the module but found no usable questions.');
    addJob(subject.name + ' — ' + mod.title, rows, arr.length, mod.title + ' II', subjectId);
    msg.innerHTML = '';
  }catch(err){
    msg.innerHTML = '<div class="msg error">' + escapeHtml(err.message) + '</div>';
  }
}

function readReworkFile(f){
  const msg = document.getElementById('rwLoadMsg');
  const niceTitle = f.name.replace(/\.(docx|json|html?)$/i, '').replace(/[_-]+/g, ' ').trim();

  if(/\.docx$/i.test(f.name)){
    msg.innerHTML += '<div class="msg info">Reading ' + escapeHtml(f.name) + '…</div>';
    LEADocxQuiz.read(f).then(res => {
      const rows = res.rows.map(LEAQuizRework.canonical).filter(Boolean);
      if(!rows.length) throw new Error('No usable questions in ' + f.name + '.');
      addJob(f.name, rows, res.rows.length, niceTitle, null, res.warnings);
    }).catch(err => {
      msg.innerHTML += '<div class="msg error">' + escapeHtml(f.name + ': ' + err.message) + '</div>';
    });
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try{
      const { rows, kind } = LEAQuizRework.parseAny(reader.result, f.name);
      addJob(f.name + ' (' + kind + ')', rows, rows.length, niceTitle);
    }catch(err){
      msg.innerHTML += '<div class="msg error">' + escapeHtml(f.name + ': ' + err.message) + '</div>';
    }
  };
  reader.readAsText(f);
}

function addJob(label, rows, rawCount, title, subjectId, warnings){
  const job = {
    id: ++rwJobSeq,
    label, rows,
    skippedOnRead: rawCount && rawCount > rows.length ? rawCount - rows.length : 0,
    warnings: warnings || [],
    result: null,
    previewIndex: 0,
    previewOpen: false,
    saved: false,
    dest: {
      subjectId: subjectId || (subjects[0] && subjects[0].id) || '',
      no: '', moduleId: '', title: title || label,
      noTouched: false, idTouched: false
    }
  };
  rwJobs.push(job);
  autoNumberJobs();
  document.getElementById('rwOptionsCard').classList.remove('hidden');
  document.getElementById('rwLoadMsg').innerHTML = '';
  renderJobs();
}

// Two files headed for the same subject would otherwise both claim the next
// free number and the second would fail at save with "already used". Numbering
// counts what is already queued, not just what is on the site.
function autoNumberJobs(){
  const taken = {};
  subjects.forEach(s => {
    taken[s.id] = new Set((s.modules || []).map(m => String(m.no)));
  });
  rwJobs.forEach(job => {
    const sid = job.dest.subjectId;
    if(!taken[sid]) taken[sid] = new Set();
    if(job.dest.noTouched && job.dest.no){ taken[sid].add(job.dest.no); return; }
    let n = 1;
    while(taken[sid].has(String(n).padStart(2, '0'))) n++;
    job.dest.no = String(n).padStart(2, '0');
    taken[sid].add(job.dest.no);
    if(!job.dest.idTouched) job.dest.moduleId = sid + '-' + job.dest.no;
  });
}

// ---------------------------------------------------------------- drawing ---

function renderJobs(){
  const box = document.getElementById('rwJobs');
  if(!box) return;
  if(!rwJobs.length){ box.innerHTML = ''; document.getElementById('rwSaveCard').classList.add('hidden'); return; }
  box.innerHTML = rwJobs.map(jobCardHtml).join('');
  wireJobs();
  const ready = rwJobs.some(j => j.result && j.result.keyOk && !j.saved);
  document.getElementById('rwSaveCard').classList.toggle('hidden', !ready);
}

function jobCardHtml(job){
  const subjectOptions = subjects.map(s =>
    '<option value="' + escapeHtml(s.id) + '"' + (s.id === job.dest.subjectId ? ' selected' : '') + '>' +
    escapeHtml(s.name) + '</option>').join('');

  const subject = subjects.find(s => s.id === job.dest.subjectId);
  const path = subject ? 'data/' + subjectFolder(subject) + '/' + job.dest.no + '.json' : '';

  let state = '<span class="rw-state">' + job.rows.length + ' questions</span>';
  if(job.saved)                       state = '<span class="rw-state ok">Saved</span>';
  else if(job.result && job.result.keyOk)  state = '<span class="rw-state ok">Checked · ' + job.rows.length + ' questions</span>';
  else if(job.result && !job.result.keyOk) state = '<span class="rw-state bad">Answer key problem</span>';

  return '<div class="card rw-job" data-job="' + job.id + '">' +
    '<div class="rw-job-head">' +
      '<div><b>' + escapeHtml(job.dest.title || job.label) + '</b>' +
        '<div class="field-note">from ' + escapeHtml(job.label) + '</div></div>' +
      state +
    '</div>' +

    (job.skippedOnRead ? '<div class="msg info">' + job.skippedOnRead +
      ' row(s) in the file could not be read as questions and were left out.</div>' : '') +
    (job.warnings.length ? '<details class="rw-more"><summary>' + job.warnings.length +
      ' item(s) skipped while reading</summary><p class="field-note">' +
      job.warnings.map(escapeHtml).join('<br>') + '</p></details>' : '') +

    '<div class="field-grid" style="margin-top:12px;">' +
      '<div><div class="field-label">Subject</div>' +
        '<select data-f="subjectId">' + subjectOptions + '</select></div>' +
      '<div><div class="field-label">Title</div>' +
        '<input type="text" data-f="title" value="' + escapeHtml(job.dest.title) + '"></div>' +
      '<div><div class="field-label">Number</div>' +
        '<input type="text" data-f="no" value="' + escapeHtml(job.dest.no) + '"></div>' +
      '<div><div class="field-label">Id</div>' +
        '<input type="text" data-f="moduleId" value="' + escapeHtml(job.dest.moduleId) + '"></div>' +
    '</div>' +
    '<p class="field-note" style="margin-top:8px;">Saved as <code>' + escapeHtml(path) + '</code></p>' +

    (job.result ? jobResultHtml(job) : '') +

    '<div class="rw-job-btns">' +
      (job.result ? '<button data-act="peek" data-job="' + job.id + '">' +
        (job.previewOpen ? 'Hide the questions' : 'Look at the questions') + '</button>' : '') +
      '<span style="flex:1;"></span>' +
      '<button class="danger" data-act="drop" data-job="' + job.id + '">Remove</button>' +
    '</div>' +

    (job.previewOpen ? questionPeekHtml(job) : '') +
  '</div>';
}

function jobResultHtml(job){
  const r = job.result;
  if(!r.keyOk){
    return '<div class="msg error" style="margin-top:12px;">A question no longer points at the answer it ' +
      'started with, so this one will not be saved. Remove it and check the source file.</div>';
  }
  const moved = r.rewritten.length;
  return '<div class="msg ok-msg" style="margin-top:12px;">' +
      'Checked. All ' + r.checked + ' answers still point at the same choice they did in the original.' +
    '</div>' +
    '<p class="field-note">' + moved + ' question' + (moved === 1 ? '' : 's') + ' reworded' +
      (r.skipped.length ? ', ' + r.skipped.length + ' left as written' : '') + '.</p>' +
    (moved ? '<details class="rw-more"><summary>See the rewording</summary>' +
      '<table class="rw-table"><tr><th>Before</th><th>After</th></tr>' +
      r.rewritten.slice(0, 40).map(x => '<tr><td style="color:var(--muted);">' + escapeHtml(x.from) +
        '</td><td style="color:var(--good);">' + escapeHtml(x.to) + '</td></tr>').join('') +
      '</table></details>' : '');
}

// The old preview reported counts and averages — useful for trusting the
// shuffle, useless for judging whether the questions are any good. This shows
// the questions the way a reader will meet them, and lets you fix them here
// rather than saving something wrong and repairing it from the Pages tab.
//
// Edits write straight into job.result.rows, which is what gets saved. The
// answer-key check ran before any of this, so a question you have touched is
// no longer covered by it — the card says so.
function questionPeekHtml(job){
  const rows = job.result.rows;
  if(!rows.length) return '<div class="rw-peek"><p class="field-note">Every question was removed.</p></div>';
  const i = Math.max(0, Math.min(job.previewIndex, rows.length - 1));
  const q = rows[i];
  const letters = ['A','B','C','D','E','F','G','H'];
  const edited = job.editedIdx && job.editedIdx.has(i);

  const choices = (q.o || []).map((o, n) => {
    const isObj = typeof o !== 'string';
    return '<div class="rw-choice' + (n === q.c ? ' right' : '') + '">' +
      '<input type="radio" name="rwc-' + job.id + '" value="' + n + '"' +
        (n === q.c ? ' checked' : '') + ' data-e="c" title="Mark as the right answer">' +
      '<span class="rw-letter">' + (letters[n] || (n + 1)) + '</span>' +
      (isObj
        ? '<span class="field-note" style="flex:1;">Combined choice (“Both A and B”) — edit this one in the Pages tab.</span>'
        : '<input type="text" class="rw-opt" data-e="o" data-i="' + n + '" value="' + escapeHtml(o) + '">') +
      ((q.o.length > 2 && !isObj)
        ? '<button class="rw-x" data-act="delopt" data-job="' + job.id + '" data-i="' + n + '" title="Remove this choice">&times;</button>'
        : '') +
    '</div>';
  }).join('');

  return '<div class="rw-peek">' +
    '<div class="rw-peek-nav">' +
      '<button data-act="prev" data-job="' + job.id + '"' + (i === 0 ? ' disabled' : '') + '>Back</button>' +
      '<span>Question ' + (i + 1) + ' of ' + rows.length +
        (edited ? ' · <span style="color:var(--gold-bright);">edited</span>' : '') + '</span>' +
      '<button data-act="next" data-job="' + job.id + '"' + (i >= rows.length - 1 ? ' disabled' : '') + '>Next</button>' +
    '</div>' +

    '<div class="field-label">Topic <span style="font-weight:400;color:var(--muted);">(shown above the question)</span></div>' +
    '<input type="text" data-e="s" value="' + escapeHtml(q.s || '') + '" placeholder="Leave blank for none">' +

    '<div class="field-label" style="margin-top:12px;">Question</div>' +
    '<textarea data-e="q" rows="3">' + escapeHtml(q.q || '') + '</textarea>' +

    '<div class="field-label" style="margin-top:12px;">Choices <span style="font-weight:400;color:var(--muted);">— tick the right one</span></div>' +
    choices +
    '<button data-act="addopt" data-job="' + job.id + '" style="margin-top:4px;">Add a choice</button>' +

    '<div class="field-label" style="margin-top:14px;">Why it\'s the answer</div>' +
    '<textarea data-e="n" rows="2" placeholder="Leave blank if there is nothing to explain.">' +
      escapeHtml(q.n || '') + '</textarea>' +

    '<div class="rw-peek-foot">' +
      '<span class="field-note">Changes are kept as you type. Nothing is written to the site until you save.</span>' +
      '<button class="danger" data-act="delq" data-job="' + job.id + '">Delete this question</button>' +
    '</div>' +
  '</div>';
}

// Text edits update the row without redrawing, or the field would lose focus on
// every keystroke. Only changes that alter the layout redraw.
function wirePeek(card, job){
  const rows = job.result && job.result.rows;
  if(!rows || !rows.length) return;
  const i = Math.max(0, Math.min(job.previewIndex, rows.length - 1));
  const q = rows[i];
  job.editedIdx = job.editedIdx || new Set();

  card.querySelectorAll('.rw-peek [data-e]').forEach(el => {
    const field = el.dataset.e;
    if(field === 'c'){
      el.addEventListener('change', () => {
        q.c = Number(el.value);
        job.editedIdx.add(i);
        renderJobs();
      });
      return;
    }
    el.addEventListener('input', () => {
      if(field === 'o') q.o[Number(el.dataset.i)] = el.value;
      else q[field] = el.value;
      job.editedIdx.add(i);
      markJobEdited(job);
    });
  });
}

// The key check ran before the edits, so once a question is touched the card
// should stop implying the check still covers it.
function markJobEdited(job){
  const card = document.querySelector('.rw-job[data-job="' + job.id + '"] .rw-state');
  if(card && !card.classList.contains('warn')){
    card.className = 'rw-state warn';
    card.textContent = 'Edited by you · ' + job.result.rows.length + ' questions';
  }
}

function wireJobs(){
  document.querySelectorAll('.rw-job').forEach(card => {
    const job = rwJob(Number(card.dataset.job));
    if(!job) return;
    if(job.previewOpen && job.result) wirePeek(card, job);
    card.querySelectorAll('[data-f]').forEach(el => {
      el.addEventListener('change', () => {
        const f = el.dataset.f;
        job.dest[f] = el.value.trim();
        if(f === 'no') job.dest.noTouched = true;
        if(f === 'moduleId') job.dest.idTouched = true;
        if(f === 'subjectId'){ job.dest.noTouched = false; job.dest.idTouched = false; autoNumberJobs(); }
        renderJobs();
      });
    });
  });

  document.querySelectorAll('#rwJobs button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const job = rwJob(Number(btn.dataset.job));
      if(!job) return;
      const a = btn.dataset.act;
      const rows = job.result && job.result.rows;
      const i = rows ? Math.max(0, Math.min(job.previewIndex, rows.length - 1)) : 0;
      if(a === 'drop'){ rwJobs = rwJobs.filter(j => j !== job); autoNumberJobs(); }
      if(a === 'peek') job.previewOpen = !job.previewOpen;
      if(a === 'prev') job.previewIndex = Math.max(0, job.previewIndex - 1);
      if(a === 'next') job.previewIndex = job.previewIndex + 1;
      if(a === 'addopt'){ rows[i].o.push(''); job.editedIdx = job.editedIdx || new Set(); job.editedIdx.add(i); }
      if(a === 'delopt'){
        const n = Number(btn.dataset.i);
        rows[i].o.splice(n, 1);
        // Removing a choice above the answer shifts it down; removing the
        // answer itself leaves the key pointing at whatever slid into its place,
        // so it falls back to the first choice and the card flags it as edited.
        if(rows[i].c === n) rows[i].c = 0;
        else if(rows[i].c > n) rows[i].c--;
        job.editedIdx = job.editedIdx || new Set(); job.editedIdx.add(i);
      }
      if(a === 'delq'){
        rows.splice(i, 1);
        job.previewIndex = Math.min(i, Math.max(0, rows.length - 1));
        job.editedIdx = new Set();   // indices have all shifted
      }
      renderJobs();
    });
  });
}

// --------------------------------------------------------------- checking ---

function previewAllJobs(){
  const msg = document.getElementById('rwPreviewMsg');
  msg.innerHTML = '';
  if(!rwJobs.length){ msg.innerHTML = '<div class="msg error">Nothing loaded yet.</div>'; return; }

  const seed = parseInt(document.getElementById('rwSeed').value, 10) || 42;
  const rewrite = document.getElementById('rwRewrite').value === 'on';
  const shuffleOptions = document.getElementById('rwShuffle').value === 'on';
  const reorder = document.getElementById('rwReorder').value === 'on';

  let bad = 0;
  rwJobs.forEach((job, n) => {
    if(job.saved) return;
    try{
      // A different seed per job, so two files loaded together do not come out
      // shuffled into the same order as each other.
      job.result = LEAQuizRework.build(job.rows, { seed: seed + n, rewrite, shuffleOptions, reorder });
      if(!job.result.keyOk) bad++;
    }catch(err){
      job.result = null;
      bad++;
      msg.innerHTML += '<div class="msg error">' + escapeHtml(job.label + ': ' + err.message) + '</div>';
    }
  });

  renderJobs();
  if(!bad) msg.innerHTML += '<div class="msg ok-msg">All checked. Look through the questions, then save.</div>';
}

// ----------------------------------------------------------------- saving ---

// The manifest is fetched once, every module is added to the copy in memory,
// and it is written once at the end. Writing it per module would mean each
// save racing the last one's commit.
async function saveAllJobs(){
  const btn = document.getElementById('rwSaveBtn');
  const statusEl = document.getElementById('rwStatus');
  function log(m){ statusEl.innerHTML += '<div>' + escapeHtml(m) + '</div>'; }

  statusEl.className = 'save-status';
  statusEl.innerHTML = '';
  btn.disabled = true;

  const todo = rwJobs.filter(j => j.result && j.result.keyOk && !j.saved);
  if(!todo.length){
    statusEl.className = 'save-status err';
    log('Nothing is ready to save. Press "Check them all" first.');
    btn.disabled = false;
    return;
  }

  try{
    const manifest = await fetchManifestForWrite(log);
    const planned = [];

    // Validate everything before writing anything, so a bad title on the last
    // file does not leave the first four already committed.
    for(const job of todo){
      const d = job.dest;
      const subject = manifest.find(s => s.id === d.subjectId);
      if(!subject) throw new Error(job.label + ': that subject is not in the manifest.');
      if(!/^\d{2}$/.test(d.no)) throw new Error(job.label + ': the number should be two digits, like 05.');
      if(!d.moduleId) throw new Error(job.label + ': give it an id.');
      if(!d.title) throw new Error(job.label + ': give it a title.');
      subject.modules = subject.modules || [];
      const path = 'data/' + subjectFolder(subject) + '/' + d.no + '.json';
      if(subject.modules.some(m => m.id === d.moduleId))
        throw new Error(job.label + ': the id "' + d.moduleId + '" is already used in ' + subject.name + '.');
      if(subject.modules.some(m => m.file === path) || planned.some(p => p.path === path))
        throw new Error(job.label + ': ' + path + ' is already taken. Change its number.');
      planned.push({ job, subject, path, entry: {
        id: d.moduleId, no: d.no, title: d.title,
        total: job.result.rows.length, file: path, format: 'json'
      }});
    }

    for(const p of planned){
      log('Writing ' + p.path + ' …');
      await callSave(p.path, JSON.stringify(p.job.result.rows, null, 2) + '\n',
        'Admin: add "' + p.entry.title + '" to ' + p.subject.id);
      p.subject.modules.push(p.entry);
      p.job.saved = true;
    }

    log('Adding ' + planned.length + ' module(s) to the list of subjects …');
    await callSave(MANIFEST_PATH, manifestToJson(manifest),
      'Admin: add ' + planned.length + ' reworked module(s)');
    rememberManifest(manifest);
    manifestSubjects = manifest;
    subjects = manifest;

    statusEl.className = 'save-status ok';
    log('Done. ' + planned.length + ' module(s) are live and will show up on the site.');
    renderJobs();
  }catch(err){
    statusEl.className = 'save-status err';
    log('Stopped: ' + err.message);
    log('Anything already written above is saved; the rest was not attempted.');
  }finally{
    btn.disabled = false;
  }
}

</script>
