<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standings — LEA Reviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 64px;
  }
  .wrap{width:100%; max-width:520px;}
  a{color:inherit;}
  button{font-family:inherit;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:8px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:28px; line-height:1; text-transform:uppercase; flex:1; }
  /* Rows, faces and dots come from assets/leaderboard.css, shared with the
     subject page's leaderboard modal. */
  .rv-face{
    width:44px; height:44px; margin:0 0 8px; border:1px solid color-mix(in srgb, var(--gold) 45%, transparent);
    background:var(--bg-panel-2); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--gold-bright); overflow:hidden;
  }
  .rv-side.them .rv-face{ margin-left:auto; }
  .rv-face img{ width:100%; height:100%; object-fit:cover; }

  .week-note{
    font-family:var(--font-body); font-size:13px; line-height:1.6; color:var(--muted);
    background:var(--bg-panel); border:1px solid var(--line); padding:12px 16px; margin-top:16px;
  }
  .rank-chip{ font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }

  /* 3g Closest rival: two standings either side of a VS. */
  .rival-vs{ position:relative; background:var(--bg-panel); border:1px solid var(--line); padding:16px; margin-bottom:16px; }
  .rv-kicker{ font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .rv-row{ display:flex; align-items:center; gap:12px; }
  .rv-side{ flex:1; min-width:0; }
  .rv-side.them{ text-align:right; }
  .rv-name{ font-family:var(--font-display); font-weight:700; font-size:20px; text-transform:uppercase; line-height:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv-mastered{ font-family:var(--font-body); font-weight:600; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--gold-bright); margin-top:6px; white-space:nowrap; }
  .rv-avg{ font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:3px; white-space:nowrap; }
  .rv-vs{ font-family:var(--font-display); font-weight:800; font-size:28px; color:var(--muted); flex-shrink:0; }
  .rv-note{ font-family:var(--font-hand); font-size:14px; color:var(--muted); margin-top:14px; line-height:1.5; }

  .tabs-row{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1; min-height:44px; font-family:var(--font-body); font-weight:600; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    padding:0 6px; border-radius:0; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{ border-color:var(--gold); color:var(--gold-bright); background:color-mix(in srgb, var(--gold) 8%, transparent); }

  .rival-card{
    position:relative; background:var(--bg-panel); border:1px solid var(--line); padding:20px; margin-bottom:18px;
  }
  .rival-card::before, .rival-card::after{ content:""; position:absolute; width:12px; height:12px; border:2px solid var(--gold); opacity:.9; }
  .rival-card::before{ top:-2px; left:-2px; border-width:2px 0 0 2px; }
  .rival-card::after{ bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
  .rival-names{ display:flex; justify-content:space-between; gap:12px; font-family:var(--font-body); font-weight:500; font-size:11px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .rival-names b{ color:var(--ink); }
  .rival-bar-track{ height:6px; border-radius:0; background:var(--bg-panel-2); overflow:hidden; display:flex; margin-bottom:10px; }
  .rival-bar-you{ background:var(--gold); height:100%; }
  .rival-bar-them{ background:var(--blue-bright); height:100%; }
  .rival-note{ font-family:var(--font-hand); font-size:16px; color:var(--ink); }


  .state-note{ font-family:var(--font-body); font-size:13px; color:var(--muted); text-align:center; padding:40px 0; line-height:1.6; }
  .theme-toggle{
    position:fixed; top:16px; right:16px; z-index:50;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--gold-bright);
    font-size:15px; width:34px; height:34px;
    border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
</style>
<link rel="stylesheet" href="assets/blueprint.css?v=63">
<link rel="stylesheet" href="assets/leaderboard.css?v=63">
<script src="assets/theme.js?v=63" data-alt-class="light-mode" data-default-is="dark"></script>
<script src="assets/nav.js?v=63"></script>
<script src="assets/avatar.js?v=63"></script>
<script src="assets/leaderboard.js?v=63"></script>
<script src="assets/offline.js?v=63"></script>
<script src="assets/presence.js?v=63"></script>

</head>
<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="index.html" title="Back" data-back>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title" data-vt="lea-standings" data-vt-peer="index.html">Standings</div>
    <div class="rank-chip" id="rankChip"></div>
  </div>

  <div class="tabs-row" id="tabsRow"></div>
  <div id="contentArea"><script>document.write(LEANav.skel('rows', 6))</script></div>
</div>

<script>
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let activeTab = 'overall';
let currentUsername = '';
let leaderboardData = null;

async function loadLeaderboard(){
  if(leaderboardData) return leaderboardData;
  const { data, error } = await sb.rpc('get_leaderboard');
  leaderboardData = (!error && data) ? data.slice().sort((a,b) => (b.total_mastered||0) - (a.total_mastered||0)) : [];
  return leaderboardData;
}

function renderTabs(){
  const tabs = [
    { key: 'overall', label: 'Overall' },
    { key: 'week', label: 'This week' },
    { key: 'rivals', label: 'Rivals' }
  ];
  document.getElementById('tabsRow').innerHTML = tabs.map(t =>
    '<button class="tab-btn' + (activeTab === t.key ? ' active' : '') + '" data-tab="' + t.key + '">' + t.label + '</button>'
  ).join('');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { if(activeTab === btn.dataset.tab) return; activeTab = btn.dataset.tab; render(true); });
  });
}

// Pictures keyed by display name, fetched once. Left empty when the column
// does not exist yet (see design_handoff_lea_reviewer/avatars-setup.sql), in
// which case every row simply shows initials.
let avatarByUsername = {};
function avatarFor(username){ return avatarByUsername[username] || null; }

async function loadAvatars(){
  avatarByUsername = await LEALeaderboard.loadAvatars(sb);
}

const onlineDot = (username) => LEALeaderboard.onlineDot(username);

// Row and podium markup lives in assets/leaderboard.js; each board only says
// which number it ranks by.
const masteredOverall = r => r.total_mastered || 0;
const masteredThisWeek = r => r.mastered || 0;

// One "floor": a row whose bar is sized against first place. On your own row
// the bar also marks where the person just above you is, and says how far.
function floorHtml(board, rank, value){
  const row = board[rank - 1], mine = row.username === currentUsername;
  const top = Math.max(1, value(board[0]));
  const bar = { value: value(row), pct: value(row) / top * 100 };
  if(mine && rank > 1){
    const ahead = board[rank - 2], gap = value(ahead) - value(row);
    bar.markPct = value(ahead) / top * 100;
    bar.note = gap > 0 ? gap.toLocaleString('en-US') + ' more to pass ' + ahead.username : 'Level with ' + ahead.username;
  }
  return LEALeaderboard.rowHtml(row, rank, { isMine: mine, avatars: avatarByUsername, bar });
}

// Podium for the top three, floors for 4–10, and your own floor pinned below
// when you're further down.
function boardHtml(board, value){
  const myIdx = board.findIndex(r => r.username === currentUsername);
  let html = LEALeaderboard.podiumHtml(board, { value, avatars: avatarByUsername, myUsername: currentUsername });
  const floors = [];
  for(let rank = 4; rank <= Math.min(10, board.length); rank++) floors.push(floorHtml(board, rank, value));
  if(floors.length) html += '<div class="lb-list lea-stagger">' + floors.join('') + '</div>';
  if(myIdx >= 10) html += LEALeaderboard.gapHtml() + '<div class="lb-list">' + floorHtml(board, myIdx + 1, value) + '</div>';
  return html;
}

async function renderOverall(){
  const area = document.getElementById('contentArea');
  const data = await loadLeaderboard();
  if(data.length === 0){
    area.innerHTML = '<div class="state-note">No scores yet — be the first!</div>';
    return;
  }
  const myIdx = data.findIndex(r => r.username === currentUsername);
  const chip = document.getElementById('rankChip');
  if(chip) chip.textContent = myIdx >= 0 ? ('You\u2019re #' + (myIdx + 1)) : '';
  area.innerHTML = boardHtml(data, masteredOverall);
}

// The frame's Closest rival card. Drawn from the same RPC rows as the list —
// username, total_mastered, avg_best_score — so it needs no new data. Returns
// '' when there is no rival to show rather than inventing one.
function rivalCardHtml(data, myIdx){
  if(myIdx <= 0) return '';
  const me = data[myIdx], rival = data[myIdx - 1];
  const gap = Math.max(0, (rival.total_mastered || 0) - (me.total_mastered || 0));
  // Daily Drill is a fixed 20 items, so "drills" is a real unit here rather
  // than an arbitrary one.
  // Whole drills: "about 1.9 drills" read like a measurement nobody can do.
  const drills = Math.max(1, Math.round(gap / 20));
  const side = (name, row) =>
    '<div class="rv-side' + (name === null ? ' them' : '') + '">' +
      '<div class="rv-face">' + LEAAvatar.faceHtml(avatarFor(row.username), row.username) + '</div>' +
      '<div class="rv-name">' + escapeHtml(name === null ? (row.username || '\u2014') : name) + '</div>' +
      '<div class="rv-mastered">' + (row.total_mastered || 0) + ' mastered</div>' +
      '<div class="rv-avg">' + Math.round((row.avg_best_score || 0) * 100) + '% avg</div>' +
    '</div>';
  return (
    '<div class="rival-vs">' +
      '<div class="rv-kicker">Closest rival</div>' +
      '<div class="rv-row">' + side('You', me) + '<div class="rv-vs">VS</div>' + side(null, rival) + '</div>' +
      (gap > 0
        ? '<div class="rv-note">' + gap + ' question' + (gap === 1 ? '' : 's') + ' behind. That\u2019s about ' + drills + ' drill' + (drills === 1 ? '' : 's') + '.</div>'
        : '<div class="rv-note">Level with them \u2014 next one puts you ahead.</div>') +
    '</div>'
  );
}

// Counted from mastery_events, which dates each question the first time it
// is mastered. Questions mastered before that table existed carry no date and
// never will, so the window genuinely starts when it was switched on — the
// footnote says so rather than letting a short first week read as a full one.
async function renderWeek(){
  const area = document.getElementById('contentArea');

  let payload = null, failed = false;
  try{
    const { data, error } = await sb.rpc('get_weekly_leaderboard', { p_days: 7 });
    if(error) failed = true; else payload = data;
  }catch(e){ failed = true; }

  if(failed || !payload){
    // Most likely this deployment has not run weekly-standings-setup.sql.
    // Say what is missing rather than showing an empty week as a result.
    area.innerHTML =
      '<div class="state-note">Weekly standings aren’t switched on for this database yet. ' +
      'Running <b>weekly-standings-setup.sql</b> starts the clock.</div>';
    return;
  }

  const rows = payload.rows || [];
  const since = payload.since ? new Date(payload.since) : null;
  const days = payload.window_days || 7;

  // How much of the window actually has data behind it.
  const sinceNote = (() => {
    if(!since) return '';
    const elapsedDays = Math.floor((Date.now() - since.getTime()) / 86400000);
    const stamp = since.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
    return elapsedDays >= days
      ? '<div class="week-note">Last ' + days + ' days.</div>'
      : '<div class="week-note">Counting from ' + stamp +
        ' — questions mastered before then carry no date, so this week is still filling up.</div>';
  })();

  if(rows.length === 0){
    area.innerHTML =
      '<div class="state-note">Nothing mastered in the last ' + days + ' days yet — ' +
      'be the first.</div>' + sinceNote;
    return;
  }

  const myIdx = rows.findIndex(r => r.username === currentUsername);
  const chip = document.getElementById('rankChip');
  if(chip) chip.textContent = myIdx >= 0 ? ('You’re #' + (myIdx + 1) + ' this week') : '';

  area.innerHTML = boardHtml(rows, masteredThisWeek) + sinceNote;
}

async function renderRivals(){
  const area = document.getElementById('contentArea');
  const data = await loadLeaderboard();
  if(data.length === 0){
    area.innerHTML = '<div class="state-note">No scores yet — be the first!</div>';
    return;
  }
  const myIdx = data.findIndex(r => r.username === currentUsername);
  if(myIdx === -1){
    area.innerHTML = '<div class="state-note">You’re not ranked yet — master a few questions and check back.</div>';
    return;
  }
  if(myIdx === 0){
    area.innerHTML = '<div class="state-note">You’re in first place. No one’s ahead of you to catch.</div>';
    return;
  }
  const chip = document.getElementById('rankChip');
  if(chip) chip.textContent = 'You’re #' + (myIdx + 1);   // not the weekly rank left over from the last tab
  const me = data[myIdx];
  const rival = data[myIdx - 1];
  const gap = Math.max(0, (rival.total_mastered||0) - (me.total_mastered||0));
  const drills = Math.max(1, Math.round(gap / 20)); // whole Daily Drills (20 items each)
  const total = Math.max(1, (me.total_mastered||0) + (rival.total_mastered||0));
  const myShare = Math.round(((me.total_mastered||0) / total) * 100);

  // Same card the Overall tab shows, rather than a second design for the
  // same comparison.
  area.innerHTML = rivalCardHtml(data, myIdx) +
    '<div class="lb-list lea-stagger">' + floorHtml(data, myIdx, masteredOverall) + floorHtml(data, myIdx + 1, masteredOverall) + '</div>';
}

// fromTab: a tab tap, so the new board fades up in place. Live presence
// updates redraw silently. The skeleton only shows before anything has loaded,
// never over a board already on screen.
async function render(fromTab){
  renderTabs();
  const area = document.getElementById('contentArea');
  if(!area.querySelector('.lb-podium, .lb-list, .state-note, .rival-vs')) area.innerHTML = LEANav.skel('rows', 6);
  if(activeTab === 'overall') await renderOverall();
  else if(activeTab === 'week') await renderWeek();
  else await renderRivals();
  if(fromTab && area.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    area.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
  }
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  let username = (session.user.email || '').split('@')[0];
  const { data: profile } = await sb.from('profiles').select('username').eq('id', session.user.id).single();
  if(profile && profile.username) username = profile.username;
  currentUsername = username;
  await loadAvatars();
  await render();
  // Re-render when people arrive or leave, so the dots stay true without a
  // refresh. render() rebuilds the active tab from data already in hand.
  if(window.LEAPresence){
    let firstCall = true;
    LEAPresence.subscribe(() => {
      if(firstCall){ firstCall = false; return; }
      render();
    });
  }
})();
</script>
</body>
</html>
