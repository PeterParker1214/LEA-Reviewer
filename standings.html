<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standings — LEA Reviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 64px;
  }
  .wrap{width:100%; max-width:520px;}
  a{color:inherit;}
  button{font-family:inherit;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:22px; text-transform:uppercase; }

  .tabs-row{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1; font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    padding:11px 6px; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{ border-color:var(--gold); color:var(--gold-bright); background:rgba(224,168,63,0.08); }

  .rival-card{
    position:relative; background:var(--bg-panel); border:1px solid var(--line); padding:20px; margin-bottom:18px;
  }
  .rival-card::before, .rival-card::after{ content:""; position:absolute; width:12px; height:12px; border:2px solid var(--gold); opacity:.9; }
  .rival-card::before{ top:-2px; left:-2px; border-width:2px 0 0 2px; }
  .rival-card::after{ bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
  .rival-names{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .rival-names b{ color:var(--ink); }
  .rival-bar-track{ height:10px; border-radius:5px; background:var(--bg-panel-2); overflow:hidden; display:flex; margin-bottom:10px; }
  .rival-bar-you{ background:var(--gold); height:100%; }
  .rival-bar-them{ background:var(--blue-bright); height:100%; }
  .rival-note{ font-family:var(--font-hand); font-size:16px; color:var(--ink); }

  .lb-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:4px; }
  .lb-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:10px; background:var(--bg-panel-2); border:1px solid var(--line); }
  .lb-row.top1{ background:rgba(224,168,63,0.1); border-color:var(--gold); }
  .lb-row.top1 .lb-rank{ font-family:var(--font-display); font-size:26px; color:var(--gold-bright); }
  .lb-row.top2 .lb-rank{ font-family:var(--font-display); font-size:22px; color:var(--ink); }
  .lb-row.top3 .lb-rank{ font-family:var(--font-display); font-size:22px; color:var(--gold); }
  .lb-row.mine{ border-color:var(--gold); background:rgba(224,168,63,0.12); }
  .lb-rank{ font-family:var(--font-mono); color:var(--muted); font-weight:700; width:30px; flex-shrink:0; }
  .lb-name{ flex:1; font-family:var(--font-body); font-size:14px; }
  .lb-stats{ font-family:var(--font-mono); font-size:11px; color:var(--muted); text-align:right; }

  .state-note{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:center; padding:40px 0; line-height:1.7; }
  .theme-toggle{
    position:fixed; top:16px; right:16px; z-index:50;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--gold-bright);
    font-size:15px; width:34px; height:34px;
    border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
</style>
<link rel="stylesheet" href="assets/blueprint.css?v=1">
<script src="assets/theme.js?v=1" data-alt-class="light-mode" data-default-is="dark"></script>
</head>
<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="index.html" title="Back home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title">Standings</div>
  </div>

  <div class="tabs-row" id="tabsRow"></div>
  <div id="contentArea"><div class="state-note">Loading…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let activeTab = 'overall';
let currentUsername = '';
let leaderboardData = null;

async function loadLeaderboard(){
  if(leaderboardData) return leaderboardData;
  const { data, error } = await sb.rpc('get_leaderboard');
  leaderboardData = (!error && data) ? data.slice().sort((a,b) => (b.total_mastered||0) - (a.total_mastered||0)) : [];
  return leaderboardData;
}

function renderTabs(){
  const tabs = [
    { key: 'overall', label: 'Overall' },
    { key: 'week', label: 'This week' },
    { key: 'rivals', label: 'Rivals' }
  ];
  document.getElementById('tabsRow').innerHTML = tabs.map(t =>
    '<button class="tab-btn' + (activeTab === t.key ? ' active' : '') + '" data-tab="' + t.key + '">' + t.label + '</button>'
  ).join('');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
}

function lbRowHtml(row, rank, isMine){
  const cls = 'lb-row' + (rank <= 3 ? ' top' + rank : '') + (isMine ? ' mine' : '');
  return (
    '<div class="' + cls + '">' +
      '<div class="lb-rank">' + rank + '</div>' +
      '<div class="lb-name">' + escapeHtml(row.username) + (isMine ? ' (you)' : '') + '</div>' +
      '<div class="lb-stats">' + (row.total_mastered||0) + ' mastered · ' + Math.round((row.avg_best_score||0)*100) + '% avg</div>' +
    '</div>'
  );
}

async function renderOverall(){
  const area = document.getElementById('contentArea');
  const data = await loadLeaderboard();
  if(data.length === 0){
    area.innerHTML = '<div class="state-note">No scores yet — be the first!</div>';
    return;
  }
  const myIdx = data.findIndex(r => r.username === currentUsername);
  const top10 = data.slice(0, 10);
  let html = '<div class="lb-list">' + top10.map((r, i) => lbRowHtml(r, i+1, i === myIdx)).join('') + '</div>';
  if(myIdx >= 10){
    html += '<div class="lb-list" style="margin-top:10px;">' + lbRowHtml(data[myIdx], myIdx+1, true) + '</div>';
  }
  area.innerHTML = html;
}

function renderWeek(){
  document.getElementById('contentArea').innerHTML =
    '<div class="state-note">Weekly standings need a time-windowed leaderboard query that doesn’t exist in the database yet — the current get_leaderboard() only returns all-time totals. This needs a backend change, not a page change.</div>';
}

async function renderRivals(){
  const area = document.getElementById('contentArea');
  const data = await loadLeaderboard();
  if(data.length === 0){
    area.innerHTML = '<div class="state-note">No scores yet — be the first!</div>';
    return;
  }
  const myIdx = data.findIndex(r => r.username === currentUsername);
  if(myIdx === -1){
    area.innerHTML = '<div class="state-note">You’re not ranked yet — master a few questions and check back.</div>';
    return;
  }
  if(myIdx === 0){
    area.innerHTML = '<div class="state-note">You’re in first place. No one’s ahead of you to catch.</div>';
    return;
  }
  const me = data[myIdx];
  const rival = data[myIdx - 1];
  const gap = Math.max(0, (rival.total_mastered||0) - (me.total_mastered||0));
  const drills = Math.round((gap / 20) * 10) / 10; // Daily Drill's fixed 20-item size, so this is a real unit, not an arbitrary one
  const total = Math.max(1, (me.total_mastered||0) + (rival.total_mastered||0));
  const myShare = Math.round(((me.total_mastered||0) / total) * 100);

  area.innerHTML =
    '<div class="rival-card">' +
      '<div class="rival-names"><span><b>You</b> · ' + (me.total_mastered||0) + '</span><span><b>' + escapeHtml(rival.username) + '</b> · ' + (rival.total_mastered||0) + '</span></div>' +
      '<div class="rival-bar-track"><div class="rival-bar-you" style="width:' + myShare + '%;"></div><div class="rival-bar-them" style="width:' + (100-myShare) + '%;"></div></div>' +
      '<div class="rival-note">' + gap + ' question' + (gap===1?'':'s') + ' behind. That’s about ' + drills + ' drill' + (drills===1?'':'s') + '.</div>' +
    '</div>' +
    '<div class="lb-list">' + lbRowHtml(rival, myIdx, false) + lbRowHtml(me, myIdx+1, true) + '</div>';
}

async function render(){
  renderTabs();
  const area = document.getElementById('contentArea');
  area.innerHTML = '<div class="state-note">Loading…</div>';
  if(activeTab === 'overall') await renderOverall();
  else if(activeTab === 'week') renderWeek();
  else await renderRivals();
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  let username = (session.user.email || '').split('@')[0];
  const { data: profile } = await sb.from('profiles').select('username').eq('id', session.user.id).single();
  if(profile && profile.username) username = profile.username;
  currentUsername = username;
  await render();
})();
</script>
</body>
</html>
