  .subtitle { color: #666; margin-bottom: 32px; }

    padding-bottom: 6px;
    margin-top: 40px;

  .question-text { font-weight: 600; margin-bottom: 12px; }

  .choice {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    background: #fafafa;
    cursor: pointer;
    font-size: 0.98rem;
  }
  .choice:hover:not(:disabled) { background: #eef2f7; }
  .choice:disabled { cursor: default; }
  .choice.correct { background: #e6f4ea; border-color: var(--correct); color: var(--correct); font-weight: 600; }
  .choice.incorrect { background: #fbe9e7; border-color: var(--incorrect); color: var(--incorrect); }
  .explanation {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    background: #f0f4f8;
    border-left: 3px solid var(--accent);
    font-style: italic;
    font-size: 0.94rem;
    border-radius: 0 6px 6px 0;
  }
  .explanation.show { display: block; }
  .source { font-style: normal; font-weight: 600; color: var(--accent); }
  #progress {
    position: sticky; top: 0; background: var(--bg);
    padding: 8px 0; font-size: 0.9rem; color: #555;
    border-bottom: 1px solid #ddd; z-index: 10;

const root = document.getElementById('quiz-root');
const progressEl = document.getElementById('progress');
let answered = 0;

function updateProgress() {
  progressEl.textContent = `${answered} / ${QUIZ_DATA.length} answered`;
}

let lastSubtopic = null;
QUIZ_DATA.forEach((q, qIndex) => {
  if (q.subtopic !== lastSubtopic) {
    const h = document.createElement('h2');
    h.className = 'subtopic-heading';
    h.textContent = q.subtopic;
    root.appendChild(h);
    lastSubtopic = q.subtopic;
  }

  const card = document.createElement('div');
  card.className = 'question-card';

  const qText = document.createElement('div');
  qText.className = 'question-text';
  qText.textContent = `${qIndex + 1}. ${q.question}`;
  card.appendChild(qText);

  if (q.image) {
    const img = document.createElement('img');
    img.src = q.image;
    img.className = 'question-image';
    img.alt = 'Figure for question ' + (qIndex + 1);
    card.appendChild(img);
  }

  const explanation = document.createElement('div');
  explanation.className = 'explanation';
  explanation.innerHTML = `${q.explanation} <span class="source">(${q.source})</span>`;

  q.choices.forEach((choiceText, cIndex) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', () => {
      const allBtns = card.querySelectorAll('.choice');
      allBtns.forEach(b => b.disabled = true);
      if (cIndex === q.correctIndex) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('incorrect');
        allBtns[q.correctIndex].classList.add('correct');
      }
      explanation.classList.add('show');
      answered++;
      updateProgress();
    });
    card.appendChild(btn);
  });

  card.appendChild(explanation);
  root.appendChild(card);
});

updateProgress();
</script>
