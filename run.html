<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run — LEA Reviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 14px 26px;
  }
  .wrap{width:100%; max-width:640px;}
  a{color:inherit;}
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* ===== header ===== */
  .run-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .icon-btn{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.flagged{ border-color:var(--gold); color:var(--gold); }
  .header-title{ text-align:center; flex:1; min-width:0; }
  .header-title .h-sub{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .header-title .h-main{ font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:uppercase; color:var(--ink); margin-top:2px; }

  /* ===== tick strip ===== */
  /* The frame gives every tick flex:1 so the strip spans the card, rather
     than a fixed 7px each that leaves a ragged tail and scrolls on long
     modules.

     One tick per question, always: the strip is read as a count of what is
     left as much as a progress bar, so a 40-item module has to show 40
     marks. Past roughly 28 they stop fitting at a 3px gap on a phone, so
     what gives is the gap and the border, never the number of ticks. The
     densest tier drops min-width to 0 so flex can hand out sub-pixel widths
     rather than overflow. */
  .tick-strip{ display:flex; align-items:center; gap:3px; margin-bottom:8px; overflow:hidden; }
  .tick{ flex:1; min-width:2px; height:7px; border-radius:1px; background:var(--bg-panel-2); border:1px solid var(--line); }
  .tick-strip.dense{ gap:2px; }
  .tick-strip.denser{ gap:1px; }
  .tick-strip.densest{ gap:0; }
  .tick-strip.dense .tick, .tick-strip.denser .tick, .tick-strip.densest .tick{
    min-width:1px; border-width:0; border-radius:0;
  }
  .tick-strip.densest .tick{ min-width:0; }
  /* Where you are. Marked by height rather than width or colour, because at
     the dense tiers a tick is one pixel wide and has no colour to spare. */
  .tick.current{ height:13px; box-shadow:0 0 0 1px var(--gold-bright); }
  .tick.correct{ background:var(--good); border-color:var(--good); }
  .tick.incorrect{ background:var(--bad); border-color:var(--bad); }
  .tick.skipped{ background:var(--blue-bright); border-color:var(--blue-bright); }
  .tick.flagged{ background:var(--gold); border-color:var(--gold); }
  .counts-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  /* Frame 2c colours each count by what it means — green right, red wrong,
     blue skipped, gold flagged — rather than one uniform ink. */
  .counts-text{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); letter-spacing:.03em; }
  .counts-text b{ color:var(--ink); }
  .counts-text .c-right{ color:var(--good); }
  .counts-text .c-wrong{ color:var(--bad); }
  .counts-text .c-skip{ color:var(--blue-bright); }
  .counts-text .c-flag{ color:var(--gold-bright); }
  .jump-chip{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--blue-bright);
    padding:6px 12px; border-radius:20px; cursor:pointer; flex-shrink:0;
  }
  .jump-chip:hover{ border-color:var(--blue-bright); }

  /* ===== blueprint card ===== */
  .bp-card{
    position:relative; background:var(--bg-panel); border:1px solid var(--line);
    padding:22px 20px 20px; margin-bottom:16px;
  }
  .bp-card::before, .bp-card::after{ content:""; position:absolute; width:12px; height:12px; border:2px solid var(--gold); opacity:.9; }
  .bp-card::before{ top:-2px; left:-2px; border-width:2px 0 0 2px; }
  .bp-card::after{ bottom:-2px; right:-2px; border-width:0 2px 2px 0; }
  .section-tag{
    display:inline-block; background:var(--gold); color:#1a1206; font-family:var(--font-mono);
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; border-radius:3px; margin-bottom:12px;
  }
  .clock-chip{
    display:inline-block; margin-left:8px; border:1px dashed var(--line); color:var(--muted);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:20px;
  }
  .qtext{ font-size:17px; font-weight:450; line-height:1.6; color:var(--ink); margin:0 0 14px; }
  /* Phone: the wrapper takes no part in layout, so text and figure stack
     exactly as they always did. Desktop re-forms it as a row. */
  .q-body{ display:contents; }
  /* Centred: figures are rarely the card's full width, and left-aligning
     them left a ragged gap beside every one. justify/align live on the class
     because the inline style only sets display. */
  .qimg-wrap{ margin-bottom:14px; display:none; position:relative; justify-content:center; align-items:center; }
  .qimg-wrap img{ max-width:100%; border-radius:8px; border:1px solid var(--line); display:block; cursor:zoom-in; }
  /* A figure is often the whole question — a truss, a load diagram, a plan.
     At 390px it is unreadable without opening it. */
  .qimg-hint{
    position:absolute; right:8px; bottom:8px; pointer-events:none;
    background:rgba(10,18,24,0.82); color:var(--gold-bright);
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:4px 7px; border-radius:5px; border:1px solid var(--line);
  }

  /* Full-screen figure viewer: pinch or wheel to zoom, drag to pan. */
  .imgview{
    position:fixed; inset:0; z-index:120; background:rgba(4,9,13,0.96);
    display:flex; align-items:center; justify-content:center; touch-action:none; overflow:hidden;
  }
  .imgview.hidden{ display:none; }
  .imgview img{
    max-width:100%; max-height:100%; user-select:none; -webkit-user-drag:none;
    transform-origin:center center; will-change:transform;
  }
  .imgview-bar{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; gap:10px; padding:12px 14px;
  }
  .imgview-bar .iv-note{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  }
  .imgview-bar button{
    width:44px; height:44px; border-radius:8px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--gold-bright); font-family:var(--font-mono); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .imgview-zoom{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    min-height:56px; text-align:left; padding:13px 16px; border-radius:10px;
    border:1.5px dashed var(--line); background:var(--bg-panel-2); color:var(--ink);
    font-family:var(--font-body); font-size:14.5px; line-height:1.4; cursor:pointer;
    display:flex; align-items:center; gap:10px; transition:border-color .12s ease;
  }
  .opt:hover:not(.locked){ border-style:solid; border-color:var(--blue-bright); }
  .opt .letter{ font-family:var(--font-mono); color:var(--blue-bright); flex-shrink:0; }
  .opt.locked{ cursor:default; }
  .opt.correct{ border-style:solid; border-color:var(--good); background:rgba(95,191,130,0.12); }
  .opt.correct::after{ content:"\2713"; margin-left:auto; color:var(--good); font-weight:700; }
  .opt.incorrect{ border-style:solid; border-color:var(--bad); background:rgba(226,96,74,0.12); }
  .opt.incorrect::after{ content:"\2715"; margin-left:auto; color:var(--bad); font-weight:700; }
  .opt.dim{ opacity:.6; }
  .opt.chosen-tag::after{ content:"Chosen"; margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--blue-bright); text-transform:uppercase; }
  /* Ungraded "chosen" state (exam mode, pre-submit) — a plain selection
     highlight, distinct from study mode's chosen-tag+incorrect combo which
     must keep its red styling untouched. */
  .opt.chosen-tag:not(.incorrect):not(.correct){ border-style:solid; border-color:var(--blue-bright); }
  .opt.chosen-tag:not(.incorrect):not(.correct) .letter{ color:var(--blue-bright); }

  /* ===== explanation panel ===== */
  .explain{ margin-top:16px; padding:14px 16px; border-left:3px solid var(--good); background:var(--bg-panel-2); border-radius:0 8px 8px 0; }
  .explain.wrong{ border-left-color:var(--bad); }
  .explain .verdict{ font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase; margin-bottom:6px; }
  .explain.right .verdict{ color:var(--good); }
  .explain.wrong .verdict{ color:var(--bad); }
  .explain .reason{ font-size:13.5px; line-height:1.6; color:var(--ink); margin-bottom:10px; }
  /* Frame 2c: label in blue, value in muted and NOT uppercased, the two
     separated by a 10px gap rather than a margin on the label. */
  .explain .meta-row{
    display:flex; gap:10px; align-items:flex-start;
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--blue-bright); margin-bottom:8px;
  }
  .explain .meta-row span{ flex:1; color:var(--muted); text-transform:none; letter-spacing:0; }
  .explain .steps-list{ margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--ink); line-height:1.7; }
  /* A figure that belongs to the explanation rather than the question — a
     worked solution or a marked-up detail, which would give the answer away
     if it were shown before the reader commits. Same zoom affordance as the
     question figure, since it is just as likely to be unreadable at 390px. */
  .explain .qimg-wrap{ display:flex; margin:0 0 10px; }
  .chip-row{ display:flex; gap:8px; margin-top:12px; }
  .chip-btn{
    flex:1; font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    padding:9px 6px; border-radius:8px; cursor:pointer; text-align:center;
  }
  .chip-btn:hover{ border-color:var(--gold); }
  .chip-btn.active{ border-color:var(--gold); color:var(--gold); background:rgba(224,168,63,0.1); }
  .note-box{ margin-top:10px; }
  .note-box textarea{
    width:100%; min-height:64px; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-family:var(--font-hand); font-size:14px; padding:10px 12px; resize:vertical;
  }
  .note-box .note-save{
    margin-top:6px; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--gold); color:#1a1206; border:none; padding:7px 14px; border-radius:6px; cursor:pointer;
  }

  /* ===== footer ===== */
  /* The action bar stays on screen, so answering a question no longer means
     scrolling back down to reach Next. Sticky rather than fixed: it still
     sits in the flow at the end of the page, so the desktop rail layout and
     the results screens need no change at all. The shadow is the page
     colour, which fades content out under the bar instead of cutting it. */
  .run-footer{
    display:flex; gap:10px;
    position:sticky; bottom:0; z-index:60;
    padding:12px 0 10px;
    background:var(--bg-deep);
    box-shadow:0 -12px 16px -8px var(--bg-deep);
  }
  .footer-btn{
    flex:1; height:52px; border-radius:12px; font-family:var(--font-mono); font-size:13px;
    text-transform:uppercase; letter-spacing:.04em; cursor:pointer; border:none;
  }
  .footer-btn.skip{ background:var(--bg-panel); border:1px solid var(--blue-bright); color:var(--blue-bright); }
  .footer-btn.next{ background:var(--gold); color:#1a1206; font-weight:700; }
  .footer-btn:disabled{ opacity:.4; cursor:default; }

  /* ===== bottom sheets ===== */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:200; }
  .sheet-overlay.hidden{ display:none; }
  .sheet{
    width:100%; max-width:640px; max-height:82vh; overflow-y:auto; background:var(--bg-panel);
    border-top:2px solid var(--gold); border-radius:16px 16px 0 0; padding:22px 20px 26px;
    box-shadow:0 -24px 60px rgba(0,0,0,0.5);
  }
  .sheet.report{ border-top-color:var(--bad); }
  .sheet h3{ font-family:var(--font-display); font-weight:700; font-size:20px; text-transform:uppercase; margin:0 0 14px; }
  .map-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .map-legend .lg-item{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  .map-legend .lg-dot{ width:9px; height:9px; border-radius:2px; }
  .map-grid{ display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin-bottom:16px; }
  .map-cell{
    aspect-ratio:1; border-radius:5px; background:var(--bg-panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; color:var(--muted); cursor:pointer;
  }
  .map-cell.correct{ background:var(--good); color:#0a1218; border-color:var(--good); }
  .map-cell.incorrect{ background:var(--bad); color:#0a1218; border-color:var(--bad); }
  .map-cell.skipped{ background:var(--blue-bright); color:#0a1218; border-color:var(--blue-bright); }
  .map-cell.flagged{ background:var(--gold); color:#1a1206; border-color:var(--gold); }
  .map-cell.current{ outline:2px solid var(--ink); outline-offset:1px; }
  .map-actions{ display:flex; flex-direction:column; gap:8px; }
  .map-action-btn{
    height:48px; border-radius:10px; font-family:var(--font-mono); font-size:12px; text-transform:uppercase;
    letter-spacing:.03em; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink); cursor:pointer;
  }
  .map-action-btn:disabled{ opacity:.4; cursor:default; }

  .report-reason{ display:flex; align-items:center; gap:10px; min-height:48px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); margin-bottom:8px; cursor:pointer; }
  .report-reason input{ accent-color:var(--bad); }
  .report-reason.selected{ border-color:var(--bad); background:rgba(226,96,74,0.08); }
  .report-comment{
    width:100%; min-height:70px; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-family:var(--font-hand); font-size:14px; padding:10px 12px; margin:8px 0 14px; resize:vertical;
  }
  .report-send{
    width:100%; height:48px; border-radius:10px; background:var(--bad); color:#fff; border:none;
    font-family:var(--font-mono); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; cursor:pointer;
  }
  .report-note{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-align:center; margin-top:10px; }
  .sheet-close{
    display:block; margin:14px auto 0; background:none; border:none; color:var(--muted);
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; cursor:pointer;
  }


  /* ===== 7b desktop (1120px) =====
     The Jump sheet disappears and the map lives permanently in a 300px rail.
     Below this width the rail renders nothing at all (renderRail bails), so
     the phone layout is exactly as it was. */
  .run-shell{ width:100%; display:flex; justify-content:center; }
  .run-rail{ display:none; }
  .kbd-hint{ display:none; }

  @media (min-width:1120px){
    .run-shell{ display:grid; grid-template-columns:1fr 300px; gap:28px;
      align-items:start; max-width:1120px; margin:0 auto; }
    .wrap{ max-width:none; }
    .run-rail{ display:block; position:sticky; top:24px; }

    /* The map is always open, so the Jump chip has nothing left to do. */
    #jumpChip{ display:none; }

    /* Frame 7b: options in two columns at a 10px gap, so their outer edges
       line up with the action bar below. Padding and size come from the
       shared layer's desktop block. */
    .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .opt{ margin:0; }

    /* The figure sits beside the question text rather than above it, which is
       what keeps the options on screen without scrolling. Both are wrapped in
       .q-body so they can share a row; the wrapper is display:contents on a
       phone, so the stacked order there is untouched. */
    .q-body{ display:flex; gap:26px; align-items:flex-start; margin-bottom:20px; }
    .q-body .qtext{ flex:1; min-width:0; margin:0; }
    .q-body .qimg-wrap{ width:252px; height:150px; flex-shrink:0; margin:0; }

    .kbd-hint{ display:block; text-align:center; font-family:var(--font-mono);
      font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
      color:var(--muted); margin-top:10px; }
  }

  /* Rail furniture */
  .rail-block{ background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .rail-head{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-bright); margin-bottom:10px; }
  /* A full module runs to 200+ questions, which would push "To resolve" and
     the module stat far below the fold. Cap the grid and let it scroll so the
     rail stays a rail. */
  .rail-map{ display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-bottom:12px;
    max-height:min(46vh, 340px); overflow-y:auto; padding-right:2px; }
  .rail-map .map-cell{ aspect-ratio:1; padding:0; font-size:9.5px; }

  /* ===== scrollbars =====
     The platform scrollbar is a light slab with a boxed track and arrow
     buttons; on a dark panel it reads as a sticker stuck to the page rather
     than part of it. This leaves just a thin thumb in the palette, quiet at
     rest and brightening on hover so it stays easy to grab.

     Chrome ignores ::-webkit-scrollbar entirely the moment scrollbar-width is
     set, so the standard properties sit behind @supports for Firefox, which
     is the engine with no webkit pseudo-elements. */
  .rail-map::-webkit-scrollbar,
  .sheet::-webkit-scrollbar{ width:8px; height:8px; }
  .rail-map::-webkit-scrollbar-track,
  .sheet::-webkit-scrollbar-track{ background:transparent; }
  .rail-map::-webkit-scrollbar-button,
  .sheet::-webkit-scrollbar-button{ display:none; width:0; height:0; }
  .rail-map::-webkit-scrollbar-thumb,
  .sheet::-webkit-scrollbar-thumb{ background:var(--muted); border-radius:4px; border:2px solid transparent; background-clip:content-box; }
  .rail-map::-webkit-scrollbar-thumb:hover,
  .sheet::-webkit-scrollbar-thumb:hover{ background:var(--blue-bright); background-clip:content-box; }
  @supports not selector(::-webkit-scrollbar){
    .rail-map, .sheet{ scrollbar-width:thin; scrollbar-color:var(--muted) transparent; }
  }

  .resolve-row{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; background:none; border:none; border-bottom:1px solid var(--line);
    color:var(--ink); font-family:var(--font-mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.03em; padding:9px 2px; cursor:pointer; }
  .resolve-row:last-of-type{ border-bottom:none; }
  .resolve-row:hover{ color:var(--gold-bright); }
  .resolve-row .rr-go{ color:var(--blue-bright); }
  .rail-more{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); padding:6px 2px; }
  .rail-stat-row{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin-bottom:8px; }

<script>
// ================= Auth =================
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUserId = null;

sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT') window.location.href = 'index.html';
});

(async function initApp(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  currentUserId = session.user.id;
  if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }
  await boot();
})();

// ================= Helpers =================
// The colour lives above every screen of the run rather than inside one,
// because the body is rebuilt from scratch for the question, the review and
// the results, and anything drawn inside a screen goes with it.
function showModuleColour(){
  const cls = moduleColourClass(MODULE);
  if(!cls) return;
  const strip = document.createElement('div');
  strip.className = 'mod-strip' + cls.replace(' mod-tinted', '');
  document.body.appendChild(strip);
}

/* An admin-set colour on a module, or nothing. Unknown names fall through to
 * nothing rather than to a default, so a typo in the manifest shows up as a
 * plain card instead of quietly colouring the wrong group. */
const MODULE_COLOURS = ['amber','orange','red','rose','violet','blue','teal','green'];
function moduleColourClass(mod){
  const c = mod && mod.color;
  return (c && MODULE_COLOURS.indexOf(c) !== -1) ? ' mod-tinted mod-c-' + c : '';
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function letter(i){ return String.fromCharCode(65 + i); }
// Subject names carry decorative emoji that the compact headers can't fit.
// Must consume skin-tone modifiers and ZWJ joiners too, or compound emoji
// leave stray glyphs behind. Mirrors the helper in index.html/subject.html.
function stripEmoji(str){ return String(str||'').replace(/[\p{Extended_Pictographic}\p{Emoji_Modifier}\u{200D}\u{FE0F}]+/gu,'').trim(); }

// Renders one option's display text — plain strings pass through; the
// templated {ref,tpl} option type (Building Laws' "Both A and B"-style
// answers) recomputes its letters from the *current* shuffled order, so it
// stays correct no matter how options are shuffled.
function optionText(item, origIdx, perm){
  const o = item.o[origIdx];
  if(typeof o === 'string') return o;
  const letters = o.ref.map(r => letter(perm.indexOf(r))).sort();
  const join = (arr, conj) => arr.length===1 ? arr[0] : arr.length===2 ? (arr[0]+' '+conj+' '+arr[1]) : (arr.slice(0,-1).join(', ')+', '+conj+' '+arr[arr.length-1]);
  if(o.tpl==='both') return 'Both ' + join(letters,'and');
  if(o.tpl==='both_true') return 'Both ' + join(letters,'and') + ' are true';
  if(o.tpl==='either') return 'Either ' + join(letters,'or');
  if(o.tpl==='only') return join(letters,'and') + ' only';
  return join(letters,'and');
}

// ================= Boot =================
let SUBJECT, MODULE, QUESTIONS, MODE;
let order = [];       // question indices, in play order
let pos = 0;           // current position in `order`
let frontier = 0;      // furthest position reached (answered OR skipped)
let answersLog = [];   // per position: {selected,isCorrect} | {skipped:true} | null
let optOrders = {};    // per position: shuffled option-index permutation
let flaggedSet = new Set();
let notes = {};
let reportTargetQIndex = null;
let reportTargetSubjectId = null;
let reportTargetModuleId = null;

// ---- Exam-mode state ----
const EXAM_MS_PER_ITEM = (5 * 60 * 60 * 1000) / 200; // 90s/item — the real 200-item/5h exam's pace, scaled to any module size
let examLengthChoice = null; // 'full' | 'sim50'
let examEndAt = 0;
let examSubmitted = false;
let examPrevBestPct = null;   // standing best %, captured before submit overwrites it

// How many questions in this module were already mastered when the attempt
// began. markMastered runs DURING an attempt, so by the results screen the
// earlier state is gone unless it is captured up front. A run-local value is
// enough because results follow the run in the same page session — except
// across a resume, where the page may have reloaded, so it also rides in the
// resume payload. Null means "never captured", which omits the line rather
// than reporting a wrong number.
let masteredAtStart = null;
// Counted one answer at a time, never by diffing stored totals across the
// run. The diff raced the sync: on a cold load the "before" read hit an empty
// local cache while the "after" read the full synced figure, so a 5-of-15 run
// once reported "+15 questions newly mastered". Asking whether THIS question
// was already mastered, at the moment it is answered, cannot drift.
// One place that decides what an explanation figure looks like, so the two
// card renderers cannot drift.
function explainImgHtml(item){
  if(!item || !item.nimg) return '';
  return '<div class="qimg-wrap"><img src="' + escapeHtml(item.nimg) +
         '" alt="Figure explaining the answer"><span class="qimg-hint">Tap to zoom</span></div>';
}

let newlyMasteredThisRun = 0;
function captureMasteredAtStart(){
  masteredAtStart = 0;          // a run is now in progress; the count is live
  newlyMasteredThisRun = 0;
}
function noteMastered(qIndex){
  const p = LEAProgress.load(SUBJECT.id, MODULE.id);
  if((p.mastered || []).indexOf(qIndex) === -1) newlyMasteredThisRun++;
}
function newlyMasteredCount(){
  return masteredAtStart === null ? null : newlyMasteredThisRun;
}
let examTimerHandle = null;

async function boot(){
  const params = new URLSearchParams(window.location.search);
  const subjectId = params.get('s');
  const moduleId = params.get('m');
  const drillParams = { topic: params.get('topic'), scope: params.get('scope'), q: params.get('q'), filter: params.get('filter') };
  MODE = params.get('mode') || 'study';
  const body = document.getElementById('pageBody');

  if(MODE !== 'study' && MODE !== 'exam' && MODE !== 'drill' && MODE !== 'daily-drill'){
    body.innerHTML = '<div class="state-card">' + escapeHtml(MODE) + ' isn’t a run mode this page knows.<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; Home</a></div>';
    return;
  }

  let subjects;
  try{
    const res = await fetch('data/subjects.json', { cache: 'no-cache' });
    subjects = await res.json();
  }catch(e){
    body.innerHTML = '<div class="state-card">Couldn’t load the subjects catalogue. Try reloading.</div>';
    return;
  }
  ALL_SUBJECTS = subjects;

  // Daily Drill, and Mock Exam / topic Drill launched without a specific
  // subject+module, all draw from multiple modules at once — see the
  // "Cross-subject" section below for why that's a genuinely different code
  // path from the rest of this function.
  const isMulti = MODE === 'daily-drill' || (!subjectId && !moduleId && (MODE === 'exam' || MODE === 'drill'));
  if(isMulti){
    await bootMulti(subjects, drillParams);
    return;
  }

  SUBJECT = subjects.find(s => s.id === subjectId);
  MODULE = SUBJECT && SUBJECT.modules.find(m => m.id === moduleId);
  if(!SUBJECT || !MODULE){
    body.innerHTML = '<div class="state-card">Unknown module.<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; All subjects</a></div>';
    return;
  }
  // Same reader as the cross-subject index, so a module behaves identically
  // whether you open it directly or meet it in a drill — and so mastered[]
  // indices mean the same thing on both paths. See assets/quiz-source.js.
  QUESTIONS = await LEAQuizSource.loadModuleQuestions(MODULE);
  if(!QUESTIONS){
    body.innerHTML = '<div class="state-card">Couldn’t load this module’s questions. Try reloading.</div>';
    return;
  }

  document.title = MODULE.title + ' — LEA Reviewer';
  showModuleColour();

  const p = LEAProgress.load(SUBJECT.id, MODULE.id);
  flaggedSet = new Set(p.flagged || []);
  notes = Object.assign({}, p.notes || {});

  if(MODE === 'study'){
    // Hidden questions (admin's "Hide this question", engine-spec §4) keep
    // their slot forever — mastered[] indices must never shift — they just
    // stop being served.
    order = QUESTIONS.map((_, i) => i).filter(i => !QUESTIONS[i].hidden);
    answersLog = new Array(order.length).fill(null);
    pos = 0; frontier = 0;
    captureMasteredAtStart();
    tryResume();
  } else if(MODE === 'exam'){
    tryResumeExam();
  } else if(MODE === 'drill'){
    // Not the cross-subject SRS system (that's the separate Daily Drill,
    // §6) — this pulls whatever in *this module* isn't mastered yet, plus
    // anything flagged, and runs it exactly like study mode (immediate
    // feedback, no clock). See engine-spec.md §5.1.
    const masteredSet = new Set(p.mastered || []);
    order = QUESTIONS.map((_, i) => i).filter(i => !QUESTIONS[i].hidden && (!masteredSet.has(i) || flaggedSet.has(i)));
    if(order.length === 0){
      body.innerHTML = '<div class="state-card">Nothing to drill here — every question in this module is mastered and nothing’s flagged.<br><br><a href="subject.html?s=' + encodeURIComponent(subjectId) + '" style="color:var(--gold-bright);">&larr; Back to subject</a></div>';
      return;
    }
    answersLog = new Array(order.length).fill(null);
    pos = 0; frontier = 0;
    captureMasteredAtStart();
    tryResume();
  }
}

// Resume attempts are namespaced by mode too, not just subject+module —
// otherwise a study attempt and an exam attempt on the same module would
// clobber each other's saved slot (LEAResume's own key is subject+module
// only). Passing this composite in place of a bare moduleId keeps that fix
// entirely inside run.html, no change to quiz-resume.js needed.
function resumeKey(){ return MODULE.id + '__' + MODE; }

// Mirrors LEAResume's own "is there something worth prompting about" check,
// so we know synchronously whether to expect its onResume/onStartOver
// callback (and skip the immediate render) or render right away (and not
// wait for a callback that will never come).
function tryResume(){
  const rec = LEAResume.load(SUBJECT.id, resumeKey());
  const hasUnfinished = rec && rec.total && rec.answeredCount > 0 && rec.answeredCount < rec.total;
  if(!hasUnfinished){
    renderRun();
    return;
  }
  LEAResume.promptIfUnfinished(SUBJECT.id, resumeKey(), {
    onResume: (payload) => {
      if(payload && Array.isArray(payload.answersLog)){
        answersLog = payload.answersLog;
        frontier = payload.frontier || 0;
        pos = Math.min(payload.pos || 0, order.length - 1);
        if(Array.isArray(payload.flagged)) flaggedSet = new Set(payload.flagged);
        // Prefer the figure from when the attempt actually began. Re-capturing
        // here would count everything mastered before the reload as new, which
        // is the opposite of the truth.
        if(typeof payload.masteredAtStart === 'number') masteredAtStart = payload.masteredAtStart;
      }
      renderRun();
    },
    onStartOver: () => { renderRun(); }
  });
}

function saveResumeState(){
  const answeredCount = answersLog.filter(a => a && !a.skipped).length;
  LEAResume.save(SUBJECT.id, resumeKey(), {
    answeredCount, total: order.length, position: pos + 1,
    payload: { answersLog, frontier, pos, flagged: Array.from(flaggedSet), masteredAtStart }
  });
}

// ================= Exam mode =================
function tryResumeExam(){
  const rec = LEAResume.load(SUBJECT.id, resumeKey());
  const hasUnfinished = rec && rec.payload && rec.payload.examEndAt && Array.isArray(rec.payload.order);
  if(!hasUnfinished){
    renderExamStart();
    return;
  }
  if(Date.now() >= rec.payload.examEndAt){
    // Clock ran out while away — restore what was answered and grade it now.
    order = rec.payload.order;
    answersLog = rec.payload.answersLog;
    if(Array.isArray(rec.payload.flagged)) flaggedSet = new Set(rec.payload.flagged);
    if(typeof rec.payload.masteredAtStart === 'number') masteredAtStart = rec.payload.masteredAtStart;
    examEndAt = rec.payload.examEndAt;
    submitExam(true);
    return;
  }
  LEAResume.promptIfUnfinished(SUBJECT.id, resumeKey(), {
    onResume: (payload) => {
      order = payload.order;
      answersLog = payload.answersLog;
      pos = Math.min(payload.pos || 0, order.length - 1);
      frontier = order.length - 1;
      if(Array.isArray(payload.flagged)) flaggedSet = new Set(payload.flagged);
      examEndAt = payload.examEndAt;
      examLengthChoice = payload.examLengthChoice;
      if(typeof payload.masteredAtStart === 'number') masteredAtStart = payload.masteredAtStart;
      examSubmitted = false;
      startExamTimer();
      renderExamRun();
    },
    onStartOver: () => { renderExamStart(); }
  });
}

function saveExamResumeState(){
  const answeredCount = answersLog.filter(a => a && a.selected != null && a.selected !== -1).length;
  LEAResume.save(SUBJECT.id, resumeKey(), {
    answeredCount, total: order.length, position: pos + 1,
    payload: { order, answersLog, pos, flagged: Array.from(flaggedSet), examEndAt, examLengthChoice, masteredAtStart }
  });
}

function visibleQIndexes(){
  return QUESTIONS.map((_, i) => i).filter(i => !QUESTIONS[i].hidden);
}

function renderExamStart(){
  const body = document.getElementById('pageBody');
  const visibleCount = visibleQIndexes().length;
  const fullMs = visibleCount * EXAM_MS_PER_ITEM;
  const simCount = Math.min(50, visibleCount);
  const simMs = simCount * EXAM_MS_PER_ITEM;
  body.innerHTML =
    '<div class="run-header">' +
      '<button class="icon-btn" id="backBtn" title="Back to subject">' + svgArrowLeft() + '</button>' +
      '<div class="header-title"><div class="h-sub">' + escapeHtml(stripEmoji(SUBJECT.name)) + ' · Module ' + escapeHtml(MODULE.no) + '</div><div class="h-main">Mock exam</div></div>' +
      '<div style="width:44px;flex-shrink:0;"></div>' +
    '</div>' +
    '<div class="bp-card">' +
      '<span class="section-tag">' + escapeHtml(MODULE.title) + '</span>' +
      '<p class="qtext" style="font-size:15px;">One global clock. No feedback until you submit — everything gets reviewed at the end.</p>' +
      '<div class="options">' +
        '<button class="opt" id="startFullBtn" style="min-height:64px;">' +
          '<span style="display:flex;flex-direction:column;gap:3px;"><b>Full exam — ' + visibleCount + ' items</b><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);">' + formatDuration(fullMs) + '</span></span>' +
        '</button>' +
        '<button class="opt" id="startSimBtn" style="min-height:64px;">' +
          '<span style="display:flex;flex-direction:column;gap:3px;"><b>' + simCount + '-item sim</b><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);">' + formatDuration(simMs) + '</span></span>' +
        '</button>' +
      '</div>' +
    '</div>';
  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'subject.html?s=' + encodeURIComponent(SUBJECT.id); });
  document.getElementById('startFullBtn').addEventListener('click', () => startExam('full'));
  document.getElementById('startSimBtn').addEventListener('click', () => startExam('sim50'));
}

function startExam(choice){
  captureMasteredAtStart();
  examLengthChoice = choice;
  let idxs = visibleQIndexes();
  if(choice === 'sim50' && idxs.length > 50){
    for(let i = idxs.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [idxs[i], idxs[j]] = [idxs[j], idxs[i]]; }
    idxs = idxs.slice(0, 50);
  }
  order = idxs;
  answersLog = new Array(order.length).fill(null);
  optOrders = {};
  pos = 0;
  frontier = order.length - 1; // exam navigation is free — no per-question gating
  examSubmitted = false;
  examEndAt = Date.now() + Math.round(order.length * EXAM_MS_PER_ITEM);
  saveExamResumeState();
  startExamTimer();
  renderExamRun();
}

function startExamTimer(){
  stopExamTimer();
  examTimerHandle = setInterval(() => {
    const remaining = examEndAt - Date.now();
    const pill = document.getElementById('examTimerPill');
    if(pill) pill.textContent = formatDuration(remaining);
    if(remaining <= 0) submitExam(true);
  }, 1000);
}
function stopExamTimer(){
  if(examTimerHandle){ clearInterval(examTimerHandle); examTimerHandle = null; }
}

function renderExamRun(){
  const body = document.getElementById('pageBody');
  if(examSubmitted){
    body.innerHTML = renderHeader() + renderTickStrip() + renderCountsRow() + '<div id="cardSlot"></div>' + renderFooter();
    renderCard();
    wireHeader();
    wireFooter();
    return;
  }
  body.innerHTML = renderHeader() + examStatusBar() + '<div id="cardSlot"></div>' + examFooterHtml();
  renderExamCardUngraded();
  wireHeader();
  wireExamFooter();
  renderRail();
}

function examStatusBar(){
  const remaining = examEndAt - Date.now();
  const pct = order.length > 0 ? Math.round(((pos + 1) / order.length) * 100) : 0;
  const answeredCount = answersLog.filter(a => a && a.selected != null && a.selected !== -1).length;
  return (
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;flex-wrap:wrap;">' +
      '<span class="exam-timer" id="examTimerPill">' + formatDuration(remaining) + '</span>' +
      '<div class="counts-text" style="white-space:nowrap;">' + answeredCount + ' answered · ' + flaggedSet.size + ' flagged · ' + (order.length - answeredCount) + ' left</div>' +
    '</div>' +
    // Frame 3c shows no progress bar during an exam — the clock is the only
    // pacing signal it gives, and that reads as deliberate rather than omitted.
    '<div class="clock-chip blue" style="display:block;text-align:center;margin-bottom:14px;padding:7px 10px;">No feedback until you submit</div>'
  );
}

function renderExamCardUngraded(){
  const slot = document.getElementById('cardSlot');
  const item = QUESTIONS[order[pos]];
  const logged = answersLog[pos];
  const perm = getOptOrder(pos);

  let optsHtml = '';
  perm.forEach((origIdx, displayI) => {
    const text = optionText(item, origIdx, perm);
    let cls = 'opt';
    if(logged && logged.selected === origIdx) cls += ' chosen-tag';
    const markup = '<span class="letter">' + letter(displayI) + '.</span><span>' + escapeHtml(text) + '</span>';
    optsHtml += '<button class="' + cls + '" data-idx="' + origIdx + '">' + markup + '</button>';
  });

  let imgHtml = '';
  if(item.img){ imgHtml = '<div class="qimg-wrap" style="display:flex;"><img src="' + escapeHtml(item.img) + '" alt="Figure for this question"><span class="qimg-hint">Tap to zoom</span></div>'; }

  slot.innerHTML =
    '<div class="bp-card">' +
      sectionTagHtml(item) +
      '<div class="q-body"><p class="qtext">' + escapeHtml(item.q) + '</p>' + imgHtml + '</div>' +
      '<div class="options">' + optsHtml + '</div>' +
    '</div>';

  slot.querySelectorAll('.opt[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => selectExamAnswer(parseInt(btn.getAttribute('data-idx'), 10)));
  });
  if(window.LEAEtymology) LEAEtymology.decorate(slot, SUBJECT && SUBJECT.id);
}

function selectExamAnswer(origIdx){
  answersLog[pos] = { selected: origIdx };
  saveExamResumeState();
  renderExamRun();
}

function examFooterHtml(){
  const isLast = pos === order.length - 1;
  const isFlagged = flaggedSet.has(order[pos]);
  return (
    '<div class="run-footer">' +
      '<button class="footer-btn skip" id="examFlagBtn">' + (isFlagged ? 'Unflag' : 'Flag') + '</button>' +
      '<button class="footer-btn next" id="examNextBtn">' + (isLast ? 'Review & submit →' : 'Next question →') + '</button>' +
    '</div>' +
    '<div class="kbd-hint">Keys 1-4 to answer · Enter for next</div>' +
    '<button class="sheet-close" id="examSubmitEarlyBtn" style="display:block;width:100%;margin-top:12px;">Submit exam early</button>'
  );
}

function wireExamFooter(){
  document.getElementById('examFlagBtn').addEventListener('click', toggleFlag);
  document.getElementById('examNextBtn').addEventListener('click', () => {
    const isLast = pos === order.length - 1;
    if(isLast){ submitExam(false); return; }
    pos++; saveExamResumeState(); renderExamRun();
  });
  document.getElementById('examSubmitEarlyBtn').addEventListener('click', async () => {
    if(await LEAConfirm('Submit the exam now? You can still review every question afterward.', { yes: 'Submit exam' })) submitExam(false);
  });
}

function submitExam(auto){
  if(examSubmitted) return;
  examSubmitted = true;
  stopExamTimer();
  answersLog = answersLog.map((a, p) => {
    const item = QUESTIONS[order[p]];
    const selected = (a && a.selected != null) ? a.selected : -1;
    const isCorrect = selected !== -1 && selected === item.c;
    if(isCorrect){ noteMastered(order[p]); LEAProgress.markMastered(SUBJECT.id, MODULE.id, order[p]); }
    // Blanks still score as misses, but review mode must be able to tell
    // "I answered and got it wrong" from "I ran out of time and never saw
    // this" — without the flag both paint the same red in the counts row,
    // tick strip, and question map.
    return selected === -1 ? { selected, isCorrect, skipped: true } : { selected, isCorrect };
  });
  const correct = answersLog.filter(a => a.isCorrect).length;
  // Read the standing best BEFORE recordRunScore replaces it, or the results
  // screen has nothing to compare this attempt against.
  examPrevBestPct = previousBestPct(order.length);
  LEAProgress.recordRunScore(SUBJECT.id, MODULE.id, correct, order.length);
  LEAResume.clear(SUBJECT.id, resumeKey());
  frontier = order.length - 1;
  pos = 0;
  showExamResults(auto);
}


// ================= 2d Results =================
// Built only from data that exists. Three elements the frame draws are left
// out rather than stubbed:
//   - "Queue for tomorrow" is an SRS action and there are no SRS boxes.
//   - "synced" is cut: pushRemote() is fire-and-forget, so the UI cannot know
//     it succeeded, and a false reassurance about data safety is the worst
//     kind of invented element. "Saved" alone is verifiable — the local
//     write is synchronous — so that is all it claims.
// The drill action also carries no time estimate: the only pace constant in
// the app is EXAM_MS_PER_ITEM (90s, the real exam's pace), which is not drill
// pace, and inventing a drill constant to fill the line would be a made-up
// number on a screen about the reader's own performance.

// The standing best, read BEFORE recordRunScore overwrites it. Null when
// there is nothing to compare against, so a first attempt claims nothing.
// Only comparable when the earlier best was over the same number of
// questions. 80% on a 50-item sim against 71% on a 128-item full exam is not
// a comparison, and the reader is exactly the person who would notice. When
// the lengths differ we withhold the line rather than normalise or caveat it.
//
// FOLLOW-UP: if this suppresses the line too often to be useful, the fix is
// keying best scores by mode and length so a 50-item sim keeps its own best.
// That is a schema change and is deliberately not done here.
function previousBestPct(runTotal){
  const p = LEAProgress.load(SUBJECT.id, MODULE.id);
  if(!p || !p.bestTotal || !(p.attempts > 0)) return null;
  if(p.bestTotal !== runTotal) return null;
  return Math.round((p.bestCorrect / p.bestTotal) * 100);
}

// Per-topic split of this run, from q.s — present on every question in every
// module, so this needs no new data.
function resultsByTopic(){
  const byTopic = {};
  answersLog.forEach((a, p) => {
    if(!a || a.skipped) return;
    const item = QUESTIONS[order[p]];
    const topic = ((item && item.s) || '').trim() || 'Untagged';
    const t = byTopic[topic] || (byTopic[topic] = { right: 0, total: 0 });
    t.total++;
    if(a.isCorrect) t.right++;
  });
  return Object.keys(byTopic).map(name => {
    const t = byTopic[name];
    return { name: name, right: t.right, total: t.total, pct: Math.round((t.right / t.total) * 100) };
  }).sort((a, b) => a.pct - b.pct);
}

// The questions you got wrong, with what you picked beside what was right.
//
// Option order is shuffled per attempt, so the letter you saw ("C") is not
// the letter in the source. Printing one would be a claim about your own
// answer that is wrong most of the time, so the option text stands alone.
function resultsMistakes(){
  const out = [];
  answersLog.forEach((a, p) => {
    if(!a) return;
    if(!a.skipped && a.isCorrect) return;
    const item = QUESTIONS[order[p]];
    if(!item) return;
    out.push({
      topic: ((item.s || '') + '').trim(),
      q: item.q || '',
      you: a.skipped ? null : (item.o || [])[a.selected],
      answer: (item.o || [])[item.c],
      why: item.n || ''
    });
  });
  return out;
}

const MISTAKES_SHOWN = 5;

function renderResultsCard(opts){
  const correct = opts.correct, total = opts.total, missed = opts.missed;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const prev = opts.prevBestPct;

  let bestLine;
  if(prev === null)      bestLine = '<div class="res-best muted">' + pct + '%</div>';
  else if(pct > prev)    bestLine = '<div class="res-best">' + pct + '% \u2014 your best yet<span>, was ' + prev + '%</span></div>';
  else if(pct === prev)  bestLine = '<div class="res-best">' + pct + '% \u2014 matches your best</div>';
  else                   bestLine = '<div class="res-best muted">' + pct + '%<span> \u00b7 your best is ' + prev + '%</span></div>';

  // Absent, not zero, when the attempt began without a capture.
  const newly = opts.newlyMastered;
  const newlyRow = (newly === null || newly === undefined) ? ''
    : '<div class="res-rule"></div>' +
      '<div class="res-newly-row"><b>+' + newly + '</b>' +
        '<span>question' + (newly === 1 ? '' : 's') + ' newly mastered</span></div>';

  // One segment per question, right first then missed - the frame groups them
  // rather than showing them in the order they were answered.
  const segs = total > 0
    ? '<div class="res-segs">' +
        new Array(correct).fill('<i class="ok"></i>').join('') +
        new Array(Math.max(0, total - correct)).fill('<i class="no"></i>').join('') +
      '</div>'
    : '';

  const topicRows = resultsByTopic().map(t =>
    '<div class="res-topic">' +
      '<span class="rt-name">' + escapeHtml(t.name) + '</span>' +
      '<span class="rt-bar"><span style="width:' + t.pct + '%;background:' +
        (t.pct >= 100 ? 'var(--good)' : t.pct >= 70 ? 'var(--gold)' : 'var(--bad)') + ';"></span></span>' +
      '<span class="rt-frac' + (t.right === t.total ? ' full' : '') + '">' + t.right + '/' + t.total + '</span>' +
    '</div>').join('');

  const misses = resultsMistakes();
  const missHtml = misses.slice(0, MISTAKES_SHOWN).map(m =>
    '<div class="miss-card">' +
      (m.topic ? '<div class="miss-head"><span>' + escapeHtml(m.topic) + '</span></div>' : '') +
      '<div class="miss-q">' + escapeHtml(m.q) + '</div>' +
      (m.you ? '<div class="miss-you">You: ' + escapeHtml(m.you) + '</div>'
             : '<div class="miss-you">Skipped</div>') +
      (m.answer ? '<div class="miss-ans">Answer: ' + escapeHtml(m.answer) + '</div>' : '') +
      (m.why ? '<div class="miss-why">' + escapeHtml(m.why) + '</div>' : '') +
    '</div>').join('');
  const missTail = misses.length > MISTAKES_SHOWN
    ? '<div class="miss-more">' + misses.length + ' missed \u00b7 showing the first ' + MISTAKES_SHOWN + '</div>'
    : '';

  const subjName = SUBJECT ? stripEmoji(SUBJECT.name) : 'Back';
  const subjId = SUBJECT ? SUBJECT.id : '';

  return (
    '<div class="res-topbar">' +
      '<a class="res-back" href="subject.html?s=' + encodeURIComponent(subjId) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
        escapeHtml(subjName) +
      '</a>' +
      '<div class="res-saved">\u2713 Saved</div>' +
    '</div>' +
    '<div class="bp-card results-card">' +
      '<div class="res-kicker">' + escapeHtml(opts.kicker) + '</div>' +
      (opts.auto ? '<div class="counts-text" style="color:var(--bad);margin:10px 0;">Time\u2019s up \u2014 submitted automatically.</div>' : '') +
      '<div class="results-score">' + correct + '<span> / ' + total + '</span></div>' +
      bestLine +
      segs +
      '<div class="res-counts">' +
        '<span><b class="n-ok">' + correct + '</b> right</span>' +
        '<span><b class="n-no">' + missed + '</b> to revisit</span>' +
      '</div>' +
      newlyRow +
    '</div>' +
    (missed > 0
      ? '<button class="res-primary" id="drillMissesBtn"><span class="rp-title">Drill the ' + missed + ' now</span><span class="rp-go">\u2192</span></button>'
      : '<div class="res-clean">Nothing to revisit \u2014 every item correct.</div>') +
    '<div class="res-secondary">' +
      '<button class="res-alt" id="retakeTimedBtn">Retake timed</button>' +
      '<button class="res-alt" id="backToSubjectBtn">Back to subject</button>' +
    '</div>' +
    (topicRows ? '<div class="res-sec-head">By topic</div><div class="res-topics">' + topicRows + '</div>' : '') +
    (missHtml ? '<div class="res-sec-head">What you missed</div>' + missHtml + missTail : '')
  );
}

function wireResultsCard(onDrill){
  const drill = document.getElementById('drillMissesBtn');
  if(drill) drill.addEventListener('click', onDrill);
  const retake = document.getElementById('retakeTimedBtn');
  if(retake) retake.addEventListener('click', () => {
    window.location.href = 'run.html?s=' + encodeURIComponent(SUBJECT.id) + '&m=' + encodeURIComponent(MODULE.id) + '&mode=exam';
  });
  document.getElementById('backToSubjectBtn').addEventListener('click', () => {
    window.location.href = 'subject.html?s=' + encodeURIComponent(SUBJECT.id);
  });
}

function showExamResults(auto){
  const body = document.getElementById('pageBody');
  const correct = answersLog.filter(a => a.isCorrect).length;
  body.innerHTML = renderResultsCard({
    kicker: MODULE.title + ' \u00b7 Mock exam',
    correct: correct, total: order.length, missed: order.length - correct,
    prevBestPct: examPrevBestPct, newlyMastered: newlyMasteredCount(), auto: auto
  });
  wireResultsCard(() => {
    const firstMiss = answersLog.findIndex(a => a && !a.isCorrect);
    pos = firstMiss === -1 ? 0 : firstMiss;
    renderRun();
  });
}

function persistFlags(){
  const p = LEAProgress.load(SUBJECT.id, MODULE.id);
  p.flagged = Array.from(flaggedSet);
  p.notes = notes;
  LEAProgress.save(SUBJECT.id, MODULE.id, p);
}

function getOptOrder(p, itemOverride){
  if(!optOrders[p]){
    const item = itemOverride || QUESTIONS[order[p]];
    const idxs = item.o.map((_, i) => i);
    for(let i = idxs.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    optOrders[p] = idxs;
  }
  return optOrders[p];
}

// visit-state for a position: 'unvisited' | 'correct' | 'incorrect' | 'skipped'
function stateAt(p){
  const a = answersLog[p];
  if(!a) return 'unvisited';
  if(a.skipped) return 'skipped';
  return a.isCorrect ? 'correct' : 'incorrect';
}

function tickClass(p){
  const qIndex = order[p];
  if(flaggedSet.has(qIndex)) return 'flagged';
  const st = stateAt(p);
  return st === 'unvisited' ? '' : st;
}

// ================= Render: run screen =================
function renderRun(){
  const body = document.getElementById('pageBody');
  body.innerHTML =
    renderHeader() +
    renderTickStrip() +
    renderCountsRow() +
    '<div id="cardSlot"></div>' +
    renderFooter();
  renderCard();
  wireHeader();
  wireFooter();
  renderRail();
}

function renderHeader(){
  const qIndex = order[pos];
  const isFlagged = flaggedSet.has(qIndex);
  return (
    '<div class="run-header">' +
      '<button class="icon-btn" id="backBtn" title="Back to subject">' + svgArrowLeft() + '</button>' +
      '<div class="header-title">' +
        '<div class="h-sub">' + escapeHtml(stripEmoji(SUBJECT.name)) + ' · Module ' + escapeHtml(MODULE.no) + '</div>' +
        '<div class="h-main">Question ' + (pos+1) + ' / ' + order.length + '</div>' +
      '</div>' +
      '<button class="icon-btn' + (isFlagged ? ' flagged' : '') + '" id="flagBtn" title="Flag this question">' + svgFlag() + '</button>' +
      '<button class="icon-btn" id="moreBtn" title="Report a problem with this question">' + svgMore() + '</button>' +
    '</div>'
  );
}

// How tightly the strip has to pack to fit a phone's ~332px of card width.
// The thresholds are the counts at which the previous tier stops fitting.
function stripDensity(n){
  return n <= 28 ? '' : n <= 60 ? ' dense' : n <= 110 ? ' denser' : ' densest';
}

function renderTickStrip(){
  let ticks = '';
  for(let p = 0; p < order.length; p++){
    ticks += '<div class="tick ' + tickClass(p) + (p === pos ? ' current' : '') +
             '" title="Question ' + (p+1) + '"></div>';
  }
  return '<div class="tick-strip' + stripDensity(order.length) + '">' + ticks + '</div>';
}

function renderCountsRow(){
  let correct=0, incorrect=0, skipped=0;
  answersLog.forEach(a => { if(a){ if(a.skipped) skipped++; else if(a.isCorrect) correct++; else incorrect++; } });
  return (
    '<div class="counts-row">' +
      '<div class="counts-text">' + '<span class="c-right">' + correct + ' right</span> · ' + '<span class="c-wrong">' + incorrect + ' wrong</span> · ' + '<span class="c-skip">' + skipped + ' skipped</span> · ' + '<span class="c-flag">' + flaggedSet.size + ' flagged</span>' + '</div>' +
      '<button class="jump-chip" id="jumpChip">⊞ Jump</button>' +
    '</div>'
  );
}

function renderFooter(){
  const st = stateAt(pos);
  const resolved = st !== 'unvisited';
  const isLast = pos === order.length - 1;
  const canGoNext = resolved && (pos < frontier || isLast);
  const showSkip = !resolved;
  return (
    '<div class="run-footer">' +
      (showSkip ? '<button class="footer-btn skip" id="skipBtn">Skip</button>' : '') +
      '<button class="footer-btn next" id="nextBtn"' + (canGoNext ? '' : ' disabled') + '>' + (isLast && resolved ? 'See results →' : 'Next question →') + '</button>' +
    '</div>' +
    '<div class="kbd-hint">Keys 1-4 to answer · Enter for next</div>'
  );
}

function renderCard(){
  const slot = document.getElementById('cardSlot');
  const item = QUESTIONS[order[pos]];
  const logged = answersLog[pos];
  const perm = getOptOrder(pos);

  let optsHtml = '';
  perm.forEach((origIdx, displayI) => {
    const text = optionText(item, origIdx, perm);
    let cls = 'opt';
    let markup = '<span class="letter">' + letter(displayI) + '.</span><span>' + escapeHtml(text) + '</span>';
    if(logged && !logged.skipped){
      cls += ' locked';
      if(origIdx === item.c) cls += ' correct';
      else if(origIdx === logged.selected) cls += ' incorrect chosen-tag';
      else cls += ' dim';
    } else if(logged && logged.skipped){
      cls += ' locked dim';
    }
    optsHtml += '<button class="' + cls + '" data-idx="' + origIdx + '"' + (logged ? ' disabled' : '') + '>' + markup + '</button>';
  });

  let imgHtml = '';
  if(item.img){ imgHtml = '<div class="qimg-wrap" style="display:flex;"><img src="' + escapeHtml(item.img) + '" alt="Figure for this question"><span class="qimg-hint">Tap to zoom</span></div>'; }

  let explainHtml = '';
  if(logged && !logged.skipped){
    const verdictClass = logged.isCorrect ? 'right' : 'wrong';
    const verdictText = logged.isCorrect ? 'Correct.' : 'Not quite.';
    const stepsHtml = (item.steps && item.steps.length)
      ? '<div id="stepsBlock" class="hidden"><ol class="steps-list">' + item.steps.map(s => '<li>' + escapeHtml(s) + '</li>').join('') + '</ol></div>'
      : '';
    const qIndex = order[pos];
    const isFlagged = flaggedSet.has(qIndex);
    const noteVal = notes[qIndex] || '';
    explainHtml =
      '<div class="explain ' + verdictClass + '">' +
        '<div class="verdict">' + verdictText + '</div>' +
        '<div class="reason">' + escapeHtml(item.o[item.c]) + '.' + (item.n ? ' ' + escapeHtml(item.n) : '') + '</div>' +
        explainImgHtml(item) +
        (item.ref ? '<div class="meta-row">Source<span>' + escapeHtml(item.ref) + '</span></div>' : '') +
        '<div class="chip-row">' +
          (item.steps && item.steps.length ? '<button class="chip-btn" id="stepsChip">＋ Steps</button>' : '<div style="flex:1;"></div>') +
          '<button class="chip-btn" id="noteChip">✎ Note</button>' +
          '<button class="chip-btn' + (isFlagged ? ' active' : '') + '" id="drillChip">↻ Drill</button>' +
        '</div>' +
        stepsHtml +
        '<div class="note-box hidden" id="noteBox"><textarea id="noteText" placeholder="Your note on this question…">' + escapeHtml(noteVal) + '</textarea><button class="note-save" id="noteSave">Save note</button></div>' +
      '</div>';
  } else if(logged && logged.skipped){
    explainHtml = '<div class="explain" style="border-left-color:var(--blue-bright);"><div class="verdict" style="color:var(--blue-bright);">Skipped</div><div class="reason">Answer it now, or come back later from the question map.</div></div>';
  }

  slot.innerHTML =
    '<div class="bp-card">' +
      sectionTagHtml(item) +
      (SUBJECT && SUBJECT.id === 'history-of-architecture' ? '<span class="etymology-card-hint">click underlined terms for etymology</span>' : '') +
      '<span class="clock-chip">' + (MODE === 'exam' ? 'Reviewing · mock exam' : MODE === 'drill' ? 'No clock · drilling your misses' : 'No clock · study mode') + '</span>' +
      '<div class="q-body"><p class="qtext">' + escapeHtml(item.q) + '</p>' + imgHtml + '</div>' +
      '<div class="options">' + optsHtml + '</div>' +
      explainHtml +
    '</div>';

  wireCard(item);
  if(window.LEAEtymology) LEAEtymology.decorate(slot, SUBJECT && SUBJECT.id);
}

function wireCard(item){
  document.querySelectorAll('.opt[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(item, parseInt(btn.getAttribute('data-idx'), 10)));
  });
  const stepsChip = document.getElementById('stepsChip');
  if(stepsChip) stepsChip.addEventListener('click', () => {
    const block = document.getElementById('stepsBlock');
    block.classList.toggle('hidden');
    stepsChip.classList.toggle('active');
  });
  const noteChip = document.getElementById('noteChip');
  if(noteChip) noteChip.addEventListener('click', () => {
    document.getElementById('noteBox').classList.toggle('hidden');
  });
  const noteSave = document.getElementById('noteSave');
  if(noteSave) noteSave.addEventListener('click', () => {
    const qIndex = order[pos];
    const val = document.getElementById('noteText').value.trim();
    if(val) notes[qIndex] = val; else delete notes[qIndex];
    persistFlags();
    noteSave.textContent = 'Saved';
    setTimeout(() => { noteSave.textContent = 'Save note'; }, 1200);
  });
  const drillChip = document.getElementById('drillChip');
  if(drillChip) drillChip.addEventListener('click', () => toggleFlag());
}

function selectAnswer(item, origIdx){
  if(answersLog[pos]) return;
  const isCorrect = origIdx === item.c;
  answersLog[pos] = { selected: origIdx, isCorrect };
  if(isCorrect){ noteMastered(order[pos]); LEAProgress.markMastered(SUBJECT.id, MODULE.id, order[pos]); }
  if(pos === frontier && frontier < order.length - 1) frontier = pos + 1;
  else if(pos === frontier) frontier = pos;
  saveResumeState();
  renderRun();
}

function toggleFlag(){
  const qIndex = order[pos];
  if(flaggedSet.has(qIndex)) flaggedSet.delete(qIndex);
  else flaggedSet.add(qIndex);
  persistFlags();
  if(MODE === 'exam' && !examSubmitted) renderExamRun();
  else renderRun();
}

function formatDuration(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const p2 = n => String(n).padStart(2, '0');
  return h > 0 ? (h + ':' + p2(m) + ':' + p2(s)) : (p2(m) + ':' + p2(s));
}

function wireHeader(){
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'subject.html?s=' + encodeURIComponent(SUBJECT.id);
  });
  document.getElementById('flagBtn').addEventListener('click', toggleFlag);
  document.getElementById('moreBtn').addEventListener('click', openReport);
  // jumpChip lives in renderCountsRow (study/drill) — exam mode's
  // examStatusBar has no Jump button, so this must stay optional. See the
  // matching note in wireMultiHeader() for why a blind call here is
  // dangerous: it would throw and skip whatever wireExamFooter() call
  // follows it in the same render pass.
  const jumpChip = document.getElementById('jumpChip');
  if(jumpChip) jumpChip.addEventListener('click', openMap);
}

function wireFooter(){
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', () => {
    answersLog[pos] = { skipped: true };
    if(pos === frontier && frontier < order.length - 1) frontier = pos + 1;
    saveResumeState();
    if(pos < order.length - 1){ pos++; }
    renderRun();
  });
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', () => {
    const isLast = pos === order.length - 1;
    const resolved = stateAt(pos) !== 'unvisited';
    if(isLast && resolved){ finishRun(); return; }
    if(pos < order.length - 1){ pos++; renderRun(); }
  });
}

function finishRun(){
  if(MODE === 'exam' && examSubmitted){ showExamResults(false); return; }
  LEAResume.clear(SUBJECT.id, resumeKey());
  const correct = answersLog.filter(a => a && !a.skipped && a.isCorrect).length;
  const answeredWrong = answersLog.filter(a => a && !a.skipped && !a.isCorrect).length;
  const skipped = answersLog.filter(a => a && a.skipped).length;
  // Same reason as the exam path: read the standing best first.
  const prevBest = previousBestPct(order.length);
  LEAProgress.recordRunScore(SUBJECT.id, MODULE.id, correct, order.length);

  const body = document.getElementById('pageBody');
  body.innerHTML = renderResultsCard({
    kicker: MODULE.title + (MODE === 'drill' ? ' \u00b7 Drill' : ''),
    correct: correct, total: order.length, missed: answeredWrong + skipped,
    prevBestPct: prevBest, newlyMastered: newlyMasteredCount(), auto: false
  });
  wireResultsCard(() => {
    const firstMiss = answersLog.findIndex(a => a && (a.skipped || !a.isCorrect));
    pos = firstMiss === -1 ? 0 : firstMiss;
    renderRun();
  });
}

// ================= Question map =================
// During an active (pre-submit) exam nothing is graded yet, so the map can
// only ever show "answered" vs "not answered" — reusing tickClass/stateAt
// (which read .isCorrect) would leak a false "wrong" read on every answered
// item. examTickClass reuses the same blue used for "skipped" in study mode
// to mean "answered" here — the two concepts never appear on screen at the
// same time, so sharing the color isn't ambiguous in practice.
function examStateAt(p){
  const a = answersLog[p];
  return (a && a.selected != null && a.selected !== -1) ? 'answered' : 'unanswered';
}
function examTickClass(p){
  const qIndex = order[p];
  if(flaggedSet.has(qIndex)) return 'flagged';
  return examStateAt(p) === 'answered' ? 'skipped' : '';
}

// ================= 7b keyboard =================
// The desktop hint promises "Keys 1-4 to answer · Enter for next", so the keys
// have to actually work. Bound once at load; every handler re-reads live state
// rather than capturing it, since the DOM is replaced on each render.
document.addEventListener('keydown', (e) => {
  if(window.innerWidth < 1120) return;
  // Never steal keystrokes from a field the reader is typing into.
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  // Nor while a sheet is up — those have their own affordances.
  if([...document.querySelectorAll('.sheet-overlay')].some(o => !o.classList.contains('hidden'))) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;

  if(e.key >= '1' && e.key <= '9'){
    const opts = document.querySelectorAll('#cardSlot .opt[data-idx]');
    const btn = opts[parseInt(e.key, 10) - 1];
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
    return;
  }
  if(e.key === 'Enter'){
    // Whichever "advance" control this mode is currently showing.
    const next = document.getElementById('nextBtn') || document.getElementById('examNextBtn');
    if(next && !next.disabled){ e.preventDefault(); next.click(); }
  }
});

// ================= 7b desktop rail =================
// At 1120px the Jump sheet disappears and the map is simply always open, with
// flagged and skipped items listed beside it. Same data as the sheet, same
// state helpers — only the container differs, so the two cannot drift.
// Called at the end of every render pass; a no-op when the rail is off-screen.
function renderRail(){
  const rail = document.getElementById('runRail');
  if(!rail) return;
  // Cross-subject runs use pool[]; single-module runs use order[].
  const isMulti = typeof pool !== 'undefined' && pool && pool.length && (typeof MODULE === 'undefined' || !MODULE);
  const total = isMulti ? pool.length : (typeof order !== 'undefined' ? order.length : 0);
  if(!total || window.innerWidth < 1120){ rail.innerHTML = ''; return; }

  const examPhase = (MODE === 'exam' && !examSubmitted);
  const classAt = p => {
    let c = isMulti ? multiTickClass(p) : (examPhase ? examTickClass(p) : tickClass(p));
    if(p === pos) c += ' current';
    return c;
  };

  const cells = Array.from({ length: total }, (_, p) =>
    '<button class="map-cell" data-pos="' + p + '" type="button">' + (p + 1) + '</button>'
  ).join('');

  const legend = examPhase
    ? '<div class="lg-item"><span class="lg-dot" style="background:var(--blue-bright);"></span>Answered</div>' +
      '<div class="lg-item"><span class="lg-dot" style="background:var(--gold);"></span>Flagged</div>'
    : '<div class="lg-item"><span class="lg-dot" style="background:var(--good);"></span>Correct</div>' +
      '<div class="lg-item"><span class="lg-dot" style="background:var(--bad);"></span>Wrong</div>' +
      '<div class="lg-item"><span class="lg-dot" style="background:var(--blue-bright);"></span>Skipped</div>' +
      '<div class="lg-item"><span class="lg-dot" style="background:var(--gold);"></span>Flagged</div>';

  // "To resolve": everything still standing between the reader and a finish.
  const toResolve = [];
  for(let p = 0; p < total; p++){
    const flagged = isMulti ? !!pool[p].flagged : flaggedSet.has(order[p]);
    const a = answersLog[p];
    if(flagged) toResolve.push({ p, why: 'flagged' });
    else if(a && a.skipped) toResolve.push({ p, why: 'skipped' });
    else if(!examPhase && !a) continue;
  }

  const resolveHtml = toResolve.length
    ? toResolve.slice(0, 8).map(item =>
        '<button class="resolve-row" data-pos="' + item.p + '" type="button">' +
          '<span>Q' + (item.p + 1) + ' ' + item.why + '</span><span class="rr-go">Go →</span>' +
        '</button>').join('') +
      (toResolve.length > 8 ? '<div class="rail-more">+' + (toResolve.length - 8) + ' more</div>' : '')
    : '<div class="rail-more">Nothing outstanding.</div>';

  let statHtml = '';
  if(!isMulti && typeof MODULE !== 'undefined' && MODULE){
    const p = LEAProgress.load(SUBJECT.id, MODULE.id);
    const mastered = (p.mastered || []).length;
    const pct = MODULE.total > 0 ? Math.round((mastered / MODULE.total) * 100) : 0;
    statHtml =
      '<div class="rail-block">' +
        '<div class="rail-head">This module</div>' +
        '<div class="rail-stat-row"><span>' + mastered + ' / ' + MODULE.total + ' mastered</span><b>' + pct + '%</b></div>' +
        '<div class="rail-bar"><div class="rail-bar-fill" style="width:' + pct + '%;"></div></div>' +
      '</div>';
  }

  rail.innerHTML =
    '<div class="rail-block">' +
      '<div class="rail-head">Question map</div>' +
      '<div class="rail-map">' + cells + '</div>' +
      '<div class="map-legend">' + legend + '</div>' +
    '</div>' +
    '<div class="rail-block">' +
      '<div class="rail-head">To resolve</div>' + resolveHtml +
    '</div>' +
    statHtml;

  // Paint cell states after insertion so the class logic stays in one place.
  rail.querySelectorAll('.map-cell').forEach(cell => {
    const p = parseInt(cell.getAttribute('data-pos'), 10);
    cell.className = 'map-cell ' + classAt(p);
    cell.addEventListener('click', () => jumpToPosition(p));
  });
  rail.querySelectorAll('.resolve-row').forEach(row => {
    row.addEventListener('click', () => jumpToPosition(parseInt(row.getAttribute('data-pos'), 10)));
  });
}

// Shared by the rail and the keyboard shortcuts. Honours the same frontier
// rule the sheet does: you cannot skip ahead of where you have reached.
function jumpToPosition(target){
  const isMulti = typeof pool !== 'undefined' && pool && pool.length && (typeof MODULE === 'undefined' || !MODULE);
  if(target > frontier) return;
  pos = target;
  if(isMulti){
    if(multiKind === 'exam' && !examSubmitted) renderMultiExamRun(); else renderMultiRun();
  } else {
    if(MODE === 'exam' && !examSubmitted) renderExamRun(); else renderRun();
  }
}

function openMap(){
  const examPhase = (MODE === 'exam' && !examSubmitted);
  const legend = document.getElementById('mapLegend');
  legend.innerHTML = examPhase
    ? ('<div class="lg-item"><span class="lg-dot" style="background:var(--blue-bright);"></span>Answered</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--gold);"></span>Flagged</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--bg-panel-2);border:1px solid var(--line);"></span>Not answered</div>')
    : ('<div class="lg-item"><span class="lg-dot" style="background:var(--good);"></span>Correct</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--bad);"></span>Wrong</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--blue-bright);"></span>Skipped</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--gold);"></span>Flagged</div>' +
       '<div class="lg-item"><span class="lg-dot" style="background:var(--bg-panel-2);border:1px solid var(--line);"></span>Not seen</div>');

  const grid = document.getElementById('mapGrid');
  grid.innerHTML = order.map((qIndex, p) => {
    let cls = examPhase ? examTickClass(p) : tickClass(p);
    if(p === pos) cls += ' current';
    return '<div class="map-cell ' + cls + '" data-pos="' + p + '">' + (p+1) + '</div>';
  }).join('');
  grid.querySelectorAll('.map-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const target = parseInt(cell.getAttribute('data-pos'), 10);
      if(target <= frontier){
        pos = target; closeMap();
        if(examPhase) renderExamRun(); else renderRun();
      }
    });
  });

  const flaggedPositions = order.map((qIndex, p) => flaggedSet.has(qIndex) ? p : -1).filter(p => p >= 0);
  const goFlagged = document.getElementById('mapGoFlagged');
  const goSkipped = document.getElementById('mapGoSkipped');
  goFlagged.textContent = 'Go to ' + flaggedPositions.length + ' flagged';
  goFlagged.disabled = flaggedPositions.length === 0;
  goFlagged.onclick = () => { if(flaggedPositions.length){ pos = flaggedPositions[0]; closeMap(); if(examPhase) renderExamRun(); else renderRun(); } };

  if(examPhase){
    const unansweredPositions = order.map((qIndex, p) => examStateAt(p) === 'unanswered' ? p : -1).filter(p => p >= 0);
    goSkipped.textContent = unansweredPositions.length + ' unanswered';
    goSkipped.disabled = unansweredPositions.length === 0;
    goSkipped.onclick = () => { if(unansweredPositions.length){ pos = unansweredPositions[0]; closeMap(); renderExamRun(); } };
  } else {
    const skippedPositions = answersLog.map((a, p) => (a && a.skipped) ? p : -1).filter(p => p >= 0);
    goSkipped.textContent = skippedPositions.length + ' skipped';
    goSkipped.disabled = skippedPositions.length === 0;
    goSkipped.onclick = () => { if(skippedPositions.length){ pos = skippedPositions[0]; closeMap(); renderRun(); } };
  }
  document.getElementById('mapOverlay').classList.remove('hidden');
}
function closeMap(){ document.getElementById('mapOverlay').classList.add('hidden'); }
document.getElementById('mapClose').addEventListener('click', closeMap);
document.getElementById('mapOverlay').addEventListener('click', (e) => { if(e.target.id === 'mapOverlay') closeMap(); });

// ================= Report sheet (offline-first queue) =================
// The four categories the frame specifies, verbatim. "Other" is deliberately
// absent: without a required free-text field it produces reports nobody can
// act on, so every reason here names something specific enough to fix.
const REPORT_REASONS = [
  'Answer key looks wrong',
  'Typo or unclear wording',
  'Figure missing or broken',
  'Duplicate of another item'
];
let selectedReason = null;

function openReport(){
  reportTargetSubjectId = SUBJECT.id;
  reportTargetModuleId = MODULE.id;
  reportTargetQIndex = order[pos];
  openReportSheet();
}

function openReportSheet(){
  selectedReason = null;
  document.getElementById('reportComment').value = '';
  const container = document.getElementById('reportReasons');
  container.innerHTML = REPORT_REASONS.map((r, i) =>
    '<label class="report-reason" data-i="' + i + '"><input type="radio" name="reportReason" value="' + i + '"> ' + escapeHtml(r) + '</label>'
  ).join('');
  container.querySelectorAll('.report-reason').forEach(row => {
    row.addEventListener('click', () => {
      selectedReason = REPORT_REASONS[parseInt(row.getAttribute('data-i'), 10)];
      container.querySelectorAll('.report-reason').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      row.querySelector('input').checked = true;
    });
  });
  document.getElementById('reportOverlay').classList.remove('hidden');
}
function closeReport(){ document.getElementById('reportOverlay').classList.add('hidden'); }
document.getElementById('reportClose').addEventListener('click', closeReport);
document.getElementById('reportOverlay').addEventListener('click', (e) => { if(e.target.id === 'reportOverlay') closeReport(); });

// Confirmation sheets come from assets/lea-confirm.js (window.LEAConfirm) —
// see that file for why native confirm() cannot be used here.

// Capped: if the backend is unreachable (or the table is missing) every send
// fails and lands here, so an uncapped queue would grow until it blew the
// localStorage quota and started breaking saved progress too.
const REPORT_QUEUE_MAX = 50;
function queueReport(report){
  let queue = [];
  try{ queue = JSON.parse(localStorage.getItem('lea_report_queue') || '[]'); }catch(e){}
  queue.push(report);
  if(queue.length > REPORT_QUEUE_MAX) queue = queue.slice(-REPORT_QUEUE_MAX);
  try{ localStorage.setItem('lea_report_queue', JSON.stringify(queue)); }catch(e){}
}

async function flushReportQueue(){
  let queue = [];
  try{ queue = JSON.parse(localStorage.getItem('lea_report_queue') || '[]'); }catch(e){}
  if(!queue.length || !navigator.onLine) return;
  const remaining = [];
  for(const report of queue){
    try{
      const { error } = await sb.from('reports').insert(report);
      if(error) remaining.push(report);
    }catch(e){ remaining.push(report); }
  }
  try{ localStorage.setItem('lea_report_queue', JSON.stringify(remaining)); }catch(e){}
}
window.addEventListener('online', flushReportQueue);

document.getElementById('reportSend').addEventListener('click', async () => {
  if(!selectedReason || reportTargetQIndex == null) return;
  const report = {
    question_ref: reportTargetSubjectId + '/' + reportTargetModuleId + '/' + reportTargetQIndex,
    reason: selectedReason,
    comment: document.getElementById('reportComment').value.trim() || null,
    user_id: currentUserId,
    status: 'open',
    created_at: new Date().toISOString()
  };
  // This used to queue, close the sheet, and fire a flush whose result was
  // discarded — so a failed send looked exactly like a successful one. A
  // reader flagging a wrong answer deserves to know whether it actually
  // went anywhere, so send first and report what really happened.
  const sendBtn = document.getElementById('reportSend');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  let sent = false, failure = null;
  try{
    const { error } = await sb.from('reports').insert(report);
    if(error) failure = error.message || String(error); else sent = true;
  }catch(e){ failure = e.message || String(e); }

  sendBtn.disabled = false;
  sendBtn.textContent = 'Send report';

  if(sent){
    closeReport();
    showReportToast('Report sent. Thank you.');
    return;
  }
  // Hold it locally and retry on reconnect, but never claim it was sent.
  queueReport(report);
  closeReport();
  showReportToast(navigator.onLine
    ? 'Couldn’t send that report — saved on this device and it’ll retry.'
    : 'Saved — it’ll send when you’re back online.');
});

// Small transient confirmation. The report sheet is already closed by the
// time this shows, so it can't live inside it.
function showReportToast(message){
  let el = document.getElementById('reportToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'reportToast';
    el.style.cssText =
      'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2500;' +
      'max-width:calc(100% - 32px);background:var(--bg-panel);border:1px solid var(--line);' +
      'border-left:3px solid var(--gold);border-radius:10px;padding:12px 16px;' +
      'font-family:var(--font-mono);font-size:12px;color:var(--ink);' +
      'box-shadow:0 8px 30px rgba(0,0,0,0.45);';
    document.body.appendChild(el);
  }
