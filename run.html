  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(showReportToast._t);
  showReportToast._t = setTimeout(() => { el.style.display = 'none'; }, 3800);
}

// ================= Cross-subject: Daily Drill / Mock Exam / Topic Drill =================
// These three all launch without ?s=&m= — they draw from multiple modules at
// once, so a single global SUBJECT/MODULE/QUESTIONS/order (as used by the
// single-module study/exam/drill paths above) doesn't fit. `pool[]` holds
// resolved cells instead: { subjectId, subjectName, moduleId, moduleTitle,
// qIndex, q, s, mastered, flagged }. Every write (markMastered, flag) goes
// to that cell's own subject+module, not a shared one.
//
// Only format:'json' modules are answerable here (today: History of
// Architecture + Building Laws) — every other subject's questions still live
// in standalone quiz HTML this engine can't run. That ceiling is real and
// shown in the UI rather than hidden; it lifts on its own as more subjects
// get extracted to JSON.
let pool = [];
let multiKind = null; // 'drill-daily' | 'drill-topic' | 'exam'
let ALL_SUBJECTS = null;

function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function buildQuestionIndex(subjects){
  const cells = [];
  for(const subject of subjects){
    if(!subject.ready) continue;
    for(const mod of (subject.modules || [])){
      // Every module, whatever it is stored as. This used to skip anything
      // that wasn't a .json file, which hid 61% of the bank from every
      // cross-subject feature — see assets/quiz-source.js.
      const arr = await LEAQuizSource.loadModuleQuestions(mod);
      if(!arr) continue;
      const p = LEAProgress.load(subject.id, mod.id);
      const masteredSet = new Set(p.mastered || []);
      const flagSet = new Set(p.flagged || []);
      arr.forEach((q, qIndex) => {
        if(q.hidden) return; // admin-hidden — keeps its slot, just never served
        cells.push({
          subjectId: subject.id, subjectName: subject.name, moduleId: mod.id, moduleTitle: mod.title,
          moduleAttempts: p.attempts || 0, qIndex, q, s: q.s || mod.title,
          mastered: masteredSet.has(qIndex), flagged: flagSet.has(qIndex)
        });
      });
    }
  }
  return cells;
}

// engine-spec §6's tiers, reduced: tiers 1-2 (overdue / due today) need
// {box,dueAt} SRS state that doesn't exist yet, so they're empty until that
// ships — adding boxes later is a data addition here, not a rewrite. Tiers
// 3-4 approximate "most-missed" at the module level (no per-question miss
// count exists): unmastered questions in a module you've attempted before
// outrank unmastered questions in a module you've never opened.
// Tier 3 is "unmastered in a module you have opened", tier 4 is "unmastered
// in one you have not". Taking tier 3 first and only falling through when it
// runs dry meant a reader with a backlog never saw a new subject: 275 tier-3
// questions across two subjects kept 3,363 across seven permanently out of
// reach, so every drill was the same two subjects for weeks.
//
// Revisiting still leads — that is the point of the tier — but a fixed share
// of each drill is reserved for ground you have not opened, so the drill can
// introduce a subject instead of waiting to be asked. Either side lends its
// slots to the other when it is short, so a full backlog or a blank slate
// both still produce twenty questions.
const DRILL_SIZE = 20;
const DRILL_REVISIT_SHARE = 0.7;   // 14 of 20

function buildDailyDrillPool(index){
  const unmastered = index.filter(c => !c.mastered);
  const revisit = shuffleArr(unmastered.filter(c => c.moduleAttempts > 0));
  const fresh = shuffleArr(unmastered.filter(c => c.moduleAttempts === 0));

  const wantRevisit = Math.round(DRILL_SIZE * DRILL_REVISIT_SHARE);
  const takeRevisit = Math.min(revisit.length, wantRevisit);
  const takeFresh = Math.min(fresh.length, DRILL_SIZE - takeRevisit);
  const pool = revisit.slice(0, takeRevisit).concat(fresh.slice(0, takeFresh));

  // Whichever side was short, top up from the other so the drill is full.
  if(pool.length < DRILL_SIZE){
    const rest = revisit.slice(takeRevisit).concat(fresh.slice(takeFresh));
    pool.push(...rest.slice(0, DRILL_SIZE - pool.length));
  }
  return shuffleArr(pool);
}

function buildMockExamPool(index, count){
  const bySubject = {};
  index.forEach(c => { (bySubject[c.subjectId] = bySubject[c.subjectId] || []).push(c); });
  let out = [];
  Object.keys(bySubject).forEach(sid => {
    const share = bySubject[sid].length / index.length;
    const take = Math.max(1, Math.round(count * share));
    out = out.concat(shuffleArr(bySubject[sid]).slice(0, take));
  });
  return shuffleArr(out).slice(0, count);
}

function buildTopicDrillPool(index, topicName){
  return shuffleArr(index.filter(c => c.s === topicName && (!c.mastered || c.flagged)));
}

function buildFlaggedDrillPool(index){
  return shuffleArr(index.filter(c => c.flagged));
}

// Mirrors search.html's own filter chips (all/unmastered/flagged/notes) so
// "Drill all N" from a search actually drills the same N results.
function buildSearchDrillPool(index, q, filter){
  const needle = (q || '').toLowerCase();
  let matches = index.filter(c => (c.q.q || '').toLowerCase().includes(needle));
  if(filter === 'unmastered') matches = matches.filter(c => !c.mastered);
  else if(filter === 'flagged') matches = matches.filter(c => c.flagged);
  // 'notes' filter isn't representable here — buildQuestionIndex doesn't carry
  // per-cell note state (only the Search/Saved pages fetch that) — matches
  // stay unfiltered by notes, same "not mastered" pool as everything else.
  return shuffleArr(matches);
}

// Sorting purely by percentage looks right until you notice that most topics
// are on 0%, and every tie was broken by position in the index — which is
// subject order. The whole list came out of whichever subject happens to be
// first in the manifest.
//
// Percentage still decides the order. Within a run of topics on the SAME
// percentage the subjects take turns, so a tie is broken by variety rather
// than by manifest position, and "your shakiest topics" reads as a spread.
function aggregateWeakTopics(index){
  const byTopic = {};
  index.forEach(c => {
    const t = byTopic[c.s] || (byTopic[c.s] = { total: 0, mastered: 0, subjects: {} });
    t.total++;
    if(c.mastered) t.mastered++;
    t.subjects[c.subjectId] = (t.subjects[c.subjectId] || 0) + 1;
  });

  const rows = Object.keys(byTopic).map(name => {
    const t = byTopic[name];
    // A topic name can appear in more than one subject; attribute it to
    // whichever contributes most of its questions.
    const subjectId = Object.keys(t.subjects).sort((a, b) => t.subjects[b] - t.subjects[a])[0];
    return { name, total: t.total, mastered: t.mastered, subjectId, pct: Math.round((t.mastered / t.total) * 100) };
  }).filter(t => t.pct < 100)
    .sort((a, b) => (a.pct - b.pct) || (b.total - a.total) || a.name.localeCompare(b.name));

  // Round-robin within each percentage band, never across bands.
  const out = [];
  let i = 0;
  while(i < rows.length){
    let j = i;
    while(j < rows.length && rows[j].pct === rows[i].pct) j++;
    const band = rows.slice(i, j);
    const queues = {};
    band.forEach(r => (queues[r.subjectId] = queues[r.subjectId] || []).push(r));
    const keys = Object.keys(queues);
    let drained = false;
    while(!drained){
      drained = true;
      keys.forEach(k => { if(queues[k].length){ out.push(queues[k].shift()); drained = false; } });
    }
    i = j;
  }
  return out;
}

async function bootMulti(subjects, drillParams){
  const body = document.getElementById('pageBody');
  document.title = (MODE === 'daily-drill' ? 'Daily Drill' : MODE === 'exam' ? 'Mock Exam' : 'Drill') + ' — LEA Reviewer';
  body.innerHTML = '<div class="state-card">Building your set…</div>';
  const index = await buildQuestionIndex(subjects);

  if(MODE === 'daily-drill'){
    pool = buildDailyDrillPool(index);
    if(pool.length === 0){
      body.innerHTML = '<div class="state-card">Nothing to drill right now — you’re caught up.<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; Home</a></div>';
      return;
    }
    startMultiRun('drill-daily');
  } else if(MODE === 'exam'){
    if(index.length === 0){
      body.innerHTML = '<div class="state-card">No questions could be loaded right now. Check your connection and try again.<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; Home</a></div>';
      return;
    }
    renderMultiExamStart(index);
  } else if(MODE === 'drill'){
    // Three ways to land in a cross-subject drill: a weak topic (Home), all
    // flagged items (Saved), or a search's results (Search) — same pool
    // mechanics underneath, just a different filter building the set.
    let drillKind = 'drill-topic';
    if(drillParams.topic){
      pool = buildTopicDrillPool(index, drillParams.topic);
      if(pool.length === 0){
        body.innerHTML = '<div class="state-card">Nothing left to drill in “' + escapeHtml(drillParams.topic) + '.”<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; Home</a></div>';
        return;
      }
    } else if(drillParams.scope === 'flagged'){
      drillKind = 'drill-flagged';
      pool = buildFlaggedDrillPool(index);
      if(pool.length === 0){
        body.innerHTML = '<div class="state-card">Nothing flagged right now.<br><br><a href="saved.html" style="color:var(--gold-bright);">&larr; Saved</a></div>';
        return;
      }
    } else if(drillParams.q){
      drillKind = 'drill-search';
      pool = buildSearchDrillPool(index, drillParams.q, drillParams.filter);
      if(pool.length === 0){
        body.innerHTML = '<div class="state-card">Nothing to drill from that search.<br><br><a href="search.html" style="color:var(--gold-bright);">&larr; Search</a></div>';
        return;
      }
    } else {
      body.innerHTML = '<div class="state-card">No drill set specified.<br><br><a href="index.html" style="color:var(--gold-bright);">&larr; Home</a></div>';
      return;
    }
    startMultiRun(drillKind);
  }
}

// ---- Drill-kind (daily / topic) run: immediate feedback, no clock ----
// Cross-subject equivalent of masteredAtStart. A pool spans modules, so the
// snapshot is a per-module tally taken before the run and diffed after. Same
// reasoning as the single-module case: markMastered runs during the attempt,
// so the earlier state has to be captured up front or it is unrecoverable.
let multiMasteredAtStart = null;
function captureMultiMasteredAtStart(){
  const tally = {};
  pool.forEach(cell => {
    const k = cell.subjectId + '/' + cell.moduleId;
    if(tally[k] === undefined) tally[k] = (LEAProgress.load(cell.subjectId, cell.moduleId).mastered || []).length;
  });
  multiMasteredAtStart = tally;
}
function multiNewlyMasteredCount(){
  // Counted from this run's own answers, never from a before/after diff of
  // stored totals. The diff raced the sync — on a cold load the "before" read
  // hit an empty local cache and the "after" read the full synced figure, so a
  // 20-question drill once reported "+259 now mastered".
  if(!Array.isArray(pool) || !Array.isArray(answersLog)) return null;
  let gained = 0;
  answersLog.forEach((a, p) => {
    if(!a || a.skipped || !a.isCorrect) return;
    const cell = pool[p];
    if(cell && !cell.mastered) gained++;
  });
  return gained;
}

function startMultiRun(kind){
  multiKind = kind;
  captureMultiMasteredAtStart();
  answersLog = new Array(pool.length).fill(null);
  pos = 0; frontier = 0;
  renderMultiRun();
}

function multiStateAt(p){
  const a = answersLog[p];
  if(!a) return 'unvisited';
  if(a.skipped) return 'skipped';
  return a.isCorrect ? 'correct' : 'incorrect';
}
function multiTickClass(p){
  if(pool[p].flagged) return 'flagged';
  const st = multiStateAt(p);
  return st === 'unvisited' ? '' : st;
}

function renderMultiRun(){
  const body = document.getElementById('pageBody');
  body.innerHTML =
    renderMultiHeader() +
    renderMultiTickStrip() +
    renderMultiCountsRow() +
    '<div id="cardSlot"></div>' +
    renderMultiFooter();
  renderMultiCard();
  wireMultiHeader();
  wireMultiFooter();
  renderRail();
}

// Every cross-subject run used to label itself "Drill", so a Mock Exam read
// "Drill · History of Architecture" — wrong on both halves.
const MULTI_KIND_LABELS = {
  'exam': 'Mock Exam',
  'drill-daily': 'Daily Drill',
  'drill-topic': 'Topic Drill',
  'drill-flagged': 'Flagged',
  'drill-search': 'Search'
};

// The card tags each question with its own subject; the header describes the
// run as a whole, so a pool spanning subjects must not claim to be whichever
// subject happens to be on screen at the moment.
function multiScopeLabel(){
  const names = new Set(pool.map(c => stripEmoji(c.subjectName)));
  return names.size === 1 ? [...names][0] : 'Mixed';
}

function renderMultiHeader(){
  const cell = pool[pos];
  const title = MULTI_KIND_LABELS[multiKind] || 'Drill';
  // Frame 3a puts the scope in the kicker and the progress in the title —
  // "Mixed subjects" over "Daily drill · 6 / 20" — rather than repeating the
  // mode name on both lines.
  const isDaily = multiKind === 'drill-daily';
  const kicker = isDaily ? multiScopeLabel() : (title + ' · ' + multiScopeLabel());
  const main = isDaily
    ? (title + ' · ' + (pos+1) + ' / ' + pool.length)
    : ('Question ' + (pos+1) + ' / ' + pool.length);
  // The streak chip appears only where the frame draws it, and only when
  // there is a streak — it reads the stored value rather than guessing one.
  const streak = isDaily ? (LEAProgress.loadMeta('streak') || {}) : null;
  const streakChip = (streak && streak.current > 0)
    ? '<span class="streak-chip" title="Current daily-drill streak">' + svgFlame() + streak.current + '</span>'
    : '';
  return (
    '<div class="run-header">' +
      '<button class="icon-btn" id="backBtn" title="Back home">' + svgArrowLeft() + '</button>' +
      '<div class="header-title">' +
        '<div class="h-sub">' + escapeHtml(kicker) + '</div>' +
        '<div class="h-main">' + escapeHtml(main) + '</div>' +
      '</div>' +
      streakChip +
      '<button class="icon-btn' + (cell.flagged ? ' flagged' : '') + '" id="flagBtn" title="Flag this question">' + svgFlag() + '</button>' +
      '<button class="icon-btn" id="moreBtn" title="Report a problem with this question">' + svgMore() + '</button>' +
    '</div>'
  );
}

function renderMultiTickStrip(){
  let ticks = '';
  for(let p = 0; p < pool.length; p++){
    ticks += '<div class="tick ' + multiTickClass(p) + (p === pos ? ' current' : '') +
             '" title="Question ' + (p+1) + '"></div>';
  }
  return '<div class="tick-strip' + stripDensity(pool.length) + '">' + ticks + '</div>';
}

function renderMultiCountsRow(){
  let correct=0, incorrect=0, skipped=0, flagged=0;
  answersLog.forEach(a => { if(a){ if(a.skipped) skipped++; else if(a.isCorrect) correct++; else incorrect++; } });
  pool.forEach(c => { if(c.flagged) flagged++; });
  return (
    '<div class="counts-row">' +
      '<div class="counts-text">' + '<span class="c-right">' + correct + ' right</span> · ' + '<span class="c-wrong">' + incorrect + ' wrong</span> · ' + '<span class="c-skip">' + skipped + ' skipped</span> · ' + '<span class="c-flag">' + flagged + ' flagged</span>' + '</div>' +
      '<button class="jump-chip" id="jumpChip">⊞ Jump</button>' +
    '</div>'
  );
}

function renderMultiFooter(){
  const resolved = multiStateAt(pos) !== 'unvisited';
  const isLast = pos === pool.length - 1;
  const canGoNext = resolved && (pos < frontier || isLast);
  const showSkip = !resolved;
  return (
    '<div class="run-footer">' +
      (showSkip ? '<button class="footer-btn skip" id="skipBtn">Skip</button>' : '') +
      '<button class="footer-btn next" id="nextBtn"' + (canGoNext ? '' : ' disabled') + '>' + (isLast && resolved ? 'See results →' : 'Next question →') + '</button>' +
    '</div>' +
    '<div class="kbd-hint">Keys 1-4 to answer · Enter for next</div>'
  );
}

function renderMultiCard(){
  const slot = document.getElementById('cardSlot');
  const cell = pool[pos];
  const item = cell.q;
  const logged = answersLog[pos];
  const perm = getOptOrder(pos, item);

  let optsHtml = '';
  perm.forEach((origIdx, displayI) => {
    const text = optionText(item, origIdx, perm);
    let cls = 'opt';
    const markup = '<span class="letter">' + letter(displayI) + '.</span><span>' + escapeHtml(text) + '</span>';
    if(logged && !logged.skipped){
      cls += ' locked';
      if(origIdx === item.c) cls += ' correct';
      else if(origIdx === logged.selected) cls += ' incorrect chosen-tag';
      else cls += ' dim';
    } else if(logged && logged.skipped){
      cls += ' locked dim';
    }
    optsHtml += '<button class="' + cls + '" data-idx="' + origIdx + '"' + (logged ? ' disabled' : '') + '>' + markup + '</button>';
  });

  let imgHtml = '';
  if(item.img){ imgHtml = '<div class="qimg-wrap" style="display:flex;"><img src="' + escapeHtml(item.img) + '" alt="Figure for this question"><span class="qimg-hint">Tap to zoom</span></div>'; }

  let explainHtml = '';
  if(logged && !logged.skipped){
    const verdictClass = logged.isCorrect ? 'right' : 'wrong';
    const verdictText = logged.isCorrect ? 'Correct.' : 'Not quite.';
    explainHtml =
      '<div class="explain ' + verdictClass + '">' +
        '<div class="verdict">' + verdictText + '</div>' +
        '<div class="reason">' + escapeHtml(item.o[item.c]) + '.' + (item.n ? ' ' + escapeHtml(item.n) : '') + '</div>' +
        explainImgHtml(item) +
        (item.ref ? '<div class="meta-row">Source<span>' + escapeHtml(item.ref) + '</span></div>' : '') +
      '</div>';
  } else if(logged && logged.skipped){
    explainHtml = '<div class="explain" style="border-left-color:var(--blue-bright);"><div class="verdict" style="color:var(--blue-bright);">Skipped</div><div class="reason">Answer it now, or come back later from the question map.</div></div>';
  }

  slot.innerHTML =
    '<div class="bp-card">' +
      sectionTagHtml(item) +
      '<span class="clock-chip">' + escapeHtml(cell.moduleTitle) + '</span>' +
      '<div class="q-body"><p class="qtext">' + escapeHtml(item.q) + '</p>' + imgHtml + '</div>' +
      '<div class="options">' + optsHtml + '</div>' +
      explainHtml +
    '</div>';

  slot.querySelectorAll('.opt[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => selectMultiAnswer(item, parseInt(btn.getAttribute('data-idx'), 10)));
  });
  if(window.LEAEtymology) LEAEtymology.decorate(slot, cell.subjectId);
}

function selectMultiAnswer(item, origIdx){
  if(answersLog[pos]) return;
  const cell = pool[pos];
  const isCorrect = origIdx === item.c;
  answersLog[pos] = { selected: origIdx, isCorrect };
  if(isCorrect) LEAProgress.markMastered(cell.subjectId, cell.moduleId, cell.qIndex);
  if(pos === frontier && frontier < pool.length - 1) frontier = pos + 1;
  renderMultiRun();
}

function toggleMultiFlag(){
  const cell = pool[pos];
  cell.flagged = !cell.flagged;
  const p = LEAProgress.load(cell.subjectId, cell.moduleId);
  const fset = new Set(p.flagged || []);
  if(cell.flagged) fset.add(cell.qIndex); else fset.delete(cell.qIndex);
  p.flagged = Array.from(fset);
  LEAProgress.save(cell.subjectId, cell.moduleId, p);
  if(multiKind === 'exam' && !examSubmitted) renderMultiExamRun();
  else renderMultiRun();
}

function wireMultiHeader(){
  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
  document.getElementById('flagBtn').addEventListener('click', toggleMultiFlag);
  document.getElementById('moreBtn').addEventListener('click', openMultiReport);
  // jumpChip lives in renderMultiCountsRow (drill-kind runs) — exam mode
  // uses examStatusBarFor instead, which has no Jump button, so this must
  // stay optional. A blind getElementById().addEventListener() here would
  // throw for exam runs and silently skip every wireMulti*Footer() call
  // that follows it in the same render pass.
  const jumpChip = document.getElementById('jumpChip');
  if(jumpChip) jumpChip.addEventListener('click', openMultiMap);
}

function wireMultiFooter(){
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', () => {
    answersLog[pos] = { skipped: true };
    if(pos === frontier && frontier < pool.length - 1) frontier = pos + 1;
    if(pos < pool.length - 1) pos++;
    renderMultiRun();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    const isLast = pos === pool.length - 1;
    const resolved = multiStateAt(pos) !== 'unvisited';
    if(isLast && resolved){ finishMultiRun(); return; }
    if(pos < pool.length - 1){ pos++; renderMultiRun(); }
  });
}

function finishMultiRun(){
  if(multiKind === 'exam' && examSubmitted){
    showMultiExamResults(false, answersLog.filter(a => a.isCorrect).length);
    return;
  }
  const correct = answersLog.filter(a => a && !a.skipped && a.isCorrect).length;
  const attempted = answersLog.filter(a => a && !a.skipped).length;

  if(multiKind === 'drill-daily'){
    showDailyDrillDone(correct, attempted);
    return;
  }

  const body = document.getElementById('pageBody');
  const pct = pool.length > 0 ? Math.round((correct / pool.length) * 100) : 0;
  body.innerHTML =
    '<div class="bp-card results-card">' +
      '<span class="section-tag">' + escapeHtml(MULTI_KIND_LABELS[multiKind] || 'Drill') + '</span>' +
      '<div class="results-score">' + correct + '<span> / ' + pool.length + '</span></div>' +
      '<div class="counts-text">' + attempted + ' answered · ' + (pool.length - attempted) + ' skipped · ' + pct + '%</div>' +
      '<div class="results-actions">' +
        '<button class="footer-btn skip" id="backHomeBtn">Back home</button>' +
      '</div>' +
    '</div>';
  document.getElementById('backHomeBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
}

// ---- Streak: {current, best, lastCompletedDate}, guarded on the calendar
// date string (not elapsed hours) so timezone/DST can't double-count or
// skip a day. Increments once per completed Daily Drill session, even if
// the pool had fewer than 20 items because that's all there was to drill.
function dateStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function bumpStreak(){
  const streak = LEAProgress.loadMeta('streak') || { current: 0, best: 0, lastCompletedDate: null };
  const today = dateStr(new Date());
  if(streak.lastCompletedDate === today) return streak;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  streak.current = (streak.lastCompletedDate === dateStr(yesterday)) ? (streak.current || 0) + 1 : 1;
  streak.best = Math.max(streak.best || 0, streak.current);
  streak.lastCompletedDate = today;
  LEAProgress.saveMeta('streak', streak);
  return streak;
}

// 3b Daily drill done.
//
// The frame's "Tomorrow" block is deliberately absent: naming tomorrow's
// queue needs due dates, and nothing schedules anything. Its third line —
// "extra practice won't change tomorrow's queue" — is actually inverted
// under the current selection, since mastering more removes questions from
// the pool. That block returns with SRS; approximating it now would be a
// claim the reader disproves by coming back tomorrow, and substituting a
// weaker true sentence would bury the gap.
function showDailyDrillDone(correct, attempted){
  const streak = bumpStreak();
  const misses = pool.length - correct;
  const newly = multiNewlyMasteredCount();
  const body = document.getElementById('pageBody');

  const streakLine = streak.best > streak.current
    ? streak.current + ' day' + (streak.current === 1 ? '' : 's') + ' running \u00b7 best ' + streak.best
    : streak.current + ' day' + (streak.current === 1 ? '' : 's') + ' running';


  // Seven ticks, filled from the left, with today lit — the same reading as
  // Home's streak card so the two never disagree.
  const ddTicks = Array.from({length: 7}, (_, i) => {
    const done = i < Math.min(streak.current, 7);
    const today = i === Math.min(streak.current, 7) - 1;
    return '<i class="' + (today ? 'today' : (done ? 'done' : '')) + '"></i>';
  }).join('');

  body.innerHTML =
    '<div class="dd-topbar"><div class="res-saved">\u2713 Saved</div></div>' +
    '<div class="bp-card dd-card">' +
      '<div class="dd-ring">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
      '</div>' +
      '<div class="dd-title">Done for today</div>' +
      '<div class="dd-day">Day ' + streak.current + ' in the bag.</div>' +
      '<div class="dd-ticks">' + ddTicks + '</div>' +
      '<div class="dd-streak">' + streakLine + '</div>' +
    '</div>' +
    '<div class="dd-stats">' +
      '<div class="dd-stat"><b class="ok">' + correct + '</b><span>Right</span></div>' +
      '<div class="dd-stat"><b class="no">' + misses + '</b><span>To revisit</span></div>' +
      (newly === null ? '' : '<div class="dd-stat"><b class="gold">+' + newly + '</b><span>Now mastered</span></div>') +
    '</div>' +
      (misses > 0
        ? '<button class="res-primary" id="reviewMissesBtn"><span class="rp-title">Review today\u2019s ' + misses + ' misses</span><span class="rp-go">\u2192</span></button>'
        : '<div class="res-clean">Every one correct \u2014 nothing to revisit.</div>') +
      '<div class="res-secondary">' +
        '<button class="res-alt" id="keepGoingBtn">Keep going anyway</button>' +
        '<button class="res-alt" id="backHomeBtn">Back home</button>' +
      '</div>' +
    '</div>';

  const review = document.getElementById('reviewMissesBtn');
  if(review) review.addEventListener('click', () => {
    const firstMiss = answersLog.findIndex(a => a && (a.skipped || !a.isCorrect));
    pos = firstMiss === -1 ? 0 : firstMiss;
    renderMultiRun();
  });
  // "Keep going" starts a fresh daily-drill pool. It cannot promise anything
  // about tomorrow, so it says nothing about it.
  document.getElementById('keepGoingBtn').addEventListener('click', () => {
    window.location.href = 'run.html?mode=daily-drill';
  });
  document.getElementById('backHomeBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
}

// ---- Question map (drill-kind multi runs) ----
function openMultiMap(){
  const legend = document.getElementById('mapLegend');
  legend.innerHTML =
    '<div class="lg-item"><span class="lg-dot" style="background:var(--good);"></span>Correct</div>' +
    '<div class="lg-item"><span class="lg-dot" style="background:var(--bad);"></span>Wrong</div>' +
    '<div class="lg-item"><span class="lg-dot" style="background:var(--blue-bright);"></span>Skipped</div>' +
    '<div class="lg-item"><span class="lg-dot" style="background:var(--gold);"></span>Flagged</div>' +
    '<div class="lg-item"><span class="lg-dot" style="background:var(--bg-panel-2);border:1px solid var(--line);"></span>Not seen</div>';
  const grid = document.getElementById('mapGrid');
  grid.innerHTML = pool.map((cell, p) => {
    let cls = multiTickClass(p);
    if(p === pos) cls += ' current';
    return '<div class="map-cell ' + cls + '" data-pos="' + p + '">' + (p+1) + '</div>';
  }).join('');
  grid.querySelectorAll('.map-cell').forEach(c => {
    c.addEventListener('click', () => {
      const target = parseInt(c.getAttribute('data-pos'), 10);
      if(target <= frontier){ pos = target; closeMap(); renderMultiRun(); }
    });
  });
  const flaggedPositions = pool.map((c, p) => c.flagged ? p : -1).filter(p => p >= 0);
  const skippedPositions = answersLog.map((a, p) => (a && a.skipped) ? p : -1).filter(p => p >= 0);
  const goFlagged = document.getElementById('mapGoFlagged');
  const goSkipped = document.getElementById('mapGoSkipped');
  goFlagged.textContent = 'Go to ' + flaggedPositions.length + ' flagged';
  goFlagged.disabled = flaggedPositions.length === 0;
  goFlagged.onclick = () => { if(flaggedPositions.length){ pos = flaggedPositions[0]; closeMap(); renderMultiRun(); } };
  goSkipped.textContent = skippedPositions.length + ' skipped';
  goSkipped.disabled = skippedPositions.length === 0;
  goSkipped.onclick = () => { if(skippedPositions.length){ pos = skippedPositions[0]; closeMap(); renderMultiRun(); } };
  document.getElementById('mapOverlay').classList.remove('hidden');
}

function openMultiReport(){
  const cell = pool[pos];
  reportTargetQIndex = cell.qIndex;
  reportTargetSubjectId = cell.subjectId;
  reportTargetModuleId = cell.moduleId;
  openReportSheet();
}

// ---- Exam-kind (cross-subject Mock Exam): same shape as single-module exam ----
function renderMultiExamStart(index){
  const body = document.getElementById('pageBody');
  const fullMs = index.length * EXAM_MS_PER_ITEM;
  const simCount = Math.min(50, index.length);
  const simMs = simCount * EXAM_MS_PER_ITEM;
  body.innerHTML =
    '<div class="run-header">' +
      '<button class="icon-btn" id="backBtn" title="Back home">' + svgArrowLeft() + '</button>' +
      '<div class="header-title"><div class="h-sub">Mock Exam</div><div class="h-main">Mixed, across subjects</div></div>' +
      '<div style="width:44px;flex-shrink:0;"></div>' +
    '</div>' +
    '<div class="bp-card">' +
      '<span class="section-tag">Cross-subject</span>' +
      '<p class="qtext" style="font-size:15px;">A mixed run drawn proportionally across every subject with drillable questions today. One global clock, no feedback until you submit.</p>' +
      '<div class="options">' +
        '<button class="opt" id="startFullBtn" style="min-height:64px;">' +
          '<span style="display:flex;flex-direction:column;gap:3px;"><b>Full exam — ' + index.length + ' items</b><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);">' + formatDuration(fullMs) + '</span></span>' +
        '</button>' +
        '<button class="opt" id="startSimBtn" style="min-height:64px;">' +
          '<span style="display:flex;flex-direction:column;gap:3px;"><b>' + simCount + '-item sim</b><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);">' + formatDuration(simMs) + '</span></span>' +
        '</button>' +
      '</div>' +
    '</div>';
  document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
  document.getElementById('startFullBtn').addEventListener('click', () => startMultiExam(index, index.length));
  document.getElementById('startSimBtn').addEventListener('click', () => startMultiExam(index, simCount));
}

function startMultiExam(index, count){
  multiKind = 'exam';
  pool = buildMockExamPool(index, count);
  captureMultiMasteredAtStart();
  answersLog = new Array(pool.length).fill(null);
  pos = 0; frontier = pool.length - 1;
  examSubmitted = false;
  examEndAt = Date.now() + Math.round(pool.length * EXAM_MS_PER_ITEM);
  startExamTimer();
  renderMultiExamRun();
}

function renderMultiExamRun(){
  const body = document.getElementById('pageBody');
  if(examSubmitted){
    body.innerHTML = renderMultiHeader() + renderMultiTickStrip() + renderMultiCountsRow() + '<div id="cardSlot"></div>' + renderMultiFooter();
    renderMultiCard();
    wireMultiHeader();
    wireMultiFooter();
    return;
  }
  body.innerHTML = renderMultiHeader() + examStatusBarFor(pool.length) + '<div id="cardSlot"></div>' + examFooterHtmlFor(pool.length, (n) => selectMultiExamNext(n));
  renderMultiExamCardUngraded();
  wireMultiHeader();
  wireMultiExamFooter();
  renderRail();
}

function examStatusBarFor(total){
  const remaining = examEndAt - Date.now();
  const pct = total > 0 ? Math.round(((pos + 1) / total) * 100) : 0;
  const answeredCount = answersLog.filter(a => a && a.selected != null && a.selected !== -1).length;
  const flaggedCount = (typeof pool !== 'undefined' && pool && pool.length)
    ? pool.filter(c => c.flagged).length
    : order.filter(qi => flaggedSet.has(qi)).length;
  return (
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;flex-wrap:wrap;">' +
      '<span class="exam-timer" id="examTimerPill">' + formatDuration(remaining) + '</span>' +
      '<div class="counts-text" style="white-space:nowrap;">' + answeredCount + ' answered · ' + flaggedCount + ' flagged · ' + (total - answeredCount) + ' left</div>' +
    '</div>' +
    // Frame 3c shows no progress bar during an exam — the clock is the only
    // pacing signal it gives, and that looks deliberate rather than omitted.
    '<div class="clock-chip blue" style="display:block;text-align:center;margin-bottom:14px;padding:7px 10px;">No feedback until you submit</div>'
  );
}

function examFooterHtmlFor(total, onNext){
  const isLast = pos === total - 1;
  return (
    '<div class="run-footer">' +
      '<button class="footer-btn skip" id="examFlagBtn">' + (pool[pos].flagged ? 'Unflag' : 'Flag') + '</button>' +
      '<button class="footer-btn next" id="examNextBtn">' + (isLast ? 'Review & submit →' : 'Next question →') + '</button>' +
    '</div>' +
    '<div class="kbd-hint">Keys 1-4 to answer · Enter for next</div>' +
    '<button class="sheet-close" id="examSubmitEarlyBtn" style="display:block;width:100%;margin-top:12px;">Submit exam early</button>'
  );
}

function renderMultiExamCardUngraded(){
  const slot = document.getElementById('cardSlot');
  const cell = pool[pos];
  const item = cell.q;
  const logged = answersLog[pos];
  const perm = getOptOrder(pos, item);
  let optsHtml = '';
  perm.forEach((origIdx, displayI) => {
    const text = optionText(item, origIdx, perm);
    let cls = 'opt';
    if(logged && logged.selected === origIdx) cls += ' chosen-tag';
    const markup = '<span class="letter">' + letter(displayI) + '.</span><span>' + escapeHtml(text) + '</span>';
    optsHtml += '<button class="' + cls + '" data-idx="' + origIdx + '">' + markup + '</button>';
  });
  let imgHtml = '';
  if(item.img){ imgHtml = '<div class="qimg-wrap" style="display:flex;"><img src="' + escapeHtml(item.img) + '" alt="Figure for this question"><span class="qimg-hint">Tap to zoom</span></div>'; }
  slot.innerHTML =
    '<div class="bp-card">' +
      sectionTagHtml(item) +
      '<span class="clock-chip">' + escapeHtml(stripEmoji(cell.subjectName)) + '</span>' +
      '<div class="q-body"><p class="qtext">' + escapeHtml(item.q) + '</p>' + imgHtml + '</div>' +
      '<div class="options">' + optsHtml + '</div>' +
    '</div>';
  slot.querySelectorAll('.opt[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => selectMultiExamAnswer(parseInt(btn.getAttribute('data-idx'), 10)));
  });
  if(window.LEAEtymology) LEAEtymology.decorate(slot, cell.subjectId);
}

function selectMultiExamAnswer(origIdx){
  answersLog[pos] = { selected: origIdx };
  renderMultiExamRun();
}

function wireMultiExamFooter(){
  document.getElementById('examFlagBtn').addEventListener('click', toggleMultiFlag);
  document.getElementById('examNextBtn').addEventListener('click', () => {
    const isLast = pos === pool.length - 1;
    if(isLast){ submitMultiExam(false); return; }
    pos++; renderMultiExamRun();
  });
  document.getElementById('examSubmitEarlyBtn').addEventListener('click', async () => {
    if(await LEAConfirm('Submit the exam now? You can still review every question afterward.', { yes: 'Submit exam' })) submitMultiExam(false);
  });
}

function submitMultiExam(auto){
  if(examSubmitted) return;
  examSubmitted = true;
  stopExamTimer();
  answersLog = answersLog.map((a, p) => {
    const cell = pool[p];
    const selected = (a && a.selected != null) ? a.selected : -1;
    const isCorrect = selected !== -1 && selected === cell.q.c;
    if(isCorrect) LEAProgress.markMastered(cell.subjectId, cell.moduleId, cell.qIndex);
    // See the note in submitExam — blanks stay misses for scoring but are
    // flagged so review mode can distinguish them from real wrong answers.
    return selected === -1 ? { selected, isCorrect, skipped: true } : { selected, isCorrect };
  });
  const correct = answersLog.filter(a => a.isCorrect).length;
  // A mixed exam spans modules, so its score can't live under any one
  // module's bestCorrect/bestTotal without corrupting that module's real
  // best score — it goes in its own meta list instead.
  const history = LEAProgress.loadMeta('mockexams') || [];
  history.push({ at: new Date().toISOString(), correct, total: pool.length, auto: !!auto });
  LEAProgress.saveMeta('mockexams', history.slice(-20));
  frontier = pool.length - 1;
  pos = 0;
  showMultiExamResults(auto, correct);
}

function showMultiExamResults(auto, correct){
  const body = document.getElementById('pageBody');
  const attempted = answersLog.filter(a => a.selected !== -1).length;
  const pct = pool.length > 0 ? Math.round((correct / pool.length) * 100) : 0;
  body.innerHTML =
    '<div class="bp-card results-card">' +
      '<span class="section-tag">Mock Exam · Mixed</span>' +
      (auto ? '<div class="counts-text" style="color:var(--bad);margin:10px 0;">Time’s up — submitted automatically.</div>' : '') +
      '<div class="results-score">' + correct + '<span> / ' + pool.length + '</span></div>' +
      '<div class="counts-text">' + attempted + ' answered · ' + (pool.length - attempted) + ' left blank · ' + pct + '%</div>' +
      '<div class="results-actions">' +
        '<button class="footer-btn skip" id="backHomeBtn">Back home</button>' +
        '<button class="footer-btn next" id="reviewAnswersBtn">Review answers →</button>' +
      '</div>' +
    '</div>';
  document.getElementById('backHomeBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
  document.getElementById('reviewAnswersBtn').addEventListener('click', () => { pos = 0; renderMultiRun(); });
}

// ---- SVGs (Lucide-style, stroke-width 1.5, matching the site's icon set) ----
// Flame for the daily-drill streak chip, same Lucide geometry as icons.js.
function svgFlame(){
  return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>';
}

// Not every module tags its questions by topic (the older QUIZ_DATA quizzes
// carry no topic field at all). Omit the tag entirely in that case rather than
// drawing an empty gold chip.
function sectionTagHtml(item){
  const s = item && item.s ? String(item.s).trim() : '';
  return s ? '<span class="section-tag">' + escapeHtml(s) + '</span>' : '';
}

function svgArrowLeft(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
}
function svgFlag(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 1-1h13.7a.5.5 0 0 1 .4.8L16 9l3.1 5.2a.5.5 0 0 1-.4.8H5"/></svg>';
}
function svgMore(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>';
}
</script>
<script>
// ================= Figure viewer =================
// A figure is often the whole question — a truss, a load diagram, a floor
// plan — and at phone width it is unreadable in the card. Tapping one opens
// it full-screen with wheel/pinch zoom and drag to pan.
//
// Delegated from the document, because the card is re-rendered on every
// question and per-image handlers would be rebound (or leaked) each time.
(function(){
  const view = document.getElementById('imgView');
  const img = document.getElementById('ivImg');
  if(!view || !img) return;

  let scale = 1, tx = 0, ty = 0;
  let dragging = false, lastX = 0, lastY = 0, pointers = new Map(), startDist = 0, startScale = 1;

  function apply(){ img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
  function setScale(next){
    scale = Math.min(6, Math.max(1, next));
    if(scale === 1){ tx = 0; ty = 0; }
    apply();
  }

  function open(src, alt){
    img.src = src;
    img.alt = alt || 'Figure';
    reset();
    view.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    view.classList.add('hidden');
    document.body.style.overflow = '';
    img.removeAttribute('src');
  }

  document.addEventListener('click', (e) => {
    const hit = e.target.closest('.qimg-wrap img');
    if(!hit) return;
    e.preventDefault();
    open(hit.getAttribute('src'), hit.getAttribute('alt'));
  });

  document.getElementById('ivClose').addEventListener('click', close);
  document.getElementById('ivIn').addEventListener('click', () => setScale(scale * 1.5));
  document.getElementById('ivOut').addEventListener('click', () => setScale(scale / 1.5));
  // Clicking the backdrop closes; clicking the image itself must not.
  view.addEventListener('click', (e) => { if(e.target === view) close(); });
  document.addEventListener('keydown', (e) => {
    if(view.classList.contains('hidden')) return;
    if(e.key === 'Escape') close();
    if(e.key === '+' || e.key === '=') setScale(scale * 1.5);
    if(e.key === '-') setScale(scale / 1.5);
  });

  view.addEventListener('wheel', (e) => {
    e.preventDefault();
    setScale(scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });

  view.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2){
      const [a, b] = [...pointers.values()];
      startDist = Math.hypot(a.x - b.x, a.y - b.y);
      startScale = scale;
    } else {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      view.setPointerCapture(e.pointerId);
    }
  });
  view.addEventListener('pointermove', (e) => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2 && startDist > 0){
      const [a, b] = [...pointers.values()];
      setScale(startScale * (Math.hypot(a.x - b.x, a.y - b.y) / startDist));
      return;
    }
    if(!dragging || scale === 1) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  function release(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2) startDist = 0;
    if(pointers.size === 0) dragging = false;
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  img.addEventListener('dblclick', () => { scale > 1 ? reset() : setScale(2.5); });
})();


</script>
