<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnemonics — LEA Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 64px;
  }
  .wrap{width:100%; max-width:560px;}
  a{color:inherit;}
  button, input{font-family:inherit;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:22px; text-transform:uppercase; }

  .search{
    width:100%; background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:14px; padding:12px 14px; margin-bottom:10px;
  }
  .search:focus{ outline:none; border-color:var(--gold); }

  /* Categories wrap rather than stretch: four labels of uneven length. */
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    padding:8px 12px; border-radius:999px; cursor:pointer;
  }
  .chip.active{ border-color:var(--gold); color:var(--gold-bright); background:rgba(224,168,63,0.08); }

  .drill-all-btn{
    display:block; width:100%; background:var(--gold); color:#1a1206; border:none; border-radius:10px;
    padding:14px; text-align:center; font-family:var(--font-display); font-weight:700; font-size:15px;
    text-transform:uppercase; margin-bottom:16px; cursor:pointer;
  }

  .mn-card{ background:var(--bg-panel); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:10px; padding:14px 16px; margin-bottom:12px; scroll-margin-top:16px; }
  .mn-card.flash{ border-color:var(--gold); }
  .mn-cat{ font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .mn-title{ font-family:var(--font-display); font-weight:700; font-size:18px; text-transform:uppercase; line-height:1.15; margin-bottom:8px; }
  .mn-hook{ font-family:var(--font-hand); font-size:16px; line-height:1.5; margin-bottom:12px;
    background:rgba(111,168,207,0.06); border-left:2px solid rgba(224,168,63,0.5); padding:9px 11px; }
  .mn-hook b, .mn-items b.hl{ color:var(--gold-bright); font-weight:700; }

  .mn-items{ list-style:none; margin:0 0 12px; padding:0; border-top:1px dashed var(--line); }
  .mn-items li{ display:grid; grid-template-columns:minmax(58px, max-content) 1fr; gap:12px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; line-height:1.5; }
  .mn-items .k{ font-family:var(--font-mono); font-size:12px; color:var(--blue-bright); padding-top:1px; }
  .mn-items li.hid{ cursor:pointer; }
  .mn-items li.hid .v{ color:var(--muted); font-family:var(--font-mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    border:1px dashed var(--line); border-radius:6px; padding:3px 8px; justify-self:start; }
  .mn-items li.hid:hover .v{ border-color:var(--gold); color:var(--gold-bright); }
  .mn-note{ font-size:12.5px; color:var(--muted); line-height:1.55; margin:-4px 0 12px; }
  .mn-note b{ color:var(--ink); }

  .mn-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mn-actions button{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink); padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .mn-actions button:hover{ border-color:var(--gold); }
  .mn-actions button.on{ border-color:var(--gold); color:var(--gold-bright); }
  .mn-count{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .mn-count.done{ color:var(--good); }

  .state-note{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:center; padding:40px 0; }
  .credits{ font-size:12px; color:var(--muted); line-height:1.6; text-align:center; margin-top:24px; }
</style>
<link rel="stylesheet" href="assets/blueprint.css?v=21">
<script src="assets/theme.js?v=21" data-alt-class="light-mode" data-default-is="dark"></script>
<script src="assets/offline.js?v=21"></script>
</head>
<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="index.html" title="Back home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title">Mnemonics</div>
  </div>

  <input class="search" id="search" type="search" placeholder="Search — e.g. Pritzker, CSI, thermae" autocomplete="off">
  <div class="chips" id="chips"></div>
  <button class="drill-all-btn" id="randomBtn" type="button">Drill a random one</button>
  <div id="contentArea"><div class="state-note">Loading…</div></div>
  <div class="credits">Shared by the LEA January 2027 Discord in #mnemonics.<br>Credits to Ar. J, wizzeukit and Jay.</div>
</div>

<script>
const CATS = { all:'All', laws:'Laws & Practice', history:'History & Theory', tech:'Technology & Design' };

let LIST = [];
const BY_ID = {};
let activeCat = 'all';
let query = '';
// Per card: 'closed', 'open' (whole list shown) or 'drill' (list hidden until
// each line is tapped). Only in memory — a drill is a few seconds of recall,
// not progress worth saving.
const mode = {};
const revealed = {};

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// In data/mnemonics.json a [bracketed] part is the letter or sound the
// mnemonic hangs on, and is drawn in gold.
function markHtml(s){
  return escapeHtml(s).replace(/\[([^\]]+)\]/g, '<b>$1</b>');
}

function plain(s){ return String(s || '').replace(/[\[\]]/g, ''); }

function matches(m, q){
  if(!q) return true;
  const hay = [m.title, m.hook, m.note, (m.tags || []).join(' ')]
    .concat(m.items.map(it => it.k + ' ' + it.v)).map(plain).join(' ').toLowerCase();
  return q.split(/\s+/).every(word => hay.includes(word));
}

function renderChips(){
  document.getElementById('chips').innerHTML = Object.keys(CATS).map(cat =>
    '<button class="chip' + (cat === activeCat ? ' active' : '') + '" type="button" data-cat="' + cat + '">' + escapeHtml(CATS[cat]) + '</button>'
  ).join('');
}

function cardHtml(m){
  const state = mode[m.id] || 'closed';
  const seen = revealed[m.id] || new Set();
  let body = '';
  if(state !== 'closed'){
    body = '<ol class="mn-items">' + m.items.map((it, i) => {
      const hidden = state === 'drill' && !seen.has(i);
      return '<li' + (hidden ? ' class="hid"' : '') + ' data-i="' + i + '">' +
        '<span class="k">' + escapeHtml(plain(it.k)) + '</span>' +
        '<span class="v">' + (hidden ? 'Tap to check' : markHtml(it.v)) + '</span>' +
      '</li>';
    }).join('') + '</ol>' +
    (m.note && (state === 'open' || seen.size === m.items.length) ? '<div class="mn-note">' + markHtml(m.note) + '</div>' : '');
  }

  let actions;
  if(state === 'drill'){
    const done = seen.size === m.items.length;
    actions =
      '<button type="button" class="on" data-act="drill">Stop drill</button>' +
      (done ? '<button type="button" data-act="again">Again</button>' : '<button type="button" data-act="reveal">Show all</button>') +
      '<span class="mn-count' + (done ? ' done' : '') + '">' + seen.size + ' / ' + m.items.length + '</span>';
  } else {
    actions =
      '<button type="button"' + (state === 'open' ? ' class="on"' : '') + ' data-act="list">' + (state === 'open' ? 'Hide list' : 'Show list') + '</button>' +
      '<button type="button" data-act="drill">Drill</button>';
  }

  return (
    '<div class="mn-card" id="' + escapeHtml(m.id) + '" data-id="' + escapeHtml(m.id) + '">' +
      '<div class="mn-cat">' + escapeHtml(CATS[m.cat] || '') + '</div>' +
      '<div class="mn-title">' + escapeHtml(m.title) + '</div>' +
      '<div class="mn-hook">' + markHtml(m.hook) + '</div>' +
      body +
      '<div class="mn-actions">' + actions + '</div>' +
    '</div>'
  );
}

function render(){
  renderChips();
  const q = query.trim().toLowerCase();
  const shown = LIST.filter(m => (activeCat === 'all' || m.cat === activeCat) && matches(m, q));
  document.getElementById('contentArea').innerHTML = shown.length
    ? shown.map(cardHtml).join('')
    : '<div class="state-note">No mnemonic matches that.</div>';
}

// Redraw one card in place, so tapping a line never jumps the page.
function redraw(id){
  const el = document.getElementById(id);
  if(el) el.outerHTML = cardHtml(BY_ID[id]);
}

function startDrill(id){
  mode[id] = 'drill';
  revealed[id] = new Set();
}

document.getElementById('contentArea').addEventListener('click', e => {
  const card = e.target.closest('.mn-card');
  if(!card) return;
  const id = card.dataset.id;
  const btn = e.target.closest('[data-act]');
  if(btn){
    const act = btn.dataset.act;
    if(act === 'list') mode[id] = mode[id] === 'open' ? 'closed' : 'open';
    else if(act === 'drill'){ if(mode[id] === 'drill') mode[id] = 'closed'; else startDrill(id); }
    else if(act === 'reveal') revealed[id] = new Set(BY_ID[id].items.map((_, i) => i));
    else if(act === 'again') revealed[id] = new Set();
    redraw(id);
    return;
  }
  const line = e.target.closest('li.hid');
  if(line){
    revealed[id].add(Number(line.dataset.i));
    redraw(id);
  }
});

document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('[data-cat]');
  if(!chip) return;
  activeCat = chip.dataset.cat;
  render();
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  render();
});

function focusCard(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'start' });
  el.classList.add('flash');
}

document.getElementById('randomBtn').addEventListener('click', () => {
  if(!LIST.length) return;
  const m = LIST[Math.floor(Math.random() * LIST.length)];
  activeCat = 'all'; query = '';
  document.getElementById('search').value = '';
  startDrill(m.id);
  render();
  focusCard(m.id);
});

(async function boot(){
  try{
    const res = await fetch('data/mnemonics.json', { cache: 'no-cache' });
    LIST = await res.json();
  }catch(e){
    document.getElementById('contentArea').innerHTML = '<div class="state-note">Couldn’t load the mnemonics. Try reloading.</div>';
    return;
  }
  LIST.forEach(m => { BY_ID[m.id] = m; });
  // A link from a quiz explanation lands on its card, list open.
  const target = decodeURIComponent(location.hash.slice(1));
  if(BY_ID[target]) mode[target] = 'open';
  render();
  if(BY_ID[target]) focusCard(target);
})();
</script>
</body>
</html>
