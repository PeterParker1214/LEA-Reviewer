<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages — LEA Reviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 20px;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column;
    height:calc(100vh - 40px); height:calc(100dvh - 40px);}
  a{color:inherit;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .icon-btn-44{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; text-decoration:none;
  }
</style>
<link rel="stylesheet" href="assets/blueprint.css?v=80">
<script src="assets/theme.js?v=79" data-alt-class="light-mode" data-default-is="dark"></script>
<script src="assets/nav.js?v=79"></script>
<script src="assets/avatar.js?v=79"></script>
<script src="assets/chat.js?v=79"></script>
<script src="assets/offline.js?v=79"></script>
<script src="assets/presence.js?v=79"></script>
<script>if(window.LEAPresence) LEAPresence.init({});</script>
<link rel="stylesheet" href="assets/messenger.css?v=79">
<script src="assets/messenger-model.js?v=79"></script>
<script src="assets/messenger.js?v=79"></script>
<style>body{padding:20px 16px}.wrap{max-width:1120px;height:auto}.message-page-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.message-page-head h1{font:800 24px var(--font-display);text-transform:uppercase;margin:0}.online-count{margin-left:auto;font:11px var(--font-mono);color:var(--muted)}.online-count b{color:var(--good)}#messenger .lea-msg-heading h2{visibility:hidden}@media(max-width:700px){body{padding:12px 8px}.lea-msg-layout{height:calc(100dvh - 84px)}}</style>
</head>
<body>
<div class="wrap">
  <header class="message-page-head"><a class="icon-btn-44" href="index.html" data-back aria-label="Back to reviewer">←</a><h1>Messages</h1><span class="online-count" id="onlineCount"></span></header>
  <main id="messenger"></main>
</div>
<script>
(async function(){
  const sb=window.__leaSharedClient || supabase.createClient('https://rjrrprbvsmflzncojbtq.supabase.co','sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y');
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='index.html';return;}
  if(window.LEAPresence)LEAPresence.subscribe(names=>{document.getElementById('onlineCount').innerHTML=names.length?'<b>'+names.length+'</b> online':'';});
  const args=new URLSearchParams(location.search);
  const messenger=LEAMessenger.mount(document.getElementById('messenger'),sb,session.user,{to:args.get('to')});
  if(args.has('community')){await messenger.ready;messenger.open(null);}
  sb.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){messenger.destroy();location.href='index.html';}});
})();
</script>
</body>
</html>
