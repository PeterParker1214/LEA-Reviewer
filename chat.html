<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 20px;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column;
    height:calc(100vh - 40px); height:calc(100dvh - 40px);}
  a{color:inherit;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex:none; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:22px; text-transform:uppercase; flex:1; }
  .online-count{ font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .online-count b{ color:var(--good); font-weight:600; }

  .tabs-row{ display:flex; gap:8px; margin-bottom:12px; flex:none; }
  .tab-btn{
    flex:1; font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    padding:11px; border-radius:10px; cursor:pointer;
  }
  .tab-btn.active{ border-color:var(--gold); color:var(--gold-bright); background:color-mix(in srgb, var(--gold) 8%, transparent); }
  .tab-btn .pip{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-left:5px; vertical-align:1px; }

  .panel{ flex:1; min-height:0; display:flex; flex-direction:column;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel-head{ flex:none; display:flex; align-items:center; gap:9px; padding:10px 12px;
    border-bottom:1px solid var(--line); background:var(--bg-panel-2); }
  .panel-head .h-name{ font-family:var(--font-display); font-weight:800; font-size:18px; text-transform:uppercase; flex:1; }
  .link-btn{ background:none; border:0; color:var(--blue-bright); font-size:12px; cursor:pointer; padding:6px; }

  .stream{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding:12px; display:flex; flex-direction:column; gap:12px; }
  .msg{ display:flex; gap:9px; align-items:flex-start; }
  .msg .face{ width:30px; height:30px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--blue-bright); font-family:var(--font-display); }
  .msg .face img{ width:100%; height:100%; object-fit:cover; }
  .msg .col{ min-width:0; max-width:82%; }
  .msg .bub{ background:var(--bg-panel-2); border:1px solid var(--line);
    border-radius:2px 12px 12px 12px; padding:8px 11px; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
  .msg .who{ display:inline-block; font-size:11px; color:var(--blue); font-family:var(--font-mono);
    margin-bottom:2px; text-decoration:none; }
  .msg .who:hover{ color:var(--blue-bright); text-decoration:underline; }
  .panel-head .h-name a{ color:inherit; text-decoration:none; }
  .msg .at{ font-size:10px; color:var(--muted); font-family:var(--font-mono); margin-top:3px; }
  .msg.mine{ flex-direction:row-reverse; }
  .msg.mine .bub{ background:color-mix(in srgb, var(--gold) 12%, transparent);
    border-color:color-mix(in srgb, var(--gold) 38%, transparent); border-radius:12px 2px 12px 12px; }
  .msg.mine .at{ text-align:right; }
  .msg .shot{ display:block; max-width:100%; margin-top:6px; border-radius:8px; border:1px solid var(--line); }
  .msg .bin{ background:none; border:0; color:var(--muted); font-size:11px; cursor:pointer;
    padding:2px 4px; font-family:var(--font-mono); }
  .msg .bin:hover{ color:var(--bad); }

  .compose{ flex:none; display:flex; gap:8px; align-items:flex-end; padding:10px;
    border-top:1px solid var(--line); background:var(--bg-panel-2); }
  .compose textarea{
    flex:1; resize:none; max-height:110px; font-family:inherit; font-size:16px; line-height:1.4;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:20px; padding:9px 13px; color:var(--ink);
  }
  .compose textarea:disabled{ opacity:.5; }
  .pick{ width:38px; height:38px; flex:none; border-radius:50%; cursor:pointer;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center; }
  .pick svg{ width:18px; height:18px; }
  .send{ width:38px; height:38px; flex:none; border-radius:50%; border:0; cursor:pointer;
    background:var(--gold); color:#1a1206; font-weight:700; font-size:17px; }
  .send:disabled{ opacity:.45; cursor:default; }
  .draft-shot{ flex:none; display:flex; align-items:center; gap:9px; padding:8px 10px;
    border-top:1px solid var(--line); background:var(--bg-panel-2); font-size:12px; color:var(--muted); }
  .draft-shot img{ width:42px; height:42px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }

  .thread-row{ display:flex; gap:10px; align-items:center; padding:11px 12px; cursor:pointer;
    border-bottom:1px solid var(--line); background:none; border-left:0; border-right:0; border-top:0;
    width:100%; text-align:left; color:inherit; }
  .thread-row .face{ width:36px; height:36px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:var(--bg-panel-2);
    border:1px solid var(--line); color:var(--blue-bright); font-family:var(--font-display); font-weight:800; }
  .thread-row .face img{ width:100%; height:100%; object-fit:cover; }
  .thread-row .x{ flex:1; min-width:0; }
  .thread-row .nm{ font-size:14px; font-weight:600; }
  .thread-row .pv{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thread-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); flex:none; }

  .state-note{ padding:26px 16px; text-align:center; color:var(--muted); font-size:13px; line-height:1.6; }
  .state-note code{ font-family:var(--font-mono); font-size:12px; }
  .say{ flex:none; padding:8px 12px; font-size:12px; color:var(--bad); background:var(--bg-panel-2);
    border-top:1px solid var(--line); }

  .finder{ flex:none; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg-panel-2); }
  .finder input{ width:100%; font-family:inherit; font-size:16px; padding:9px 12px; color:var(--ink);
    background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; }
</style>

<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="index.html" title="Back" data-back>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title">Chat</div>
    <div class="online-count" id="onlineCount"></div>
  </div>

  <div class="tabs-row" id="tabsRow">
    <button class="tab-btn active" type="button" data-tab="lobby">Lobby</button>
    <button class="tab-btn" type="button" data-tab="dm">Messages</button>
  </div>

  <div class="panel">
    <div class="panel-head hidden" id="panelHead">
      <button class="link-btn" type="button" id="threadBack">&#8592; Messages</button>
      <div class="h-name" id="threadName"></div>
    </div>
    <div class="finder hidden" id="finder">
      <input id="finderInput" type="search" placeholder="Search a name to message&hellip;" autocomplete="off" spellcheck="false">
    </div>
    <div class="stream" id="stream"><div class="state-note">Loading&hellip;</div></div>
    <div class="say hidden" id="say"></div>
    <div class="draft-shot hidden" id="draftShot"></div>
    <div class="compose hidden" id="compose">
      <button class="pick" type="button" id="pickBtn" title="Send a picture or GIF" aria-label="Send a picture or GIF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-6 6"/></svg>
      </button>
      <input id="pickInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
      <textarea id="draft" rows="1" maxlength="1000" placeholder="Message the lobby&hellip;"></textarea>
      <button class="send" type="button" id="sendBtn" aria-label="Send" disabled>&#8594;</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SEEN_KEY = 'lea_chat_seen';
const PAGE = 60;

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const state = {
  me: null, isAdmin: false,
  tab: 'lobby',
  openThread: undefined,   // undefined = thread list, null = lobby, id = that person
  lobby: [], dms: [],
  people: new Map(),       // user id -> { username, avatar_url }
  draftImage: null,        // { url, name } already uploaded, waiting to be sent
  finding: ''
};

function seenMap(){
  try{ return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); }catch(e){ return {}; }
}
function markSeen(who, id){
  if(who == null) return;
  const m = seenMap();
  if(Number(m[who] || 0) >= Number(id)) return;
  m[who] = id;
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(m)); }catch(e){}
}

function person(id){ return state.people.get(id) || { username: 'Someone', avatar_url: null }; }
function faceHtml(id){
  const p = person(id);
  return window.LEAAvatar ? LEAAvatar.faceHtml(p.avatar_url, p.username) : escapeHtml((p.username || '?')[0]);
}

function note(html){ document.getElementById('stream').innerHTML = '<div class="state-note">' + html + '</div>'; }
function say(text){
  const el = document.getElementById('say');
  el.textContent = text || '';
  el.classList.toggle('hidden', !text);
  if(text) setTimeout(() => { if(el.textContent === text){ el.textContent = ''; el.classList.add('hidden'); } }, 4000);
}

// ---------------------------------------------------------------- loading

// Everyone's name and face in one go. The site has one small community, so
// ponytail: the whole profile list is fetched once rather than joined per
// message — switch to an embedded select if the member list ever gets long.
async function loadPeople(){
  const { data } = await sb.from('profiles').select('id,username,avatar_url');
  (data || []).forEach(p => state.people.set(p.id, p));
}

async function loadMessages(){
  const lobby = sb.from('chat_messages').select('id,user_id,to_user,body,image_url,created_at')
    .is('to_user', null).order('id', { ascending:false }).limit(PAGE);
  const mine = sb.from('chat_messages').select('id,user_id,to_user,body,image_url,created_at')
    .not('to_user', 'is', null).order('id', { ascending:false }).limit(200);
  const [a, b] = await Promise.all([lobby, mine]);
  if(a.error || b.error) throw (a.error || b.error);
  state.lobby = (a.data || []).slice().reverse();
  state.dms = b.data || [];
}

// ---------------------------------------------------------------- drawing

function msgHtml(m){
  const mine = m.user_id === state.me;
  const canDelete = mine || state.isAdmin;
  return '<div class="msg' + (mine ? ' mine' : '') + '" data-id="' + m.id + '">' +
      '<div class="face">' + faceHtml(m.user_id) + '</div>' +
      '<div class="col">' +
        '<div class="bub">' +
          (mine || state.tab !== 'lobby' ? '' : '<a class="who" href="user.html?u=' + escapeHtml(m.user_id) + '">' + escapeHtml(person(m.user_id).username) + '</a>') +
          (m.body ? escapeHtml(m.body) : '') +
          (m.image_url ? '<img class="shot" src="' + escapeHtml(m.image_url) + '" alt="" loading="lazy">' : '') +
        '</div>' +
        '<div class="at">' + escapeHtml(LEAChat.shortTime(m.created_at)) +
          (canDelete ? ' <button class="bin" type="button" data-del="' + m.id + '">Delete</button>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
}

function drawStream(messages, emptyText){
  const stream = document.getElementById('stream');
  const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80;
  stream.innerHTML = messages.length
    ? messages.map(msgHtml).join('')
    : '<div class="state-note">' + emptyText + '</div>';
  stream.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => remove(Number(b.dataset.del)));
  });
  if(atBottom) stream.scrollTop = stream.scrollHeight;
}

function drawThreadList(){
  const seen = seenMap();
  const threads = LEAChat.groupThreads(state.dms, state.me, seen);
  const q = state.finding.trim().toLowerCase();

  // With a search term the list becomes people rather than threads, so a
  // first message to someone you have never written to is the same gesture.
  const rows = q
    ? Array.from(state.people.values())
        .filter(p => p.id !== state.me && (p.username || '').toLowerCase().includes(q))
        .slice(0, 30)
        .map(p => ({ userId: p.id, last: null, unread: false }))
    : threads;

  const stream = document.getElementById('stream');
  if(!rows.length){
    stream.innerHTML = '<div class="state-note">' +
      (q ? 'Nobody by that name.' : 'No messages yet. Search a name above to start one.') + '</div>';
    return;
  }
  stream.innerHTML = rows.map(t => {
    const last = t.last;
    const preview = !last ? 'Say hello'
      : (last.user_id === state.me ? 'You: ' : '') + (last.body || 'Picture');
    return '<button class="thread-row" type="button" data-who="' + escapeHtml(t.userId) + '">' +
        '<div class="face">' + faceHtml(t.userId) + '</div>' +
        '<div class="x"><div class="nm">' + escapeHtml(person(t.userId).username) + '</div>' +
        '<div class="pv">' + escapeHtml(preview) + '</div></div>' +
        (t.unread ? '<div class="dot"></div>' : '') +
      '</button>';
  }).join('');
  stream.querySelectorAll('[data-who]').forEach(b => {
    b.addEventListener('click', () => openThread(b.dataset.who));
  });
}

function render(){
  const showList = state.tab === 'dm' && state.openThread === undefined;
  document.getElementById('finder').classList.toggle('hidden', !showList);
  document.getElementById('compose').classList.toggle('hidden', showList);
  document.getElementById('panelHead').classList.toggle('hidden', !(state.tab === 'dm' && state.openThread));

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const unread = LEAChat.groupThreads(state.dms, state.me, seenMap()).some(t => t.unread);
  document.querySelector('[data-tab="dm"]').innerHTML = 'Messages' + (unread ? '<span class="pip"></span>' : '');

  if(showList){ drawThreadList(); return; }

  const who = state.tab === 'lobby' ? null : state.openThread;
  const pool = who === null ? state.lobby : state.dms;
  const list = LEAChat.threadMessages(pool, state.me, who);
  if(who !== null){
    document.getElementById('threadName').innerHTML =
      '<a href="user.html?u=' + escapeHtml(who) + '">' + escapeHtml(person(who).username) + '</a>';
    if(list.length) markSeen(who, list[list.length - 1].id);
  }
  document.getElementById('draft').placeholder =
    who === null ? 'Message the lobby…' : 'Message ' + person(who).username + '…';
  drawStream(list, who === null ? 'Nothing in the lobby yet. Say the first thing.' : 'No messages yet.');
}

function openThread(who){
  state.openThread = who;
  state.finding = '';
  document.getElementById('finderInput').value = '';
  render();
  document.getElementById('draft').focus();
}

// ---------------------------------------------------------------- sending

function refreshSendButton(){
  const ready = !!LEAChat.sendable(document.getElementById('draft').value, state.draftImage && state.draftImage.url);
  document.getElementById('sendBtn').disabled = !ready;
}

async function send(){
  const draft = document.getElementById('draft');
  const payload = LEAChat.sendable(draft.value, state.draftImage && state.draftImage.url);
  if(!payload) return;
  const to = state.tab === 'lobby' ? null : state.openThread;
  if(state.tab === 'dm' && !to) return;

  document.getElementById('sendBtn').disabled = true;
  const { error } = await sb.from('chat_messages').insert({ ...payload, to_user: to, user_id: state.me });
  if(error){
    // The rate limit in the insert policy shows up as a plain policy refusal.
    say(/row-level security/i.test(error.message) ? 'Slow down a moment, then send again.' : error.message);
    refreshSendButton();
    return;
  }
  draft.value = '';
  draft.style.height = 'auto';
  clearDraftImage();
  refreshSendButton();
}

async function remove(id){
  const { error } = await sb.from('chat_messages').delete().eq('id', id);
  if(error){ say(error.message); return; }
  state.lobby = state.lobby.filter(m => m.id !== id);
  state.dms = state.dms.filter(m => m.id !== id);
  render();
}

function clearDraftImage(){
  state.draftImage = null;
  const el = document.getElementById('draftShot');
  el.innerHTML = '';
  el.classList.add('hidden');
}

async function pickImage(file){
  const problem = LEAChat.imageProblem(file);
  if(problem){ say(problem); return; }
  const el = document.getElementById('draftShot');
  el.classList.remove('hidden');

  // A picture over the limit is resized here rather than refused. A GIF
  // never gets this far — imageProblem() turns an oversized one away,
  // because a canvas would keep one frame and drop the animation.
  if(LEAChat.needsShrinking(file)){
    el.textContent = 'Resizing…';
    try{ file = await LEAChat.shrinkToFit(file); }
    catch(e){ say('That picture could not be resized. Try saving it smaller.'); clearDraftImage(); return; }
  }

  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = state.me + '/' + Date.now() + '.' + ext;
  el.textContent = 'Uploading…';

  const up = await sb.storage.from('chat-images').upload(path, file, { contentType: file.type, cacheControl: '3600' });
  if(up.error){ say(up.error.message); clearDraftImage(); return; }
  const url = sb.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
  state.draftImage = { url, path };
  el.innerHTML = '<img src="' + escapeHtml(url) + '" alt="">' +
    '<span>Picture ready</span><button class="link-btn" type="button" id="dropShot">Remove</button>';
  document.getElementById('dropShot').addEventListener('click', () => { clearDraftImage(); refreshSendButton(); });
  refreshSendButton();
}

// ---------------------------------------------------------------- live

function watch(){
  sb.channel('chat-stream')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chat_messages' }, ({ new: m }) => {
      if(m.to_user == null) state.lobby.push(m); else state.dms.unshift(m);
      render();
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'chat_messages' }, ({ old: m }) => {
      state.lobby = state.lobby.filter(x => x.id !== m.id);
      state.dms = state.dms.filter(x => x.id !== m.id);
      render();
    })
    .subscribe();
}

// ---------------------------------------------------------------- wiring

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    state.openThread = state.tab === 'dm' ? undefined : null;
    render();
  });
});
document.getElementById('threadBack').addEventListener('click', () => {
  state.openThread = undefined;
  render();
});
document.getElementById('finderInput').addEventListener('input', e => {
  state.finding = e.target.value;
  drawThreadList();
});
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('pickBtn').addEventListener('click', () => document.getElementById('pickInput').click());
document.getElementById('pickInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file) pickImage(file);
});
const draftEl = document.getElementById('draft');
draftEl.addEventListener('input', () => {
  draftEl.style.height = 'auto';
  draftEl.style.height = Math.min(draftEl.scrollHeight, 110) + 'px';
  refreshSendButton();
});
draftEl.addEventListener('keydown', e => {
  // Enter sends on a desktop keyboard; on a phone Enter is a new line.
  if(e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); }
});
draftEl.addEventListener('paste', e => {
  const item = Array.from(e.clipboardData ? e.clipboardData.files : []).find(f => f.type.startsWith('image/'));
  if(item){ e.preventDefault(); pickImage(item); }
});

if(window.LEAPresence){
  LEAPresence.subscribe(names => {
    document.getElementById('onlineCount').innerHTML = names.length ? '<b>' + names.length + '</b> online' : '';
  });
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  state.me = session.user.id;

  // chat.html?to=<id> is where the Message button on a member's page lands.
  const wanted = new URLSearchParams(location.search).get('to');
  if(wanted && wanted !== state.me){ state.tab = 'dm'; state.openThread = wanted; }

  try{
    const { data: mine } = await sb.from('profiles').select('is_admin').eq('id', state.me).single();
    state.isAdmin = !!(mine && mine.is_admin === true);
    await loadPeople();
    await loadMessages();
  }catch(e){
    // Before chat-setup.sql is run the table is simply not there yet.
    note(/chat_messages/.test(e.message || '')
      ? 'Chat is not switched on yet. Run <code>design_handoff_lea_reviewer/chat-setup.sql</code> in Supabase.'
      : escapeHtml(e.message || 'Could not load chat.'));
    return;
  }
  render();
  watch();
})();
</script>
</body>
</html>
