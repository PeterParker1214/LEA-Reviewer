<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LEA Reviewer">
  <!--
    Bahay kubo, drawn for this app. Original work — no third-party artwork and
    nothing to attribute.

    Built as SOLID SHAPES rather than line work on purpose. A favicon is read
    at 16px, where a 4x downscale turns any stroke thin enough to grey out;
    filled masses keep their edges. The window and the gaps between the posts
    are cut in the plate colour so the whole mark survives being shrunk.

    The dark rounded plate is deliberate too: a browser tab may be light or
    dark, and bare gold vanishes against one of them.
  -->
  <rect width="64" height="64" rx="12" fill="#0a1218"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="10.75" fill="none"
        stroke="#e0a83f" stroke-width="2" opacity=".45"/>

  <g fill="#f0c268">
    <!-- Nipa roof. A hip roof, so the top is a short ridge rather than a
         point — that is the shape a bahay kubo actually has, and the flat
         run of pixels also survives the downscale better than an apex. -->
    <path d="M26.5 9 h11 L58 33 H6 Z"/>
    <!-- Walls. -->
    <path d="M17 33 h30 v13 H17 Z"/>
    <!-- Silong posts holding the house off the ground. -->
    <path d="M19.5 46 h4.2 v9 h-4.2 Z"/>
    <path d="M29.9 46 h4.2 v9 h-4.2 Z"/>
    <path d="M40.3 46 h4.2 v9 h-4.2 Z"/>
    <!-- Ground. -->
    <path d="M11 55.5 h42 v3 H11 Z"/>
  </g>

  <!-- Window, cut back to the plate so it stays a hole at any size. -->
  <path d="M27.4 36 h9.2 v6.6 h-9.2 Z" fill="#0a1218"/>
</svg>
