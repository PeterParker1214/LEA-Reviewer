<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LEA Reviewer — SFX Preview</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f8fb}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(760px,100%);background:#fff;border:1px solid #dfe5ee;border-radius:20px;padding:28px;box-shadow:0 16px 50px rgba(25,45,80,.08)}h1{margin:0 0 8px;font-size:28px}.sub{margin:0 0 24px;color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}button{border:1px solid #cfd7e5;background:#fff;border-radius:12px;padding:14px;font:inherit;cursor:pointer;text-align:left}button:hover{background:#f7f9fc}.section{padding:20px 0;border-top:1px solid #e8ecf2}.section:first-of-type{border-top:0;padding-top:0}.tag{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#667085}label{display:flex;justify-content:space-between;gap:16px;margin:16px 0 6px;font-size:14px;font-weight:600}input[type=range]{width:100%}.status{margin-top:18px;padding:12px 14px;border-radius:12px;background:#f3f5f8;color:#475467;font-size:14px}.note{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff8e6;color:#6b4d00;font-size:13px}small{color:#667085}
</style></head>
<body><main class="card"><h1>LEA Reviewer SFX Preview</h1><p class="sub">Real Mixkit SFX selected for the reviewer. Background music is intentionally parked.</p>
<section class="section"><div class="tag">Approved</div><h2>Quiz sounds</h2><div class="grid">
<button data-sfx="wrong">❌ Kids cartoon close bells<br><small>Wrong answer</small></button>
<button data-sfx="correct">✅ Achievement bell<br><small>Correct answer</small></button>
<button data-sfx="next">➡️ Arcade score interface<br><small>Enter another question</small></button>
<button data-sfx="complete">🏁 Uplifting bells notification<br><small>Finish a module</small></button>
</div></section>
<section class="section"><label for="sfxVolume"><span>SFX volume</span><span id="sfxValue">70%</span></label><input id="sfxVolume" type="range" min="0" max="1" step="0.01" value="0.70"><button id="mute" style="margin-top:12px">Mute / unmute</button></section>
<div class="note">Background music remains disabled. These are the four SFX selected for the reviewer.</div><div class="status" id="status">Click a sound to preview it.</div></main>
<script src="assets/audio.js?v=66"></script><script>
const statusEl=document.getElementById('status'),sfxVolume=document.getElementById('sfxVolume'),sfxValue=document.getElementById('sfxValue');LEAAudio.init();function setStatus(m){statusEl.textContent=m}
document.querySelectorAll('[data-sfx]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.sfx;LEAAudio.unlock();LEAAudio.playSfx(n);setStatus('Previewing: '+n)}));
document.getElementById('mute').addEventListener('click',()=>{const muted=LEAAudio.toggleMute();setStatus(muted?'Audio muted.':'Audio unmuted.')});sfxVolume.addEventListener('input',e=>{LEAAudio.setSfxVolume(e.target.value);sfxValue.textContent=Math.round(Number(e.target.value)*100)+'%'});
</script></body></html>
