<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img"
     aria-label="A uniformly varying triangular load on a beam, zero at the left end rising to w at the right, with its resultant W acting at the centroid and reactions R1 and R2">
  <!-- Uniformly varying (triangular) load. Drawn for this app; standard
       engineering notation. The resultant is shown at the centroid of the
       triangle — two thirds of the span from the zero end — because that is
       what the question asks the reader to find. -->
  <style>
    .ink{ fill:none; stroke:#1b2a38; stroke-width:2; stroke-linecap:round; }
    .beam{ fill:#b9c6d2; stroke:#1b2a38; stroke-width:2.2; }
    .tri{ fill:#e2d3a8; stroke:#1b2a38; stroke-width:2; }
    .load{ fill:none; stroke:#1b2a38; stroke-width:1.6; }
    .res{ fill:none; stroke:#8a5a1c; stroke-width:3.2; stroke-linecap:round; }
    .dim{ fill:none; stroke:#5d6f80; stroke-width:1.4; }
    .t{ font-family:Georgia,'Times New Roman',serif; font-size:15px; fill:#1b2a38; }
    .ti{ font-family:Georgia,'Times New Roman',serif; font-size:16px; font-style:italic; font-weight:700; fill:#1b2a38; }
    .tr{ font-family:Georgia,'Times New Roman',serif; font-size:16px; font-style:italic; font-weight:700; fill:#8a5a1c; }
    .td{ font-family:Georgia,'Times New Roman',serif; font-size:13px; fill:#5d6f80; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a38"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a1c"/>
    </marker>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d6f80"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#5d6f80"/>
    </marker>
  </defs>

  <rect width="560" height="230" fill="#f5f3ed"/>

  <!-- the load triangle: zero at the left, full intensity at the right -->
  <path class="tri" d="M80 116 L480 30 L480 116 z"/>
  <g class="load" marker-end="url(#a)">
    <line x1="130" y1="106" x2="130" y2="116"/>
    <line x1="180" y1="95" x2="180" y2="116"/>
    <line x1="230" y1="84" x2="230" y2="116"/>
    <line x1="280" y1="73" x2="280" y2="116"/>
    <line x1="330" y1="62" x2="330" y2="116"/>
    <line x1="380" y1="52" x2="380" y2="116"/>
    <line x1="430" y1="41" x2="430" y2="116"/>
  </g>
  <text class="t" x="74" y="112" text-anchor="end">0</text>
  <text class="ti" x="492" y="30">w</text>
  <text class="t" x="508" y="30">kN/m</text>

  <!-- resultant, at the centroid: two thirds along from the zero end -->
  <line class="res" x1="347" y1="18" x2="347" y2="108" marker-end="url(#ao)"/>
  <text class="tr" x="347" y="14" text-anchor="middle">W</text>

  <rect class="beam" x="80" y="116" width="400" height="12"/>

  <!-- reactions -->
  <line class="ink" x1="80" y1="176" x2="80" y2="134" marker-end="url(#a)"/>
  <line class="ink" x1="480" y1="176" x2="480" y2="134" marker-end="url(#a)"/>
  <text class="ti" x="80" y="196" text-anchor="middle">R</text>
  <text class="td" x="92" y="200">1</text>
  <text class="ti" x="480" y="196" text-anchor="middle">R</text>
  <text class="td" x="492" y="200">2</text>

  <!-- span -->
  <line class="dim" x1="80" y1="214" x2="480" y2="214" marker-start="url(#d2)" marker-end="url(#d1)"/>
  <text class="ti" x="280" y="210" text-anchor="middle">L</text>
</svg>
