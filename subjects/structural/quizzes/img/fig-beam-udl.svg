<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img"
     aria-label="Simply supported beam carrying a uniformly distributed load w over a span L, pin support at A, roller support at B">
  <!-- Simply supported beam under a uniform load. Drawn for this app; standard
       engineering notation, so there is nothing here that belongs to anyone. -->
  <style>
    .ink{ fill:none; stroke:#1b2a38; stroke-width:2; stroke-linecap:round; }
    .beam{ fill:#b9c6d2; stroke:#1b2a38; stroke-width:2.2; }
    .load{ fill:none; stroke:#1b2a38; stroke-width:1.8; }
    .dim{ fill:none; stroke:#5d6f80; stroke-width:1.4; }
    .t{ font-family:Georgia,'Times New Roman',serif; font-size:15px; fill:#1b2a38; }
    .ti{ font-family:Georgia,'Times New Roman',serif; font-size:16px; font-style:italic; font-weight:700; fill:#1b2a38; }
    .td{ font-family:Georgia,'Times New Roman',serif; font-size:13px; fill:#5d6f80; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b2a38"/>
    </marker>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5d6f80"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#5d6f80"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5d6f80" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="560" height="210" fill="#f5f3ed"/>

  <!-- the load: a rail with arrows down onto the beam -->
  <text class="ti" x="280" y="26" text-anchor="middle">w kN/m</text>
  <line class="load" x1="80" y1="42" x2="480" y2="42"/>
  <g class="load" marker-end="url(#a)">
    <line x1="80" y1="42" x2="80" y2="82"/>
    <line x1="140" y1="42" x2="140" y2="82"/>
    <line x1="200" y1="42" x2="200" y2="82"/>
    <line x1="260" y1="42" x2="260" y2="82"/>
    <line x1="320" y1="42" x2="320" y2="82"/>
    <line x1="380" y1="42" x2="380" y2="82"/>
    <line x1="440" y1="42" x2="440" y2="82"/>
    <line x1="480" y1="42" x2="480" y2="82"/>
  </g>

  <rect class="beam" x="80" y="88" width="400" height="12"/>

  <!-- A: pin support, drawn as a triangle on hatched ground -->
  <text class="t" x="62" y="96">A</text>
  <path class="beam" d="M80 100 L62 132 L98 132 z"/>
  <rect x="52" y="132" width="56" height="12" fill="url(#hatch)" stroke="#5d6f80" stroke-width="1.4"/>

  <!-- B: roller support, the one the question asks about -->
  <text class="t" x="490" y="96">B</text>
  <path class="beam" d="M480 100 L462 124 L498 124 z"/>
  <circle class="beam" cx="470" cy="131" r="7"/>
  <circle class="beam" cx="490" cy="131" r="7"/>
  <rect x="452" y="138" width="56" height="12" fill="url(#hatch)" stroke="#5d6f80" stroke-width="1.4"/>

  <!-- span -->
  <line class="dim" x1="80" y1="176" x2="480" y2="176" marker-start="url(#d2)" marker-end="url(#d1)"/>
  <line class="dim" x1="80" y1="150" x2="80" y2="182"/>
  <line class="dim" x1="480" y1="156" x2="480" y2="182"/>
  <text class="ti" x="280" y="197" text-anchor="middle">L</text>
  <text class="td" x="296" y="197">m</text>
</svg>
