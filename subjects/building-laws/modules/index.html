<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="../../../favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="../../../favicon-16x16.png" sizes="16x16">
<link rel="icon" href="../../../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../../apple-touch-icon.png">
<link rel="manifest" href="../../../site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Laws — Modules</title>
<style>
  :root{
    --ink: #f6f1e6; --bg-deep: #090c0a; --bg-panel: rgba(255,255,255,0.035); --bg-glow1: #12140f; --bg-glow2: #0b0d0a;
    --clay: #e8a13c; --clay-bright: #f6c667; --turq: #e2933a; --sand: #ffcf85; --line: rgba(255,255,255,0.09);
    --bg-panel-deep: rgba(255,255,255,0.015); --font-head: 'Fredoka', sans-serif; --font-body: 'Quicksand', sans-serif;
  }
  body.light-mode{
    --ink: #241c10; --bg-deep: #f3ede0; --bg-panel: rgba(36,28,16,0.04); --bg-glow1: #e9e0cc; --bg-glow2: #f6f1e6;
    --clay: #a3691b; --clay-bright: #8a5417; --turq: #8a5417; --sand: #c98a2c;
    --line: rgba(36,28,16,0.12); --bg-panel-deep: rgba(36,28,16,0.02);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 15% 0%, var(--bg-glow1) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 100%, var(--bg-glow2) 0%, transparent 50%), var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:40px 16px 64px;
    transition: background-color .2s ease, color .2s ease;
  }
  .theme-toggle{
    background:none; border:1px solid var(--line); color:var(--sand);
    font-family:var(--font-body); font-size:14px; width:30px; height:30px;
    border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; line-height:1;
    vertical-align:middle; margin-left:10px;
  }
  .theme-toggle:hover{ border-color:var(--clay-bright); color:var(--clay-bright); }
  .wrap{width:100%; max-width:720px;} a{color:inherit;}
  .auth-bar{ font-size:13px; color:var(--sand); margin-bottom:26px; }
  .auth-link{ color:var(--turq); text-decoration:underline; }
  .masthead{ text-align:center; margin-bottom:22px; }
  .masthead .eyebrow{ letter-spacing:0.28em; font-size:11px; text-transform:uppercase; color:var(--clay-bright); opacity:0.9; }
  .masthead h1{ font-family:var(--font-head); font-weight:700; font-size:28px; margin:8px 0 4px; }
  .panel{
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-deep));
    border:1px solid var(--line); border-radius:10px; padding:36px 24px; text-align:center;
  }
  .panel p{ color:var(--sand); font-size:13.5px; line-height:1.6; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../../assets/presence.js"></script>
<script src="../../../assets/theme.js"></script>


<style id="glass-revamp">
  :root{ --radius-lg: 22px; --radius-md: 16px; --radius-sm: 10px; }
  body{ transition: background-color .3s ease, color .3s ease; }

  [class*="panel"], [class*="card"]:not(.leaderboard-list), [class*="box"]:not(.modal-overlay),
  [class*="module-card"], [class*="insight"], [class*="toolbar"]:not(.toolbar-actions),
  [class*="auth-bar"], [class*="results"], [class*="quiz-area"], [class*="feedback"],
  [class*="modal-box"], [class*="overall-card"], [class*="note-panel"], .mistakes-review,
  .leaderboard-list, .options label, .breakdown {
    background:
      linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)),
      #10140f !important;
    -webkit-backdrop-filter: blur(4px) !important;
    backdrop-filter: blur(4px) !important;
    border: 1px solid var(--line, rgba(255,255,255,0.09)) !important;
    border-left-width: 1px !important;
    border-radius: var(--radius-lg) !important;
    clip-path: none !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45) !important;
  }
  body.light-mode [class*="panel"], body.light-mode [class*="card"]:not(.leaderboard-list),
  body.light-mode [class*="box"]:not(.modal-overlay), body.light-mode [class*="module-card"],
  body.light-mode [class*="insight"], body.light-mode [class*="toolbar"]:not(.toolbar-actions),
  body.light-mode [class*="auth-bar"], body.light-mode [class*="results"],
  body.light-mode [class*="quiz-area"], body.light-mode [class*="feedback"],
  body.light-mode [class*="modal-box"], body.light-mode [class*="overall-card"],
  body.light-mode [class*="note-panel"], body.light-mode .mistakes-review,
  body.light-mode .leaderboard-list, body.light-mode .options label, body.light-mode .breakdown {
    background:
      linear-gradient(155deg, rgba(36,28,16,0.045), rgba(36,28,16,0.015)),
      #faf6ec !important;
    box-shadow: 0 10px 26px rgba(36,28,16,0.10) !important;
  }

  /* module-card: drop per-module rainbow accents, unify to gold, square off the asymmetric radius */
  [class*="module-card"]{
    border-left-width: 1px !important;
  }
  [class*="module-card"] .eyebrow, [class*="module-card"] .best-badge,
  .insight-box .insight-name, .insight-tag {
    color: #f0c169 !important;
  }
  body.light-mode [class*="module-card"] .eyebrow, body.light-mode [class*="module-card"] .best-badge,
  body.light-mode .insight-box .insight-name, body.light-mode .insight-tag {
    color: #8a5417 !important;
  }

  /* progress / mastery bars: unified gold-amber gradient fill */
  [class*="mastery-fill"]:not(.complete), [class*="overall-bar-fill"], [class*="bar-fill"]:not(.complete),
  [class*="progress-fill"]:not(.complete), [class*="mp-bar-fill"]:not(.complete) {
    background: linear-gradient(90deg, #e8a13c, #f6c667) !important;
  }

  button, .theme-toggle, [class*="btn"], [class*="tab"], .step-frieze, input, select, textarea {
    border-radius: var(--radius-md) !important;
  }
  .theme-toggle{ border-radius: 999px !important; }
  [class*="btn"], .primary, button.primary, .auth-tab.active, [class*="tab"].active,
  .order-toggle button.active {
    border-radius: 999px !important;
  }
  [class*="module-card"] img, .card img { border-radius: var(--radius-sm) !important; }
</style>

</head>
<body>
<script>
if (window.LEAPresence) { LEAPresence.init(); }
if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark', buttonId:'themeToggleBtn' }); }
</script>
<div class="wrap">
  <div class="auth-bar"><a class="auth-link" href="../index.html">&larr; Building Laws</a><button class="theme-toggle" id="themeToggleBtn" title="Toggle dark / light mode">☀️</button></div>
  <div class="masthead">
    <div class="eyebrow">Module Compendium</div>
    <h1>Building Laws — Modules</h1>
  </div>
  <div class="panel">
    <p>No modules have been added yet. This folder is ready for module content once it's compiled.</p>
  </div>
</div>
</body>
</html>
