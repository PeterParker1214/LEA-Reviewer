<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member — LEA Reviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Architects+Daughter&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-hand: 'Architects Daughter', cursive;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 64px;
  }
  .wrap{width:100%; max-width:520px;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:10px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:22px; text-transform:uppercase; }

  .id{ display:flex; gap:14px; align-items:center; margin-bottom:18px; }
  .face{ width:76px; height:76px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:var(--bg-panel-2);
    border:1px solid var(--line); color:var(--gold);
    font-family:var(--font-display); font-weight:800; font-size:30px; }
  .face img{ width:100%; height:100%; object-fit:cover; }
  .name{ font-family:var(--font-display); font-weight:800; font-size:27px; line-height:1; }
  .where{ font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-top:6px; }
  .where .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:5px; }
  .where .dot.off{ background:var(--muted); }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .stat{ border:1px solid var(--line); border-radius:12px; padding:11px; text-align:center; background:var(--bg-panel); }
  .stat b{ display:block; font-family:var(--font-display); font-size:25px; font-weight:800; color:var(--gold-bright); line-height:1; }
  .stat span{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

  .act{ display:block; width:100%; text-align:center; padding:13px; border-radius:10px; cursor:pointer;
    background:var(--gold); color:#1a1206; border:1px solid var(--gold); font-weight:600; font-size:15px; margin-bottom:10px; }
  .act.ghost{ background:transparent; color:var(--blue-bright); border-color:var(--line); }

  .label{ font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.1em; margin:22px 0 8px; }
  .cmp{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg-panel); }
  .cmp-row{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-bottom:1px solid var(--line); font-size:13px; }
  .cmp-row:last-child{ border-bottom:0; }
  .cmp-row .who{ width:84px; flex:none; color:var(--muted); font-family:var(--font-mono); font-size:11px;
    text-transform:uppercase; letter-spacing:.06em; }
  .bar{ flex:1; height:9px; border-radius:5px; background:var(--bg-panel-2); border:1px solid var(--line); overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--blue); }
  .cmp-row.mine .bar i{ background:var(--gold); }
  .cmp-row .n{ width:64px; flex:none; text-align:right; font-family:var(--font-mono); font-size:12px; }

  .note{ padding:22px 16px; text-align:center; color:var(--muted); font-size:13px; line-height:1.6; }
</style>
<script src="assets/theme.js?v=67" data-alt-class="light-mode" data-default-is="dark"></script>
<script src="assets/nav.js?v=67"></script>
<script src="assets/avatar.js?v=67"></script>
<script src="assets/offline.js?v=67"></script>
<script src="assets/presence.js?v=67"></script>
<script>if(window.LEAPresence) LEAPresence.init({});</script>
</head>
<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="standings.html" title="Back" data-back>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title">Member</div>
  </div>
  <div id="card"><div class="note">Loading…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://rjrrprbvsmflzncojbtq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Everything on this page is something other people can already see: the
// name and picture from the leaderboard, and that board's own numbers. The
// streak and the saved questions are this device's, so they are not here.
const params = new URLSearchParams(location.search);
const state = { id: params.get('u'), me: null, profile: null, row: null, rank: null, mine: null };

function statsHtml(){
  const cells = [
    [state.rank != null ? '#' + state.rank : '—', 'Rank'],
    [state.row ? (state.row.total_mastered || 0).toLocaleString('en-GB') : '—', 'Mastered'],
    [state.row ? Math.round((state.row.avg_best_score || 0) * 100) + '%' : '—', 'Average']
  ];
  return '<div class="stats">' + cells.map(([v, k]) =>
    '<div class="stat"><b>' + escapeHtml(v) + '</b><span>' + k + '</span></div>').join('') + '</div>';
}

// Two bars on the same scale, so "ahead" and "behind" are visible rather
// than arithmetic. Only drawn when the board knows both of you.
function compareHtml(){
  if(!state.row || !state.mine || state.id === state.me) return '';
  const top = Math.max(1, state.row.total_mastered || 0, state.mine.total_mastered || 0);
  const row = (label, n, mine) =>
    '<div class="cmp-row' + (mine ? ' mine' : '') + '">' +
      '<span class="who">' + escapeHtml(label) + '</span>' +
      '<span class="bar"><i style="width:' + Math.max(2, Math.round((n / top) * 100)) + '%"></i></span>' +
      '<span class="n">' + n.toLocaleString('en-GB') + '</span>' +
    '</div>';
  return '<div class="label">Mastered questions</div><div class="cmp">' +
    row(state.profile.username, state.row.total_mastered || 0, false) +
    row('You', state.mine.total_mastered || 0, true) +
  '</div>';
}

function render(){
  const p = state.profile;
  const online = window.LEAPresence && LEAPresence.isOnline(p.username);
  const isMe = state.id === state.me;
  document.getElementById('card').innerHTML =
    '<div class="id">' +
      '<div class="face">' + LEAAvatar.faceHtml(p.avatar_url, p.username) + '</div>' +
      '<div>' +
        '<div class="name">' + escapeHtml(p.username || '—') + '</div>' +
        '<div class="where"><span class="dot' + (online ? '' : ' off') + '"></span>' +
          (online ? 'online now' : 'offline') + '</div>' +
      '</div>' +
    '</div>' +
    statsHtml() +
    (isMe
      ? '<a class="act ghost" href="profile.html">Edit your profile</a>'
      : '<a class="act" href="chat.html?to=' + encodeURIComponent(state.id) + '">Message</a>' +
         '<a class="act ghost" href="duel.html?new=' + encodeURIComponent(state.id) + '">Challenge to a duel</a>') +
    compareHtml();
}

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  state.me = session.user.id;
  if(!state.id){ document.getElementById('card').innerHTML = '<div class="note">No member named in the link.</div>'; return; }

  const { data: p } = await sb.from('profiles').select('id,username,avatar_url').eq('id', state.id).maybeSingle();
  if(!p){ document.getElementById('card').innerHTML = '<div class="note">No such member.</div>'; return; }
  state.profile = p;
  document.title = (p.username || 'Member') + ' — LEA Reviewer';

  // Rank, mastered and average from the same RPC the standings page reads.
  // It keys on the display name, so a missing row simply leaves the numbers
  // blank rather than guessing.
  try{
    const { data, error } = await sb.rpc('get_leaderboard');
    if(!error && data){
      const rows = data.slice().sort((a,b) => (b.total_mastered||0) - (a.total_mastered||0));
      const idx = rows.findIndex(r => r.username === p.username);
      if(idx !== -1){ state.row = rows[idx]; state.rank = idx + 1; }
      const { data: mine } = await sb.from('profiles').select('username').eq('id', state.me).single();
      if(mine) state.mine = rows.find(r => r.username === mine.username) || null;
    }
  }catch(e){}

  render();
  if(window.LEAPresence) LEAPresence.subscribe(() => { if(state.profile) render(); });
})();
</script>
</body>
</html>
