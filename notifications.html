<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">

<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef1e9; --bg-deep:#0a1218; --bg-panel:#0e1c28; --bg-panel-2:#0a1520;
    --gold:#e0a83f; --gold-bright:#f0c268; --blue:#6fa8cf; --blue-bright:#8fc4ea;
    --muted:#8b98a5; --good:#5fbf82; --bad:#e2604a; --violet:#b59be8;
    --line: rgba(111,168,207,0.20); --grid-line: rgba(111,168,207,0.09);
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  body.light-mode, :root.light-mode{
    --ink:#16202b; --bg-deep:#d3dee6; --bg-panel:#ffffff; --bg-panel-2:#e9eff4;
    --gold:#b5791f; --gold-bright:#7d520c; --blue:#2f6c95; --blue-bright:#1b4a6b;
    --muted:#4f5d6a; --good:#206b3c; --bad:#a1372a; --violet:#6a4fb0;
    --line: rgba(47,108,149,0.28); --grid-line: rgba(47,108,149,0.11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 34px),
      var(--bg-deep);
    color:var(--ink); font-family:var(--font-body); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 64px;
  }
  .wrap{width:100%; max-width:560px;}
  a{color:inherit;}
  button{font-family:inherit;}

  .run-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .icon-btn-44{
    width:44px; height:44px; border-radius:8px; background:var(--bg-panel); border:1px solid var(--line);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn-44 svg{ width:19px; height:19px; }
  .page-title{ font-family:var(--font-display); font-weight:800; font-size:28px; line-height:1; text-transform:uppercase; }

  /* One scrolling row, like Search's filters: wrapping left "Reminders" alone
     on a second line. */
  .chips{ display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; margin-bottom:16px; padding-bottom:2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  /* Fade the right edge so a chip running off it reads as "scroll", not "cut". */
  .chips{ -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  .nf-body.short{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
  .nf-list{ margin:0; padding-left:18px; font-size:14px; line-height:1.55; color:var(--ink); opacity:.9; }
  .nf-list li{ margin-bottom:4px; overflow-wrap:anywhere; }
  .chip{ flex-shrink:0; }
  .chip{
    min-height:36px; font-family:var(--font-body); font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--bg-panel); border:1px solid var(--line); color:var(--muted);
    padding:0 12px; border-radius:0; cursor:pointer; white-space:nowrap;
  }
  .chip.active{ border-color:var(--gold); color:var(--gold-bright); background:color-mix(in srgb, var(--gold) 8%, transparent); }
  .chip b{ font-weight:600; color:var(--gold-bright); margin-left:4px; }

  /* Unread is a gold outline plus the dot, not a thick left stripe. */
  /* Swipe sideways to dismiss: the card follows the finger (touch-action
     leaves vertical scrolling to the browser) and springs back if let go
     early. */
  .nf-card{ position:relative; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:0; padding:16px; margin-bottom:10px; touch-action:pan-y;
    transition:transform 300ms var(--ease-drawer), opacity 300ms var(--ease-drawer); }
  .nf-card.dragging{ transition:none; }
  .nf-card.unread{ border-color:color-mix(in srgb, var(--gold) 55%, transparent); }
  .nf-card.unread::after{ content:''; position:absolute; top:20px; right:16px; width:8px; height:8px; border-radius:50%; background:var(--gold); }
  /* Meta row: what and where on the left, when on the right. */
  .nf-top{ display:flex; gap:6px; align-items:center; font-family:var(--font-body); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; padding-right:20px; }
  .nf-kind{ font-weight:600; flex-shrink:0; }
  .nf-where{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nf-time{ margin-left:auto; flex-shrink:0; white-space:nowrap; }
  .k-message .nf-kind{ color:var(--gold-bright); }
  .k-report .nf-kind{ color:var(--good); }
  .k-update .nf-kind{ color:var(--blue-bright); }
  .k-reminder .nf-kind{ color:var(--violet); }
  .k-duel .nf-kind{ color:var(--gold); }
  .nf-title{ font-family:var(--font-display); font-weight:800; font-size:20px; line-height:1.1; text-transform:uppercase; margin-bottom:6px; text-wrap:balance; overflow-wrap:anywhere; }
  .nf-body{ font-size:14px; line-height:1.6; color:color-mix(in srgb, var(--ink) 82%, transparent); white-space:pre-wrap; overflow-wrap:anywhere; }
  .nf-open{ display:inline-flex; align-items:center; min-height:36px; margin-top:8px; font-family:var(--font-body); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold-bright); text-decoration:none; }
  .nf-open:hover{ text-decoration:underline; }
  button.nf-open{ background:none; border:none; padding:0; cursor:pointer; }
  .nf-settings{ margin-left:auto; text-align:right; font-family:var(--font-body); font-weight:600; font-size:11px; line-height:1.3; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-decoration:none; }
  .nf-settings:hover{ color:var(--gold-bright); }

  .state-note{ font-family:var(--font-body); font-size:13px; color:var(--muted); text-align:center; padding:40px 0; line-height:1.6; }
  .err-note{ font-family:var(--font-body); font-size:13px; color:var(--bad); margin-bottom:12px; }
</style>

<body>
<script>if (window.LEATheme) { LEATheme.init({ altClass:'light-mode', defaultIs:'dark' }); }</script>
<div class="wrap">
  <div class="run-header">
    <a class="icon-btn-44" href="index.html" title="Back" data-back>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="page-title" data-vt="lea-notifications" data-vt-peer="index.html">Notifications</div>
    <a class="nf-settings" href="reminders.html">Reminder settings</a>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list" class="lea-stagger"><script>document.write(LEANav.skel('cards', 4))</script></div>
</div>

<script>
const sb = supabase.createClient('https://rjrrprbvsmflzncojbtq.supabase.co', 'sb_publishable_NcOypGF5CxQgEoNWjYqOnQ_oO3NR_1Y');
const esc = LEANotify.escapeHtml;

const FILTERS = [
  { id:'all',      label:'All' },
  { id:'message',  label:'Messages' },
  { id:'report',   label:'Reports' },
  { id:'update',   label:'Updates' },
  { id:'reminder', label:'Reminders' },
  { id:'duel',     label:'Duels' }
];
const KIND_LABEL = { message:'Message', report:'Report', update:'Update', reminder:'Reminder', duel:'Duel' };
const EMPTY = {
  all:'Nothing yet. Messages, report replies, site updates and reminders will show up here.',
  message:'No messages from the admin yet.',
  report:'No replies yet. When you report a question and it gets fixed, you will hear about it here.',
  update:'No site updates yet.',
  reminder:'No reminders right now.',
  duel:'No duels waiting on you.'
};

let ITEMS = [];
let ERRORS = [];
let filter = 'all';
try{ filter = new URLSearchParams(location.search).get('show') || 'all'; }catch(e){}

function timeAgo(iso){
  if(!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s / 60) + 'm ago';
  if(s < 86400) return Math.floor(s / 3600) + 'h ago';
  if(s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

// Only same-site pages and web links are opened; anything else is ignored.
function safeHref(href){
  if(!href) return null;
  try{
    const u = new URL(href, location.href);
    return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
  }catch(e){ return null; }
}

// Site updates show their first line only; the full notes live on Profile →
// Versions, which "Read →" opens. Anything written as "• " lines becomes a real
// list, so wrapped lines line up after the bullet instead of under it.
function bodyHtml(i){
  const lines = String(i.body || '').split('\n').filter(l => l.trim());
  const isBullet = l => /^\s*•\s*/.test(l);
  if(i.kind === 'update'){
    const first = (lines[0] || '').replace(/^\s*•\s*/, '');
    return first ? '<div class="nf-body short">' + esc(first) + '</div>' : '';
  }
  if(lines.length && lines.every(isBullet)){
    return '<ul class="nf-list">' + lines.map(l => '<li>' + esc(l.replace(/^\s*•\s*/, '')) + '</li>').join('') + '</ul>';
  }
  return '<div class="nf-body">' + esc(i.body) + '</div>';
}

// Swiped-away notifications, remembered on this device only.
const DISMISS_KEY = 'lea_notify_dismissed';
function dismissedSet(){ try{ return new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || '[]')); }catch(e){ return new Set(); } }
function keyOf(i){ return i.kind + ':' + i.id; }

function render(){
  const hidden = dismissedSet();
  const shown = ITEMS.filter(i => !hidden.has(keyOf(i)));
  document.getElementById('chips').innerHTML = FILTERS.map(f => {
    const n = shown.filter(i => (f.id === 'all' || i.kind === f.id) && i.unread).length;
    return '<button class="chip' + (filter === f.id ? ' active' : '') + '" data-f="' + f.id + '">' + f.label + (n ? '<b>' + n + '</b>' : '') + '</button>';
  }).join('');
  document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => { filter = btn.dataset.f; render(); }));

  const list = shown.filter(i => filter === 'all' || i.kind === filter);
  const errHtml = ERRORS.length ? '<div class="err-note">Some notifications could not load. Try again in a moment.</div>' : '';
  if(!list.length){
    document.getElementById('list').innerHTML = errHtml + '<div class="state-note">' + EMPTY[filter] + '</div>';
    return;
  }
  document.getElementById('list').innerHTML = errHtml + list.map(i => {
    const href = safeHref(i.href);
    const external = href && new URL(href).origin !== location.origin;
    return '<div class="nf-card k-' + i.kind + (i.unread ? ' unread' : '') + '" data-key="' + esc(keyOf(i)) + '">' +
      '<div class="nf-top"><span class="nf-kind">' + KIND_LABEL[i.kind] + '</span>' +
        (i.where ? '<span class="nf-where">· ' + esc(i.where) + '</span>' : '') +
        '<span class="nf-time">' + timeAgo(i.at) + '</span></div>' +
      '<div class="nf-title">' + esc(i.title) + '</div>' +
      bodyHtml(i) +
      (href ? '<a class="nf-open" href="' + esc(href) + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' + (i.kind === 'update' ? 'Read →' : 'Open →') + '</a>' : '') +
      (i.action === 'refresh' ? '<button class="nf-open" type="button" data-refresh>Refresh now →</button>' : '') +
    '</div>';
  }).join('');
  document.querySelectorAll('[data-refresh]').forEach(b => b.addEventListener('click', () => {
    b.textContent = 'Refreshing…';
    if(window.LEAReminders) LEAReminders.hardRefresh(); else location.reload();
  }));
}

// Swipe a card sideways to dismiss it. Pointer events cover finger and mouse.
// Let go past a third of the card, or with a quick flick, and it slides off
// and the gap closes; otherwise it springs back.
(function(){
  const listEl = document.getElementById('list');
  let card = null, startX = 0, startY = 0, dx = 0, t0 = 0, dragging = false;
  listEl.addEventListener('pointerdown', e => {
    const c = e.target.closest('.nf-card');
    if(!c || e.button > 0 || e.target.closest('a, button')) return;
    card = c; startX = e.clientX; startY = e.clientY; dx = 0; t0 = performance.now(); dragging = false;
  });
  listEl.addEventListener('pointermove', e => {
    if(!card) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if(!dragging){
      if(Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)){ card = null; return; }   // it's a scroll
      if(Math.abs(mx) < 8) return;
      dragging = true; card.classList.add('dragging'); card.setPointerCapture(e.pointerId);
    }
    dx = mx;
    card.style.transform = 'translateX(' + dx + 'px)';
    card.style.opacity = String(1 - Math.min(Math.abs(dx) / card.offsetWidth, 1) * 0.7);
  });
  function release(){
    if(!card) return;
    const c = card; card = null;
    if(!dragging) return;
    c.classList.remove('dragging');
    const speed = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if(Math.abs(dx) > c.offsetWidth / 3 || (speed > 0.11 && Math.abs(dx) > 40)) dismiss(c, Math.sign(dx));
    else { c.style.transform = ''; c.style.opacity = ''; }
  }
  listEl.addEventListener('pointerup', release);
  listEl.addEventListener('pointercancel', release);

  function dismiss(c, dir){
    const set = dismissedSet(); set.add(c.dataset.key);
    try{ localStorage.setItem(DISMISS_KEY, JSON.stringify([...set].slice(-500))); }catch(e){}
    c.style.transition = 'transform 220ms var(--ease-out), opacity 220ms var(--ease-out)';
    c.style.transform = 'translateX(' + (dir * 110) + '%)';
    c.style.opacity = '0';
    setTimeout(() => {
      // Close the gap instead of letting the cards below jump up.
      c.style.overflow = 'hidden';
      c.style.height = c.offsetHeight + 'px';
      void c.offsetHeight;
      c.style.transition = 'height 220ms var(--ease-out), margin 220ms var(--ease-out), padding 220ms var(--ease-out), border-width 220ms var(--ease-out)';
      c.style.height = '0px'; c.style.marginBottom = '0px'; c.style.paddingTop = '0px'; c.style.paddingBottom = '0px'; c.style.borderWidth = '0px';
      setTimeout(render, 240);
    }, 220);
  }
})();

(async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  const userId = session.user.id;
  async function refresh(){
    const result = await LEANotify.load(sb, userId);
    // Unread marks stay on screen for this visit, so the reader can still see
    // what was new; they are saved as read in the background.
    const shownUnread = new Set(ITEMS.filter(i => i.unread).map(i => i.kind + ':' + i.id));
    result.items.forEach(i => { if(shownUnread.has(i.kind + ':' + i.id)) i.unread = true; });
    ITEMS = result.items;
    ERRORS = result.errors;
    render();
    LEANotify.markRead(sb, userId, ITEMS);
  }
  // Reminders read study progress, which finishes syncing after the page
  // loads; recompute once it has.
  window.leaOnProgressReset = refresh;
  await refresh();
})();
</script>
</body>
